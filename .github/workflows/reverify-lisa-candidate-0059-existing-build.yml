name: Reverify existing Lisa Candidate0059 build

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID that produced the Candidate0059 checkpoint"
        required: true
        type: string
      source_commit:
        description: "Exact commit SHA recorded by that build run"
        required: true
        type: string
      checkpoint_artifact:
        description: "Checkpoint artifact name from the source run"
        required: true
        default: "lisa-c0059-reverify-inputs-a1"
        type: string
      verifier_ref:
        description: "Repository ref containing the verifier scripts to use"
        required: true
        default: "main"
        type: string
      expected_boot_sha256:
        description: "Optional expected boot.img SHA256; leave blank to trust checkpoint manifest only"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-c0059-reverify-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  reverify:
    name: reverify-existing-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CHECKPOINT_ARTIFACT: ${{ inputs.checkpoint_artifact }}
      EXPECTED_BOOT_SHA256: ${{ inputs.expected_boot_sha256 }}

    steps:
      - name: Checkout verifier source only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verifier_ref }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Validate manual source coordinates
        run: |
          set -euo pipefail

          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "source_run_id must be numeric" >&2
            exit 2
          fi
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_commit must be a full 40-hex Git SHA" >&2
            exit 2
          fi
          if [[ -n "$EXPECTED_BOOT_SHA256" ]] && ! [[ "$EXPECTED_BOOT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "expected_boot_sha256 must be blank or a 64-hex SHA256" >&2
            exit 2
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          actual_sha="$(jq -r '.head_sha' <<<"$run_json")"
          actual_name="$(jq -r '.name' <<<"$run_json")"
          actual_event="$(jq -r '.event' <<<"$run_json")"

          if [[ "${actual_sha,,}" != "${SOURCE_COMMIT,,}" ]]; then
            echo "Source mismatch: run ${SOURCE_RUN_ID} head_sha=${actual_sha}, requested=${SOURCE_COMMIT}" >&2
            exit 3
          fi

          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | [.name, (.id|tostring), (.expired|tostring)] | @tsv' |
            awk -F '\t' -v wanted="$CHECKPOINT_ARTIFACT" '$1 == wanted && $3 == "false" { print $2; exit }'
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "Checkpoint artifact not found or expired: $CHECKPOINT_ARTIFACT" >&2
            exit 4
          fi

          {
            echo "REVERIFY_ONLY=1"
            echo "SOURCE_RUN_ID=${SOURCE_RUN_ID}"
            echo "SOURCE_COMMIT=${SOURCE_COMMIT}"
            echo "SOURCE_WORKFLOW=${actual_name}"
            echo "SOURCE_EVENT=${actual_event}"
            echo "CHECKPOINT_ARTIFACT=${CHECKPOINT_ARTIFACT}"
            echo "CHECKPOINT_ARTIFACT_ID=${artifact_id}"
            echo "No kernel checkout, make, compiler prepare, or boot repack will run."
          } | tee reverify-source.txt

      - name: Generate verifier recipes
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_factory.py
          python3 reconstruction/scripts/test_candidate_0059_identity.py
          python3 reconstruction/scripts/test_candidate_0059_bpf_port.py
          python3 reconstruction/scripts/test_candidate_0059_artifacts.py

      - name: Download checkpoint from selected source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.checkpoint_artifact }}
          path: .checkpoint-download
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Install verifier tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-yaml binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-system-arm kmod curl unzip jq

      - name: Restore checkpoint and verify every saved hash
        run: |
          set -euo pipefail
          (cd .checkpoint-download && sha256sum -c checkpoint.tar.gz.sha256)
          python3 reconstruction/scripts/candidate_0059_artifacts.py restore \
            --archive .checkpoint-download/checkpoint.tar.gz \
            --commit "$SOURCE_COMMIT" \
            --run "$SOURCE_RUN_ID"

          if [[ -n "$EXPECTED_BOOT_SHA256" ]]; then
            actual_boot_sha="$(sha256sum boot.img | awk '{print $1}')"
            if [[ "${actual_boot_sha,,}" != "${EXPECTED_BOOT_SHA256,,}" ]]; then
              echo "boot.img SHA256 mismatch: actual=${actual_boot_sha} expected=${EXPECTED_BOOT_SHA256}" >&2
              exit 5
            fi
            echo "EXPECTED_BOOT_SHA256_MATCH=PASS" | tee -a reverify-source.txt
          else
            echo "EXPECTED_BOOT_SHA256_MATCH=NOT_REQUESTED" | tee -a reverify-source.txt
          fi

      - name: Revalidate inherited and Candidate0059 gates without make
        run: |
          set -euo pipefail
          GITHUB_SHA="$SOURCE_COMMIT" python3 reconstruction/scripts/candidate_0059_build.py verify \
            2>&1 | tee candidate-0059-verify.log
          grep -q 'LISA_CANDIDATE_0059_VERIFICATION=PASS' candidate-0059-verify.log
          grep -q 'LISA_CANDIDATE_0059_BPF_LINKED_GATE=PASS' candidate-0059-verify.log
          grep -q 'LISA_CANDIDATE_0059_PERFORMANCE_LINKED_GATE=PASS' candidate-0059-verify.log

      - name: Execute actual Candidate0059 ARM64 Image BPF probe
        id: bpf_probe
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_qemu_probe.py
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path

          state = json.loads(Path("candidate-0059-bpf-qemu.json").read_text()).get("state")
          if state not in ("PASS", "INCONCLUSIVE_BOOT"):
              raise SystemExit("Unexpected BPF guest state: " + str(state))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("state=" + str(state) + "\n")
          print("BPF_GUEST_STATE=" + str(state))
          PYCODE

      - name: Record independent revalidation metadata
        env:
          BPF_GUEST_STATE: ${{ steps.bpf_probe.outputs.state }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path

          verification = Path("candidate-0059-verification.json")
          result = json.loads(verification.read_text())
          boot_sha = hashlib.sha256(Path("boot.img").read_bytes()).hexdigest()
          checkpoint = json.loads(Path("lisa-build-checkpoint.json").read_text())
          if boot_sha != checkpoint["files"]["boot.img"]["sha256"]:
              raise SystemExit("Reverification changed boot bytes")

          result.update(
              reverify_only=True,
              reverify_source_run_id=os.environ["SOURCE_RUN_ID"],
              reverify_source_commit=os.environ["SOURCE_COMMIT"],
              reverify_workflow_run_id=os.environ["GITHUB_RUN_ID"],
              bpf_arm64_guest_test=os.environ.get("BPF_GUEST_STATE"),
              phone_device_tested=False,
              android16_performance_runtime_tested=False,
              developer_options_postdevice_tested=False,
              checkpoint_boot_bytes_unchanged=True,
          )
          verification.write_text(json.dumps(result, indent=2) + "\n")
          PYCODE

      - name: Publish reverified Candidate0059 boot pending phone validation
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-reverified-source-${{ inputs.source_run_id }}
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            reverify-source.txt
            boot.img
            boot.img.sha256
            candidate-0059-Image
            candidate-0059.config
            candidate-0059.ikconfig
            candidate-0059-manifest.txt
            candidate-0059-identity.json
            candidate-0059-verification.json
            candidate-0059-bpf-verification.json
            candidate-0059-bpf-qemu.json
            candidate-0059-bpf-qemu.log
            candidate-0059-performance-verification.json
            candidate-0059-performance-source.json
            candidate-0059-performance-scope.txt
            candidate-0059-verify.log
            kernel/out/System.map
            kernel/out/Module.symvers
            lisa-build-checkpoint.json

      - name: Preserve reverify evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-reverify-failure-${{ inputs.source_run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            reverify-source.txt
            candidate-0059-*.json
            candidate-0059-*.txt
            candidate-0059-*.log
            candidate-0059-checks/
            lisa-build-checkpoint.json
