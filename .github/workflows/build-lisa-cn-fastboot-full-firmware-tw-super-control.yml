name: Build Lisa stock-Image-3.09 port baseline with Candidate 0008

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-lisa-cn-fastboot-full-firmware-tw-super-control.yml
      - reconstruction/stock/stock-Image-3.09/**
      - .gitattributes

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-image-3-09-port-baseline
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BASE: reconstruction/stock/stock-Image-3.09
      CANDIDATE_0008_ARTIFACT_ID: "10765228960"
      CANDIDATE_0008_ARTIFACT_SHA256: b248c0fc9edd03d26e3527973cd2aae1b25e6517aa6be167f9704c26d1116a0b
      CANDIDATE_0008_BOOT_SHA256: 585a69eae9ab0fe1ff028c5e9890c36e4d745778e9d60a9ebdc61649a81c2063
      HISTORICAL_CN_OS2_0_16_VENDOR_BOOT_SHA256: c0a7528e8eacd2a86270ee017dfe90e657f1a0c5c40527869f89e915c2954a5a
      HISTORICAL_CN_OS2_0_16_DTBO_SHA256: db7c50147d8217c41cd86e53dda6e8ce93a5928a8f06ece8da92955a9c0e7ba7

    steps:
      - name: Checkout reconstruction metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Materialize exact stock-Image-3.09 Git LFS baseline
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y git-lfs curl unzip file python3
          git lfs install --local

          expected=(
            abl.img
            aop.img
            bluetooth.img
            cpucp.img
            devcfg.img
            dsp.img
            dtbo.img
            featenabler.img
            hyp.img
            imagefv.img
            keymaster.img
            modem.img
            qupfw.img
            shrm.img
            tz.img
            uefisecapp.img
            vbmeta.img
            vbmeta_system.img
            vendor_boot.img
            xbl.img
            xbl_config.img
          )

          mkdir -p gate package/images

          for name in "${expected[@]}"; do
            path="$BASE/$name"
            pointer="$(git show "HEAD:$path")"
            printf '%s\n' "$pointer" | grep -Fqx 'version https://git-lfs.github.com/spec/v1'
            printf '%s\n' "$pointer" | grep -Eq '^oid sha256:[0-9a-f]{64}$'
            printf '%s\n' "$pointer" | grep -Eq '^size [0-9]+$'
          done

          git lfs pull --include="$BASE/*.img" --exclude=""

          : > gate/STOCK_IMAGE_3_09_INVENTORY.tsv
          printf 'image\tbytes\tsha256\tlfs_oid_match\n' >> gate/STOCK_IMAGE_3_09_INVENTORY.tsv

          for name in "${expected[@]}"; do
            path="$BASE/$name"
            pointer="$(git show "HEAD:$path")"
            expected_sha="$(printf '%s\n' "$pointer" | awk -F: '/^oid sha256:/ {print $2}')"
            expected_size="$(printf '%s\n' "$pointer" | awk '/^size / {print $2}')"

            test -s "$path"
            if head -n1 "$path" | grep -Fqx 'version https://git-lfs.github.com/spec/v1'; then
              echo "LFS pointer was not materialized: $path" >&2
              exit 1
            fi

            actual_sha="$(sha256sum "$path" | awk '{print $1}')"
            actual_size="$(stat -c '%s' "$path")"
            test "$actual_sha" = "$expected_sha"
            test "$actual_size" = "$expected_size"

            printf '%s\t%s\t%s\t1\n' "$name" "$actual_size" "$actual_sha" >> gate/STOCK_IMAGE_3_09_INVENTORY.tsv
            cp "$path" "package/images/$name"
          done

          test "$(find package/images -maxdepth 1 -type f -name '*.img' | wc -l)" -eq "${#expected[@]}"
          sha256sum package/images/*.img | sort > package/STOCK_IMAGE_3_09_SHA256SUMS.txt

          {
            echo "baseline_commit=$GITHUB_SHA"
            echo "baseline_path=$BASE"
            echo "image_count=${#expected[@]}"
            echo "LFS_POINTER_CONTENT_GATE=PASS"
            echo "LISA_STOCK_IMAGE_3_09_BASELINE_GATE=PASS"
          } | tee gate/BASELINE_GATE.txt

      - name: Classify stock-Image-3.09 against historical CN OS2.0.16 companion state
        run: |
          set -euo pipefail

          new_vendor_boot="$(sha256sum "$BASE/vendor_boot.img" | awk '{print $1}')"
          new_dtbo="$(sha256sum "$BASE/dtbo.img" | awk '{print $1}')"

          {
            echo "stock_image_3_09_vendor_boot_sha256=$new_vendor_boot"
            echo "historical_cn_os2_0_16_vendor_boot_sha256=$HISTORICAL_CN_OS2_0_16_VENDOR_BOOT_SHA256"
            echo "vendor_boot_matches_historical_cn=$([ "$new_vendor_boot" = "$HISTORICAL_CN_OS2_0_16_VENDOR_BOOT_SHA256" ] && echo 1 || echo 0)"
            echo
            echo "stock_image_3_09_dtbo_sha256=$new_dtbo"
            echo "historical_cn_os2_0_16_dtbo_sha256=$HISTORICAL_CN_OS2_0_16_DTBO_SHA256"
            echo "dtbo_matches_historical_cn=$([ "$new_dtbo" = "$HISTORICAL_CN_OS2_0_16_DTBO_SHA256" ] && echo 1 || echo 0)"
          } | tee gate/HISTORICAL_BASELINE_DELTA.txt

      - name: Download exact Candidate 0008 reconstructed boot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_0008_ARTIFACT_ID}/zip"             -o candidate0008.zip

          echo "$CANDIDATE_0008_ARTIFACT_SHA256  candidate0008.zip" | sha256sum -c -

          mkdir -p candidate0008
          unzip -q candidate0008.zip -d candidate0008
          candidate_boot="$(find candidate0008 -type f -name boot.img -print -quit)"
          test -n "$candidate_boot"
          test -s "$candidate_boot"
          test "$(sha256sum "$candidate_boot" | awk '{print $1}')" = "$CANDIDATE_0008_BOOT_SHA256"

          cp "$candidate_boot" package/images/boot.img

          {
            echo "candidate_artifact_id=$CANDIDATE_0008_ARTIFACT_ID"
            echo "candidate_boot_sha256=$CANDIDATE_0008_BOOT_SHA256"
            echo "CANDIDATE_0008_BOOT_EXACT=PASS"
          } | tee gate/CANDIDATE_GATE.txt

      - name: Build stock-Image-3.09 aligned port package
        run: |
          set -euo pipefail

          cat > package/PORT_BASELINE.md <<'EOF'
          # Lisa ROM-port baseline: reconstruction/stock/stock-Image-3.09

          This package is aligned to the exact bottom package used for the user's
          Lisa ROM port. It supersedes the earlier assumption that the complete
          companion/firmware state should be reconstructed from CN OS2.0.16.

          ## Exact bottom-package source

          reconstruction/stock/stock-Image-3.09/

          Git LFS object SHA-256 and byte size are checked against the pointers
          committed in the same repository revision before this artifact is built.

          The baseline contains:

          - abl / aop / bluetooth / cpucp / devcfg / dsp
          - dtbo / featenabler / hyp / imagefv / keymaster / modem
          - qupfw / shrm / tz / uefisecapp
          - vbmeta / vbmeta_system / vendor_boot
          - xbl / xbl_config

          boot.img is not present in stock-Image-3.09. For this diagnostic package
          it is supplied only from the exact reconstructed Candidate 0008 artifact.

          ## Intended variable separation

          - Bottom firmware and companion partitions: exact stock-Image-3.09
          - Dynamic userspace (super): the user's actual ported ROM
          - Boot/kernel under test: Candidate 0008 only
          - Do not introduce CN OS2.0.16 vendor_boot/dtbo merely to reproduce the
            old historical g598 environment; that is no longer the active port base.

          No automatic device flashing is performed by CI.
          EOF

          cat > package/verify-package.ps1 <<'EOF'
          $ErrorActionPreference = 'Stop'

          $sumFile = Join-Path $PSScriptRoot 'STOCK_IMAGE_3_09_SHA256SUMS.txt'
          Get-Content $sumFile | ForEach-Object {
              if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
                  $expected = $matches[1]
                  $rel = ($matches[2] -replace '^package/', '')
                  $path = Join-Path $PSScriptRoot $rel
                  $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
                  if ($actual -ne $expected) { throw "SHA256 mismatch: $path" }
              }
          }

          Write-Host 'STOCK_IMAGE_3_09_PACKAGE_SHA256_GATE=PASS'
          EOF

          cp gate/STOCK_IMAGE_3_09_INVENTORY.tsv package/
          cp gate/HISTORICAL_BASELINE_DELTA.txt package/
          cp gate/BASELINE_GATE.txt package/
          cp gate/CANDIDATE_GATE.txt package/

          find package/images -maxdepth 1 -type f -name '*.img' -printf '%f\n' | sort > package/FINAL_IMAGE_INVENTORY.txt

      - name: Final stock-Image-3.09 alignment gate
        run: |
          set -euo pipefail

          grep -Fqx 'LFS_POINTER_CONTENT_GATE=PASS' gate/BASELINE_GATE.txt
          grep -Fqx 'LISA_STOCK_IMAGE_3_09_BASELINE_GATE=PASS' gate/BASELINE_GATE.txt
          grep -Fqx 'CANDIDATE_0008_BOOT_EXACT=PASS' gate/CANDIDATE_GATE.txt

          test -s package/images/abl.img
          test -s package/images/xbl.img
          test -s package/images/xbl_config.img
          test -s package/images/vendor_boot.img
          test -s package/images/dtbo.img
          test -s package/images/vbmeta.img
          test -s package/images/vbmeta_system.img
          test -s package/images/boot.img

          test "$(sha256sum package/images/boot.img | awk '{print $1}')" = "$CANDIDATE_0008_BOOT_SHA256"

          echo 'LISA_STOCK_IMAGE_3_09_CANDIDATE_0008_FINAL_GATE=PASS' | tee package/final-gate.txt

      - name: Upload stock-Image-3.09 aligned package
        uses: actions/upload-artifact@v4
        with:
          name: lisa-stock-image-3-09-candidate-0008-port-baseline
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: package/
