name: Diagnose Lisa exact stock vs Candidate 0013 initcall delta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-lisa-exact-initcall-delta.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-exact-initcall-delta
  cancel-in-progress: true

env:
  STOCK_BOOT: stock-main/reconstruction/stock/stock-Image/boot.img
  STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
  STOCK_KERNEL_SIZE: "51436032"
  C0013_ARTIFACT_ID: "10797029934"
  C0013_IMAGE_SHA256: 7ecf678c39ca38ad2d26fd49a0f73c57dd117f0f044fac5b059c1ecbffad492f

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact healthy stock boot
        uses: actions/checkout@v4
        with:
          ref: main
          path: stock-main
          lfs: true
          fetch-depth: 1

      - name: Authenticate and extract stock Image
        run: |
          set -euo pipefail
          test "$(sha256sum "$STOCK_BOOT" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, struct
          b=Path(os.environ['STOCK_BOOT']).read_bytes()
          if b[:8] != b'ANDROID!':
              raise SystemExit('bad stock boot magic')
          ksz=struct.unpack_from('<I', b, 8)[0]
          if ksz != int(os.environ['STOCK_KERNEL_SIZE']):
              raise SystemExit(f'unexpected stock kernel size: {ksz}')
          img=b[4096:4096+ksz]
          if struct.unpack_from('<I', img, 0x38)[0] != 0x644d5241:
              raise SystemExit('ARM64 Image magic missing')
          Path('stock-Image').write_bytes(img)
          print('STOCK_IMAGE_SHA256='+hashlib.sha256(img).hexdigest())
          print('STOCK_IMAGE_BYTES='+str(len(img)))
          PY
          echo 'STOCK_INPUT_AUTH_GATE=PASS'

      - name: Download exact Candidate 0013 Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C0013_ARTIFACT_ID}/zip" \
            -o c0013.zip
          mkdir c0013
          unzip -q c0013.zip -d c0013
          img="$(find c0013 -type f -name candidate-0013-Image -print -quit)"
          test -n "$img" && test -s "$img"
          cp "$img" candidate-0013-Image
          test "$(sha256sum candidate-0013-Image | awk '{print $1}')" = "$C0013_IMAGE_SHA256"
          echo 'C0013_INPUT_AUTH_GATE=PASS'

      - name: Install and run exact kallsyms recovery
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip curl unzip binutils
          python3 -m pip install --break-system-packages \
            git+https://github.com/marin-m/vmlinux-to-elf.git@19683fb95b29cd31362d49e6f48ab8368f96cbdf
          kallsyms-finder stock-Image > stock.kallsyms
          kallsyms-finder candidate-0013-Image > c0013.kallsyms
          test -s stock.kallsyms
          test -s c0013.kallsyms
          echo "STOCK_KALLSYMS_LINES=$(wc -l < stock.kallsyms)"
          echo "C0013_KALLSYMS_LINES=$(wc -l < c0013.kallsyms)"

      - name: Compare exact initcall levels and ordering
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          line_rx=re.compile(r'^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.+?)\s*$')
          generated_prefix=re.compile(r'^\d+_\d+_')
          compiler_suffixes=[
              re.compile(r'\.llvm\.[0-9A-Fa-f]+$'),
              re.compile(r'\.(?:isra|constprop|part|cold)\.\d+$'),
              re.compile(r'\.cfi_jt$'),
              re.compile(r'\.\d+$'),
          ]

          def normalize_fn(fn):
              prev=None
              while fn != prev:
                  prev=fn
                  for rx in compiler_suffixes:
                      fn=rx.sub('', fn)
              return fn

          def parse(path):
              rows=[]
              for raw in Path(path).read_text(errors='replace').splitlines():
                  m=line_rx.match(raw)
                  if not m:
                      continue
                  addr_s, typ, name=m.groups()
                  if not name.startswith('__initcall_'):
                      continue
                  body=name[len('__initcall_'):]
                  body=generated_prefix.sub('', body)
                  level=None
                  fn=None
                  if body.endswith('early'):
                      level='early'; fn=body[:-5]
                  elif body.endswith('rootfs'):
                      level='rootfs'; fn=body[:-6]
                  else:
                      mm=re.match(r'^(.*?)([0-7]s?)$', body)
                      if mm:
                          fn,level=mm.groups()
                  if level is None or not fn:
                      continue
                  rows.append({
                      'addr':int(addr_s,16), 'addr_s':addr_s, 'raw':name,
                      'fn':fn, 'norm':normalize_fn(fn), 'level':level,
                  })
              rows.sort(key=lambda x:x['addr'])
              for i,r in enumerate(rows):
                  r['global_order']=i
              bylevel={}
              for r in rows:
                  bylevel.setdefault(r['level'],[]).append(r)
              for level,rs in bylevel.items():
                  for i,r in enumerate(rs):
                      r['level_order']=i
              return rows

          s=parse('stock.kallsyms')
          c=parse('c0013.kallsyms')
          levels=['early','0','0s','1','1s','2','2s','3','3s','4','4s','5','5s','rootfs','6','6s','7','7s']
          s_map={(r['norm'],r['level']):r for r in s}
          c_map={(r['norm'],r['level']):r for r in c}
          s_fn={r['norm'] for r in s}
          c_fn={r['norm'] for r in c}

          stock_only_samelevel=sorted(set(s_map)-set(c_map))
          cand_only_samelevel=sorted(set(c_map)-set(s_map))
          true_stock_only=sorted(k for k in stock_only_samelevel if k[0] not in c_fn)
          true_cand_only=sorted(k for k in cand_only_samelevel if k[0] not in s_fn)

          level_moves=[]
          for fn in sorted(s_fn & c_fn):
              sl=sorted({r['level'] for r in s if r['norm']==fn})
              cl=sorted({r['level'] for r in c if r['norm']==fn})
              if sl != cl:
                  level_moves.append((fn,','.join(sl),','.join(cl)))

          priority_rx=re.compile(r'(qcom|msm|yupik|scm|rpmh|llcc|icc|interconnect|ufs|ufshcd|scsi|gic|irq|timer|watchdog|wdog|smmu|iommu|clk|clock|gdsc|regulator|pinctrl|tlmm|gpio|cpufreq|opp|psci|smp|cpu|memblock|ramoops|pstore)', re.I)
          priority=[k for k in true_stock_only if priority_rx.search(k[0])]

          def write_pairs(path, pairs, source):
              lines=['level\taddress\tlevel_order\tglobal_order\tnormalized_fn\traw_symbol']
              mp=s_map if source=='stock' else c_map
              for k in sorted(pairs, key=lambda x:(levels.index(x[1]) if x[1] in levels else 99, mp[x]['level_order'], x[0])):
                  r=mp[k]
                  lines.append(f"{r['level']}\t{r['addr_s']}\t{r['level_order']}\t{r['global_order']}\t{r['norm']}\t{r['raw']}")
              Path(path).write_text('\n'.join(lines)+'\n')

          write_pairs('stock-only-same-level.tsv', stock_only_samelevel, 'stock')
          write_pairs('candidate-only-same-level.tsv', cand_only_samelevel, 'candidate')
          write_pairs('true-stock-only-initcalls.tsv', true_stock_only, 'stock')
          write_pairs('true-candidate-only-initcalls.tsv', true_cand_only, 'candidate')
          write_pairs('priority-true-stock-only-initcalls.tsv', priority, 'stock')
          Path('initcall-level-moves.tsv').write_text('normalized_fn\tstock_levels\tcandidate_levels\n' + ''.join(f'{a}\t{b}\t{d}\n' for a,b,d in level_moves))

          counts=['level\tstock\tcandidate\tdelta']
          for level in levels:
              sn=sum(r['level']==level for r in s)
              cn=sum(r['level']==level for r in c)
              counts.append(f'{level}\t{sn}\t{cn}\t{cn-sn:+d}')
          Path('initcall-level-counts.tsv').write_text('\n'.join(counts)+'\n')

          # Common same-level functions whose relative order moves materially.
          displacements=[]
          for k in sorted(set(s_map)&set(c_map)):
              sr,cr=s_map[k],c_map[k]
              sden=max(1,sum(x['level']==sr['level'] for x in s)-1)
              cden=max(1,sum(x['level']==cr['level'] for x in c)-1)
              sp=sr['level_order']/sden
              cp=cr['level_order']/cden
              d=abs(cp-sp)
              if d >= 0.15:
                  displacements.append((d,k[1],k[0],sr['level_order'],cr['level_order'],sp,cp))
          displacements.sort(reverse=True)
          Path('large-order-displacements.tsv').write_text(
              'abs_fraction_delta\tlevel\tnormalized_fn\tstock_order\tcandidate_order\tstock_fraction\tcandidate_fraction\n' +
              ''.join(f'{d:.6f}\t{lv}\t{fn}\t{so}\t{co}\t{sp:.6f}\t{cp:.6f}\n' for d,lv,fn,so,co,sp,cp in displacements[:300])
          )

          summary=[
              f'STOCK_INITCALL_TOTAL={len(s)}',
              f'C0013_INITCALL_TOTAL={len(c)}',
              f'STOCK_ONLY_SAME_LEVEL={len(stock_only_samelevel)}',
              f'C0013_ONLY_SAME_LEVEL={len(cand_only_samelevel)}',
              f'TRUE_STOCK_ONLY_INITCALLS={len(true_stock_only)}',
              f'TRUE_C0013_ONLY_INITCALLS={len(true_cand_only)}',
              f'INITCALL_LEVEL_MOVES={len(level_moves)}',
              f'PRIORITY_TRUE_STOCK_ONLY_INITCALLS={len(priority)}',
              f'LARGE_ORDER_DISPLACEMENTS={len(displacements)}',
              'EXACT_INITCALL_DELTA_DIAGNOSIS=PASS',
          ]
          Path('initcall-summary.txt').write_text('\n'.join(summary)+'\n')
          print('\n'.join(summary))
          print('PRIORITY_STOCK_ONLY_BEGIN')
          for fn,lv in priority[:100]:
              print(f'{lv}\t{fn}')
          print('PRIORITY_STOCK_ONLY_END')
          PY

      - name: Final diagnostic gate
        run: |
          set -euo pipefail
          grep -Fqx 'EXACT_INITCALL_DELTA_DIAGNOSIS=PASS' initcall-summary.txt
          echo 'LISA_EXACT_INITCALL_DELTA_DIAGNOSIS=PASS'
          cat initcall-level-counts.tsv
          cat initcall-summary.txt

      - name: Upload exact initcall diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-exact-stock-vs-c0013-initcall-delta
          retention-days: 14
          if-no-files-found: warn
          path: |
            initcall-summary.txt
            initcall-level-counts.tsv
            stock-only-same-level.tsv
            candidate-only-same-level.tsv
            true-stock-only-initcalls.tsv
            true-candidate-only-initcalls.tsv
            priority-true-stock-only-initcalls.tsv
            initcall-level-moves.tsv
            large-order-displacements.tsv
            stock.kallsyms
            c0013.kallsyms
