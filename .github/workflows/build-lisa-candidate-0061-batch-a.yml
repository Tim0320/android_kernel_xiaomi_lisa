name: Build Lisa Candidate0061 Batch A 5.4.292

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: lisa-c0061-batch-a
  cancel-in-progress: true

jobs:
  batch-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Candidate0061 package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: package
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Checkout frozen Lisa 5.4.289 source
        uses: actions/checkout@v4
        with:
          repository: Tim0320/android_kernel_xiaomi_lisa
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Fetch official Batch A stable endpoints
        run: |
          set -euo pipefail
          stable=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git -C kernel fetch --no-tags --depth=1 "$stable"             refs/tags/v5.4.289:refs/tags/upstream-v5.4.289             refs/tags/v5.4.292:refs/tags/upstream-v5.4.292
          git -C kernel show upstream-v5.4.292:Makefile | grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)'

      - name: Materialize Candidate0058 BPF Stage-A payload
        run: |
          set -euo pipefail
          cat package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part00               package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part01               package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part02               package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part03             > package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz

      - name: Materialize durable stock ABI oracle
        id: stock_abi
        run: |
          set -euo pipefail
          git -C package lfs install --local
          git -C package lfs pull --include="reconstruction/stock/stock-Image/boot.img"
          boot="package/reconstruction/stock/stock-Image/boot.img"
          test -s "$boot"
          test "$(stat -c %s "$boot")" -eq 201326592
          boot_sha="$(sha256sum "$boot" | awk '{print $1}')"
          echo "STOCK_BOOT_SHA256=$boot_sha"
          test "$boot_sha" = e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
          rm -rf stock-abi
          mkdir -p stock-abi
          python3 package/reconstruction/scripts/extract_stock_ikheaders_from_boot.py             --boot "$boot"             --out stock-abi/stock-kheaders             --manifest candidate-0061-stock-ikheaders.json             2>&1 | tee candidate-0061-stock-ikheaders.log
          grep -q '^LISA_STOCK_IKHEADERS_EXTRACT=PASS$' candidate-0061-stock-ikheaders.log
          test -s stock-abi/stock-kheaders/include/linux/power_debug.h
          test -s stock-abi/stock-kheaders/include/linux/kconfig.h

      - name: Recreate frozen Candidate0059 inherited source stack
        id: c0059
        env:
          PYTHONPATH: ${{ github.workspace }}/package/reconstruction/scripts
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
        run: |
          set -euo pipefail
          rm -rf kernel/out
          mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          python3 package/reconstruction/scripts/candidate_0059_factory.py
          python3 - <<'PY' 2>&1 | tee candidate-0061-c0059-source.log
          from pathlib import Path
          from types import SimpleNamespace
          import candidate_0046_build as c46
          import candidate_0050_proc_abi_patch as proc50
          import candidate_0056_power_patch as power
          import candidate_0059_ownership_patch as ownership
          import candidate_0059_perf_port as perf
          import candidate_0059_bpf_port as bpf

          root = Path("package").resolve()
          kernel = Path("kernel").resolve()

          ufs = (kernel / "drivers/scsi/ufs/ufshcd.c").read_text()
          mem = (kernel / "drivers/misc/mi-memory/mem_interface.c").read_text()
          if "set_ufs_hba_data(sdev);" not in ufs or "void set_ufs_hba_data(" not in mem:
              raise RuntimeError("Frozen 5.4.289 source no longer carries the expected Candidate0055 UFS bridge")

          power.retained = lambda _root: SimpleNamespace(apply=lambda _r, _k: None)
          if not (kernel / "kernel/power/lisa_power_compat.c").exists():
              power.apply(root, kernel)

          c46.ROOT = root
          c46.KERNEL = kernel
          c46.OUT = kernel / "out"
          c46.patch_qgki_module_abi()

          proc50.apply(root, kernel)

          ownership.retained = lambda _root: SimpleNamespace(apply=lambda _r, _k: None)
          ownership.apply(root, kernel)

          perf.apply_sources(root, kernel)
          bpf.apply(root, kernel)
          print("C0059_INHERITED_SOURCE_STACK_RECREATED=PASS")
          PY
          grep -q '^C0059_INHERITED_SOURCE_STACK_RECREATED=PASS$' candidate-0061-c0059-source.log
          git -C kernel diff --check
          git -C kernel diff --stat | tee candidate-0061-c0059-source-stat.txt

      - name: Apply official Stable Batch A semantically
        id: apply
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_batch_a_apply.py             --source kernel             --report candidate-0061-batch-a-apply.json             2>&1 | tee candidate-0061-batch-a-apply.log
          grep -q '^C0061_BATCH_A_APPLY=PASS$' candidate-0061-batch-a-apply.log
          grep -q '^SUBLEVEL = 292$' kernel/Makefile
          git -C kernel diff --check
          git -C kernel diff --stat | tee candidate-0061-batch-a-source-stat.txt

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             bc bison flex build-essential libssl-dev libelf-dev             gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi             python3 curl xz-utils unzip git rsync kmod

      - name: Cache stock-generation AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install exact stock-generation clang
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors               "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"               -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'

      - name: Prepare reviewed Batch A control config
        id: config
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          rm -rf kernel/out
          mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          # MIXED_CONFLICT build-oracle compatibility only.
          # Replay the reviewed Candidate0059 config delta without changing stable source semantics.
          kernel/scripts/config --file kernel/out/.config --set-str LOCALVERSION "-qgki-lisa-c0059-r43da7c5-by-Tim0320" -d LOCALVERSION_AUTO -d COMPAT_VDSO -d ARM64_USE_LSE_ATOMICS -d RELR -e PERF_HELPER -e MILLET_CGROUP -e MILLET_SIG -e MILLET_BINDER -e MILLET_PKG -e MILLET_BINDER_GKI -e MILLET_CORE -e MILLET_HS -e BOARD_XIAOMI_LISA -e MIHW -e PACKAGE_RUNTIME_INFO -e MIGT
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out"             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig prepare scripts             2>&1 | tee candidate-0061-batch-a-config.log
          grep -E '^(CONFIG_MIHW|CONFIG_MIGT|CONFIG_PACKAGE_RUNTIME_INFO|CONFIG_MODVERSIONS|CONFIG_CFI_CLANG|CONFIG_QCOM_WATCHDOG_BARK_TIME|CONFIG_QCOM_WATCHDOG_PET_TIME)='             kernel/out/.config | tee candidate-0061-batch-a-config.txt
          grep -q '^CONFIG_MIHW=y$' kernel/out/.config
          grep -q '^CONFIG_MIGT=y$' kernel/out/.config
          grep -q '^CONFIG_PACKAGE_RUNTIME_INFO=y$' kernel/out/.config
          grep -q '^CONFIG_MODVERSIONS=y$' kernel/out/.config
          grep -q '^CONFIG_CFI_CLANG=y$' kernel/out/.config
          grep -q '^CONFIG_LOCALVERSION="-qgki-lisa-c0059-r43da7c5-by-Tim0320"$' kernel/out/.config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' kernel/out/.config
          grep -q '^# CONFIG_COMPAT_VDSO is not set$' kernel/out/.config
          grep -q '^# CONFIG_ARM64_USE_LSE_ATOMICS is not set$' kernel/out/.config
          grep -q '^# CONFIG_RELR is not set$' kernel/out/.config
          grep -q '^CONFIG_PERF_HELPER=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_CGROUP=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_SIG=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_BINDER=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_PKG=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_BINDER_GKI=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_CORE=y$' kernel/out/.config
          grep -q '^CONFIG_MILLET_HS=y$' kernel/out/.config
          grep -q '^CONFIG_LEDS_QTI_FLASH=m$' kernel/out/.config
          grep -q '^CONFIG_MI_HARDWARE_ID=m$' kernel/out/.config
          grep -q 'proc_create_proc_ops' kernel/include/linux/proc_fs.h
          grep -q '#define proc_create proc_create_proc_ops' kernel/include/linux/proc_fs.h
          grep -q 'STOCK_ABI_ROOT' kernel/scripts/Makefile.build
          config_sha="$(sha256sum kernel/out/.config | awk '{print $1}')"
          echo "C0061_BATCH_A_CONTROL_CONFIG_SHA256=$config_sha"
          test "$config_sha" = 664d12d837af3e3b26d2f04da0f11cefd8ba2b53e0fa01f3e7e274921f589397
          cp kernel/out/.config candidate-0061-batch-a-control.config

      - name: Compile reviewed Batch A control
        id: control_build
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out"             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             CLANG_TRIPLE=aarch64-linux-gnu-             Image modules dtbs 2>&1 | tee candidate-0061-batch-a-control-build.log
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/Module.symvers
          test "$(find kernel/out -name '*.ko' -type f | wc -l)" -gt 0
          cp kernel/out/Module.symvers candidate-0061-batch-a-control.Module.symvers
          control_symvers_sha="$(sha256sum candidate-0061-batch-a-control.Module.symvers | awk '{print $1}')"
          echo "C0061_BATCH_A_CONTROL_SYMVERS_SHA256=$control_symvers_sha"
          test "$control_symvers_sha" = 846e9ceec05d4da4a0bf9c3ca4b7677bd1955091ccd0d7c46d4848bb7c14b7ff
          sha256sum kernel/out/arch/arm64/boot/Image | tee candidate-0061-batch-a-control-Image.sha256
          echo C0061_BATCH_A_CONTROL_COMPILE_MODPOST=PASS

      - name: Apply Candidate0059 ABI compatibility delta
        id: compat
        env:
          PYTHONPATH: ${{ github.workspace }}/package/reconstruction/scripts
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee candidate-0061-batch-a-compat.log
          from pathlib import Path
          import candidate_0061_c0059_abi_compat as compat
          compat.apply(Path("package").resolve(), Path("kernel").resolve())
          print("C0061_C0059_ABI_COMPAT_GATE=PASS")
          PY
          grep -q '^C0061_C0059_ABI_COMPAT_GATE=PASS$' candidate-0061-batch-a-compat.log
          git -C kernel diff --check

      - name: Rebuild Batch A target with ABI compatibility
        id: build
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          rm -rf kernel/out
          mkdir -p kernel/out
          cp candidate-0061-batch-a-control.config kernel/out/.config
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out"             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig prepare scripts             2>&1 | tee candidate-0061-batch-a-target-config.log
          test "$(sha256sum kernel/out/.config | awk '{print $1}')" =             664d12d837af3e3b26d2f04da0f11cefd8ba2b53e0fa01f3e7e274921f589397
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out"             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             CLANG_TRIPLE=aarch64-linux-gnu-             Image modules dtbs 2>&1 | tee candidate-0061-batch-a-build.log
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/Module.symvers
          test "$(find kernel/out -name '*.ko' -type f | wc -l)" -gt 0
          sha256sum kernel/out/arch/arm64/boot/Image | tee candidate-0061-batch-a-Image.sha256
          echo C0061_BATCH_A_COMPILE_MODPOST=PASS

      - name: Audit exact ABI compatibility delta
        id: abi
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - candidate-0061-batch-a-control.Module.symvers kernel/out/Module.symvers candidate-0061-batch-a-abi.json <<'PY'
          import json, sys
          from pathlib import Path

          def load(path):
              out = {}
              for raw in Path(path).read_text(errors="replace").splitlines():
                  fields = raw.split()
                  if len(fields) >= 2:
                      out[fields[1]] = fields[0].lower()
              return out

          control = load(sys.argv[1])
          target = load(sys.argv[2])
          changed = {k: {"control": control[k], "target": target[k]}
                     for k in sorted(control.keys() & target.keys())
                     if control[k] != target[k]}
          removed = {k: control[k] for k in sorted(control.keys() - target.keys())}
          added = {k: target[k] for k in sorted(target.keys() - control.keys())}
          expected_added = {
              "lisa_mtdoops_checkpoint": "0x002a7d5d",
              "qcom_scm_get_download_mode": "0xd9dc8135",
          }
          result = {
              "control": "reviewed Batch A control equivalent to run 37306854501",
              "control_config_sha256": "664d12d837af3e3b26d2f04da0f11cefd8ba2b53e0fa01f3e7e274921f589397",
              "control_symvers_sha256": "846e9ceec05d4da4a0bf9c3ca4b7677bd1955091ccd0d7c46d4848bb7c14b7ff",
              "target": "Candidate0061 Batch A + restored Candidate0059 ABI exports",
              "changed_crc_count": len(changed),
              "removed_symbol_count": len(removed),
              "added_symbol_count": len(added),
              "changed": changed,
              "removed": removed,
              "added": added,
              "expected_added": expected_added,
              "candidate0059_stable_provenance": {
                  "reviewed_changed": [
                      "xhci_dbg_trace", "xhci_ext_cap_init", "xhci_gen_setup",
                      "xhci_resume", "xhci_suspend"
                  ],
                  "reviewed_added": [
                      "flow_rule_match_ports_range", "page_get_link_raw", "tasklet_setup"
                  ],
              },
          }
          Path(sys.argv[3]).write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({
              "changed_crc_count": len(changed),
              "removed_symbol_count": len(removed),
              "added_symbol_count": len(added),
              "added": added,
          }, sort_keys=True))
          if changed or removed or added != expected_added:
              raise SystemExit("ABI_COMPAT_DELTA_MISMATCH")
          print("C0061_BATCH_A_MODULE_SYMVERS_GATE=PASS")
          PY

      - name: Report Batch A build evidence
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_ABI_OUTCOME: ${{ steps.stock_abi.outcome }}
          C0059_OUTCOME: ${{ steps.c0059.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          CONTROL_BUILD_OUTCOME: ${{ steps.control_build.outcome }}
          COMPAT_OUTCOME: ${{ steps.compat.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ABI_OUTCOME: ${{ steps.abi.outcome }}
        run: |
          set -u
          {
            echo "Candidate0061 Batch A source/build gate"
            echo
            echo "- source_sha: ${GITHUB_SHA}"
            echo "- run_id: ${GITHUB_RUN_ID}"
            echo "- stock_abi: $STOCK_ABI_OUTCOME"
            echo "- c0059_source: $C0059_OUTCOME"
            echo "- apply: $APPLY_OUTCOME"
            echo "- config: $CONFIG_OUTCOME"
            echo "- control_build: $CONTROL_BUILD_OUTCOME"
            echo "- compat: $COMPAT_OUTCOME"
            echo "- build: $BUILD_OUTCOME"
            echo "- abi: $ABI_OUTCOME"
            if test -s candidate-0061-batch-a-apply.json; then
              python3 -c "import json; p=json.load(open('candidate-0061-batch-a-apply.json')); print('- apply_counts:', p.get('counts', {}))"
            fi
            if test -s candidate-0061-batch-a-abi.json; then
              python3 -c "import json; p=json.load(open('candidate-0061-batch-a-abi.json')); print('- delta_changed:', p.get('changed_crc_count')); print('- delta_removed:', p.get('removed_symbol_count')); print('- delta_added:', p.get('added_symbol_count')); print('- delta_symbols:', p.get('added', {}))"
            fi
            echo
            if test -s candidate-0061-batch-a-build.log; then
              echo "target-build-log-tail:"
              tail -n 30 candidate-0061-batch-a-build.log
            elif test -s candidate-0061-batch-a-control-build.log; then
              echo "control-build-log-tail:"
              tail -n 30 candidate-0061-batch-a-control-build.log
            elif test -s candidate-0061-batch-a-config.log; then
              echo "config-log-tail:"
              tail -n 30 candidate-0061-batch-a-config.log
            elif test -s candidate-0061-batch-a-apply.log; then
              echo "apply-log-tail:"
              tail -n 30 candidate-0061-batch-a-apply.log
            elif test -s candidate-0061-c0059-source.log; then
              echo "c0059-source-log-tail:"
              tail -n 30 candidate-0061-c0059-source.log
            elif test -s candidate-0061-stock-ikheaders.log; then
              echo "stock-ikheaders-log-tail:"
              tail -n 30 candidate-0061-stock-ikheaders.log
            fi
          } > candidate-0061-batch-a-issue.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file candidate-0061-batch-a-issue.md

      - name: Upload Candidate0061 Batch A evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0061-batch-a-evidence-a${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            candidate-0061-stock-ikheaders.json
            candidate-0061-stock-ikheaders.log
            candidate-0061-c0059-source.log
            candidate-0061-c0059-source-stat.txt
            candidate-0061-batch-a-apply.json
            candidate-0061-batch-a-apply.log
            candidate-0061-batch-a-source-stat.txt
            candidate-0061-batch-a-config.log
            candidate-0061-batch-a-config.txt
            candidate-0061-batch-a-control.config
            candidate-0061-batch-a-control.Module.symvers
            candidate-0061-batch-a-control-build.log
            candidate-0061-batch-a-control-Image.sha256
            candidate-0061-batch-a-compat.log
            candidate-0061-batch-a-target-config.log
            candidate-0061-batch-a-build.log
            candidate-0061-batch-a-Image.sha256
            candidate-0061-batch-a-abi.json
            kernel/out/.config
            kernel/out/Module.symvers
            kernel/out/System.map
            kernel/out/arch/arm64/boot/Image
