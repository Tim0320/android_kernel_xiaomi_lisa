          PY
            fi
            if test -s candidate-0061-integrated-identity.txt; then cat candidate-0061-integrated-identity.txt; fi
            if test -s candidate-0061-integrated-boot-validation.txt; then cat candidate-0061-integrated-boot-validation.txt; fi
            if test -s candidate-0061-integrated-build.log; then echo; echo "target-build-log-tail:"; tail -n 30 candidate-0061-integrated-build.log; fi
          } > candidate-0061-integrated-issue.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file candidate-0061-integrated-issue.md

