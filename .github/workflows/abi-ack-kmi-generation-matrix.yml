          echo "ACK_KMI_SCORE=$score/$total"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ack-kmi-${{ matrix.branch }}
          retention-days: 5
          include-hidden-files: true
          path: |
            kernel/out/.config
            kernel/out/**/*.symversions
            kernel/out/**/*.symtypes
