name: Audit Lisa stock-Image-3.09 vendor_boot ABI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-lisa-stock-image-3-09-vendor-boot-abi.yml
      - reconstruction/stock/stock-Image-3.09/vendor_boot.img
      - reconstruction/stock/stock-Image-3.09/dtbo.img
      - .gitattributes

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-image-3-09-vendor-boot-abi
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: reconstruction/stock/stock-Image-3.09
      EXPECT_VENDOR_BOOT_SHA256: a94ecc2b8e53666693fd3cfc99ad07b5f24f586e85841728bf1d41333bc4b053
      EXPECT_DTBO_SHA256: 537655919c72edcba2e1dcbc83edb45fe92484263f3b8d5b29e8c1408282a35c
      CANDIDATE_RELEASE: 5.4.289-qgki-g5987d69e25da
      EXPECT_QGKI_MODULE_LAYOUT: ba39cbb8

    steps:
      - name: Checkout exact stock-Image-3.09 with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpio file lz4 zstd xz-utils gzip python3 python3-pyelftools

      - name: Authenticate exact 3.09 companion images
        run: |
          set -euo pipefail
          test "$(sha256sum "$BASE/vendor_boot.img" | awk '{print $1}')" = "$EXPECT_VENDOR_BOOT_SHA256"
          test "$(sha256sum "$BASE/dtbo.img" | awk '{print $1}')" = "$EXPECT_DTBO_SHA256"
          echo 'STOCK_IMAGE_3_09_COMPANION_HASH_GATE=PASS'

      - name: Parse vendor_boot and extract ramdisk
        run: |
          set -euo pipefail
          rm -rf vendor-ramdisks vendor-root audit
          mkdir -p vendor-ramdisks vendor-root audit
          python3 - "$BASE/vendor_boot.img" vendor-ramdisks <<'PY'
          import struct, sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          out = Path(sys.argv[2])
          if data[:8] != b'VNDRBOOT':
              raise SystemExit(f'bad vendor_boot magic: {data[:8]!r}')
          def u32(o): return struct.unpack_from('<I', data, o)[0]
          def align(v, a): return (v + a - 1) // a * a
          version = u32(8); page = u32(12); ramdisk_size = u32(24)
          header_size = u32(2096); dtb_size = u32(2100)
          ramdisk_off = align(header_size, page)
          dtb_off = align(ramdisk_off + ramdisk_size, page)
          frags = []
          if version >= 4 and header_size >= 2128:
              count = u32(2116); entry_size = u32(2120)
              table_off = align(dtb_off + dtb_size, page)
              if count and entry_size >= 108:
                  for i in range(count):
                      o = table_off + i * entry_size
                      size, rel, typ = u32(o), u32(o + 4), u32(o + 8)
                      name = data[o+12:o+44].split(b'\0',1)[0].decode('utf-8','replace') or f'fragment{i}'
                      frags.append((i, name, typ, rel, size))
          if not frags:
              frags = [(0, 'vendor_ramdisk', 0, 0, ramdisk_size)]
          lines = [f'header_version={version}', f'page_size={page}', f'vendor_ramdisk_size={ramdisk_size}', f'dtb_size={dtb_size}', f'fragment_count={len(frags)}']
          for i, name, typ, rel, size in frags:
              start = ramdisk_off + rel; end = start + size
              if end > ramdisk_off + ramdisk_size or end > len(data):
                  raise SystemExit(f'fragment {i} exceeds vendor ramdisk section')
              safe = ''.join(c if c.isalnum() or c in '._-' else '_' for c in name)
              (out / f'{i:02d}-{safe}.bin').write_bytes(data[start:end])
              lines.append(f'fragment[{i}]={name}\ttype={typ}\toffset={rel}\tsize={size}')
          Path('audit/vendor-boot-layout.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Unpack ramdisk and classify module load plans
        run: |
          set -euo pipefail
          idx=0
          for frag in vendor-ramdisks/*.bin; do
            out="vendor-root/fragment-$idx"
            cpio_file="vendor-ramdisks/fragment-$idx.cpio"
            mkdir -p "$out"
            magic="$(xxd -p -l 8 "$frag")"
            case "$magic" in
              1f8b*) gzip -dc "$frag" > "$cpio_file" ;;
              04224d18*|02214c18*) lz4 -dc "$frag" > "$cpio_file" ;;
              fd377a585a00*) xz -dc "$frag" > "$cpio_file" ;;
              28b52ffd*) zstd -dc "$frag" > "$cpio_file" ;;
              303730373031*|303730373032*) cp "$frag" "$cpio_file" ;;
              *) echo "unknown ramdisk compression: $frag ($magic)" >&2; exit 1 ;;
            esac
            abs="$(realpath "$cpio_file")"
            (cd "$out" && cpio --quiet -idm --no-absolute-filenames < "$abs")
            idx=$((idx+1))
          done

          find vendor-root -type f -name '*.ko' -print | sort > audit/modules.txt
          find vendor-root -type f -name 'modules.load*' -print | sort > audit/load-files-all.txt
          test -s audit/modules.txt
          test -s audit/load-files-all.txt

          : > audit/load-files-active.txt
          : > audit/load-files-alternate.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rel="${f#*/lib/modules/}"
            if [[ "$rel" == modules.load* ]]; then
              echo "$f" >> audit/load-files-active.txt
            else
              echo "$f" >> audit/load-files-alternate.txt
            fi
          done < audit/load-files-all.txt

          test -s audit/load-files-active.txt
          : > audit/load-plan-active.txt
          while IFS= read -r f; do
            sed '/^[[:space:]]*$/d;/^[[:space:]]*#/d' "$f" >> audit/load-plan-active.txt
          done < audit/load-files-active.txt
          sort -u audit/load-plan-active.txt -o audit/load-plan-active.txt

          : > audit/load-plan-alternate.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            sed '/^[[:space:]]*$/d;/^[[:space:]]*#/d' "$f" >> audit/load-plan-alternate.txt
          done < audit/load-files-alternate.txt
          sort -u audit/load-plan-alternate.txt -o audit/load-plan-alternate.txt

          echo 'ACTIVE LOAD FILES:'
          cat audit/load-files-active.txt
          echo 'ACTIVE LOAD PLAN:'
          cat audit/load-plan-active.txt
          echo 'ALTERNATE LOAD FILES:'
          cat audit/load-files-alternate.txt || true

      - name: Audit active QGKI cohort and alternate 5.4-gki cohort
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from elftools.elf.elffile import ELFFile
          import os

          release = os.environ['CANDIDATE_RELEASE']
          expected_layout = os.environ['EXPECT_QGKI_MODULE_LAYOUT'].lower()
          modules = [Path(x) for x in Path('audit/modules.txt').read_text().splitlines() if x.strip()]
          active_names = {Path(x.strip()).name for x in Path('audit/load-plan-active.txt').read_text(errors='replace').splitlines() if x.strip()}
          alternate_names = {Path(x.strip()).name for x in Path('audit/load-plan-alternate.txt').read_text(errors='replace').splitlines() if x.strip()}

          rows=[]; cohorts=Counter(); active=[]
          for path in modules:
              vermagic='-'; layout=None; status='OK'
              try:
                  with path.open('rb') as f:
                      elf=ELFFile(f)
                      modinfo=elf.get_section_by_name('.modinfo')
                      if modinfo is not None:
                          for field in modinfo.data().split(b'\0'):
                              if field.startswith(b'vermagic='):
                                  vermagic=field.split(b'=',1)[1].decode('utf-8','replace'); break
                      sec=elf.get_section_by_name('__versions')
                      if sec is not None:
                          data=sec.data()
                          for off in range(0,len(data),64):
                              chunk=data[off:off+64]
                              if len(chunk)<64: break
                              name=chunk[8:].split(b'\0',1)[0].decode('ascii','replace')
                              if name=='module_layout':
                                  layout=f'{int.from_bytes(chunk[:8],"little") & 0xffffffff:08x}'; break
              except Exception as e:
                  status=f'ERROR:{e!r}'
              is_active=int(path.name in active_names)
              is_alt=int(path.name in alternate_names)
              release_ok=int(vermagic.startswith(release+' '))
              layout_ok=int(layout == expected_layout)
              row=(str(path),path.name,vermagic,layout or 'MISSING',str(release_ok),str(layout_ok),str(is_active),str(is_alt),status)
              rows.append(row); cohorts[(vermagic,layout or 'MISSING')]+=1
              if is_active: active.append(row)

          Path('audit/module-abi.tsv').write_text('path\tname\tvermagic\tmodule_layout_crc\trelease_match\tlayout_match\tactive_qgki_plan\talternate_plan\tstatus\n' + '\n'.join('\t'.join(r) for r in rows)+'\n')
          Path('audit/cohorts.txt').write_text('\n'.join(f'{n}\tmodule_layout={layout}\tvermagic={vm}' for (vm,layout),n in sorted(cohorts.items(),key=lambda x:(-x[1],x[0])))+'\n')

          missing_active=sorted(active_names-{p.name for p in modules})
          bad_release=[r for r in active if r[4]!='1']
          bad_layout=[r for r in active if r[5]!='1']
          summary=[
              f'module_count={len(rows)}',
              f'active_qgki_load_entries={len(active_names)}',
              f'active_qgki_found={len(active)}',
              f'active_qgki_missing={len(missing_active)}',
              f'active_qgki_release_mismatch={len(bad_release)}',
              f'active_qgki_layout_mismatch={len(bad_layout)}',
              f'alternate_load_entries={len(alternate_names)}',
              'active_modules=' + ','.join(sorted(r[1] for r in active)),
              'missing_active=' + ','.join(missing_active),
          ]
          if active and not missing_active and not bad_release and not bad_layout:
              summary.append('STOCK_IMAGE_3_09_ACTIVE_QGKI_ABI=PASS')
          else:
              summary.append('STOCK_IMAGE_3_09_ACTIVE_QGKI_ABI=BLOCKED')
          Path('audit/final-gate.txt').write_text('\n'.join(summary)+'\n')
          print('\n'.join(summary))
          print('\nCOHORTS:')
          print(Path('audit/cohorts.txt').read_text())
          PY

          grep -Fqx 'STOCK_IMAGE_3_09_ACTIVE_QGKI_ABI=PASS' audit/final-gate.txt

      - name: Upload ABI audit
        uses: actions/upload-artifact@v4
        with:
          name: lisa-stock-image-3-09-vendor-boot-abi-audit
          retention-days: 14
          if-no-files-found: error
          path: audit/
