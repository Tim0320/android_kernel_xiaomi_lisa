name: Compare stock Image CRCs with stock QGKI module ABI
# CI retrigger marker: stock-image ABI oracle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/abi-stock-image-crc-oracle.yml

permissions:
  contents: write

jobs:
  stock-image-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/01-install.log) 2>&1
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils gzip bzip2 lz4 zstd binutils python3-pip git git-lfs
          git lfs install

      - name: Fetch public stock boot image
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/02-fetch.log) 2>&1
          set -euo pipefail

          url="https://raw.githubusercontent.com/Jiovanni-dump/xiaomi_lisa_dump/2dbe7b5569ed49cc2c6649a7b313d4a092755034/boot.img.xz"
          rm -f stock-boot-download boot.img

          if ! curl -L --fail --retry 5 --retry-delay 2 "$url" -o stock-boot-download; then
            echo "Raw download failed; falling back to sparse Git/LFS fetch"
            rm -rf dump stock-boot-download
            git init dump
            git -C dump remote add origin https://github.com/Jiovanni-dump/xiaomi_lisa_dump.git
            git -C dump config core.sparseCheckout true
            echo "boot.img.xz" > dump/.git/info/sparse-checkout
            GIT_LFS_SKIP_SMUDGE=1 git -C dump fetch --depth=1 origin 2dbe7b5569ed49cc2c6649a7b313d4a092755034
            GIT_LFS_SKIP_SMUDGE=1 git -C dump checkout FETCH_HEAD
            git -C dump lfs pull --include="boot.img.xz"
            cp dump/boot.img.xz stock-boot-download
          fi

          ls -lh stock-boot-download
          file stock-boot-download || true
          sha256sum stock-boot-download
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          import lzma

          src = Path("stock-boot-download").read_bytes()
          print("DOWNLOAD_MAGIC=" + src[:16].hex())

          if src.startswith(b"ANDROID!"):
              print("STOCK_BOOT_CONTAINER=raw-android-boot")
              boot = src
          elif src.startswith(b"\xfd7zXZ\x00"):
              print("STOCK_BOOT_CONTAINER=xz")
              boot = lzma.decompress(src)
          elif src.startswith(b"\x1f\x8b"):
              print("STOCK_BOOT_CONTAINER=gzip")
              boot = gzip.decompress(src)
          elif src.startswith(b"version https://git-lfs.github.com/spec/v1"):
              raise SystemExit("Received a Git LFS pointer instead of file payload")
          else:
              raise SystemExit(
                  "Unknown stock boot container; first16=" + src[:16].hex()
              )

          if not boot.startswith(b"ANDROID!"):
              raise SystemExit(
                  "Normalized payload is not an Android boot image; first16="
                  + boot[:16].hex()
              )

          Path("boot.img").write_bytes(boot)
          print(f"BOOT_IMG_SIZE={len(boot)}")
          PY

          file boot.img || true
          ls -lh boot.img
          sha256sum boot.img

      - name: Extract and decompress ARM64 Image from Android boot image
        id: extract
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/03-extract.log) 2>&1
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import bz2
          import lzma
          import struct
          import subprocess
          import zlib

          data = Path("boot.img").read_bytes()
          if data[:8] != b"ANDROID!":
              raise SystemExit("Not an Android boot image")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]
          if header_version >= 3:
              page_size = 4096
          else:
              page_size = struct.unpack_from("<I", data, 36)[0]
              if page_size == 0:
                  raise SystemExit("Invalid legacy boot page size")

          start = page_size
          end = start + kernel_size
          if end > len(data):
              raise SystemExit("Kernel payload extends past boot image")

          payload = data[start:end]
          Path("kernel-payload.bin").write_bytes(payload)

          print(f"BOOT_HEADER_VERSION={header_version}")
          print(f"BOOT_PAGE_SIZE={page_size}")
          print(f"BOOT_KERNEL_SIZE={kernel_size}")
          print(f"BOOT_KERNEL_OFFSET=0x{start:x}")
          print(f"KERNEL_PAYLOAD_MAGIC={payload[:8].hex()}")

          ARM64_MAGIC = 0x644D5241

          def is_arm64_image(blob):
              return len(blob) >= 0x3c and struct.unpack_from("<I", blob, 0x38)[0] == ARM64_MAGIC

          compression = "unknown"
          image = None

          if is_arm64_image(payload):
              compression = "raw"
              image = payload
          elif payload.startswith(b"\x1f\x8b"):
              compression = "gzip"
              d = zlib.decompressobj(16 + zlib.MAX_WBITS)
              image = d.decompress(payload) + d.flush()
          elif payload.startswith(b"\xfd7zXZ\x00"):
              compression = "xz"
              d = lzma.LZMADecompressor()
              image = d.decompress(payload)
          elif payload.startswith(b"BZh"):
              compression = "bzip2"
              image = bz2.decompress(payload)
          elif payload.startswith(b"\x04\x22\x4d\x18") or payload.startswith(b"\x02\x21\x4c\x18"):
              compression = "lz4"
              proc = subprocess.run(
                  ["lz4", "-dc", "kernel-payload.bin"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if proc.returncode != 0:
                  print(proc.stderr.decode("utf-8", "replace"))
                  raise SystemExit(f"lz4 decompression failed: {proc.returncode}")
              image = proc.stdout
          elif payload.startswith(b"\x28\xb5\x2f\xfd"):
              compression = "zstd"
              proc = subprocess.run(
                  ["zstd", "-dc", "kernel-payload.bin"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if proc.returncode != 0:
                  print(proc.stderr.decode("utf-8", "replace"))
                  raise SystemExit(f"zstd decompression failed: {proc.returncode}")
              image = proc.stdout

          print(f"KERNEL_COMPRESSION={compression}")
          if image is None:
              raise SystemExit(
                  "Unsupported kernel payload format; keep kernel-payload.bin artifact for inspection"
              )

          if not is_arm64_image(image):
              got = (
                  struct.unpack_from("<I", image, 0x38)[0]
                  if len(image) >= 0x3c else None
              )
              raise SystemExit(
                  f"Decompressed payload is not an ARM64 Image; magic={got!r}"
              )

          print(f"ARM64_IMAGE_MAGIC=0x{ARM64_MAGIC:08x}")
          print(f"ARM64_IMAGE_SIZE={len(image)}")
          Path("stock-Image").write_bytes(image)
          PY

          file kernel-payload.bin stock-Image || true
          strings -a stock-Image | grep -F "Linux version 5.4.289-qgki-g5987d69e25da"
          strings -a stock-Image | grep -F "5.4.289-qgki-g5987d69e25da" | head -n 20
          ls -lh kernel-payload.bin stock-Image

      - name: Install kallsyms recovery tool
        id: tools
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/04-tools.log) 2>&1
          set -euo pipefail
          python3 -m pip install --break-system-packages git+https://github.com/marin-m/vmlinux-to-elf.git
          command -v kallsyms-finder
          command -v vmlinux-to-elf

      - name: Recover stock Image kallsyms and CRC symbols
        id: recover
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/05-recover.log) 2>&1
          set -euo pipefail

          kallsyms-finder stock-Image > stock.kallsyms
          test -s stock.kallsyms

          echo "KALLSYMS_LINES=$(wc -l < stock.kallsyms)"
          grep -E ' __crc_(module_layout|device_register|device_unregister|dev_driver_string|iommu_map|dma_buf_attach)$' stock.kallsyms || true

          crc_count="$(grep -c ' __crc_' stock.kallsyms || true)"
          echo "STOCK_IMAGE_CRC_SYMBOL_COUNT=$crc_count"
          if [[ "$crc_count" -lt 100 ]]; then
            echo "Too few __crc_ symbols recovered; oracle is not valid"
            exit 30
          fi

          # ELF reconstruction is a secondary cross-check. The kallsyms
          # output above is the primary source for absolute __crc_* values.
          vmlinux-to-elf stock-Image stock-vmlinux.elf || true
          if [[ -s stock-vmlinux.elf ]]; then
            nm -n stock-vmlinux.elf | grep ' __crc_' > stock.elf.crcs || true
            head -n 20 stock.elf.crcs || true
          fi

      - name: Compare stock Image CRCs to stock msm_drm QGKI oracle
        id: compare
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          exec > >(tee diagnostics/06-compare.log) 2>&1
          set -euo pipefail

          if [[ ! -s stock.kallsyms ]]; then
            echo "stock.kallsyms missing; compare cannot run"
            exit 40
          fi

          score=0
          total=0
          present=0

          check() {
            local symbol="$1" expected="$2"
            local raw actual

            total=$((total+1))
            raw="$(awk -v s="__crc_$symbol" '$NF == s {print $1; exit}' stock.kallsyms)"

            if [[ -n "$raw" ]]; then
              present=$((present+1))
              raw="${raw#0x}"
              raw="${raw,,}"
              actual="0x${raw: -8}"
            else
              actual="MISSING"
            fi

            echo "stock-image: $symbol image=$actual module=$expected"
            [[ "$actual" == "$expected" ]] && score=$((score+1)) || true
          }

          check module_layout 0xba39cbb8
          check device_register 0xcf9bcdee
          check device_unregister 0x4678e0d9
          check dev_driver_string 0x22a8544f
          check device_create 0xbebfb31d
          check __platform_driver_register 0x8a28799a
          check platform_driver_unregister 0xb1643fd1
          check platform_get_irq 0xbcc683a6
          check platform_get_resource 0x0b50f5aa
          check platform_get_resource_byname 0x67870233
          check __pm_runtime_resume 0xd7ceaec5
          check pm_runtime_enable 0x69233960
          check of_find_property 0x7bfb6ef3
          check of_get_property 0x3f86cb17
          check of_parse_phandle 0x5d8562ca
          check of_address_to_resource 0x6f7055af
          check of_device_is_compatible 0xb56ea40d
          check clk_get 0xf8127647
          check clk_register 0xab9a55da
          check iommu_attach_device 0x0c54e55f
          check iommu_map 0xa106c11d
          check iommu_unmap 0xe1da4443
          check regulator_get 0xf7c6097c
          check regulator_enable 0x691df2d6
          check regulator_set_voltage 0x54cdbf0a
          check kthread_create_on_node 0x947eb746
          check kthread_stop 0x97198f13
          check irq_domain_remove 0x160aa18c
          check irq_find_mapping 0x6fb78324
          check sysfs_create_group 0x0965d890
          check kobject_create_and_add 0x93a00376
          check __free_pages 0x419e8d31
          check adjust_managed_page_count 0xcf0c4b39
          check dma_direct_map_page 0x803f2855
          check dma_direct_map_sg 0x9e7457c3
          check dma_alloc_attrs 0x1c3c2bb3
          check dma_buf_attach 0x995856d1
          check dma_buf_map_attachment 0x3d20e038

          echo "STOCK_IMAGE_CRC_PRESENT=$present/$total"
          echo "STOCK_IMAGE_MODULE_CRC_SCORE=$score/$total"

          if [[ "$present" -lt 35 ]]; then
            echo "Insufficient CRC coverage to draw a conclusion"
            exit 31
          fi

          if [[ "$score" -eq "$total" ]]; then
            echo "STOCK_IMAGE_MODULE_ABI_IDENTICAL=1"
          else
            echo "STOCK_IMAGE_MODULE_ABI_IDENTICAL=0"
          fi

      - name: Persist diagnostic report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          mkdir -p reconstruction
          {
            echo "# Stock Image ABI probe diagnostic"
            echo
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo
            echo "install=${INSTALL_OUTCOME}"
            echo "fetch=${FETCH_OUTCOME}"
            echo "extract=${EXTRACT_OUTCOME}"
            echo "tools=${TOOLS_OUTCOME}"
            echo "recover=${RECOVER_OUTCOME}"
            echo "compare=${COMPARE_OUTCOME}"
            for log in diagnostics/*.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "===== $log ====="
                cat "$log"
              fi
            done
          } > reconstruction/last_stock_image_probe.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/last_stock_image_probe.txt
          if ! git diff --cached --quiet; then
            git commit -m "ci: record stock Image ABI probe diagnostics"
            git push
          fi

      - name: Upload stock CRC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-image-crc-oracle
          retention-days: 7
          path: |
            kernel-payload.bin
            stock-Image
            stock.kallsyms
            stock.elf.crcs
            diagnostics/
            reconstruction/last_stock_image_probe.txt

      - name: Fail job if probe stage failed
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          for status in "$INSTALL_OUTCOME" "$FETCH_OUTCOME" "$EXTRACT_OUTCOME" "$TOOLS_OUTCOME" "$RECOVER_OUTCOME" "$COMPARE_OUTCOME"; do
            if [[ "$status" != "success" ]]; then
              echo "At least one probe stage failed; see reconstruction/last_stock_image_probe.txt"
              exit 1
            fi
          done
