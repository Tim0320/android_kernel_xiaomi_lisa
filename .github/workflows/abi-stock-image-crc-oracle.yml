name: Compare uploaded exact Lisa stock Image CRCs with stock QGKI module ABI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/abi-stock-image-crc-oracle.yml
      - reconstruction/stock/stock-Image/**
      - reconstruction/stock_module_oracle.txt
      - scripts/extract_stock_kcrc.py

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-image-abi-oracle
  cancel-in-progress: true

jobs:
  stock-image-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        id: install
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          exec > >(tee diagnostics/01-install.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y binutils python3-pip git-lfs unzip
          git lfs install
          python3 -m pip install --break-system-packages git+https://github.com/marin-m/vmlinux-to-elf.git
          command -v kallsyms-finder

      - name: Use uploaded exact Lisa stock images
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          exec > >(tee diagnostics/02-fetch.log) 2>&1

          stock_dir="reconstruction/stock/stock-Image"
          for file in boot.img vendor_boot.img dtbo.img odm.img; do
            test -f "$stock_dir/$file"
            if grep -q '^version https://git-lfs.github.com/spec/v1' "$stock_dir/$file"; then
              echo "$file is still a Git LFS pointer"
              exit 23
            fi
          done

          cp "$stock_dir/boot.img" boot.img
          file boot.img "$stock_dir/vendor_boot.img" "$stock_dir/dtbo.img" "$stock_dir/odm.img" || true
          ls -lh boot.img "$stock_dir/vendor_boot.img" "$stock_dir/dtbo.img" "$stock_dir/odm.img"
          sha256sum boot.img "$stock_dir/vendor_boot.img" "$stock_dir/dtbo.img" "$stock_dir/odm.img"

      - name: Extract exact ARM64 stock Image
        id: extract
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          exec > >(tee diagnostics/03-extract.log) 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path("boot.img").read_bytes()
          if data[:8] != b"ANDROID!":
              raise SystemExit("Not an Android boot image")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          header_version = struct.unpack_from("<I", data, 40)[0]
          page_size = 4096 if header_version >= 3 else struct.unpack_from("<I", data, 36)[0]
          if not page_size:
              raise SystemExit("Invalid boot page size")

          start = page_size
          end = start + kernel_size
          if end > len(data):
              raise SystemExit("Kernel payload extends past boot image")

          image = data[start:end]
          if len(image) < 0x3c or struct.unpack_from("<I", image, 0x38)[0] != 0x644D5241:
              raise SystemExit("Kernel payload is not a raw ARM64 Image")

          Path("stock-Image").write_bytes(image)
          print(f"BOOT_HEADER_VERSION={header_version}")
          print(f"BOOT_PAGE_SIZE={page_size}")
          print(f"BOOT_KERNEL_SIZE={kernel_size}")
          print(f"ARM64_IMAGE_SIZE={len(image)}")
          PY

          version="$(strings -a stock-Image | grep -m1 '^Linux version ' || true)"
          echo "DETECTED_KERNEL_VERSION=$version"
          [[ "$version" == *"5.4.289-qgki-g5987d69e25da"* ]]
          echo "TARGET_KERNEL_VERSION_CONFIRMED=1"

      - name: Recover kallsyms and stock kcrctab CRCs
        id: recover
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          exec > >(tee diagnostics/04-recover.log) 2>&1

          kallsyms-finder stock-Image > stock.kallsyms
          test -s stock.kallsyms
          echo "KALLSYMS_LINES=$(wc -l < stock.kallsyms)"

          grep -E ' (_text|_stext|stext)$' stock.kallsyms || true
          grep -E ' (__start___ksymtab|__stop___ksymtab|__start___kcrctab)' stock.kallsyms | head -n 80 || true

          python3 scripts/extract_stock_kcrc.py \
            --image stock-Image \
            --kallsyms stock.kallsyms \
            --oracle reconstruction/stock_module_oracle.txt \
            --output stock.image.crcs \
            --full-output stock.full.crcs

          test -s stock.image.crcs
          cat stock.image.crcs

      - name: Summarize stock Image versus stock module ABI
        id: compare
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          exec > >(tee diagnostics/05-compare.log) 2>&1

          test -s stock.image.crcs
          mode="$(awk -F= '/^mode=/{print $2}' stock.image.crcs)"
          present="$(awk -F= '/^present=/{print $2}' stock.image.crcs)"
          score="$(awk -F= '/^score=/{print $2}' stock.image.crcs)"

          echo "STOCK_IMAGE_KCRC_MODE=$mode"
          echo "STOCK_IMAGE_CRC_PRESENT=$present"
          echo "STOCK_IMAGE_MODULE_CRC_SCORE=$score"

          cat stock.image.crcs

          {
            echo "## Stock Image ABI oracle"
            echo
            echo "- Kernel: 5.4.289-qgki-g5987d69e25da"
            echo "- CRC mode: $mode"
            echo "- Present: $present"
            echo "- Match score: $score"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare full stock CRC oracle with Build #53 Module.symvers
        id: fullcompare
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD53_ARTIFACT_ID: "10622813278"
        run: |
          set -euo pipefail
          mkdir -p diagnostics build53-artifact
          exec > >(tee diagnostics/06-full-compare.log) 2>&1

          test -s stock.full.crcs

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BUILD53_ARTIFACT_ID}/zip" \
            -o build53.zip

          unzip -q build53.zip -d build53-artifact
          echo "BUILD53_ARTIFACT_FILES:"
          find build53-artifact -maxdepth 5 -type f -printf '%p\n' | sort | head -n 200

          module_symvers="$(find build53-artifact -type f -name Module.symvers | head -n 1)"
          if [[ -z "$module_symvers" ]]; then
            echo "Build #53 artifact does not contain Module.symvers"
            exit 31
          fi
          echo "BUILD53_MODULE_SYMVERS=$module_symvers"

          python3 - "$module_symvers" stock.full.crcs full-abi-compare.txt <<'PY'
          import sys
          from pathlib import Path

          symvers_path, stock_path, out_path = sys.argv[1:]

          stock = {}
          for line in Path(stock_path).read_text().splitlines():
              if not line or line.startswith("#"):
                  continue
              crc, name, section = line.split("\t")[:3]
              stock[name] = (int(crc, 16), section)

          current_all = {}
          current_vmlinux = {}
          current_modules = {}
          for line in Path(symvers_path).read_text(errors="replace").splitlines():
              parts = line.split()
              if len(parts) < 2:
                  continue
              try:
                  crc = int(parts[0], 16)
              except ValueError:
                  continue
              name = parts[1]
              module = parts[2] if len(parts) >= 3 else "-"
              current_all[name] = (crc, module)
              if module == "vmlinux":
                  current_vmlinux[name] = (crc, module)
              else:
                  current_modules[name] = (crc, module)

          stock_names = set(stock)
          current_names = set(current_vmlinux)
          overlap = stock_names & current_names
          matches = sorted(
              name for name in overlap if stock[name][0] == current_vmlinux[name][0]
          )
          mismatches = sorted(
              name for name in overlap if stock[name][0] != current_vmlinux[name][0]
          )
          stock_only = sorted(stock_names - current_names)
          current_only = sorted(current_names - stock_names)

          module_name_counts = {}
          for _name, (_crc, module) in current_modules.items():
              module_name_counts[module] = module_name_counts.get(module, 0) + 1

          print(f"FULL_STOCK_EXPORTS={len(stock)}")
          print(f"FULL_CURRENT_SYMVERS_ALL={len(current_all)}")
          print(f"FULL_CURRENT_VMLINUX={len(current_vmlinux)}")
          print(f"FULL_CURRENT_MODULE_EXPORTS={len(current_modules)}")
          print(f"FULL_SYMBOL_OVERLAP={len(overlap)}")
          print(f"FULL_CRC_MATCHES={len(matches)}")
          print(f"FULL_CRC_MISMATCHES={len(mismatches)}")
          print(f"FULL_STOCK_ONLY={len(stock_only)}")
          print(f"FULL_CURRENT_ONLY_VMLINUX={len(current_only)}")
          if overlap:
              print(f"FULL_OVERLAP_MATCH_RATE={len(matches)/len(overlap):.6f}")
          print("FULL_TOP_MODULE_EXPORT_COUNTS:")
          for module, count in sorted(module_name_counts.items(), key=lambda kv: (-kv[1], kv[0]))[:30]:
              print(f"MODULE_EXPORT_COUNT={count}\t{module}")

          lines = [
              "# Full stock Image vs Build #53 Module.symvers",
              f"stock_exports={len(stock)}",
              f"current_symvers_all={len(current_all)}",
              f"current_vmlinux={len(current_vmlinux)}",
              f"current_module_exports={len(current_modules)}",
              f"overlap={len(overlap)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"stock_only={len(stock_only)}",
              f"current_only={len(current_only)}",
              "",
              "## MATCHES",
          ]
          for name in matches:
              scrc, section = stock[name]
              ccrc, module = current_vmlinux[name]
              lines.append(
                  f"MATCH\t{name}\t0x{scrc:08x}\t{section}\t{module}"
              )
          lines += ["", "## MISMATCHES"]
          for name in mismatches:
              scrc, section = stock[name]
              ccrc, module = current_vmlinux[name]
              lines.append(
                  f"MISMATCH\t{name}\tstock=0x{scrc:08x}\t"
                  f"current=0x{ccrc:08x}\t{section}\t{module}"
              )
          lines += ["", "## STOCK_ONLY"]
          lines.extend(f"STOCK_ONLY\t{name}\t0x{stock[name][0]:08x}\t{stock[name][1]}" for name in stock_only)
          lines += ["", "## CURRENT_ONLY"]
          lines.extend(f"CURRENT_ONLY_VMLINUX\t{name}\t0x{current_vmlinux[name][0]:08x}\tvmlinux" for name in current_only)
          lines += ["", "## MODULE_EXPORTS"]
          lines.extend(
              f"MODULE_EXPORT\t{name}\t0x{current_modules[name][0]:08x}\t{current_modules[name][1]}"
              for name in sorted(current_modules)
          )

          Path(out_path).write_text("\n".join(lines) + "\n")
          PY

          test -s full-abi-compare.txt
          head -n 30 full-abi-compare.txt

      - name: Write diagnostic report
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          FULLCOMPARE_OUTCOME: ${{ steps.fullcompare.outcome }}
        run: |
          mkdir -p reconstruction diagnostics
          {
            echo "# Stock Image ABI probe diagnostic"
            echo
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo
            echo "install=$INSTALL_OUTCOME"
            echo "fetch=$FETCH_OUTCOME"
            echo "extract=$EXTRACT_OUTCOME"
            echo "recover=$RECOVER_OUTCOME"
            echo "compare=$COMPARE_OUTCOME"
            echo "fullcompare=$FULLCOMPARE_OUTCOME"
            for log in diagnostics/*.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "===== $log ====="
                cat "$log"
              fi
            done
          } > reconstruction/last_stock_image_probe.txt

      - name: Upload stock ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-image-crc-oracle
          retention-days: 7
          if-no-files-found: warn
          path: |
            stock.kallsyms
            stock.image.crcs
            stock.full.crcs
            full-abi-compare.txt
            diagnostics/
            reconstruction/last_stock_image_probe.txt
