name: Build Lisa Candidate 0008 with CN firmware and TW super

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-lisa-cn-firmware-candidate0008-tw-super-experiment.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-candidate0008-cn-firmware-tw-super
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CN_CONTROL_ARTIFACT_ID: 10772598639
      CN_CONTROL_ARTIFACT_SHA256: 1314cf9ecbd8e7f8b9faf6601cf699ba4ed9386c162bc0c91fd7e2a256cf35b2
      CANDIDATE_0008_ARTIFACT_ID: 10765228960
      CANDIDATE_0008_ARTIFACT_SHA256: b248c0fc9edd03d26e3527973cd2aae1b25e6517aa6be167f9704c26d1116a0b
      CANDIDATE_0008_BOOT_SHA256: 585a69eae9ab0fe1ff028c5e9890c36e4d745778e9d60a9ebdc61649a81c2063
      CN_STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
      CN_VENDOR_BOOT_SHA256: c0a7528e8eacd2a86270ee017dfe90e657f1a0c5c40527869f89e915c2954a5a
      CN_DTBO_SHA256: db7c50147d8217c41cd86e53dda6e8ce93a5928a8f06ece8da92955a9c0e7ba7

    steps:
      - name: Checkout reconstruction metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file python3

      - name: Download exact control and Candidate 0008 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          download_artifact() {
            local id="$1"
            local out="$2"
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$out"
          }

          download_artifact "$CN_CONTROL_ARTIFACT_ID" cn-control.zip
          download_artifact "$CANDIDATE_0008_ARTIFACT_ID" candidate0008.zip

          echo "$CN_CONTROL_ARTIFACT_SHA256  cn-control.zip" | sha256sum -c -
          echo "$CANDIDATE_0008_ARTIFACT_SHA256  candidate0008.zip" | sha256sum -c -

          mkdir -p cn-control candidate0008
          unzip -q cn-control.zip -d cn-control
          unzip -q candidate0008.zip -d candidate0008

      - name: Locate and authenticate exact inputs
        run: |
          set -euo pipefail

          cn_root="$(find cn-control -type f -name final-gate.txt -printf '%h\n' | head -n1)"
          candidate_boot="$(find candidate0008 -type f -name boot.img -print -quit)"

          test -n "$cn_root" && test -d "$cn_root"
          test -n "$candidate_boot" && test -s "$candidate_boot"

          grep -Fqx 'LISA_CN_FIRMWARE_TW_SUPER_CONTROL_GATE=PASS' "$cn_root/final-gate.txt"
          test "$(sha256sum "$candidate_boot" | awk '{print $1}')" = "$CANDIDATE_0008_BOOT_SHA256"
          test "$(sha256sum "$cn_root/images/boot.img" | awk '{print $1}')" = "$CN_STOCK_BOOT_SHA256"
          test "$(sha256sum "$cn_root/images/vendor_boot.img" | awk '{print $1}')" = "$CN_VENDOR_BOOT_SHA256"
          test "$(sha256sum "$cn_root/images/dtbo.img" | awk '{print $1}')" = "$CN_DTBO_SHA256"

          echo "CN_ROOT=$cn_root" >> "$GITHUB_ENV"
          echo "CANDIDATE_BOOT=$candidate_boot" >> "$GITHUB_ENV"

          {
            echo 'CN_CONTROL_ARTIFACT_EXACT=PASS'
            echo 'CANDIDATE_0008_ARTIFACT_EXACT=PASS'
            echo 'CANDIDATE_0008_BOOT_EXACT=PASS'
            echo 'CN_VENDOR_BOOT_EXACT=PASS'
            echo 'CN_DTBO_EXACT=PASS'
          } | tee input-gate.txt

      - name: Build isolated experiment package
        run: |
          set -euo pipefail

          mkdir -p experiment
          cp -a "$CN_ROOT/." experiment/

          mv experiment/images/boot.img experiment/images/boot-cn-stock-control.img
          cp "$CANDIDATE_BOOT" experiment/images/boot.img

          test "$(sha256sum experiment/images/boot.img | awk '{print $1}')" = "$CANDIDATE_0008_BOOT_SHA256"
          test "$(sha256sum experiment/images/boot-cn-stock-control.img | awk '{print $1}')" = "$CN_STOCK_BOOT_SHA256"
          test "$(sha256sum experiment/images/vendor_boot.img | awk '{print $1}')" = "$CN_VENDOR_BOOT_SHA256"
          test "$(sha256sum experiment/images/dtbo.img | awk '{print $1}')" = "$CN_DTBO_SHA256"

          sha256sum experiment/images/*.img | sort > experiment/SHA256SUMS.txt

          cat > experiment/EXPERIMENT.md <<'EOF'
          # Lisa Candidate 0008 + CN OS2.0.16 firmware + TW super experiment

          This package changes exactly one image relative to the validated CN-stock-control package:

          - `images/boot.img` = reconstructed Candidate 0008
          - `images/boot-cn-stock-control.img` = exact CN stock boot retained for rollback/control
          - every other firmware image remains byte-for-byte from CN OS2.0.16.0.UKOCNXM

          Preserve from the current Taiwan OS2.0.5.0.UKOTWXM device state:

          - `super`
          - `vbmeta_system` and `vbmeta_vendor` if present
          - `userdata`
          - current top-level `vbmeta` for this experiment

          Device-test order:

          1. First boot the CN-stock-control package with TW super.
          2. Only if that control boots, replace `boot_a` with this package's `images/boot.img`.
          3. Keep the same CN `vendor_boot_a`, `dtbo_a`, and CN firmware state.
          4. If Candidate 0008 then fails, the reconstructed kernel is isolated as the changed variable.
          5. If the stock CN control itself fails, do not interpret Candidate 0008 until the CN-firmware/TW-super compatibility issue is resolved.
          EOF

          cat > experiment/EXPERIMENT_GATE.txt <<EOF
          candidate_0008_boot_sha256=$CANDIDATE_0008_BOOT_SHA256
          cn_stock_boot_control_sha256=$CN_STOCK_BOOT_SHA256
          cn_vendor_boot_sha256=$CN_VENDOR_BOOT_SHA256
          cn_dtbo_sha256=$CN_DTBO_SHA256
          only_control_boot_replaced=1
          LISA_CANDIDATE_0008_CN_FIRMWARE_TW_SUPER_STATIC_GATE=PASS
          EOF

      - name: Validate one-variable delta
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          cn_root = Path(__import__('os').environ['CN_ROOT'])
          exp = Path('experiment')

          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()

          baseline = {p.name: sha(p) for p in (cn_root/'images').glob('*.img')}
          experiment = {p.name: sha(p) for p in (exp/'images').glob('*.img') if p.name != 'boot-cn-stock-control.img'}

          missing = sorted(set(baseline) - set(experiment))
          added = sorted(set(experiment) - set(baseline))
          changed = sorted(k for k in set(baseline) & set(experiment) if baseline[k] != experiment[k])

          print('missing=' + ','.join(missing))
          print('added=' + ','.join(added))
          print('changed=' + ','.join(changed))

          if missing or added or changed != ['boot.img']:
              raise SystemExit('experiment delta is not exactly boot.img')

          Path('experiment/DELTA_GATE.txt').write_text(
              'missing=\nadded=\nchanged=boot.img\nONLY_BOOT_CHANGED=PASS\n'
          )
          PY

          grep -Fqx 'ONLY_BOOT_CHANGED=PASS' experiment/DELTA_GATE.txt
          grep -Fqx 'LISA_CANDIDATE_0008_CN_FIRMWARE_TW_SUPER_STATIC_GATE=PASS' experiment/EXPERIMENT_GATE.txt

      - name: Upload Candidate 0008 CN-firmware experiment
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0008-cn-firmware-tw-super-experiment
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: experiment/
