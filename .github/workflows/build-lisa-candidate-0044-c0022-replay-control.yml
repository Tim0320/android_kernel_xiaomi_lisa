name: Build Lisa Candidate 0044 exact Candidate0022 replay control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-lisa-candidate-0044-c0022-replay-control.yml
      - reconstruction/scripts/candidate_0044_build.py

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-candidate-0044-c0022-replay-control
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout package baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: true

      - name: Checkout exact reconstructed kernel source
        uses: actions/checkout@v4
        with:
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false

      - name: Checkout exact known-good 5.4.302 runtime source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8350
          ref: 46af56554ec50e3ff3752858bf38eaeeb852ca0d
          path: known-good-302
          fetch-depth: 1
          lfs: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 curl unzip git rsync kmod

      - name: Install stock-era clang 11.0.2
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/clang-r383902b1"
          ARCHIVE="$RUNNER_TEMP/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          curl -L --fail --retry 5 --retry-all-errors "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$DEST"
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q "clang version 11.0.2" clang-version.txt

      - name: Fetch preserved Candidate 0018 IKCONFIG
        env:
          GH_TOKEN: ${{ github.token }}
          C0040_ARTIFACT_ID: "11047365059"
        run: |
          set -euo pipefail
          mkdir -p c0040
          curl -fL --retry 5 --retry-all-errors             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$C0040_ARTIFACT_ID/zip"             -o c0040.zip
          unzip -q c0040.zip -d c0040
          cfg="$(find c0040 -type f -name candidate-0018.ikconfig -print -quit)"
          test -n "$cfg"
          cp "$cfg" candidate-0018.ikconfig
          test "$(sha256sum candidate-0018.ikconfig | awk '{print $1}')" = "f4b5bebdb85da152e035249f3bc8f6392c67fc239ef5c8367769151481421f42"

      - name: Validate Candidate 0044 build script
        run: python3 -m py_compile reconstruction/scripts/candidate_0044_build.py

      - name: Build and package Candidate 0044
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: python3 reconstruction/scripts/candidate_0044_build.py

      - name: Final Candidate 0044 replay gate
        run: |
          set -euo pipefail
          test -s boot.img
          test -s candidate-0044-Image
          test -s candidate-0044-control.txt
          grep -Fq 'LISA_CANDIDATE_0044_C0022_REPLAY_FINAL_GATE=PASS' candidate-0044-manifest.txt
          grep -Fq 'CANDIDATE_0044_C0022_REPLAY_GATE=PASS' candidate-0044-control.txt
          grep -Fq 'CANDIDATE_0044_FIXED_REGION_REPACK_GATE=PASS' candidate-0044-repack.txt
          grep -Fq 'changed_bytes_outside_kernel_region=0' candidate-0044-repack.txt
          grep -Fq 'stock_ramdisk_byte_exact=1' candidate-0044-repack.txt
          grep -Fq 'known_good_sha=46af56554ec50e3ff3752858bf38eaeeb852ca0d' candidate-0044-overlay.txt
          ! grep -Fq 'ANDROID_VENDOR_DATA(1);' kernel/include/linux/rwsem.h
          grep -Fq 'export CONFIG_DISPLAY_BUILD=y' kernel/techpack/display/config/lahainadisp.conf
          ! grep -Fq 'lisa_mtdoops_checkpoint' kernel/drivers/mtd/mtdoops.c
          echo 'LISA_CANDIDATE_0044_REPLAY_ARTIFACT_GATE=PASS'

      - name: Upload Candidate 0044
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0044-c0022-replay-control
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
          path: |
            boot.img
            boot.img.sha256
            candidate-0044-Image
            candidate-0044.ikconfig
            candidate-0044.config
            candidate-0044-repack.txt
            candidate-0044-root-cause.txt
            candidate-0044-manifest.txt
            candidate-0044-overlay.txt
            candidate-0044-control.txt
            candidate-0018.ikconfig
            clang-version.txt
