name: Reconstruct lisa 5.4.289 QGKI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - reconstruction/**
      - scripts/bootstrap_reconstruction.sh
      - scripts/check_reconstruction.sh
      - .github/workflows/reconstruct.yml

permissions:
  contents: write

concurrency:
  group: lisa-5.4.289-reconstruction
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout reconstruction metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate reconstruction scripts
        run: |
          bash -n scripts/bootstrap_reconstruction.sh
          bash -n scripts/check_reconstruction.sh

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git rsync bc bison flex libssl-dev libelf-dev

      - name: Reconstruct source tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/bootstrap_reconstruction.sh scripts/check_reconstruction.sh
          scripts/bootstrap_reconstruction.sh

      - name: Push reconstructed source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source reconstruction/manifest.env
          SRC="${RUNNER_TEMP}/lisa-reconstruction/kernel"
          cd "$SRC"

          # Publish a source snapshot instead of donor histories. The generated
          # tree keeps all kernel files/provenance documents while avoiding a
          # multi-gigabyte push of unrelated upstream Git history.
          git checkout --orphan publish-snapshot
          git reset
          git add -A
          git commit -m "lisa: publish reconstructed HyperOS 5.4.289 QGKI snapshot"

          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" --force

      - name: Summary
        run: |
          source reconstruction/manifest.env
          {
            echo "## lisa reconstruction"
            echo
            echo "- Target: \`${TARGET_VERMAGIC}\`"
            echo "- ROM: \`${TARGET_ROM}\`"
            echo "- Branch: \`${TARGET_BRANCH}\`"
            echo "- Status: source reconstruction checks passed and branch was pushed."
          } >> "$GITHUB_STEP_SUMMARY"
