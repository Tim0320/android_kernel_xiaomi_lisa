name: Audit Lisa Candidate0059 Stage4 MIGT scheduler
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reconstruction/scripts/candidate_0059_stage4_migt_sched.py
      - reconstruction/c0059_stage4_migt_sched_20261005.md
      - .github/workflows/audit-lisa-candidate-0059-stage4-migt.yml

permissions:
  contents: read

concurrency:
  group: lisa-c0059-stage4-migt
  cancel-in-progress: true

jobs:
  stage4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Candidate0059 package commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: package
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Checkout exact pinned Lisa kernel source
        uses: actions/checkout@v4
        with:
          repository: Tim0320/android_kernel_xiaomi_lisa
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Apply Candidate0059 Stages1-4
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0059_state_layer.py apply --source kernel
          python3 package/reconstruction/scripts/candidate_0059_stage2_hooks.py apply --source kernel
          python3 package/reconstruction/scripts/candidate_0059_stage3_accounting.py apply --source kernel --json candidate-0059-stage3.json
          python3 package/reconstruction/scripts/candidate_0059_stage4_migt_sched.py apply --source kernel --json candidate-0059-stage4.json
          python3 package/reconstruction/scripts/candidate_0059_stage4_migt_sched.py verify --source kernel --json candidate-0059-stage4-verify.json
          git -C kernel diff > candidate-0059-stage4.patch

      - name: Install bounded compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Configure stock-aligned Stage4 features
        run: |
          set -euo pipefail
          mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          kernel/scripts/config --file kernel/out/.config \
            -e MIHW -e PACKAGE_RUNTIME_INFO -e MIGT
          make -C kernel O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^(CONFIG_MIHW|CONFIG_PACKAGE_RUNTIME_INFO|CONFIG_MIGT|CONFIG_SCHED_WALT|CONFIG_MODVERSIONS)=' kernel/out/.config
          grep -q '^CONFIG_MIGT=y$' kernel/out/.config

      - name: Compile Stage4 dependency slice
        run: |
          set -euo pipefail
          make -C kernel O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            kernel/sched/pkg_state.o \
            kernel/sched/pkg_bridge.o \
            kernel/sched/pkg_core.o \
            kernel/sched/migt_sched.o \
            kernel/sched/walt/walt.o
          aarch64-linux-gnu-nm kernel/out/kernel/sched/migt_sched.o | \
            grep -E ' (migt_hook|migt_monitor_hook|migt_monitor_init|migt_sched_init)$'
          printf '%s\n' \
            'CANDIDATE0059_STAGE4_COMPILE=PASS' \
            'MIGT_SCHEDULER_STATISTICS_SOURCE_ACTIVE=true' \
            'DEVICE_MIGT_DRIVER_PORTED=false' \
            'MIGT_IOCTL_EXPOSED=false' \
            'METIS_COMPAT_ADDED=false' \
            'RUNTIME_TESTED=false' \
            | tee candidate-0059-stage4-result.txt

      - name: Publish exact Stage4 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-stage4-migt-a${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            candidate-0059-stage4*.json
            candidate-0059-stage4*.txt
            candidate-0059-stage4.patch
