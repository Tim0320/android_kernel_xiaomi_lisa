name: Audit Lisa Candidate0059 Stage3 accounting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reconstruction/scripts/candidate_0059_stage3_accounting.py
      - reconstruction/scripts/candidate_0059_stage2_hooks.py
      - reconstruction/c0059_stage3_accounting_20261005.md
      - .github/workflows/audit-lisa-candidate-0059-stage3-accounting.yml

permissions:
  contents: read

concurrency:
  group: lisa-c0059-stage3-accounting
  cancel-in-progress: true

jobs:
  stage3:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Candidate0059 package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: package
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Checkout exact pinned Lisa source
        uses: actions/checkout@v4
        with:
          repository: Tim0320/android_kernel_xiaomi_lisa
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Apply Stage1 Stage2 Stage3
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0059_state_layer.py apply --source kernel
          python3 package/reconstruction/scripts/candidate_0059_stage2_hooks.py apply --source kernel
          python3 package/reconstruction/scripts/candidate_0059_stage3_accounting.py apply --source kernel --json candidate-0059-stage3.json
          python3 package/reconstruction/scripts/candidate_0059_stage3_accounting.py verify --source kernel --json candidate-0059-stage3-verify.json
          git -C kernel diff --check
          git -C kernel diff > candidate-0059-stage3.patch

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Prepare stock-based config
        run: |
          set -euo pipefail
          mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          kernel/scripts/config --file kernel/out/.config -e MIHW -e PACKAGE_RUNTIME_INFO
          make -C kernel O="$PWD/kernel/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^(CONFIG_MIHW|CONFIG_PACKAGE_RUNTIME_INFO|CONFIG_SCHED_WALT|CONFIG_MODVERSIONS)=' kernel/out/.config
          grep -q '^CONFIG_PACKAGE_RUNTIME_INFO=y$' kernel/out/.config

      - name: Compile Stage3 affected objects
        run: |
          set -euo pipefail
          make -C kernel O="$PWD/kernel/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 prepare
          make -C kernel O="$PWD/kernel/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            kernel/sched/pkg_state.o kernel/sched/pkg_bridge.o kernel/sched/pkg_core.o \
            kernel/fork.o kernel/user.o kernel/cred.o kernel/exit.o \
            kernel/time/timekeeping.o kernel/sched/walt/walt.o
          aarch64-linux-gnu-nm kernel/out/kernel/sched/pkg_core.o | grep -E ' (pkg_enable|update_pkg_load|package_runtime_monitor|migt_hook)$'
          printf '%s\n' \
            'CANDIDATE0059_STAGE3_COMPILE=PASS' \
            'RUNTIME_ACCOUNTING_SOURCE_ACTIVE=true' \
            'FULL_MIGT_PORTED=false' \
            'RUNTIME_TESTED=false' \
            | tee candidate-0059-stage3-result.txt

      - name: Publish Stage3 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-stage3-accounting-a${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            candidate-0059-stage3*.json
            candidate-0059-stage3*.txt
            candidate-0059-stage3.patch
            kernel/out/.config
            kernel/out/kernel/sched/pkg_core.o
