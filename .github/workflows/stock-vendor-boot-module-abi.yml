name: Audit Lisa stock vendor_boot module ABI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stock-vendor-boot-module-abi.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-vendor-boot-module-abi
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact stock images with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cpio file lz4 zstd xz-utils gzip python3 python3-pyelftools unzip

      - name: Verify exact stock vendor_boot image
        run: |
          set -euo pipefail
          img="reconstruction/stock/stock-Image/vendor_boot.img"
          test -s "$img"
          size="$(stat -c '%s' "$img")"
          echo "STOCK_VENDOR_BOOT_BYTES=$size"
          test "$size" -gt 90000000
          file "$img"

      - name: Parse vendor_boot and extract ramdisk fragments
        run: |
          set -euo pipefail
          rm -rf vendor-ramdisks
          mkdir -p vendor-ramdisks

          python3 - reconstruction/stock/stock-Image/vendor_boot.img vendor-ramdisks/vendor-boot-layout.txt vendor-ramdisks <<'PY'
          import struct
          import sys
          from pathlib import Path

          img_path = Path(sys.argv[1])
          layout_path = Path(sys.argv[2])
          out_dir = Path(sys.argv[3])
          data = img_path.read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit(f"bad vendor_boot magic: {data[:8]!r}")

          def u32(off):
              return struct.unpack_from("<I", data, off)[0]

          def align(v, a):
              return (v + a - 1) // a * a

          version = u32(8)
          page_size = u32(12)
          vendor_ramdisk_size = u32(24)
          header_size = u32(2096)
          dtb_size = u32(2100)

          ramdisk_off = align(header_size, page_size)
          dtb_off = align(ramdisk_off + vendor_ramdisk_size, page_size)

          lines = [
              f"header_version={version}",
              f"page_size={page_size}",
              f"header_size={header_size}",
              f"vendor_ramdisk_size={vendor_ramdisk_size}",
              f"vendor_ramdisk_offset={ramdisk_off}",
              f"dtb_size={dtb_size}",
              f"dtb_offset={dtb_off}",
          ]

          fragments = []
          if version >= 4 and header_size >= 2128:
              table_size = u32(2112)
              entry_num = u32(2116)
              entry_size = u32(2120)
              bootconfig_size = u32(2124)
              table_off = align(dtb_off + dtb_size, page_size)

              lines += [
                  f"vendor_ramdisk_table_size={table_size}",
                  f"vendor_ramdisk_table_entry_num={entry_num}",
                  f"vendor_ramdisk_table_entry_size={entry_size}",
                  f"vendor_ramdisk_table_offset={table_off}",
                  f"bootconfig_size={bootconfig_size}",
              ]

              if entry_num and entry_size >= 108:
                  for idx in range(entry_num):
                      off = table_off + idx * entry_size
                      if off + entry_size > len(data):
                          raise SystemExit("vendor ramdisk table exceeds image")
                      frag_size = u32(off)
                      frag_off = u32(off + 4)
                      frag_type = u32(off + 8)
                      raw_name = data[off + 12:off + 44]
                      name = raw_name.split(b"\0", 1)[0].decode("utf-8", "replace") or f"fragment{idx}"
                      fragments.append((idx, name, frag_type, frag_off, frag_size))
                      lines.append(
                          f"fragment[{idx}] name={name} type={frag_type} "
                          f"offset={frag_off} size={frag_size}"
                      )

          if not fragments:
              fragments = [(0, "vendor_ramdisk", 0, 0, vendor_ramdisk_size)]

          for idx, name, frag_type, frag_rel, frag_size in fragments:
              start = ramdisk_off + frag_rel
              end = start + frag_size
              if end > ramdisk_off + vendor_ramdisk_size or end > len(data):
                  raise SystemExit(f"fragment {idx} exceeds vendor ramdisk section")
              safe = "".join(c if c.isalnum() or c in "._-" else "_" for c in name)
              out = out_dir / f"{idx:02d}-{safe}.bin"
              out.write_bytes(data[start:end])

          layout_path.write_text("\n".join(lines) + "\n")
          print(f"VENDOR_BOOT_HEADER_VERSION={version}")
          print(f"VENDOR_BOOT_PAGE_SIZE={page_size}")
          print(f"VENDOR_BOOT_RAMDISK_BYTES={vendor_ramdisk_size}")
          print(f"VENDOR_BOOT_RAMDISK_FRAGMENTS={len(fragments)}")
          PY

          cat vendor-ramdisks/vendor-boot-layout.txt
          ls -lh vendor-ramdisks/*.bin

      - name: Decompress and unpack all vendor ramdisks
        run: |
          set -euo pipefail
          rm -rf vendor-root
          mkdir -p vendor-root

          idx=0
          for frag in vendor-ramdisks/*.bin; do
            out="vendor-root/fragment-$idx"
            work="vendor-ramdisks/fragment-$idx.cpio"
            mkdir -p "$out"

            magic="$(xxd -p -l 8 "$frag")"
            echo "RAMDISK_FRAGMENT[$idx]=$frag magic=$magic"

            case "$magic" in
              1f8b*)
                gzip -dc "$frag" > "$work"
                ;;
              04224d18*|02214c18*)
                lz4 -dc "$frag" > "$work"
                ;;
              fd377a585a00*)
                xz -dc "$frag" > "$work"
                ;;
              28b52ffd*)
                zstd -dc "$frag" > "$work"
                ;;
              303730373031*|303730373032*)
                cp "$frag" "$work"
                ;;
              *)
                echo "Unknown ramdisk compression for $frag" >&2
                file "$frag" >&2 || true
                exit 1
                ;;
            esac

            work_abs="$(realpath "$work")"
            (
              cd "$out"
              cpio --quiet -idm --no-absolute-filenames < "$work_abs"
            )

            echo "RAMDISK_FRAGMENT_EXTRACTED[$idx]=$(find "$out" -type f | wc -l)"
            idx=$((idx + 1))
          done

          find vendor-root -type f -name '*.ko' -print | sort > stock-vendor-boot-modules.txt
          echo "STOCK_VENDOR_BOOT_MODULES=$(wc -l < stock-vendor-boot-modules.txt)"
          test -s stock-vendor-boot-modules.txt
          sed -n '1,200p' stock-vendor-boot-modules.txt

          find vendor-root -type f \( -name 'modules.load*' -o -name 'modules.dep*' \) -print | sort \
            > stock-vendor-boot-load-files.txt
          : > stock-vendor-boot-load-plan.txt
          while IFS= read -r loadfile; do
            [[ -n "$loadfile" ]] || continue
            {
              echo "===== $loadfile ====="
              cat "$loadfile"
              echo
            } >> stock-vendor-boot-load-plan.txt
          done < stock-vendor-boot-load-files.txt

          echo "STOCK_VENDOR_BOOT_LOAD_FILES=$(wc -l < stock-vendor-boot-load-files.txt)"
          sed -n '1,260p' stock-vendor-boot-load-plan.txt

      - name: Extract per-module stock ABI cohorts and versioned imports
        run: |
          set -euo pipefail

          python3 - stock-vendor-boot-modules.txt stock-vendor-boot-module-imports.tsv stock-vendor-boot-module-summary.tsv stock-vendor-boot-cohorts.txt <<'PY'
          import collections
          import sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          module_list, imports_out, summary_out, cohorts_out = map(Path, sys.argv[1:])

          modules = [Path(x) for x in module_list.read_text().splitlines() if x.strip()]
          per_module = []
          all_entries = []
          cohort_counts = collections.Counter()

          for path in modules:
              machine = "ERROR"
              vermagic = "-"
              status = "OK"
              entries = []

              try:
                  with path.open("rb") as f:
                      elf = ELFFile(f)
                      machine = elf["e_machine"]

                      modinfo = elf.get_section_by_name(".modinfo")
                      if modinfo is not None:
                          for field in modinfo.data().split(b"\0"):
                              if field.startswith(b"vermagic="):
                                  vermagic = field.split(b"=", 1)[1].decode("utf-8", "replace")
                                  break

                      sec = elf.get_section_by_name("__versions")
                      if sec is None:
                          status = "NO___versions"
                      else:
                          data = sec.data()
                          if len(data) % 64 != 0:
                              status = f"BAD_SECTION_SIZE_{len(data)}"
                          else:
                              for off in range(0, len(data), 64):
                                  chunk = data[off:off + 64]
                                  crc = int.from_bytes(chunk[:8], "little") & 0xffffffff
                                  name = chunk[8:].split(b"\0", 1)[0].decode("ascii", "replace")
                                  if name:
                                      entries.append((name, crc))
              except Exception as exc:
                  status = f"ERROR:{exc!r}"

              layout_crc = None
              for name, crc in entries:
                  if name == "module_layout":
                      layout_crc = crc
                      break

              layout_text = f"0x{layout_crc:08x}" if layout_crc is not None else "MISSING"
              cohort = (vermagic, layout_text)
              cohort_counts[cohort] += 1

              per_module.append(
                  (str(path), machine, vermagic, layout_text, len(entries), status)
              )

              for name, crc in entries:
                  all_entries.append(
                      (str(path), vermagic, layout_text, name, f"0x{crc:08x}")
                  )

          imports_out.write_text(
              "\n".join("\t".join(row) for row in all_entries) + "\n"
          )
          summary_out.write_text(
              "\n".join(
                  f"{p}\t{machine}\t{vermagic}\t{layout}\t{count}\t{status}"
                  for p, machine, vermagic, layout, count, status in per_module
              ) + "\n"
          )

          cohort_lines = []
          for (vermagic, layout), count in sorted(
              cohort_counts.items(), key=lambda kv: (-kv[1], kv[0])
          ):
              cohort_lines.append(
                  f"{count}\tmodule_layout={layout}\tvermagic={vermagic}"
              )
          cohorts_out.write_text("\n".join(cohort_lines) + "\n")

          print(f"STOCK_VENDOR_BOOT_MODULE_FILES={len(modules)}")
          print(f"STOCK_VENDOR_BOOT_VERSION_ENTRIES={len(all_entries)}")
          print(f"STOCK_VENDOR_BOOT_ABI_COHORTS={len(cohort_counts)}")
          for line in cohort_lines:
              print(f"STOCK_VENDOR_BOOT_COHORT\t{line}")

          if not all_entries:
              raise SystemExit("no versioned imports recovered")
          PY

          cat stock-vendor-boot-cohorts.txt
          sed -n '1,120p' stock-vendor-boot-module-summary.tsv

      - name: Download current 99.48 percent build evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BUILD_ARTIFACT_ID: "10645181148"
        run: |
          set -euo pipefail
          rm -rf current-build
          mkdir -p current-build

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_BUILD_ARTIFACT_ID}/zip" \
            -o current-build.zip
          unzip -q current-build.zip -d current-build

          current_symvers="$(find current-build -type f -name Module.symvers -print -quit)"
          current_compare="$(find current-build -type f -name full-stock-genksyms-compare.txt -print -quit)"
          test -n "$current_symvers"
          test -n "$current_compare"

          cp "$current_symvers" current.Module.symvers
          cp "$current_compare" current-full-stock-compare.txt

      - name: Compare each stock module against exact stock Image and current build
        run: |
          set -euo pipefail

          python3 - stock-vendor-boot-module-imports.tsv current.Module.symvers current-full-stock-compare.txt vendor-module-abi-audit.txt <<'PY'
          import sys
          from collections import Counter, defaultdict
          from pathlib import Path

          imports_path, symvers_path, full_compare_path, out_path = map(Path, sys.argv[1:])

          # Recover the exact stock Image export oracle from the prior full compare.
          stock_kernel = {}
          remaining69 = set()

          for raw in full_compare_path.read_text(errors="replace").splitlines():
              if raw.startswith("MATCH\t"):
                  p = raw.split("\t")
                  if len(p) >= 3:
                      stock_kernel[p[1]] = int(p[2], 16)
              elif raw.startswith("MISMATCH\t"):
                  p = raw.split("\t")
                  if len(p) >= 3:
                      stock_kernel[p[1]] = int(p[2].split("=", 1)[1], 16)
                      remaining69.add(p[1])
              elif raw.startswith("STOCK_ONLY\t"):
                  p = raw.split("\t")
                  if len(p) >= 3:
                      stock_kernel[p[1]] = int(p[2], 16)

          if len(stock_kernel) != 13360:
              raise SystemExit(f"expected 13360 stock kernel exports, got {len(stock_kernel)}")

          current = {}
          owner = {}
          for raw in symvers_path.read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3:
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
                  owner[p[1]] = p[2]
              except ValueError:
                  pass

          modules = defaultdict(lambda: {
              "vermagic": "-",
              "layout": "MISSING",
              "entries": [],
          })

          for raw in imports_path.read_text(errors="replace").splitlines():
              if not raw.strip():
                  continue
              module, vermagic, layout, symbol, crc_text = raw.split("\t", 4)
              modules[module]["vermagic"] = vermagic
              modules[module]["layout"] = layout
              modules[module]["entries"].append((symbol, int(crc_text, 16)))

          TARGET_LAYOUT = "0xba39cbb8"
          report = []
          cohort_stats = defaultdict(lambda: Counter())
          current_compatible_modules = []
          stock_image_compatible_modules = []
          qgki_modules = []
          qgki_remaining69 = set()

          for module in sorted(modules):
              info = modules[module]
              kernel_entries = [
                  (sym, crc) for sym, crc in info["entries"] if sym in stock_kernel
              ]
              module_only_entries = len(info["entries"]) - len(kernel_entries)

              stock_match = []
              stock_mismatch = []
              current_match = []
              current_mismatch = []
              current_missing = []

              for sym, expected in kernel_entries:
                  if stock_kernel[sym] == expected:
                      stock_match.append(sym)
                  else:
                      stock_mismatch.append(sym)

                  got = current.get(sym)
                  if got is None:
                      current_missing.append(sym)
                  elif got == expected:
                      current_match.append(sym)
                  else:
                      current_mismatch.append(sym)

              stock_ok = not stock_mismatch
              current_ok = not current_mismatch and not current_missing

              if stock_ok:
                  stock_image_compatible_modules.append(module)
              if current_ok:
                  current_compatible_modules.append(module)

              cohort = info["layout"]
              cohort_stats[cohort]["modules"] += 1
              cohort_stats[cohort]["kernel_imports"] += len(kernel_entries)
              cohort_stats[cohort]["stock_match"] += len(stock_match)
              cohort_stats[cohort]["stock_mismatch"] += len(stock_mismatch)
              cohort_stats[cohort]["current_match"] += len(current_match)
              cohort_stats[cohort]["current_mismatch"] += len(current_mismatch)
              cohort_stats[cohort]["current_missing"] += len(current_missing)

              if info["layout"] == TARGET_LAYOUT:
                  qgki_modules.append(module)
                  for sym, _ in kernel_entries:
                      if sym in remaining69:
                          qgki_remaining69.add(sym)

              report.append(
                  (
                      module,
                      info["vermagic"],
                      info["layout"],
                      len(info["entries"]),
                      len(kernel_entries),
                      module_only_entries,
                      len(stock_match),
                      len(stock_mismatch),
                      len(current_match),
                      len(current_mismatch),
                      len(current_missing),
                      stock_ok,
                      current_ok,
                      sorted(stock_mismatch),
                      sorted(current_mismatch),
                      sorted(current_missing),
                  )
              )

          print(f"STOCK_KERNEL_EXPORT_ORACLE={len(stock_kernel)}")
          print(f"STOCK_VENDOR_BOOT_MODULES_AUDITED={len(modules)}")
          print(f"STOCK_IMAGE_COMPATIBLE_MODULES={len(stock_image_compatible_modules)}")
          print(f"CURRENT_BUILD_COMPATIBLE_MODULES={len(current_compatible_modules)}")
          print(f"QGKI_TARGET_LAYOUT={TARGET_LAYOUT}")
          print(f"QGKI_COHORT_MODULES={len(qgki_modules)}")
          print(f"QGKI_REMAINING69_USED={len(qgki_remaining69)}")

          for layout, stats in sorted(cohort_stats.items()):
              print(
                  f"MODULE_ABI_COHORT\t{layout}\t"
                  f"modules={stats['modules']}\t"
                  f"kernel_imports={stats['kernel_imports']}\t"
                  f"stock_match={stats['stock_match']}\t"
                  f"stock_mismatch={stats['stock_mismatch']}\t"
                  f"current_match={stats['current_match']}\t"
                  f"current_mismatch={stats['current_mismatch']}\t"
                  f"current_missing={stats['current_missing']}"
              )

          for row in report:
              (
                  module, vermagic, layout, total_entries, kernel_imports, module_only,
                  stock_match_n, stock_mismatch_n,
                  current_match_n, current_mismatch_n, current_missing_n,
                  stock_ok, current_ok,
                  stock_mismatch, current_mismatch, current_missing,
              ) = row

              print(
                  f"MODULE_ABI\t{module}\tlayout={layout}\t"
                  f"kernel_imports={kernel_imports}\t"
                  f"stock={stock_match_n}/{kernel_imports}\t"
                  f"current={current_match_n}/{kernel_imports}\t"
                  f"current_mismatch={current_mismatch_n}\t"
                  f"current_missing={current_missing_n}\t"
                  f"stock_ok={int(stock_ok)}\tcurrent_ok={int(current_ok)}"
              )

          lines = [
              "# Stock vendor_boot per-module ABI audit",
              f"stock_kernel_exports={len(stock_kernel)}",
              f"modules_audited={len(modules)}",
              f"stock_image_compatible_modules={len(stock_image_compatible_modules)}",
              f"current_build_compatible_modules={len(current_compatible_modules)}",
              f"qgki_target_layout={TARGET_LAYOUT}",
              f"qgki_cohort_modules={len(qgki_modules)}",
              f"qgki_remaining69_used={len(qgki_remaining69)}",
              "",
              "## COHORTS",
          ]

          for layout, stats in sorted(cohort_stats.items()):
              lines.append(
                  f"{layout}\tmodules={stats['modules']}\t"
                  f"kernel_imports={stats['kernel_imports']}\t"
                  f"stock_match={stats['stock_match']}\t"
                  f"stock_mismatch={stats['stock_mismatch']}\t"
                  f"current_match={stats['current_match']}\t"
                  f"current_mismatch={stats['current_mismatch']}\t"
                  f"current_missing={stats['current_missing']}"
              )

          lines += ["", "## MODULES"]
          for row in report:
              (
                  module, vermagic, layout, total_entries, kernel_imports, module_only,
                  stock_match_n, stock_mismatch_n,
                  current_match_n, current_mismatch_n, current_missing_n,
                  stock_ok, current_ok,
                  stock_mismatch, current_mismatch, current_missing,
              ) = row
              lines.append(
                  f"{module}\tvermagic={vermagic}\tlayout={layout}\t"
                  f"total_versions={total_entries}\tkernel_imports={kernel_imports}\t"
                  f"module_only={module_only}\t"
                  f"stock_match={stock_match_n}\tstock_mismatch={stock_mismatch_n}\t"
                  f"current_match={current_match_n}\tcurrent_mismatch={current_mismatch_n}\t"
                  f"current_missing={current_missing_n}\t"
                  f"stock_ok={int(stock_ok)}\tcurrent_ok={int(current_ok)}"
              )
              if stock_mismatch:
                  lines.append("  STOCK_MISMATCH " + " ".join(stock_mismatch))
              if current_mismatch:
                  lines.append("  CURRENT_MISMATCH " + " ".join(current_mismatch))
              if current_missing:
                  lines.append("  CURRENT_MISSING " + " ".join(current_missing))

          lines += ["", "## QGKI_COHORT"]
          lines += qgki_modules

          lines += ["", "## QGKI_REMAINING69_USED"]
          lines += sorted(qgki_remaining69)

          Path(out_path).write_text("\n".join(lines) + "\n")
          PY

          sed -n '1,360p' vendor-module-abi-audit.txt

      - name: Upload stock module ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-stock-vendor-boot-module-abi
          retention-days: 14
          if-no-files-found: warn
          path: |
            vendor-ramdisks/vendor-boot-layout.txt
            stock-vendor-boot-modules.txt
            stock-vendor-boot-load-files.txt
            stock-vendor-boot-load-plan.txt
            stock-vendor-boot-module-imports.tsv
            stock-vendor-boot-module-summary.tsv
            stock-vendor-boot-cohorts.txt
            current.Module.symvers
            current-full-stock-compare.txt
            vendor-module-abi-audit.txt
