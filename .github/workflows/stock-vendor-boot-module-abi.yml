name: Audit Lisa stock vendor_boot module ABI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stock-vendor-boot-module-abi.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-vendor-boot-module-abi
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact stock images with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install extraction tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cpio file lz4 zstd xz-utils gzip python3 python3-pyelftools unzip

      - name: Verify exact stock vendor_boot image
        run: |
          set -euo pipefail
          img="reconstruction/stock/stock-Image/vendor_boot.img"
          test -s "$img"
          size="$(stat -c '%s' "$img")"
          echo "STOCK_VENDOR_BOOT_BYTES=$size"
          test "$size" -gt 90000000
          file "$img"

      - name: Parse vendor_boot and extract ramdisk fragments
        run: |
          set -euo pipefail
          rm -rf vendor-ramdisks
          mkdir -p vendor-ramdisks

          python3 - reconstruction/stock/stock-Image/vendor_boot.img vendor-ramdisks/vendor-boot-layout.txt vendor-ramdisks <<'PY'
          import struct
          import sys
          from pathlib import Path

          img_path = Path(sys.argv[1])
          layout_path = Path(sys.argv[2])
          out_dir = Path(sys.argv[3])
          data = img_path.read_bytes()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit(f"bad vendor_boot magic: {data[:8]!r}")

          def u32(off):
              return struct.unpack_from("<I", data, off)[0]

          def align(v, a):
              return (v + a - 1) // a * a

          version = u32(8)
          page_size = u32(12)
          vendor_ramdisk_size = u32(24)
          header_size = u32(2096)
          dtb_size = u32(2100)

          ramdisk_off = align(header_size, page_size)
          dtb_off = align(ramdisk_off + vendor_ramdisk_size, page_size)

          lines = [
              f"header_version={version}",
              f"page_size={page_size}",
              f"header_size={header_size}",
              f"vendor_ramdisk_size={vendor_ramdisk_size}",
              f"vendor_ramdisk_offset={ramdisk_off}",
              f"dtb_size={dtb_size}",
              f"dtb_offset={dtb_off}",
          ]

          fragments = []
          if version >= 4 and header_size >= 2128:
              table_size = u32(2112)
              entry_num = u32(2116)
              entry_size = u32(2120)
              bootconfig_size = u32(2124)
              table_off = align(dtb_off + dtb_size, page_size)

              lines += [
                  f"vendor_ramdisk_table_size={table_size}",
                  f"vendor_ramdisk_table_entry_num={entry_num}",
                  f"vendor_ramdisk_table_entry_size={entry_size}",
                  f"vendor_ramdisk_table_offset={table_off}",
                  f"bootconfig_size={bootconfig_size}",
              ]

              if entry_num and entry_size >= 108:
                  for idx in range(entry_num):
                      off = table_off + idx * entry_size
                      if off + entry_size > len(data):
                          raise SystemExit("vendor ramdisk table exceeds image")
                      frag_size = u32(off)
                      frag_off = u32(off + 4)
                      frag_type = u32(off + 8)
                      raw_name = data[off + 12:off + 44]
                      name = raw_name.split(b"\0", 1)[0].decode("utf-8", "replace") or f"fragment{idx}"
                      fragments.append((idx, name, frag_type, frag_off, frag_size))
                      lines.append(
                          f"fragment[{idx}] name={name} type={frag_type} "
                          f"offset={frag_off} size={frag_size}"
                      )

          if not fragments:
              fragments = [(0, "vendor_ramdisk", 0, 0, vendor_ramdisk_size)]

          for idx, name, frag_type, frag_rel, frag_size in fragments:
              start = ramdisk_off + frag_rel
              end = start + frag_size
              if end > ramdisk_off + vendor_ramdisk_size or end > len(data):
                  raise SystemExit(f"fragment {idx} exceeds vendor ramdisk section")
              safe = "".join(c if c.isalnum() or c in "._-" else "_" for c in name)
              out = out_dir / f"{idx:02d}-{safe}.bin"
              out.write_bytes(data[start:end])

          layout_path.write_text("\n".join(lines) + "\n")
          print(f"VENDOR_BOOT_HEADER_VERSION={version}")
          print(f"VENDOR_BOOT_PAGE_SIZE={page_size}")
          print(f"VENDOR_BOOT_RAMDISK_BYTES={vendor_ramdisk_size}")
          print(f"VENDOR_BOOT_RAMDISK_FRAGMENTS={len(fragments)}")
          PY

          cat vendor-ramdisks/vendor-boot-layout.txt
          ls -lh vendor-ramdisks/*.bin

      - name: Decompress and unpack all vendor ramdisks
        run: |
          set -euo pipefail
          rm -rf vendor-root
          mkdir -p vendor-root

          idx=0
          for frag in vendor-ramdisks/*.bin; do
            out="vendor-root/fragment-$idx"
            work="vendor-ramdisks/fragment-$idx.cpio"
            mkdir -p "$out"

            magic="$(xxd -p -l 8 "$frag")"
            echo "RAMDISK_FRAGMENT[$idx]=$frag magic=$magic"

            case "$magic" in
              1f8b*)
                gzip -dc "$frag" > "$work"
                ;;
              04224d18*|02214c18*)
                lz4 -dc "$frag" > "$work"
                ;;
              fd377a585a00*)
                xz -dc "$frag" > "$work"
                ;;
              28b52ffd*)
                zstd -dc "$frag" > "$work"
                ;;
              303730373031*|303730373032*)
                cp "$frag" "$work"
                ;;
              *)
                echo "Unknown ramdisk compression for $frag" >&2
                file "$frag" >&2 || true
                exit 1
                ;;
            esac

            (
              cd "$out"
              cpio --quiet -idm --no-absolute-filenames < "../../../$work"
            )

            echo "RAMDISK_FRAGMENT_EXTRACTED[$idx]=$(find "$out" -type f | wc -l)"
            idx=$((idx + 1))
          done

          find vendor-root -type f -name '*.ko' -print | sort > stock-vendor-boot-modules.txt
          echo "STOCK_VENDOR_BOOT_MODULES=$(wc -l < stock-vendor-boot-modules.txt)"
          test -s stock-vendor-boot-modules.txt
          sed -n '1,200p' stock-vendor-boot-modules.txt

      - name: Extract all stock module versioned imports
        run: |
          set -euo pipefail

          python3 - stock-vendor-boot-modules.txt stock-vendor-boot-imports.tsv stock-vendor-boot-module-summary.tsv <<'PY'
          import collections
          import sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          module_list, imports_out, summary_out = map(Path, sys.argv[1:])

          by_symbol = collections.defaultdict(lambda: {"crcs": set(), "modules": set()})
          summary = []

          modules = [Path(x) for x in module_list.read_text().splitlines() if x.strip()]
          parsed = 0
          versioned_modules = 0
          total_entries = 0

          for path in modules:
              try:
                  with path.open("rb") as f:
                      elf = ELFFile(f)
                      machine = elf["e_machine"]
                      sec = elf.get_section_by_name("__versions")
                      if sec is None:
                          summary.append((str(path), machine, 0, "NO___versions"))
                          continue
                      data = sec.data()
              except Exception as exc:
                  summary.append((str(path), "ERROR", 0, repr(exc)))
                  continue

              parsed += 1
              if len(data) % 64 != 0:
                  summary.append((str(path), machine, 0, f"BAD_SECTION_SIZE_{len(data)}"))
                  continue

              count = 0
              for off in range(0, len(data), 64):
                  chunk = data[off:off + 64]
                  crc = int.from_bytes(chunk[:8], "little") & 0xffffffff
                  name = chunk[8:].split(b"\0", 1)[0].decode("ascii", "replace")
                  if not name:
                      continue
                  by_symbol[name]["crcs"].add(crc)
                  by_symbol[name]["modules"].add(str(path))
                  count += 1
                  total_entries += 1

              if count:
                  versioned_modules += 1
              summary.append((str(path), machine, count, "OK"))

          conflicts = {
              sym: info for sym, info in by_symbol.items() if len(info["crcs"]) != 1
          }

          lines = []
          for sym in sorted(by_symbol):
              info = by_symbol[sym]
              crcs = sorted(info["crcs"])
              crc_text = ",".join(f"0x{x:08x}" for x in crcs)
              mods = sorted(info["modules"])
              lines.append(
                  f"{sym}\t{crc_text}\t{len(mods)}\t" + ";".join(mods)
              )

          imports_out.write_text("\n".join(lines) + "\n")
          summary_out.write_text(
              "\n".join(
                  f"{p}\t{m}\t{n}\t{status}" for p, m, n, status in summary
              ) + "\n"
          )

          print(f"STOCK_VENDOR_BOOT_MODULE_FILES={len(modules)}")
          print(f"STOCK_VENDOR_BOOT_ELF_PARSED={parsed}")
          print(f"STOCK_VENDOR_BOOT_VERSIONED_MODULES={versioned_modules}")
          print(f"STOCK_VENDOR_BOOT_VERSION_ENTRIES={total_entries}")
          print(f"STOCK_VENDOR_BOOT_UNIQUE_IMPORTS={len(by_symbol)}")
          print(f"STOCK_VENDOR_BOOT_CRC_CONFLICTS={len(conflicts)}")

          if conflicts:
              for sym, info in sorted(conflicts.items()):
                  print(
                      f"STOCK_IMPORT_CRC_CONFLICT\t{sym}\t"
                      + ",".join(f"0x{x:08x}" for x in sorted(info["crcs"]))
                  )
              raise SystemExit("conflicting CRCs for same stock import symbol")

          if not by_symbol:
              raise SystemExit("no versioned imports recovered")
          PY

      - name: Download current 99.48 percent build evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BUILD_ARTIFACT_ID: "10645181148"
        run: |
          set -euo pipefail
          rm -rf current-build
          mkdir -p current-build

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_BUILD_ARTIFACT_ID}/zip" \
            -o current-build.zip
          unzip -q current-build.zip -d current-build

          current_symvers="$(find current-build -type f -name Module.symvers -print -quit)"
          current_compare="$(find current-build -type f -name full-stock-genksyms-compare.txt -print -quit)"
          test -n "$current_symvers"
          test -n "$current_compare"

          cp "$current_symvers" current.Module.symvers
          cp "$current_compare" current-full-stock-compare.txt

      - name: Compare actual stock vendor_boot imports with current build
        run: |
          set -euo pipefail

          python3 - stock-vendor-boot-imports.tsv current.Module.symvers current-full-stock-compare.txt vendor-module-abi-audit.txt <<'PY'
          import sys
          from collections import Counter
          from pathlib import Path

          imports_path, symvers_path, full_compare_path, out_path = map(Path, sys.argv[1:])

          required = {}
          modules_by_symbol = {}
          for raw in imports_path.read_text(errors="replace").splitlines():
              if not raw.strip():
                  continue
              sym, crc_text, module_count, modules = raw.split("\t", 3)
              crcs = crc_text.split(",")
              if len(crcs) != 1:
                  raise SystemExit(f"unexpected multi-CRC import: {sym} {crc_text}")
              required[sym] = int(crcs[0], 16)
              modules_by_symbol[sym] = modules.split(";") if modules else []

          current = {}
          owner = {}
          for raw in symvers_path.read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3:
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
                  owner[p[1]] = p[2]
              except ValueError:
                  pass

          remaining69 = set()
          for raw in full_compare_path.read_text(errors="replace").splitlines():
              if raw.startswith("MISMATCH\t"):
                  remaining69.add(raw.split("\t")[1])

          match = []
          mismatch = []
          missing = []

          impacted_modules = Counter()
          for sym in sorted(required):
              exp = required[sym]
              got = current.get(sym)
              if got is None:
                  missing.append(sym)
                  for mod in modules_by_symbol[sym]:
                      impacted_modules[mod] += 1
              elif got == exp:
                  match.append(sym)
              else:
                  mismatch.append(sym)
                  for mod in modules_by_symbol[sym]:
                      impacted_modules[mod] += 1

          critical = sorted((set(mismatch) | set(missing)) & remaining69)
          used69 = sorted(set(required) & remaining69)

          total = len(required)
          compatible = len(match)

          print(f"STOCK_VENDOR_BOOT_REQUIRED_IMPORTS={total}")
          print(f"CURRENT_REQUIRED_IMPORT_PRESENT={len(match)+len(mismatch)}")
          print(f"CURRENT_REQUIRED_IMPORT_MATCHES={len(match)}")
          print(f"CURRENT_REQUIRED_IMPORT_MISMATCHES={len(mismatch)}")
          print(f"CURRENT_REQUIRED_IMPORT_MISSING={len(missing)}")
          if total:
              print(f"CURRENT_REQUIRED_ABI_MATCH_RATE={compatible/total:.6f}")

          print(f"REMAINING69_USED_BY_VENDOR_BOOT={len(used69)}")
          print(f"REMAINING69_CRITICAL_MISMATCH_OR_MISSING={len(critical)}")

          for sym in used69:
              exp = required[sym]
              got = current.get(sym)
              status = "MATCH" if got == exp else ("MISMATCH" if got is not None else "MISSING")
              print(
                  f"REMAINING69_VENDOR_IMPORT\t{status}\t{sym}\t"
                  f"stock=0x{exp:08x}\tcurrent="
                  + (f"0x{got:08x}" if got is not None else "MISSING")
              )

          lines = [
              "# Stock vendor_boot module ABI audit",
              f"required_unique_imports={total}",
              f"matches={len(match)}",
              f"mismatches={len(mismatch)}",
              f"missing={len(missing)}",
              f"match_rate={(compatible/total if total else 0):.6f}",
              f"remaining69_used={len(used69)}",
              f"remaining69_critical={len(critical)}",
              "",
              "## MISMATCH",
          ]

          for sym in mismatch:
              lines.append(
                  f"MISMATCH\t{sym}\tstock=0x{required[sym]:08x}\t"
                  f"current=0x{current[sym]:08x}\towner={owner.get(sym, '-')}"
                  f"\tmodules={';'.join(modules_by_symbol[sym])}"
              )

          lines += ["", "## MISSING"]
          for sym in missing:
              lines.append(
                  f"MISSING\t{sym}\tstock=0x{required[sym]:08x}\t"
                  f"modules={';'.join(modules_by_symbol[sym])}"
              )

          lines += ["", "## REMAINING69_USED_BY_VENDOR_BOOT"]
          for sym in used69:
              exp = required[sym]
              got = current.get(sym)
              status = "MATCH" if got == exp else ("MISMATCH" if got is not None else "MISSING")
              lines.append(
                  f"{status}\t{sym}\tstock=0x{exp:08x}\t"
                  f"current={(f'0x{got:08x}' if got is not None else 'MISSING')}\t"
                  f"modules={';'.join(modules_by_symbol[sym])}"
              )

          lines += ["", "## MOST_IMPACTED_MODULES"]
          for mod, count in impacted_modules.most_common():
              lines.append(f"{count}\t{mod}")

          Path(out_path).write_text("\n".join(lines) + "\n")
          PY

          sed -n '1,260p' vendor-module-abi-audit.txt

      - name: Upload stock module ABI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-stock-vendor-boot-module-abi
          retention-days: 14
          if-no-files-found: warn
          path: |
            vendor-ramdisks/vendor-boot-layout.txt
            stock-vendor-boot-modules.txt
            stock-vendor-boot-imports.tsv
            stock-vendor-boot-module-summary.tsv
            current.Module.symvers
            current-full-stock-compare.txt
            vendor-module-abi-audit.txt
