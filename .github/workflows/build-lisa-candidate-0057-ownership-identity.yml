name: Build Lisa Candidate0057 module ownership and identity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-lisa-candidate-0057-ownership-identity.yml
      - reconstruction/scripts/candidate_0057_build.py
      - reconstruction/scripts/candidate_0057_identity.py
      - reconstruction/scripts/candidate_0057_ownership_patch.py
permissions:
  contents: read
  actions: read
concurrency:
  group: lisa-candidate-0057-ownership-identity
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact package commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
      - name: Preflight pinned recipes syntax and source transform
        run: python3 reconstruction/scripts/candidate_0057_build.py preflight
      - name: Materialize stock LFS inputs
        run: git lfs pull
      - name: Checkout exact reconstructed kernel
        uses: actions/checkout@v4
        with:
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
      - name: Checkout exact runtime reference
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8350
          ref: 46af56554ec50e3ff3752858bf38eaeeb852ca0d
          path: known-good-302
          fetch-depth: 1
          lfs: false
      - name: Export source inputs for independent review
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0057-source-review
          retention-days: 7
          if-no-files-found: error
          path: |
            reconstruction/scripts/candidate_00*.py
            reconstruction/scripts/test_lisa_power_compat.c
            reconstruction/overlays/lisa_power_compat.*
            .github/workflows/build-lisa-candidate-0053-arm64-fault-capture.yml
            kernel/kernel/module.c
            kernel/drivers/gpu/msm/adreno-gpulist.h
            kernel/drivers/gpu/msm/adreno_a6xx.c
            kernel/drivers/gpu/msm/kgsl.c
            kernel/include/linux/dma-buf.h
            kernel/include/linux/dma-fence.h
            kernel/include/linux/reservation.h
            kernel/include/linux/dma-resv.h
            kernel/include/uapi/linux/msm_kgsl.h
            kernel/drivers/dma-buf/
            kernel/techpack/camera/config/
            kernel/techpack/camera/Makefile
            kernel/techpack/camera/drivers/Makefile
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-yaml curl unzip git rsync kmod
      - name: Prepare pinned compiler and stock oracles
        run: python3 reconstruction/scripts/candidate_0057_build.py prepare
      - name: Build and package Candidate0057
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: python3 reconstruction/scripts/candidate_0057_build.py build
      - name: Verify inherited ABI modular ownership and truthful identity
        run: python3 reconstruction/scripts/candidate_0057_build.py verify
      - name: Upload verified Candidate0057 boot and evidence
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0057-ownership-identity
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
          path: |
            boot.img
            boot.img.sha256
            candidate-0057-*
            candidate-0057.config
            candidate-0057.ikconfig
            candidate-0046-*.txt
            kernel/out/System.map
            kernel/out/Module.symvers
            kernel/out/techpack/display/msm/msm_drm.ko
            clang-version.txt
      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0057-failure-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            candidate-0057-checks/
            candidate-0057-resolved-builder.py
            candidate-0057-*.txt
            kernel/out/.config
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: Check after 2 minutes then 2 minutes then every 5 minutes
        uses: actions/github-script@v7
        with:
          script: |
            for (let check=1; ; check++) {
              await new Promise(r => setTimeout(r, check <= 2 ? 120000 : 300000));
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:context.runId, filter:'latest', per_page:100});
                const build = jobs.find(j=>j.name==='build');
                core.info(`Check ${check}: ${build?.status} / ${build?.conclusion}`);
                if (!build || build.status!=='completed') continue;
                if (build.conclusion!=='success') {
                  core.setFailed(`First failure: ${build.steps.find(s=>s.conclusion==='failure')?.name || build.conclusion}`);
                  break;
                }
                const arts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:context.runId,per_page:100});
                const a=arts.find(a=>a.name==='lisa-candidate-0057-ownership-identity' && !a.expired && a.size_in_bytes>0);
                if (!a) core.setFailed('Verified boot artifact missing');
                else await core.summary.addHeading('Candidate0057 build verified').addRaw(`Artifact ${a.id}; static checks are not a device pass; overlay corruption is not claimed fixed.`).write();
                break;
              } catch(e) { core.warning(`Check ${check}: ${e.message}`); }
            }
