name: Scan lisa Android KABI reserve generations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/abi-kabi-reserve-scan.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: control
            mode: control
            count: 0
          - label: module-0
            mode: module
            count: 0
          - label: module-2
            mode: module
            count: 2
          - label: module-4
            mode: module
            count: 4
          - label: module-6
            mode: module
            count: 6
          - label: module-8
            mode: module
            count: 8
          - label: device-0
            mode: device
            count: 0
          - label: device-2
            mode: device
            count: 2
          - label: device-4
            mode: device
            count: 4
          - label: device-6
            mode: device
            count: 6
          - label: device-8
            mode: device
            count: 8
          - label: device-10
            mode: device
            count: 10
          - label: device-12
            mode: device
            count: 12

    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git curl

      - name: Cache AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install AOSP clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ -x "$DEST/bin/clang" ]] && "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'; then
            exit 0
          fi
          curl -L --fail --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$DEST"

      - name: Clone reconstructed lisa
        run: |
          set -euo pipefail
          git clone --depth=1 --branch reconstruction/5.4.289-qgki \
            https://github.com/Tim0320/android_kernel_xiaomi_lisa.git kernel
          cd kernel
          echo "base_head=$(git rev-parse HEAD)"

      - name: Rewrite selected KABI reserve block
        run: |
          set -euo pipefail
          cd kernel
          python3 - <<'PY'
          from pathlib import Path

          mode = "${{ matrix.mode }}"
          count = int("${{ matrix.count }}")

          def rewrite_block(path_s, struct_marker, closing_marker, count):
              p = Path(path_s)
              lines = p.read_text().splitlines(True)

              start = next(i for i, line in enumerate(lines) if struct_marker in line)
              end = next(i for i in range(start + 1, len(lines)) if closing_marker in lines[i])

              reserve_idx = [
                  i for i in range(start, end)
                  if "ANDROID_KABI_RESERVE(" in lines[i]
              ]
              if not reserve_idx:
                  raise SystemExit(f"no reserve block in {path_s}")

              # Only the final contiguous reserve run immediately before the
              # struct's closing line is rewritten.
              last = reserve_idx[-1]
              first = last
              while first - 1 >= start and "ANDROID_KABI_RESERVE(" in lines[first - 1]:
                  first -= 1

              if any("ANDROID_KABI_RESERVE(" in lines[i] for i in range(last + 1, end)):
                  raise SystemExit(f"unexpected reserve line after selected block in {path_s}")

              indent = lines[first].split("ANDROID_KABI_RESERVE", 1)[0]
              replacement = [
                  f"{indent}ANDROID_KABI_RESERVE({n});\n"
                  for n in range(1, count + 1)
              ]
              lines[first:last + 1] = replacement
              p.write_text("".join(lines))

          if mode == "module":
              rewrite_block(
                  "include/linux/module.h",
                  "struct module {",
                  "} ____cacheline_aligned __randomize_layout;",
                  count,
              )
          elif mode == "device":
              rewrite_block(
                  "include/linux/device.h",
                  "struct device {",
                  "};",
                  count,
              )
          elif mode != "control":
              raise SystemExit(f"unknown mode: {mode}")

          print(f"label=${{ matrix.label }} mode={mode} count={count}")
          PY

          echo "=== struct module reserves ==="
          python3 - <<'PY'
          from pathlib import Path
          s=Path("include/linux/module.h").read_text().splitlines()
          a=next(i for i,l in enumerate(s) if "struct module {" in l)
          b=next(i for i in range(a+1,len(s)) if "} ____cacheline_aligned __randomize_layout;" in s[i])
          print("\n".join(f"{i+1}: {s[i]}" for i in range(a,b+1) if "ANDROID_KABI_RESERVE" in s[i]))
          PY

          echo "=== struct device reserves ==="
          python3 - <<'PY'
          from pathlib import Path
          s=Path("include/linux/device.h").read_text().splitlines()
          a=next(i for i,l in enumerate(s) if l.startswith("struct device {"))
          b=next(i for i in range(a+1,len(s)) if s[i] == "};")
          print("\n".join(f"{i+1}: {s[i]}" for i in range(a,b+1) if "ANDROID_KABI_RESERVE" in s[i]))
          PY

      - name: Apply exact stock config
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p out
          cp reconstruction/stock_ikconfig out/.config
          test "$(git hash-object out/.config)" = "3343d7b7b3874e065ce4805eac61c0160c40b0a3"

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig </dev/null

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- prepare scripts

      - name: Build ABI objects
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          cd kernel
          make -j"$(nproc)" O=out KBUILD_SYMTYPES=1 \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            kernel/module.o drivers/base/core.o

      - name: Score module and device CRCs
        run: |
          set -euo pipefail
          cd kernel
          cat out/kernel/module.o.symversions out/drivers/base/core.o.symversions > /tmp/sv

          read_crc() {
            local symbol="$1"
            sed -n "s/^__crc_${symbol} = \(0x[0-9a-fA-F]*\);/\1/p" /tmp/sv | head -n1
          }

          ml="$(read_crc module_layout)"
          dr="$(read_crc device_register)"
          du="$(read_crc device_unregister)"
          dd="$(read_crc dev_driver_string)"

          echo "KABI_SCAN label=${{ matrix.label }} mode=${{ matrix.mode }} count=${{ matrix.count }} module_layout=${ml:-MISSING} device_register=${dr:-MISSING} device_unregister=${du:-MISSING} dev_driver_string=${dd:-MISSING}"

          matches=0
          if [[ "${ml,,}" == "0xba39cbb8" ]]; then echo "MATCH module_layout"; matches=$((matches+1)); fi
          if [[ "${dr,,}" == "0xcf9bcdee" ]]; then echo "MATCH device_register"; matches=$((matches+1)); fi
          if [[ "${du,,}" == "0x4678e0d9" ]]; then echo "MATCH device_unregister"; matches=$((matches+1)); fi
          if [[ "${dd,,}" == "0x22a8544f" ]]; then echo "MATCH dev_driver_string"; matches=$((matches+1)); fi
          echo "KABI_MATCH_SCORE=$matches/4"

          if [[ "${{ matrix.mode }}" == "control" ]]; then
            echo "=== control assertions ==="
            test "${ml,,}" = "0x0816e668"
            test "${dr,,}" = "0xc1e70e13"
            test "${du,,}" = "0xb88b5350"
            test "${dd,,}" = "0x52e5afec"
            echo "CONTROL_BASELINE_OK=1"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabi-scan-${{ matrix.label }}
          retention-days: 5
          include-hidden-files: true
          path: |
            kernel/out/kernel/module.o.symversions
            kernel/out/drivers/base/core.o.symversions
            kernel/out/kernel/module.symtypes
            kernel/out/drivers/base/core.symtypes
