name: Audit Lisa Candidate0059 Stage2 hooks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - reconstruction/scripts/candidate_0059_state_layer.py
      - reconstruction/scripts/candidate_0059_stage2_hooks.py
      - reconstruction/c0059_stage2_hooks_20261005.md
      - .github/workflows/audit-lisa-candidate-0059-stage2-hooks.yml

permissions:
  contents: read

concurrency:
  group: lisa-c0059-stage2-hooks
  cancel-in-progress: true

jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Candidate0059 package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: package
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Checkout exact pinned Lisa source
        uses: actions/checkout@v4
        with:
          repository: Tim0320/android_kernel_xiaomi_lisa
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Apply Stage1 then Stage2 and verify scope
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0059_state_layer.py apply \
            --source kernel --json candidate-0059-stage1.json
          python3 package/reconstruction/scripts/candidate_0059_stage2_hooks.py apply \
            --source kernel --json candidate-0059-stage2.json
          python3 package/reconstruction/scripts/candidate_0059_stage2_hooks.py verify \
            --source kernel --json candidate-0059-stage2-verify.json
          git -C kernel diff --check
          git -C kernel diff > candidate-0059-stage2.patch

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Prepare stock-based Stage2 config
        run: |
          set -euo pipefail
          mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          kernel/scripts/config --file kernel/out/.config -e MIHW -e PACKAGE_RUNTIME_INFO
          make -C kernel O="$PWD/kernel/out" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_MIHW=y$' kernel/out/.config
          grep -q '^CONFIG_PACKAGE_RUNTIME_INFO=y$' kernel/out/.config
          grep -q '^CONFIG_SCHED_WALT=y$' kernel/out/.config
          grep -q '^CONFIG_MODVERSIONS=y$' kernel/out/.config
          grep -E '^(CONFIG_MIHW|CONFIG_PACKAGE_RUNTIME_INFO|CONFIG_SCHED_WALT|CONFIG_MODVERSIONS)=' \
            kernel/out/.config | tee candidate-0059-stage2-config.txt

      - name: Compile Stage2 cross-lifecycle objects
        run: |
          set -euo pipefail
          make -C kernel O="$PWD/kernel/out" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- -j2 prepare
          make -C kernel O="$PWD/kernel/out" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            kernel/sched/pkg_state.o kernel/sched/pkg_bridge.o \
            kernel/fork.o kernel/user.o kernel/cred.o kernel/exit.o \
            kernel/sched/walt/walt.o kernel/time/timekeeping.o
          for p in \
            kernel/out/kernel/sched/pkg_state.o \
            kernel/out/kernel/sched/pkg_bridge.o \
            kernel/out/kernel/fork.o kernel/out/kernel/user.o \
            kernel/out/kernel/cred.o kernel/out/kernel/exit.o \
            kernel/out/kernel/sched/walt/walt.o \
            kernel/out/kernel/time/timekeeping.o; do test -s "$p"; done
          aarch64-linux-gnu-nm kernel/out/kernel/sched/pkg_bridge.o \
            | grep -E ' [Ww] (pkg_enable|update_pkg_load)$'
          aarch64-linux-gnu-nm kernel/out/kernel/sched/pkg_state.o \
            | grep -E ' pkg_task_(bind|unbind|rebind)_user$'
          printf '%s\n' \
            'CANDIDATE0059_STAGE2_COMPILE=PASS' \
            'RUNTIME_ACCOUNTING_ACTIVE=false' \
            'FULL_MIGT_PORTED=false' \
            'RUNTIME_TESTED=false' \
            'JANK_FIXED=false' \
            | tee candidate-0059-stage2-result.txt

      - name: Publish Stage2 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-stage2-hooks-a${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            candidate-0059-stage1.json
            candidate-0059-stage2*.json
            candidate-0059-stage2*.txt
            candidate-0059-stage2.patch
            kernel/out/.config
            kernel/out/kernel/sched/pkg_state.o
            kernel/out/kernel/sched/pkg_bridge.o
            kernel/out/kernel/fork.o
            kernel/out/kernel/user.o
            kernel/out/kernel/cred.o
            kernel/out/kernel/exit.o
            kernel/out/kernel/sched/walt/walt.o
            kernel/out/kernel/time/timekeeping.o
