          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/Makefile.build")
          s = p.read_text()
          stock = (
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated "
              "-I$(STOCK_ABI_ROOT)/include "
              "-I$(STOCK_ABI_ROOT)/include/generated "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated/uapi "
              "-I$(STOCK_ABI_ROOT)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/include/generated/uapi"
          )
          conditional = (
              "$(if $(or "
              "$(findstring /lib/zstd/,$<),"
              "$(findstring /drivers/android/vendor_hooks.c,$<)"
              f"),,{stock})"
          )
          lines = s.splitlines(keepends=True)
          c_done = False
          asm_done = False
          for i, line in enumerate(lines):
              if not c_done and "$(CPP) -D__GENKSYMS__ $(c_flags) $< |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {conditional} -D__GENKSYMS__",
                      1,
                  )
                  c_done = True
                  continue
              if not asm_done and "$(CPP) -D__GENKSYMS__ $(c_flags) -xc - |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {stock} -D__GENKSYMS__",
                      1,
                  )
                  asm_done = True
          if not c_done:
              raise SystemExit("C genksyms rule not found")
          if not asm_done:
              raise SystemExit("ASM genksyms rule not found")
          p.write_text("".join(lines))
          PY

      - name: Build Image modules and DTBs
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tee composite-build.log

      - name: Summarize genksyms failures
        if: always()
        run: |
          set -euo pipefail
          if [[ -f composite-build.log ]]; then
            grep 'version generation failed' composite-build.log > composite-genksyms-failures.txt || true
          else
            : > composite-genksyms-failures.txt
          fi
          echo "COMPOSITE_GENKSYMS_VERSION_FAILURES=$(wc -l < composite-genksyms-failures.txt)"
          cat composite-genksyms-failures.txt || true

      - name: Validate build outputs release and ARM64 Image
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers
          file out/arch/arm64/boot/Image | tee image-file.txt
          grep -q 'ARM aarch64' image-file.txt || true
          grep -a -m1 -F "$TARGET_RELEASE" out/arch/arm64/boot/Image | tee image-release-hit.txt

          for ko in \
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko \
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko \
            out/drivers/misc/mi-memory/mi_memory.ko \
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko; do
            test -s "$ko"
            actual="$(strings -a "$ko" | sed -n 's/^vermagic=//p' | head -n1 | awk '{print $1}')"
            echo "OS2_0_10_COMPOSITE_VERMAGIC\t$ko\t$actual"
            test "$actual" = "$TARGET_RELEASE"
          done

      - name: Compare entire OS2.0.10 stock ABI oracle
        run: |
          set -euo pipefail
          python3 - stock.full.crcs out/Module.symvers composite-full-abi.txt <<'PY'
          import sys
          from pathlib import Path

          stock_path, symvers_path, out_path = sys.argv[1:]
          stock = {}
          for raw in Path(stock_path).read_text(errors="replace").splitlines():
              if not raw or raw.startswith("#"):
                  continue
              p = raw.split("\t")
              if len(p) >= 2:
                  stock[p[1]] = (int(p[0], 16), p[2] if len(p) >= 3 else "-")
          current = {}
          for raw in Path(symvers_path).read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3 or p[2] != "vmlinux":
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
              except ValueError:
                  pass
          sn = set(stock)
          cn = set(current)
          overlap = sn & cn
          matches = sorted(n for n in overlap if stock[n][0] == current[n])
          mismatches = sorted(n for n in overlap if stock[n][0] != current[n])
          stock_only = sorted(sn - cn)
          current_only = sorted(cn - sn)
          print(f"COMPOSITE_STOCK_EXPORTS={len(stock)}")
          print(f"COMPOSITE_CURRENT_VMLINUX={len(current)}")
          print(f"COMPOSITE_OVERLAP={len(overlap)}")
          print(f"COMPOSITE_CRC_MATCHES={len(matches)}")
          print(f"COMPOSITE_CRC_MISMATCHES={len(mismatches)}")
          print(f"COMPOSITE_STOCK_ONLY={len(stock_only)}")
          print(f"COMPOSITE_CURRENT_ONLY={len(current_only)}")
          if overlap:
              print(f"COMPOSITE_MATCH_RATE={len(matches)/len(overlap):.6f}")
          lines = [
              "# OS2.0.10 composite lineage full stock ABI comparison",
              f"stock_exports={len(stock)}",
              f"current_vmlinux={len(current)}",
              f"overlap={len(overlap)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"stock_only={len(stock_only)}",
              f"current_only={len(current_only)}",
              "",
              "## MISMATCHES",
          ]
          for n in mismatches:
              lines.append(
                  f"MISMATCH\t{n}\tstock=0x{stock[n][0]:08x}\tcurrent=0x{current[n]:08x}\t{stock[n][1]}"
              )
          lines += ["", "## STOCK_ONLY"]
          for n in stock_only:
              lines.append(f"STOCK_ONLY\t{n}\t0x{stock[n][0]:08x}\t{stock[n][1]}")
          lines += ["", "## CURRENT_ONLY"]
          for n in current_only:
              lines.append(f"CURRENT_ONLY\t{n}\t0x{current[n]:08x}")
          Path(out_path).write_text("\n".join(lines) + "\n")
          PY
          test -s composite-full-abi.txt
          sed -n '1,180p' composite-full-abi.txt

      - name: Record OS2.0.10 composite preflight gate
        run: |
          set -euo pipefail
          mismatch_count="$(awk -F= '/^mismatches=/{print $2}' composite-full-abi.txt)"
          stock_only_count="$(awk -F= '/^stock_only=/{print $2}' composite-full-abi.txt)"
          image_sha="$(sha256sum out/arch/arm64/boot/Image | awk '{print $1}')"
          {
            echo "target_release=$TARGET_RELEASE"
            echo "image_sha256=$image_sha"
            echo "crc_mismatches=$mismatch_count"
            echo "stock_only=$stock_only_count"
            echo "OS2_0_10_COMPOSITE_BUILD=PASS"
          } | tee os2-0-10-composite-report.txt

      - name: Upload OS2.0.10 composite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-os2-0-10-composite-evidence
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            clang-version.txt
            composite-donor-commits.txt
            redwood-overlay-manifest.txt
            yzzzr-overlay-manifest.txt
            lz4-overlay-manifest.txt
            kernelrelease.txt
            os2-0-10-effective.config
            composite-build.log
            composite-genksyms-failures.txt
            composite-full-abi.txt
            os2-0-10-composite-report.txt
            g4c23-module-oracle.txt
            stock.full.crcs
            out/.config
            out/Module.symvers
            out/arch/arm64/boot/Image
