name: Build Lisa OS2.0.10 composite stock lineage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-kernel-composite-lineage.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-os2-0-10-composite-stock-lineage
  cancel-in-progress: true

env:
  STOCK_ORACLE_ARTIFACT_ID: "10713959003"
  TARGET_RELEASE: 5.4.289-qgki-g4c23b1a30923
  TARGET_GIT_SUFFIX: g4c23b1a30923
  TARGET_MODULE_LAYOUT: "0xba39cbb8"
  TARGET_IMAGE_SHA256: 2162041efe1e4ac3e86bd934d4ccd9a4e00c5cd80e23c8085dfd0e0995430166

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout reconstructed kernel
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio kmod rsync python3 curl xz-utils unzip git

      - name: Cache stock-generation AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install stock-generation AOSP clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"

          if [[ -x "$DEST/bin/clang" ]] && "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'; then
            "$DEST/bin/clang" --version | tee clang-version.txt
            exit 0
          fi

          curl -L --fail --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$DEST"
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download exact OS2.0.10 stock IKCONFIG IKHEADERS and CRC oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf stock-oracle
          mkdir -p stock-oracle

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STOCK_ORACLE_ARTIFACT_ID}/zip" \
            -o stock-oracle.zip
          unzip -q stock-oracle.zip -d stock-oracle

          report="$(find stock-oracle -type f -name os2-0-10-stock-oracle-report.txt -print -quit)"
          ikconfig="$(find stock-oracle -type f -name stock_ikconfig_g4c23 -print -quit)"
          kheaders_archive="$(find stock-oracle -type f -name stock-kheaders.tar.xz -print -quit)"
          stock_crc="$(find stock-oracle -type f -name stock.full.crcs -print -quit)"
          module_oracle="$(find stock-oracle -type f -name g4c23-module-oracle.txt -print -quit)"

          test -n "$report"
          test -n "$ikconfig"
          test -n "$kheaders_archive"
          test -n "$stock_crc"
          test -n "$module_oracle"
          grep -Fqx 'OS2_0_10_STOCK_ORACLES_GATE=PASS' "$report"

          expected_header_count="$(awk -F= '$1=="kheaders_file_count" {print $2}' "$report")"
          expected_kheaders_sha="$(awk -F= '$1=="kheaders_archive_sha256" {print $2}' "$report")"
          test "$expected_header_count" = "7804"
          test -n "$expected_kheaders_sha"
          actual_kheaders_sha="$(sha256sum "$kheaders_archive" | awk '{print $1}')"
          echo "OS2_0_10_KHEADERS_ARCHIVE_SHA256=$actual_kheaders_sha"
          test "$actual_kheaders_sha" = "$expected_kheaders_sha"

          cp "$ikconfig" stock_ikconfig_g4c23
          cp "$stock_crc" stock.full.crcs
          cp "$module_oracle" g4c23-module-oracle.txt

          rm -rf stock-kheaders stock-kheaders-unpack
          mkdir -p stock-kheaders-unpack
          tar -xJf "$kheaders_archive" -C stock-kheaders-unpack
          if [[ -d stock-kheaders-unpack/stock-kheaders ]]; then
            mv stock-kheaders-unpack/stock-kheaders stock-kheaders
            rmdir stock-kheaders-unpack 2>/dev/null || true
          else
            mv stock-kheaders-unpack stock-kheaders
          fi

          header_count="$(find stock-kheaders -type f | wc -l)"
          export_count="$(grep -cv '^#\|^$' stock.full.crcs)"
          module_symbols="$(wc -l < g4c23-module-oracle.txt)"
          echo "OS2_0_10_STOCK_HEADERS=$header_count"
          echo "OS2_0_10_STOCK_EXPORTS=$export_count"
          echo "OS2_0_10_QGKI_MODULE_ORACLE=$module_symbols"
          test "$header_count" -eq "$expected_header_count"
          test "$export_count" -eq 13360
          test "$module_symbols" -eq 736
          grep -q "^module_layout ${TARGET_MODULE_LAYOUT}$" g4c23-module-oracle.txt

      - name: Fetch exact private-source donors
        run: |
          set -euo pipefail
          rm -rf donor-redwood donor-yzzzr donor-linux54

          git clone --filter=blob:none --no-checkout \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git donor-redwood
          git -C donor-redwood fetch --depth=1 origin redwood-s-oss
          git -C donor-redwood checkout --detach FETCH_HEAD

          git clone --filter=blob:none --no-checkout \
            https://github.com/YZzZr/android_kernel_xiaomi_sm8350-miui.git donor-yzzzr
          git -C donor-yzzzr fetch --depth=1 origin hyper-14
          git -C donor-yzzzr checkout --detach FETCH_HEAD

          git clone --filter=blob:none --no-checkout \
            https://github.com/torvalds/linux.git donor-linux54
          git -C donor-linux54 fetch --depth=1 origin v5.4
          git -C donor-linux54 checkout --detach FETCH_HEAD

          {
            echo "redwood=$(git -C donor-redwood rev-parse HEAD)"
            echo "yzzzr=$(git -C donor-yzzzr rev-parse HEAD)"
            echo "linux54=$(git -C donor-linux54 rev-parse HEAD)"
          } | tee composite-donor-commits.txt

      - name: Overlay redwood private implementation families
        run: |
          set -euo pipefail
          python3 - donor-redwood . redwood-overlay-manifest.txt <<'PY'
          import shutil
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          manifest = Path(sys.argv[3])
          roots = [
              "kernel/sched",
              "drivers/gpu/msm",
              "net/qrtr",
              "techpack/dataipa/drivers/platform/msm/ipa",
          ]
          excluded_files = {
              "kernel/sched/psi.c",
          }
          excluded_prefixes = (
              "techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/dump/",
          )
          copied = []
          for root_text in roots:
              root = src / root_text
              if not root.is_dir():
                  raise SystemExit(f"missing redwood donor root: {root_text}")
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.suffix not in {".c", ".h"}:
                      continue
                  rel = p.relative_to(src)
                  rel_text = rel.as_posix()
                  if rel_text in excluded_files:
                      continue
                  if any(rel_text.startswith(prefix) for prefix in excluded_prefixes):
                      continue
                  target = dst / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, target)
                  copied.append(rel.as_posix())

          # Keep the reconstructed sched trace generation because kernel/kthread.c
          # requires the kthread-work tracepoints.  Import only the Redwood-only
          # sched_setaffinity event required by the Redwood scheduler core.
          sched_rel = Path("include/trace/events/sched.h")
          redwood_sched_path = src / sched_rel
          target_sched_path = dst / sched_rel
          if not redwood_sched_path.is_file():
              raise SystemExit(f"missing redwood companion header: {sched_rel}")
          if not target_sched_path.is_file():
              raise SystemExit(f"missing reconstructed companion header: {sched_rel}")

          redwood_sched = redwood_sched_path.read_text()
          target_sched = target_sched_path.read_text()
          marker = "TRACE_EVENT(sched_setaffinity,"
          if marker not in redwood_sched:
              raise SystemExit("redwood sched_setaffinity trace event not found")
          if marker not in target_sched:
              start = redwood_sched.index(marker)
              end = redwood_sched.find("\n);\n", start)
              if end < 0:
                  raise SystemExit("could not isolate redwood sched_setaffinity trace event")
              end += len("\n);\n")
              block = redwood_sched[start:end].rstrip()
              guard = "#endif /* _TRACE_SCHED_H */"
              if guard not in target_sched:
                  raise SystemExit("reconstructed sched trace guard not found")
              target_sched = target_sched.replace(guard, block + "\n\n" + guard, 1)
              target_sched_path.write_text(target_sched)
          copied.append(sched_rel.as_posix())

          copied = sorted(set(copied))
          manifest.write_text("\n".join(copied) + "\n")
          print(f"REDWOOD_PRIVATE_FILES={len(copied)}")
          PY

          # The Redwood KGSL source generation uses dedicated translation
          # units to instantiate tracepoints.  The reconstructed Makefile
          # predates those membership entries, so merge only the required
          # trace-definition objects rather than replacing the whole GPU
          # build graph.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/gpu/msm/Makefile")
          s = p.read_text()

          def ensure_after(anchor: str, obj: str) -> None:
              global s
              if obj in s:
                  return
              if anchor not in s:
                  raise SystemExit(f"KGSL Makefile anchor missing: {anchor.strip()}")
              s = s.replace(anchor, anchor + f"\t{obj} \\\n", 1)

          ensure_after("\tkgsl_timeline.o \\\n", "kgsl_trace.o")
          ensure_after("\tadreno_sysfs.o \\\n", "adreno_trace.o")
          p.write_text(s)
          PY

          grep -q 'kgsl_trace.o' drivers/gpu/msm/Makefile
          grep -q 'adreno_trace.o' drivers/gpu/msm/Makefile
          grep -Fqx 'include/trace/events/sched.h' redwood-overlay-manifest.txt
          grep -q 'TRACE_EVENT(sched_setaffinity,' include/trace/events/sched.h
          grep -q 'sched_kthread_work_queue_work' include/trace/events/sched.h
          grep -q 'sched_kthread_work_execute_start' include/trace/events/sched.h
          grep -q 'sched_kthread_work_execute_end' include/trace/events/sched.h
          grep -q '^struct proc_ops {' include/linux/proc_fs.h
          grep -q '^static const struct proc_ops psi_io_proc_ops = {' kernel/sched/psi.c
          if grep -q '^fs/proc/' redwood-overlay-manifest.txt; then
            echo 'legacy redwood fs/proc must not override reconstructed proc_ops generation' >&2
            exit 1
          fi
          if grep -Fqx 'include/linux/proc_fs.h' redwood-overlay-manifest.txt; then
            echo 'legacy redwood proc_fs.h must not override reconstructed proc_ops generation' >&2
            exit 1
          fi
          if grep -Fqx 'kernel/sched/psi.c' redwood-overlay-manifest.txt; then
            echo 'legacy redwood PSI implementation must not override reconstructed proc_ops PSI generation' >&2
            exit 1
          fi
          if grep -q '^techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/dump/' redwood-overlay-manifest.txt; then
            echo 'redwood IPA register-dump generation must not override reconstructed IPA dump sources/headers' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path("techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/dump/ipa4.5/ipa_hw_common_ex.h")
          text = path.read_text()
          marker = "#define IPA_REG_SAVE_CFG_ENTRY_PIPE_ENDP"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("reconstructed IPA pipe-endpoint macro not found")
          end = text.find("\n\n", start)
          block = text[start:] if end < 0 else text[start:end]
          if "({" in block:
              raise SystemExit("IPA pipe-endpoint macro regressed to file-scope statement-expression generation")
          print("IPA_REG_DUMP_GENERATION=reconstructed")
          PY

      - name: Overlay YZzZr USB and TSENS private implementation
        run: |
          set -euo pipefail
          python3 - donor-yzzzr . yzzzr-overlay-manifest.txt <<'PY'
          import shutil
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          manifest = Path(sys.argv[3])
          copied = []
          for root_text in ["drivers/usb/dwc3", "drivers/thermal"]:
              root = src / root_text
              if not root.is_dir():
                  raise SystemExit(f"missing YZzZr donor root: {root_text}")
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.suffix not in {".c", ".h"}:
                      continue
                  rel = p.relative_to(src)
                  target = dst / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, target)
                  copied.append(rel.as_posix())
          host = src / "drivers/usb/host"
          if not host.is_dir():
              raise SystemExit("missing YZzZr drivers/usb/host")
          for p in sorted(host.glob("xhci*")):
              if not p.is_file() or p.suffix not in {".c", ".h"}:
                  continue
              rel = p.relative_to(src)
              target = dst / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(p, target)
              copied.append(rel.as_posix())
          copied = sorted(set(copied))
          manifest.write_text("\n".join(copied) + "\n")
          print(f"YZZZR_PRIVATE_FILES={len(copied)}")
          PY
          test -s yzzzr-overlay-manifest.txt

      - name: Restore Linux 5.4 LZ4 implementation family
        run: |
          set -euo pipefail
          rm -rf lib/lz4
          mkdir -p lib/lz4
          cp donor-linux54/lib/lz4/Makefile lib/lz4/Makefile
          cp donor-linux54/lib/lz4/lz4_compress.c lib/lz4/lz4_compress.c
          cp donor-linux54/lib/lz4/lz4_decompress.c lib/lz4/lz4_decompress.c
          cp donor-linux54/lib/lz4/lz4defs.h lib/lz4/lz4defs.h
          cp donor-linux54/lib/lz4/lz4hc_compress.c lib/lz4/lz4hc_compress.c
          cp donor-linux54/include/linux/lz4.h include/linux/lz4.h
          {
            echo "lib/lz4/Makefile"
            echo "lib/lz4/lz4_compress.c"
            echo "lib/lz4/lz4_decompress.c"
            echo "lib/lz4/lz4defs.h"
            echo "lib/lz4/lz4hc_compress.c"
            echo "include/linux/lz4.h"
          } > lz4-overlay-manifest.txt
          echo "LZ4_SOURCE_GENERATION=linux-v5.4"

      - name: Generate build environment from exact OS2.0.10 IKCONFIG
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cp stock_ikconfig_g4c23 out/.config

          scripts/config --file out/.config --enable BOARD_XIAOMI_LISA
          printf '%s\n' "-${TARGET_GIT_SUFFIX}" > .scmversion

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          cp out/.config os2-0-10-effective.config
          make -s O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- kernelrelease | tee kernelrelease.txt
          grep -Fqx "$TARGET_RELEASE" kernelrelease.txt

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- prepare scripts

      - name: Stage complete stock global headers for genksyms only
        env:
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          rm -rf "$STOCK_ABI_ROOT"
          mkdir -p "$STOCK_ABI_ROOT"
          rsync -a stock-kheaders/ "$STOCK_ABI_ROOT/"
          count="$(find "$STOCK_ABI_ROOT" -type f | wc -l)"
          echo "COMPOSITE_STOCK_GENKSYMS_FILES=$count"
          test "$count" -eq 7804

      - name: Route genksyms through OS2.0.10 stock global headers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/Makefile.build")
          s = p.read_text()
          stock = (
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated "
              "-I$(STOCK_ABI_ROOT)/include "
              "-I$(STOCK_ABI_ROOT)/include/generated "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated/uapi "
              "-I$(STOCK_ABI_ROOT)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/include/generated/uapi"
          )
          conditional = (
              "$(if $(or "
              "$(findstring /lib/zstd/,$<),"
              "$(findstring /drivers/android/vendor_hooks.c,$<)"
              f"),,{stock})"
          )
          lines = s.splitlines(keepends=True)
          c_done = False
          asm_done = False
          for i, line in enumerate(lines):
              if not c_done and "$(CPP) -D__GENKSYMS__ $(c_flags) $< |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {conditional} -D__GENKSYMS__",
                      1,
                  )
                  c_done = True
                  continue
              if not asm_done and "$(CPP) -D__GENKSYMS__ $(c_flags) -xc - |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {stock} -D__GENKSYMS__",
                      1,
                  )
                  asm_done = True
          if not c_done:
              raise SystemExit("C genksyms rule not found")
          if not asm_done:
              raise SystemExit("ASM genksyms rule not found")
          p.write_text("".join(lines))
          PY

      - name: Build Image modules and DTBs
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tee composite-build.log

      - name: Summarize genksyms failures
        if: always()
        run: |
          set -euo pipefail
          if [[ -f composite-build.log ]]; then
            grep 'version generation failed' composite-build.log > composite-genksyms-failures.txt || true
          else
            : > composite-genksyms-failures.txt
          fi
          echo "COMPOSITE_GENKSYMS_VERSION_FAILURES=$(wc -l < composite-genksyms-failures.txt)"
          cat composite-genksyms-failures.txt || true

      - name: Validate build outputs release and ARM64 Image
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers
          file out/arch/arm64/boot/Image | tee image-file.txt
          grep -q 'ARM aarch64' image-file.txt || true
          grep -a -m1 -F "$TARGET_RELEASE" out/arch/arm64/boot/Image | tee image-release-hit.txt

          for ko in \
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko \
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko \
            out/drivers/misc/mi-memory/mi_memory.ko \
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko; do
            test -s "$ko"
            actual="$(strings -a "$ko" | sed -n 's/^vermagic=//p' | head -n1 | awk '{print $1}')"
            echo "OS2_0_10_COMPOSITE_VERMAGIC\t$ko\t$actual"
            test "$actual" = "$TARGET_RELEASE"
          done

      - name: Compare entire OS2.0.10 stock ABI oracle
        run: |
          set -euo pipefail
          python3 - stock.full.crcs out/Module.symvers composite-full-abi.txt <<'PY'
          import sys
          from pathlib import Path

          stock_path, symvers_path, out_path = sys.argv[1:]
          stock = {}
          for raw in Path(stock_path).read_text(errors="replace").splitlines():
              if not raw or raw.startswith("#"):
                  continue
              p = raw.split("\t")
              if len(p) >= 2:
                  stock[p[1]] = (int(p[0], 16), p[2] if len(p) >= 3 else "-")
          current = {}
          for raw in Path(symvers_path).read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3 or p[2] != "vmlinux":
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
              except ValueError:
                  pass
          sn = set(stock)
          cn = set(current)
          overlap = sn & cn
          matches = sorted(n for n in overlap if stock[n][0] == current[n])
          mismatches = sorted(n for n in overlap if stock[n][0] != current[n])
          stock_only = sorted(sn - cn)
          current_only = sorted(cn - sn)
          print(f"COMPOSITE_STOCK_EXPORTS={len(stock)}")
          print(f"COMPOSITE_CURRENT_VMLINUX={len(current)}")
          print(f"COMPOSITE_OVERLAP={len(overlap)}")
          print(f"COMPOSITE_CRC_MATCHES={len(matches)}")
          print(f"COMPOSITE_CRC_MISMATCHES={len(mismatches)}")
          print(f"COMPOSITE_STOCK_ONLY={len(stock_only)}")
          print(f"COMPOSITE_CURRENT_ONLY={len(current_only)}")
          if overlap:
              print(f"COMPOSITE_MATCH_RATE={len(matches)/len(overlap):.6f}")
          lines = [
              "# OS2.0.10 composite lineage full stock ABI comparison",
              f"stock_exports={len(stock)}",
              f"current_vmlinux={len(current)}",
              f"overlap={len(overlap)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"stock_only={len(stock_only)}",
              f"current_only={len(current_only)}",
              "",
              "## MISMATCHES",
          ]
          for n in mismatches:
              lines.append(
                  f"MISMATCH\t{n}\tstock=0x{stock[n][0]:08x}\tcurrent=0x{current[n]:08x}\t{stock[n][1]}"
              )
          lines += ["", "## STOCK_ONLY"]
          for n in stock_only:
              lines.append(f"STOCK_ONLY\t{n}\t0x{stock[n][0]:08x}\t{stock[n][1]}")
          lines += ["", "## CURRENT_ONLY"]
          for n in current_only:
              lines.append(f"CURRENT_ONLY\t{n}\t0x{current[n]:08x}")
          Path(out_path).write_text("\n".join(lines) + "\n")
