          import sys
          from pathlib import Path

          stock_path, symvers_path, out_path = sys.argv[1:]
          stock = {}
          for raw in Path(stock_path).read_text(errors="replace").splitlines():
              if not raw or raw.startswith("#"):
                  continue
              p = raw.split("\t")
              if len(p) >= 2:
                  stock[p[1]] = (int(p[0], 16), p[2] if len(p) >= 3 else "-")
          current = {}
          for raw in Path(symvers_path).read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3 or p[2] != "vmlinux":
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
              except ValueError:
                  pass
          sn = set(stock)
          cn = set(current)
          overlap = sn & cn
          matches = sorted(n for n in overlap if stock[n][0] == current[n])
          mismatches = sorted(n for n in overlap if stock[n][0] != current[n])
          stock_only = sorted(sn - cn)
          current_only = sorted(cn - sn)
          print(f"COMPOSITE_STOCK_EXPORTS={len(stock)}")
          print(f"COMPOSITE_CURRENT_VMLINUX={len(current)}")
          print(f"COMPOSITE_OVERLAP={len(overlap)}")
          print(f"COMPOSITE_CRC_MATCHES={len(matches)}")
          print(f"COMPOSITE_CRC_MISMATCHES={len(mismatches)}")
          print(f"COMPOSITE_STOCK_ONLY={len(stock_only)}")
          print(f"COMPOSITE_CURRENT_ONLY={len(current_only)}")
          if overlap:
              print(f"COMPOSITE_MATCH_RATE={len(matches)/len(overlap):.6f}")
          lines = [
              "# OS2.0.10 composite lineage full stock ABI comparison",
              f"stock_exports={len(stock)}",
              f"current_vmlinux={len(current)}",
              f"overlap={len(overlap)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"stock_only={len(stock_only)}",
              f"current_only={len(current_only)}",
              "",
              "## MISMATCHES",
          ]
          for n in mismatches:
              lines.append(
                  f"MISMATCH\t{n}\tstock=0x{stock[n][0]:08x}\tcurrent=0x{current[n]:08x}\t{stock[n][1]}"
              )
          lines += ["", "## STOCK_ONLY"]
          for n in stock_only:
              lines.append(f"STOCK_ONLY\t{n}\t0x{stock[n][0]:08x}\t{stock[n][1]}")
          lines += ["", "## CURRENT_ONLY"]
          for n in current_only:
              lines.append(f"CURRENT_ONLY\t{n}\t0x{current[n]:08x}")
          Path(out_path).write_text("\n".join(lines) + "\n")
          PY
          test -s composite-full-abi.txt
          sed -n '1,180p' composite-full-abi.txt

