name: Audit Lisa Candidate0061 device evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-lisa-candidate-0061-device-evidence.yml
      - reconstruction/lisa_5_4_302_touch_plan_state.json
      - reconstruction/scripts/c0061_cmdline_provenance_gate.py
      - reconstruction/scripts/c0061_embedded_cmdline_config_prepare.py
      - scripts/collect_c0061_vendor_loader_readonly.ps1
      - reconstruction/scripts/c0061_oem_oops_module_route_gate.py
      - reconstruction/tools/collect_lisa_touch_runtime.ps1
      - scripts/collect_lisa_twrp_logs.ps1
      - scripts/collect_lisa_android_first_fault.ps1

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-c0061-device-evidence-audit
  cancel-in-progress: true

jobs:
  evidence-audit:
    name: Device evidence (not a kernel build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout project state
        uses: actions/checkout@v4

      - name: Self-test NFC Kernel Kconfig cmdline and draft-preflight (synthetic data only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile reconstruction/scripts/c0061_cmdline_provenance_gate.py
          python3 -m py_compile reconstruction/scripts/c0061_embedded_cmdline_config_prepare.py
          python3 reconstruction/scripts/c0061_cmdline_provenance_gate.py --self-test
          python3 reconstruction/scripts/c0061_embedded_cmdline_config_prepare.py --self-test
          echo 'C0061_CMDLINE_AUDIT=SYNTAX_AND_SYNTHETIC_PASS; REAL_DEVICE_CMDLINE=UNVERIFIED; NOT_FLASHABLE'

      - name: Self-test OEM Oops per-record QGKI evidence parser (synthetic data only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile reconstruction/scripts/c0061_oem_oops_module_route_gate.py
          python3 reconstruction/scripts/c0061_oem_oops_module_route_gate.py --self-test
          echo 'C0061_OEM_OOPS_ROUTE_AUDIT=STATIC_SELF_TEST_PASS; DEVICE_RUNTIME_UNVERIFIED'

      - name: Test C0061 OEM vendor read-only collector (syntax plus synthetic allowlist)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = 'scripts/collect_c0061_vendor_loader_readonly.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw 'C0061_VENDOR_LOADER_POWERSHELL_PARSE=FAIL' }
          Write-Host 'C0061_VENDOR_LOADER_POWERSHELL_PARSE=PASS'
          $result = & pwsh -NoProfile -NonInteractive -File $path -SelfTest
          if ($LASTEXITCODE -ne 0 -or $result -notcontains 'C0061_VENDOR_LOADER_READONLY_SELF_TEST=PASS') { throw 'C0061_VENDOR_LOADER_READONLY_SELF_TEST=FAIL' }
          Write-Host 'C0061_VENDOR_LOADER_READONLY_SELF_TEST=PASS; NO_DEVICE_ACCESS'

      - name: Parse TWRP collector PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = "scripts/collect_lisa_twrp_logs.ps1"
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("POWERSHELL_PARSE_ERROR line={0} char={1} message={2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            throw "LISA_TWRP_COLLECTOR_SYNTAX=FAIL"
          }
          Write-Host "LISA_TWRP_COLLECTOR_SYNTAX=PASS"

      - name: Parse Android first-fault collector and reject recovery as Android
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = "scripts/collect_lisa_android_first_fault.ps1"
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("POWERSHELL_PARSE_ERROR line={0} message={1}" -f $_.Extent.StartLineNumber, $_.Message) }
            throw "LISA_ANDROID_FIRST_FAULT_COLLECTOR_SYNTAX=FAIL"
          }
          Write-Host "LISA_ANDROID_FIRST_FAULT_COLLECTOR_SYNTAX=PASS"
          $output = & pwsh -NoProfile -NonInteractive -File $path -SelfTest
          if ($LASTEXITCODE -ne 0 -or $output -notcontains "LISA_ANDROID_FIRST_FAULT_SELF_TEST=PASS") {
            throw "LISA_ANDROID_FIRST_FAULT_RECOVERY_CLASSIFIER=FAIL"
          }
          Write-Host "LISA_ANDROID_FIRST_FAULT_RECOVERY_CLASSIFIER=PASS"

      - name: Parse remote TWRP shell probe syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          source = pathlib.Path("scripts/collect_lisa_twrp_logs.ps1").read_text()
          rows = source.splitlines()
          try:
              start = rows.index("$AdbdProvenanceScript = @'")
              end = rows.index("'@", start + 1)
          except ValueError:
              raise SystemExit("ADBD_PROBE_HERESTRING_MISSING")
          adbd_script = "\n".join(rows[start + 1:end])
          row = next((x for x in source.splitlines()
                      if 'File = "23_nfc_runtime_module_provenance.txt"' in x), None)
          if row is None or "; Command = '" not in row or not row.endswith("' }"):
              raise SystemExit("NFC_PROBE_STRING_MISSING")
          nfc = row.split("; Command = '", 1)[1].rsplit("' }", 1)[0]
          with tempfile.TemporaryDirectory() as tmp:
              for label, body in (("adbd", adbd_script), ("nfc", nfc)):
                  p = pathlib.Path(tmp) / (label + ".sh")
                  p.write_text("#!/bin/sh" + chr(10) + body + chr(10))
                  for shell in ("bash", "dash"):
                      subprocess.run([shell, "-n", str(p)], check=True)
                  print(f"TWRP_{label.upper()}_SHELL_SYNTAX=PASS")
          PY

      - name: Audit canonical state and referenced static CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          s = json.loads(pathlib.Path("reconstruction/lisa_5_4_302_touch_plan_state.json").read_text())
          required = ("last_checked_commit", "last_checked_run", "current_phase", "completed_steps", "blocker", "next_action", "next_expected_evidence")
          missing = [key for key in required if key not in s]
          if missing:
              raise SystemExit("STATE_SCHEMA_MISSING=" + ",".join(missing))
          if not isinstance(s["completed_steps"], list) or not isinstance(s["next_expected_evidence"], list):
              raise SystemExit("STATE_SCHEMA_BAD_LIST")
          run_id = int(s["last_verified_static_ci_run"])
          static_head = str(s["last_verified_static_ci_sha"]).strip()
          if len(static_head) != 40:
              raise SystemExit("VERIFIED_STATIC_CI_SHA_MISSING")
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          })
          with urllib.request.urlopen(req, timeout=25) as response:
              run = json.load(response)
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("VERIFIED_STATIC_CI_NOT_SUCCESS")
          if run.get("head_sha") != static_head or run.get("name") != "Build Lisa Candidate0061 Integrated 5.4.302":
              raise SystemExit("VERIFIED_STATIC_CI_IDENTITY_MISMATCH")
          jobs_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(jobs_url, headers=req.headers), timeout=25) as response:
              jobs = json.load(response).get("jobs", [])
          if not any(j.get("name") == "integrated-302" and j.get("conclusion") == "success" for j in jobs):
              raise SystemExit("VERIFIED_STATIC_CI_JOB_NOT_SUCCESS")
          artifacts_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          with urllib.request.urlopen(urllib.request.Request(artifacts_url, headers=req.headers), timeout=25) as response:
              artifacts = json.load(response).get("artifacts", [])
          verified_artifact = next((a for a in artifacts if a.get("name", "").startswith("lisa-c0061-5.4.302-static-verified") and not a.get("expired")), None)
          if verified_artifact is None:
              raise SystemExit("VERIFIED_STATIC_CI_ARTIFACT_MISSING")
          note = {
              "audit_type": "READ_ONLY_DEVICE_EVIDENCE_CHECKPOINT",
              "kernel_rebuilt": False,
              "device_test_performed": False,
              "device_boot_pass": False,
              "nfc_android_load_verified": False,
              "latest_source_checkout": os.environ["GITHUB_SHA"],
              "last_checked_commit": s["last_checked_commit"],
              "last_checked_run": s["last_checked_run"],
              "static_ci_head_sha": run.get("head_sha"),
              "verified_static_ci_run": run_id,
              "verified_static_ci_artifact_id": verified_artifact.get("id"),
              "static_ci_status": run.get("conclusion"),
              "current_phase": s["current_phase"],
              "blocker": s["blocker"],
              "next_action": s["next_action"],
              "next_expected_evidence": s["next_expected_evidence"],
              "result": "RUNTIME_EVIDENCE_PENDING"
          }
          pathlib.Path("audit/device-evidence-checkpoint.json").write_text(json.dumps(note, ensure_ascii=False, indent=2) + "\n")
          summary = [
              "## Lisa Candidate0061 — evidence-only audit",
              "",
              f"- Referenced static CI: [run {run_id}]({run.get('html_url', url)}) — **{run['conclusion']}**",
              f"- Current phase: `{s['current_phase']}`",
              f"- Blocker: `{s['blocker']}`",
              "- Android boot: **NOT VERIFIED**",
              "- NFC module deployment / Android actual load: **NOT VERIFIED**",
              "- New kernel build: **NO**",
              "- This job audits metadata only; its success is NOT a device PASS.",
              "",
              "### Next action",
              s["next_action"]
          ]
          report = "\n".join(summary) + "\n"
          pathlib.Path("audit/README.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          print("STATE_SCHEMA=PASS")
          print("VERIFIED_STATIC_CI=SUCCESS")
          print("DEVICE_RUNTIME=UNVERIFIED")
          print("C0061_DEVICE_EVIDENCE_AUDIT=RUNTIME_EVIDENCE_PENDING")
          PY

      - name: Upload evidence-only audit
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0061-device-evidence-audit
          path: audit/
          retention-days: 14
