name: Build Lisa with minimal stock ABI header environment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-kernel-stock-abi-overlay.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-abi-full-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout reconstructed kernel
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio kmod rsync python3 curl xz-utils unzip

      - name: Cache stock-generation AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install stock-generation AOSP clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"

          if [[ -x "$DEST/bin/clang" ]] && "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'; then
            "$DEST/bin/clang" --version | tee clang-version.txt
            exit 0
          fi

          curl -L --fail --retry 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$DEST"
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download exact stock IKHEADERS and proven minimal closure
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_KHEADERS_ARTIFACT_ID: "10637733529"
          MINIMAL_CLOSURE_ARTIFACT_ID: "10641950893"
        run: |
          set -euo pipefail
          mkdir -p stock-artifact closure-artifact

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STOCK_KHEADERS_ARTIFACT_ID}/zip" \
            -o stock-kheaders-artifact.zip
          unzip -q stock-kheaders-artifact.zip -d stock-artifact

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MINIMAL_CLOSURE_ARTIFACT_ID}/zip" \
            -o minimal-closure-artifact.zip
          unzip -q minimal-closure-artifact.zip -d closure-artifact

          test -d stock-artifact/stock-kheaders
          closure_file="$(find closure-artifact -name abi-source-header-closure.txt -type f -print -quit)"
          test -n "$closure_file"
          cp "$closure_file" abi-source-header-closure.txt

          echo "STOCK_KHEADERS_FILES=$(find stock-artifact/stock-kheaders -type f | wc -l)"
          echo "MINIMAL_SOURCE_CLOSURE=$(wc -l < abi-source-header-closure.txt)"
          test "$(wc -l < abi-source-header-closure.txt)" -eq 774

      - name: Generate donor build environment from exact stock IKCONFIG
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          source reconstruction/manifest.env
          test -s reconstruction/stock_ikconfig
          test "$(git hash-object reconstruction/stock_ikconfig)" = "$STOCK_IKCONFIG_BLOB"

          rm -rf out
          mkdir -p out
          cp reconstruction/stock_ikconfig out/.config
          scripts/config --file out/.config --enable BOARD_XIAOMI_LISA

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- prepare scripts

          release="$(make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- kernelrelease)"
          echo "PRE_OVERLAY_KERNELRELEASE=$release"

      - name: Apply proven minimal stock ABI header environment
        run: |
          set -euo pipefail

          python3 - stock-artifact/stock-kheaders abi-source-header-closure.txt . out overlay-manifest.txt <<'PY'
          import shutil
          import sys
          from pathlib import Path

          stock = Path(sys.argv[1])
          closure = Path(sys.argv[2])
          src_root = Path(sys.argv[3])
          out_root = Path(sys.argv[4])
          manifest = Path(sys.argv[5])

          def is_generated(rel):
              s = rel.as_posix()
              return (
                  s.startswith("include/generated/")
                  or s.startswith("include/config/")
                  or s.startswith("arch/arm64/include/generated/")
              )

          source_paths = []
          for raw in closure.read_text().splitlines():
              rel_text = raw.strip()
              if not rel_text:
                  continue
              rel = Path(rel_text)
              if is_generated(rel):
                  raise SystemExit(f"generated path leaked into source closure: {rel_text}")
              src = stock / rel
              if not src.is_file():
                  raise SystemExit(f"missing stock source header: {rel_text}")
              target = src_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, target)
              source_paths.append(rel_text)

          generated_paths = []
          for src in sorted(p for p in stock.rglob("*.h") if p.is_file()):
              rel = src.relative_to(stock)
              if not is_generated(rel):
                  continue
              target = out_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, target)
              generated_paths.append(rel.as_posix())

          # Ensure generated files are at least as new as source overlay files,
          # reducing the chance that Kbuild immediately regenerates them from
          # the donor Kconfig environment.
          for rel_text in generated_paths:
              target = out_root / rel_text
              target.touch()

          manifest.write_text(
              "\n".join(
                  [
                      f"source_headers={len(source_paths)}",
                      f"generated_headers={len(generated_paths)}",
                      "",
                      "## SOURCE",
                      *source_paths,
                      "",
                      "## GENERATED",
                      *generated_paths,
                  ]
              ) + "\n"
          )

          print(f"FULL_BUILD_STOCK_SOURCE_HEADERS={len(source_paths)}")
          print(f"FULL_BUILD_STOCK_GENERATED_HEADERS={len(generated_paths)}")
          PY

          test ! -d include/config
          test ! -d arch/arm64/include/generated
          test ! -f .config
          grep -qx 'source_headers=774' overlay-manifest.txt
          grep -qx 'generated_headers=2120' overlay-manifest.txt
          echo "FULL_BUILD_SOURCE_TREE_CLEAN=1"

      - name: Build Image modules and DTBs under stock ABI header environment
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tee build-stock-abi-overlay.log

      - name: Validate full build outputs and ABI
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers
          test -s out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko
          test -s out/drivers/input/touchscreen/gt9897t/goodix_core.ko
          test -s out/drivers/misc/mi-memory/mi_memory.ko
          test -s out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko

          check_crc() {
            local symbol="$1"
            local expected="$2"
            local actual
            actual="$(awk -v sym="$symbol" '$2 == sym {print tolower($1); exit}' out/Module.symvers)"
            echo "FULL_BUILD_ABI\t$symbol\trebuilt=${actual:-MISSING}\tstock=$expected"
            [[ "$actual" == "$expected" ]]
          }

          core_fail=0
          while read -r symbol expected; do
            if ! check_crc "$symbol" "$expected"; then
              core_fail=$((core_fail + 1))
            fi
          done <<'EOF_CORE'
          module_layout 0xba39cbb8
          device_register 0xcf9bcdee
          device_unregister 0x4678e0d9
          dev_driver_string 0x22a8544f
          device_create 0xbebfb31d
          __platform_driver_register 0x8a28799a
          platform_driver_unregister 0xb1643fd1
          platform_get_irq 0xbcc683a6
          platform_get_resource 0x0b50f5aa
          platform_get_resource_byname 0x67870233
          __pm_runtime_resume 0xd7ceaec5
          pm_runtime_enable 0x69233960
          of_find_property 0x7bfb6ef3
          of_get_property 0x3f86cb17
          of_parse_phandle 0x5d8562ca
          of_address_to_resource 0x6f7055af
          of_device_is_compatible 0xb56ea40d
          clk_get 0xf8127647
          clk_register 0xab9a55da
          iommu_attach_device 0x0c54e55f
          iommu_map 0xa106c11d
          iommu_unmap 0xe1da4443
          regulator_get 0xf7c6097c
          regulator_enable 0x691df2d6
          regulator_set_voltage 0x54cdbf0a
          kthread_create_on_node 0x947eb746
          kthread_stop 0x97198f13
          irq_domain_remove 0x160aa18c
          irq_find_mapping 0x6fb78324
          sysfs_create_group 0x0965d890
          kobject_create_and_add 0x93a00376
          __free_pages 0x419e8d31
          adjust_managed_page_count 0xcf0c4b39
          dma_direct_map_page 0x803f2855
          dma_direct_map_sg 0x9e7457c3
          dma_alloc_attrs 0x1c3c2bb3
          dma_buf_attach 0x995856d1
          dma_buf_map_attachment 0x3d20e038
          EOF_CORE

          echo "FULL_BUILD_CORE_ABI_FAIL=$core_fail"
          echo "FULL_BUILD_CORE_ABI_SCORE=$((38-core_fail))/38"

          vendor_fail=0
          check_vendor_crc() {
            if ! check_crc "$1" "$2"; then
              vendor_fail=$((vendor_fail + 1))
            fi
          }

          check_vendor_crc get_ufs_data 0xfa507f92
          check_vendor_crc get_ufs_hba_data 0xc40eabac
          check_vendor_crc get_ufs_sdev_data 0xc5bbd8a8
          check_vendor_crc memblock_mem_size_in_gb 0x84fd4cc1
          check_vendor_crc ufs_get_string_desc 0x479d5ded
          check_vendor_crc ufs_read_desc_param 0x16548413
          check_vendor_crc ufshcd_read_desc 0xa93e3b58
          check_vendor_crc cnss_statistic_wow_wakeup 0x0fc3f432
          check_vendor_crc wow_suspend_type 0x635b9cbb
          check_vendor_crc dsi_bridge_interface_enable 0x43bda09c
          check_vendor_crc mi_disp_register_client 0xa292ba4e
          check_vendor_crc mi_disp_unregister_client 0x26ae4476
          check_vendor_crc mi_disp_set_fod_queue_work 0xb762dd7b
          check_vendor_crc last_touch_events_collect 0x9e978bfa
          check_vendor_crc update_palm_sensor_value 0x49118811
          check_vendor_crc xiaomitouch_register_modedata 0x1d883975

          # module_layout is already part of the core score; include it in the
          # historical 17-symbol vendor/UFS comparison for continuity.
          if ! check_crc module_layout 0xba39cbb8; then
            vendor_fail=$((vendor_fail + 1))
          fi

          echo "FULL_BUILD_VENDOR_ABI_FAIL=$vendor_fail"
          echo "FULL_BUILD_VENDOR_ABI_SCORE=$((17-vendor_fail))/17"

          source reconstruction/manifest.env
          for ko in \
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko \
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko \
            out/drivers/misc/mi-memory/mi_memory.ko \
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko; do
            actual="$(strings -a "$ko" | sed -n 's/^vermagic=//p' | head -n1 | awk '{print $1}')"
            echo "FULL_BUILD_VERMAGIC\t$ko\t$actual"
            test "$actual" = "$TARGET_VERMAGIC"
          done

          # Full build must preserve the already-proven core ABI.
          test "$core_fail" -eq 0

      - name: Upload full-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-stock-abi-full-build-evidence
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            clang-version.txt
            abi-source-header-closure.txt
            overlay-manifest.txt
            build-stock-abi-overlay.log
            out/.config
            out/Module.symvers
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/**/*.dtb
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko
            out/drivers/misc/mi-memory/mi_memory.ko
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko
