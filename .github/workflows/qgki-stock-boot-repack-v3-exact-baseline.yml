name: Repack Lisa Candidate 0006 from exact OS2.0.10 baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-stock-boot-repack-v3-exact-baseline.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-candidate-0006-exact-os2-0-10
  cancel-in-progress: true

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASELINE_ARTIFACT_ID: "10754191797"
      BASELINE_BOOT_SHA256: 0959eaa1bc914d570792b53207fc9f481b3986c8b9f2a0ec2a76a1fd625a3c1f
      BASELINE_IMAGE_SHA256: 2162041efe1e4ac3e86bd934d4ccd9a4e00c5cd80e23c8085dfd0e0995430166
      KERNEL_ARTIFACT_ID: "10762792655"
      KERNEL_IMAGE_SHA256: 4aa9995ae5ecbd2e3beb3018cd19a11a80e8970eb96c540874be547d2ecd90c6
      LAYOUT_ARTIFACT_ID: "10763146594"
      TARGET_RELEASE: 5.4.289-qgki-g4c23b1a30923
      RECONSTRUCTION_SHA: ab491ef6ecd4d35f9edcaa8ad00b568306c6ce64
      STOCK_BOOT_BYTES: "201326592"

    steps:
      - name: Install verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file python3

      - name: Download exact baseline and current validated evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline-evidence kernel-evidence layout-evidence

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$output"
          }

          download_artifact "$BASELINE_ARTIFACT_ID" baseline-evidence.zip
          unzip -q baseline-evidence.zip -d baseline-evidence
          download_artifact "$KERNEL_ARTIFACT_ID" kernel-evidence.zip
          unzip -q kernel-evidence.zip -d kernel-evidence
          download_artifact "$LAYOUT_ARTIFACT_ID" layout-evidence.zip
          unzip -q layout-evidence.zip -d layout-evidence

          find baseline-evidence kernel-evidence layout-evidence \
            -maxdepth 6 -type f -printf '%p %s bytes\n' | sort | tee artifact-files.txt

      - name: Authenticate exact OS2.0.10 stock baseline
        run: |
          set -euo pipefail
          stock_boot="$(find baseline-evidence -type f -path '*/official/boot.img' -print -quit)"
          stock_image="$(find baseline-evidence -type f -name official-stock-Image -print -quit)"
          baseline_report="$(find baseline-evidence -type f -name baseline-report.txt -print -quit)"
          stock_layout="$(find baseline-evidence -type f -name official-boot-layout.txt -print -quit)"

          test -n "$stock_boot" && test -s "$stock_boot"
          test -n "$stock_image" && test -s "$stock_image"
          test -n "$baseline_report" && test -s "$baseline_report"
          test -n "$stock_layout" && test -s "$stock_layout"

          test "$(sha256sum "$stock_boot" | awk '{print $1}')" = "$BASELINE_BOOT_SHA256"
          test "$(sha256sum "$stock_image" | awk '{print $1}')" = "$BASELINE_IMAGE_SHA256"
          test "$(stat -c '%s' "$stock_boot")" = "$STOCK_BOOT_BYTES"
          grep -Fqx "target_release=$TARGET_RELEASE" "$baseline_report"
          grep -Fqx "official_boot_sha256=$BASELINE_BOOT_SHA256" "$baseline_report"
          grep -Fqx "official_image_sha256=$BASELINE_IMAGE_SHA256" "$baseline_report"
          grep -Fqx 'OS2_0_10_STOCK_BOOT_GATE=PASS' "$baseline_report"
          grep -Fqx 'arm64_image_magic=PASS' "$stock_layout"
          grep -Fqx 'target_release_present=PASS' "$stock_layout"

          cp "$stock_boot" stock-boot.img
          cp "$stock_image" stock-Image
          cp "$baseline_report" baseline-report.txt
          cp "$stock_layout" official-boot-layout.txt
          sha256sum stock-boot.img stock-Image | tee exact-baseline.sha256

      - name: Authenticate exact Candidate 0006 Image ABI and runtime layout
        run: |
          set -euo pipefail
          image="$(find kernel-evidence -type f -path '*/out/arch/arm64/boot/Image' -print -quit)"
          if [[ -z "$image" ]]; then
            image="$(find kernel-evidence -type f -name Image -print -quit)"
          fi
          report="$(find kernel-evidence -type f -name os2-0-10-composite-report.txt -print -quit)"
          full_abi="$(find kernel-evidence -type f -name composite-full-abi.txt -print -quit)"
          module_gate="$(find kernel-evidence -type f -name qgki-module-oracle-current.txt -print -quit)"
          genksyms_failures="$(find kernel-evidence -type f -name composite-genksyms-failures.txt -print -quit)"
          final_gate="$(find layout-evidence -type f -name final-runtime-layout-gate.txt -print -quit)"
          layout_image_sha="$(find layout-evidence -type f -name exact-composite-Image.sha256 -print -quit)"

          test -n "$image" && test -s "$image"
          test -n "$report" && test -s "$report"
          test -n "$full_abi" && test -s "$full_abi"
          test -n "$module_gate" && test -s "$module_gate"
          test -n "$genksyms_failures"
          test -n "$final_gate" && test -s "$final_gate"
          test -n "$layout_image_sha" && test -s "$layout_image_sha"

          test "$(sha256sum "$image" | awk '{print $1}')" = "$KERNEL_IMAGE_SHA256"
          grep -Fqx "target_release=$TARGET_RELEASE" "$report"
          grep -Fqx "image_sha256=$KERNEL_IMAGE_SHA256" "$report"
          grep -Fqx 'crc_mismatches=0' "$report"
          grep -Fqx 'module_oracle_matches=736' "$report"
          grep -Fqx 'module_oracle_mismatches=0' "$report"
          grep -Fqx 'module_oracle_missing=0' "$report"
          grep -Fqx 'OS2_0_10_COMPOSITE_BUILD=PASS' "$report"
          test ! -s "$genksyms_failures"

          grep -Fqx 'matches=736' "$module_gate"
          grep -Fqx 'mismatches=0' "$module_gate"
          grep -Fqx 'missing=0' "$module_gate"

          grep -Fqx "reconstruction_sha=$RECONSTRUCTION_SHA" "$final_gate"
          grep -Fqx "composite_artifact_id=$KERNEL_ARTIFACT_ID" "$final_gate"
          grep -Fqx "image_sha256=$KERNEL_IMAGE_SHA256" "$final_gate"
          grep -Fqx 'required_runtime_fields=17' "$final_gate"
          grep -Fqx 'required_runtime_field_offsets_equal=1' "$final_gate"
          grep -Fqx 'rwsem_size_current=48' "$final_gate"
          grep -Fqx 'rwsem_size_stock=48' "$final_gate"
          grep -Fqx 'inode_i_private_current=640' "$final_gate"
          grep -Fqx 'inode_i_private_stock=640' "$final_gate"
          grep -Fqx 'panel_size_current=104' "$final_gate"
          grep -Fqx 'panel_size_stock=104' "$final_gate"
          grep -Fqx 'FINAL_RUNTIME_LAYOUT_GATE=PASS' "$final_gate"
          grep -Fq "$KERNEL_IMAGE_SHA256" "$layout_image_sha"

          cp "$image" rebuilt-Image
          cp "$report" os2-0-10-composite-report.txt
          cp "$full_abi" composite-full-abi.txt
          cp "$module_gate" qgki-module-oracle-current.txt
          cp "$final_gate" final-runtime-layout-gate.txt
          cp "$layout_image_sha" layout-exact-composite-Image.sha256
          sha256sum rebuilt-Image | tee rebuilt-Image.sha256
          echo 'CANDIDATE_0006_KERNEL_EVIDENCE_GATE=PASS'

      - name: Compare exact stock and rebuilt ARM64 Image headers
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee exact-baseline-early-boot-diff.txt
          from pathlib import Path
          import hashlib, struct

          TARGET = b"5.4.289-qgki-g4c23b1a30923"

          def parse(path):
              b = Path(path).read_bytes()
              if len(b) < 64:
                  raise SystemExit(f"{path}: too small")
              magic = struct.unpack_from("<I", b, 0x38)[0]
              if magic != 0x644D5241:
                  raise SystemExit(f"{path}: bad ARM64 magic 0x{magic:08x}")
              return b, {
                  "file_bytes": len(b),
                  "sha256": hashlib.sha256(b).hexdigest(),
                  "code0": struct.unpack_from("<I", b, 0)[0],
                  "code1": struct.unpack_from("<I", b, 4)[0],
                  "text_offset": struct.unpack_from("<Q", b, 8)[0],
                  "image_size": struct.unpack_from("<Q", b, 16)[0],
                  "flags": struct.unpack_from("<Q", b, 24)[0],
                  "res2": struct.unpack_from("<Q", b, 32)[0],
                  "res3": struct.unpack_from("<Q", b, 40)[0],
                  "res4": struct.unpack_from("<Q", b, 48)[0],
                  "magic": magic,
                  "res5": struct.unpack_from("<I", b, 60)[0],
              }

          stock_b, stock = parse("stock-Image")
          rebuilt_b, rebuilt = parse("rebuilt-Image")
          hard_fields = ("text_offset", "flags", "res2", "res3", "res4", "magic", "res5")
          failed = []

          for label, h in (("stock", stock), ("rebuilt", rebuilt)):
              print(f"[{label}]")
              for k, v in h.items():
                  print(f"{k}={hex(v) if isinstance(v, int) else v}")

          print("[compare]")
          for key in hard_fields:
              same = stock[key] == rebuilt[key]
              print(f"{key}_equal={int(same)}")
              if not same:
                  failed.append(key)
          print(f"code0_equal={int(stock['code0'] == rebuilt['code0'])}")
          print(f"code1_equal={int(stock['code1'] == rebuilt['code1'])}")
          print(f"image_size_delta={rebuilt['image_size'] - stock['image_size']}")
          print(f"file_size_delta={rebuilt['file_bytes'] - stock['file_bytes']}")
          print(f"target_release_present={int(TARGET in rebuilt_b)}")

          if stock["text_offset"] != 0x80000:
              failed.append("unexpected-stock-text_offset")
          if stock["flags"] != 0xA:
              failed.append("unexpected-stock-flags")
          if TARGET not in rebuilt_b:
              failed.append("target-release-missing")
          if failed:
              raise SystemExit("critical ARM64 early-boot header mismatch: " + ", ".join(failed))
          print("EXACT_BASELINE_ARM64_HEADER_GATE=PASS")
          PY

      - name: Repack Candidate 0006 exact OS2.0.10 boot.img
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          stock = Path("stock-boot.img").read_bytes()
          kernel = Path("rebuilt-Image").read_bytes()
          target = b"5.4.289-qgki-g4c23b1a30923"
          page = 4096

          def align(v, a):
              return (v + a - 1) // a * a
          def sha(b):
              return hashlib.sha256(b).hexdigest()

          if stock[:8] != b"ANDROID!":
              raise SystemExit("stock baseline is not Android boot image")
          if len(stock) != 201326592:
              raise SystemExit("unexpected stock partition size")
          if struct.unpack_from("<I", stock, 40)[0] != 3:
              raise SystemExit("expected boot header v3")
          if struct.unpack_from("<I", kernel, 0x38)[0] != 0x644D5241:
              raise SystemExit("rebuilt Image lacks ARM64 magic")
          if target not in kernel:
              raise SystemExit("rebuilt Image lacks target release")

          stock_kernel_size = struct.unpack_from("<I", stock, 8)[0]
          ramdisk_size = struct.unpack_from("<I", stock, 12)[0]
          stock_ramdisk_off = align(page + stock_kernel_size, page)
          stock_ramdisk_end = stock_ramdisk_off + ramdisk_size
          if stock_ramdisk_end > len(stock):
              raise SystemExit("stock ramdisk is truncated")
          ramdisk = stock[stock_ramdisk_off:stock_ramdisk_end]

          header_page = bytearray(stock[:page])
          struct.pack_into("<I", header_page, 8, len(kernel))
          out = bytearray(header_page)
          out.extend(kernel)
          out.extend(b"\0" * (align(len(out), page) - len(out)))
          new_ramdisk_off = len(out)
          out.extend(ramdisk)
          out.extend(b"\0" * (align(len(out), page) - len(out)))
          new_logical_end = len(out)
          if new_logical_end > len(stock):
              raise SystemExit("rebuilt logical boot payload exceeds stock partition size")
          out.extend(b"\0" * (len(stock) - len(out)))
          out = bytes(out)
          Path("boot.img").write_bytes(out)

          check_kernel_size = struct.unpack_from("<I", out, 8)[0]
          check_ramdisk_size = struct.unpack_from("<I", out, 12)[0]
          check_ramdisk_off = align(page + check_kernel_size, page)
          check_kernel = out[page:page + check_kernel_size]
          check_ramdisk = out[check_ramdisk_off:check_ramdisk_off + check_ramdisk_size]

          checks = {
              "android_magic": out[:8] == b"ANDROID!",
              "header_version_preserved": struct.unpack_from("<I", out, 40)[0] == 3,
              "header_metadata_except_kernel_size_preserved": out[12:page] == stock[12:page],
              "kernel_size_header_exact": check_kernel_size == len(kernel),
              "kernel_payload_hash_exact": sha(check_kernel) == sha(kernel),
              "ramdisk_size_preserved": check_ramdisk_size == ramdisk_size,
              "ramdisk_payload_hash_preserved": sha(check_ramdisk) == sha(ramdisk),
              "partition_size_preserved": len(out) == len(stock),
              "arm64_image_magic": struct.unpack_from("<I", check_kernel, 0x38)[0] == 0x644D5241,
              "target_release_present": target in check_kernel,
              "tail_zeroed": not any(out[new_logical_end:]),
              "stale_avb_footer_absent": not (len(out) >= 64 and out[-64:-60] == b"AVBf"),
          }
          failed = [k for k, v in checks.items() if not v]
          lines = [
              "# Lisa Candidate 0006 exact OS2.0.10 baseline repack",
              f"stock_boot_sha256={sha(stock)}",
              f"stock_kernel_size={stock_kernel_size}",
              f"stock_ramdisk_size={ramdisk_size}",
              f"new_kernel_sha256={sha(kernel)}",
              f"new_kernel_size={len(kernel)}",
              f"new_ramdisk_offset={new_ramdisk_off}",
              f"new_logical_end={new_logical_end}",
              f"new_boot_bytes={len(out)}",
              f"new_boot_sha256={sha(out)}",
          ]
          lines += [f"check_{k}={int(v)}" for k, v in checks.items()]
          Path("boot-static-validation.txt").write_text("\n".join(lines) + "\n")
          print(Path("boot-static-validation.txt").read_text(), end="")
          if failed:
              raise SystemExit("boot static validation failed: " + ", ".join(failed))
          PY
          sha256sum boot.img | tee boot.img.sha256
          file boot.img

      - name: Final Candidate 0006 static gate
        run: |
          set -euo pipefail
          grep -Fqx 'EXACT_BASELINE_ARM64_HEADER_GATE=PASS' exact-baseline-early-boot-diff.txt
          grep -Fqx "stock_boot_sha256=$BASELINE_BOOT_SHA256" boot-static-validation.txt
          grep -Fqx "new_kernel_sha256=$KERNEL_IMAGE_SHA256" boot-static-validation.txt
          grep -Fqx 'check_android_magic=1' boot-static-validation.txt
          grep -Fqx 'check_header_version_preserved=1' boot-static-validation.txt
          grep -Fqx 'check_header_metadata_except_kernel_size_preserved=1' boot-static-validation.txt
          grep -Fqx 'check_kernel_size_header_exact=1' boot-static-validation.txt
          grep -Fqx 'check_kernel_payload_hash_exact=1' boot-static-validation.txt
          grep -Fqx 'check_ramdisk_size_preserved=1' boot-static-validation.txt
          grep -Fqx 'check_ramdisk_payload_hash_preserved=1' boot-static-validation.txt
          grep -Fqx 'check_partition_size_preserved=1' boot-static-validation.txt
          grep -Fqx 'check_arm64_image_magic=1' boot-static-validation.txt
          grep -Fqx 'check_target_release_present=1' boot-static-validation.txt
          grep -Fqx 'check_tail_zeroed=1' boot-static-validation.txt
          grep -Fqx 'check_stale_avb_footer_absent=1' boot-static-validation.txt
          test "$(stat -c '%s' boot.img)" = "$STOCK_BOOT_BYTES"
          test "$(sha256sum rebuilt-Image | awk '{print $1}')" = "$KERNEL_IMAGE_SHA256"

          boot_sha="$(sha256sum boot.img | awk '{print $1}')"
          {
            echo '# Lisa Candidate 0006'
            echo "reconstruction_sha=$RECONSTRUCTION_SHA"
            echo "baseline_artifact_id=$BASELINE_ARTIFACT_ID"
            echo "kernel_artifact_id=$KERNEL_ARTIFACT_ID"
            echo "layout_artifact_id=$LAYOUT_ARTIFACT_ID"
            echo "kernel_image_sha256=$KERNEL_IMAGE_SHA256"
            echo "boot_img_sha256=$boot_sha"
            echo "target_release=$TARGET_RELEASE"
            echo 'module_oracle=736/736'
            echo 'crc_mismatches=0'
            echo 'runtime_layout=PASS'
            echo 'static_boot_gate=PASS'
            echo 'LISA_CANDIDATE_0006_STATIC_GATE=PASS'
          } | tee candidate-0006-report.txt

      - name: Upload Candidate 0006 boot.img and exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0006-exact-os2-0-10
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
          path: |
            boot.img
            boot.img.sha256
            candidate-0006-report.txt
            boot-static-validation.txt
            exact-baseline-early-boot-diff.txt
            exact-baseline.sha256
            baseline-report.txt
            official-boot-layout.txt
            stock-Image
            rebuilt-Image
            rebuilt-Image.sha256
            os2-0-10-composite-report.txt
            composite-full-abi.txt
            qgki-module-oracle-current.txt
            final-runtime-layout-gate.txt
            layout-exact-composite-Image.sha256
            artifact-files.txt
