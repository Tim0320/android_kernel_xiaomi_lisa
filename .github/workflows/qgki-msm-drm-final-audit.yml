name: Final audit stock QGKI msm_drm ABI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-msm-drm-final-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install audit tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3 unzip curl

      - name: Download successful build and exact vendor_boot ABI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ARTIFACT_ID: "10653097819"
          VENDOR_BOOT_ARTIFACT_ID: "10648361196"
        run: |
          set -euo pipefail
          mkdir -p build-evidence vendor-evidence

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BUILD_ARTIFACT_ID}/zip" \
            -o build-evidence.zip
          unzip -q build-evidence.zip -d build-evidence

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VENDOR_BOOT_ARTIFACT_ID}/zip" \
            -o vendor-evidence.zip
          unzip -q vendor-evidence.zip -d vendor-evidence

          symvers="$(find build-evidence -type f -name Module.symvers -print -quit)"
          imports="$(find vendor-evidence -type f -name stock-vendor-boot-module-imports.tsv -print -quit)"
          summary="$(find vendor-evidence -type f -name stock-vendor-boot-module-summary.tsv -print -quit)"

          test -n "$symvers"
          test -n "$imports"
          test -n "$summary"

          cp "$symvers" final.Module.symvers
          cp "$imports" final.stock-vendor-boot-module-imports.tsv
          cp "$summary" final.stock-vendor-boot-module-summary.tsv

          test -s final.Module.symvers
          test -s final.stock-vendor-boot-module-imports.tsv
          test -s final.stock-vendor-boot-module-summary.tsv

          echo "FINAL_BUILD_SYMVERS_LINES=$(wc -l < final.Module.symvers)"
          echo "FINAL_VENDOR_IMPORT_ROWS=$(wc -l < final.stock-vendor-boot-module-imports.tsv)"

      - name: Verify stock msm_drm cohort metadata from exact vendor_boot audit
        run: |
          set -euo pipefail

          python3 - final.stock-vendor-boot-module-summary.tsv stock-msm-drm-metadata.txt <<'PY'
          import sys
          from pathlib import Path

          rows = []
          for raw in Path(sys.argv[1]).read_text(errors="replace").splitlines():
              if not raw.strip():
                  continue
              parts = raw.split("\t")
              if len(parts) < 6:
                  continue
              path, machine, vermagic, layout, count, status = parts[:6]
              if path.endswith("/lib/modules/msm_drm.ko"):
                  rows.append((path, machine, vermagic, layout, int(count), status))

          if len(rows) != 1:
              raise SystemExit(f"expected exactly one msm_drm.ko row, got {len(rows)}")

          path, machine, vermagic, layout, count, status = rows[0]

          expected_vermagic = (
              "5.4.289-qgki-g5987d69e25da "
              "SMP preempt mod_unload modversions aarch64"
          )
          expected_layout = "0xba39cbb8"

          print(f"STOCK_MSM_DRM_PATH={path}")
          print(f"STOCK_MSM_DRM_MACHINE={machine}")
          print(f"STOCK_MSM_DRM_VERMAGIC={vermagic}")
          print(f"STOCK_MSM_DRM_MODULE_LAYOUT={layout}")
          print(f"STOCK_MSM_DRM_VERSION_ENTRIES={count}")
          print(f"STOCK_MSM_DRM_PARSE_STATUS={status}")

          if vermagic.strip() != expected_vermagic:
              raise SystemExit(f"unexpected vermagic: {vermagic!r}")
          if layout.lower() != expected_layout:
              raise SystemExit(f"unexpected module_layout: {layout}")
          if count != 736:
              raise SystemExit(f"expected 736 version entries, got {count}")
          if status != "OK":
              raise SystemExit(f"unexpected module parse status: {status}")

          Path(sys.argv[2]).write_text(
              f"path={path}\n"
              f"vermagic={vermagic}\n"
              f"module_layout={layout}\n"
              f"version_entries={count}\n"
              f"status={status}\n"
          )
          PY

          cat stock-msm-drm-metadata.txt

      - name: Verify exact six boot-critical CRCs
        run: |
          set -euo pipefail

          python3 - final.Module.symvers qgki-six-final.txt <<'PY'
          import sys
          from pathlib import Path

          expected = {
              "proc_create_data": 0xa187c33a,
              "proc_mkdir": 0xd8fd7935,
              "proc_remove": 0x0420ade2,
              "remove_proc_entry": 0x05ba4e75,
              "sched_setscheduler": 0xe09be37d,
              "wake_up_process": 0xfa54581b,
          }

          current = {}
          for raw in Path(sys.argv[1]).read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3:
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
              except ValueError:
                  pass

          score = 0
          lines = []
          for symbol, stock in expected.items():
              got = current.get(symbol)
              match = got == stock
              score += int(match)
              line = (
                  f"{symbol}\tstock=0x{stock:08x}\t"
                  f"current="
                  + (f"0x{got:08x}" if got is not None else "MISSING")
                  + f"\tmatch={int(match)}"
              )
              print("FINAL_QGKI_SIX\t" + line)
              lines.append(line)

          print(f"FINAL_QGKI_SIX_SCORE={score}/6")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n")

          if score != 6:
              raise SystemExit(f"six-symbol score is {score}/6")
          PY

      - name: Audit all 736 stock msm_drm imports
        run: |
          set -euo pipefail

          python3 - final.stock-vendor-boot-module-imports.tsv final.Module.symvers qgki-msm-drm-final-audit.txt <<'PY'
          import sys
          from pathlib import Path

          imports_path = Path(sys.argv[1])
          symvers_path = Path(sys.argv[2])
          report_path = Path(sys.argv[3])

          required = {}
          module_rows = 0

          for raw in imports_path.read_text(errors="replace").splitlines():
              if not raw.strip():
                  continue
              parts = raw.split("\t")
              if len(parts) < 5:
                  continue

              module, vermagic, layout, symbol, crc_text = parts[:5]
              if not module.endswith("/lib/modules/msm_drm.ko"):
                  continue

              module_rows += 1
              crc = int(crc_text, 16)

              previous = required.get(symbol)
              if previous is not None and previous != crc:
                  raise SystemExit(
                      f"conflicting msm_drm CRC for {symbol}: "
                      f"0x{previous:08x} vs 0x{crc:08x}"
                  )
              required[symbol] = crc

          current = {}
          for raw in symvers_path.read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) < 3:
                  continue
              try:
                  current[p[1]] = int(p[0], 16)
              except ValueError:
                  pass

          matches = []
          mismatches = []
          missing = []

          for symbol, stock_crc in sorted(required.items()):
              got = current.get(symbol)
              if got is None:
                  missing.append((symbol, stock_crc))
              elif got == stock_crc:
                  matches.append((symbol, stock_crc))
              else:
                  mismatches.append((symbol, stock_crc, got))

          print(f"FINAL_MSM_DRM_VERSION_ROWS={module_rows}")
          print(f"FINAL_MSM_DRM_IMPORTS={len(required)}")
          print(f"FINAL_MSM_DRM_MATCHES={len(matches)}")
          print(f"FINAL_MSM_DRM_MISMATCHES={len(mismatches)}")
          print(f"FINAL_MSM_DRM_MISSING={len(missing)}")
          if required:
              print(
                  f"FINAL_MSM_DRM_MATCH_RATE="
                  f"{len(matches)/len(required):.6f}"
              )

          lines = [
              "# Final stock QGKI msm_drm ABI audit",
              f"version_rows={module_rows}",
              f"imports={len(required)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"missing={len(missing)}",
              "",
              "## MISMATCH",
          ]

          for symbol, stock_crc, current_crc in mismatches:
              line = (
                  f"{symbol}\tstock=0x{stock_crc:08x}\t"
                  f"current=0x{current_crc:08x}"
              )
              print("FINAL_MSM_DRM_MISMATCH\t" + line)
              lines.append(line)

          lines += ["", "## MISSING"]
          for symbol, stock_crc in missing:
              line = f"{symbol}\tstock=0x{stock_crc:08x}"
              print("FINAL_MSM_DRM_MISSING_SYMBOL\t" + line)
              lines.append(line)

          report_path.write_text("\n".join(lines) + "\n")

          if module_rows != 736:
              raise SystemExit(
                  f"expected 736 msm_drm version rows, got {module_rows}"
              )
          if len(required) != 736:
              raise SystemExit(
                  f"expected 736 unique imports, got {len(required)}"
              )
          if mismatches or missing:
              raise SystemExit(
                  f"ABI audit failed: {len(mismatches)} mismatches, "
                  f"{len(missing)} missing"
              )
          PY

          cat qgki-msm-drm-final-audit.txt

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-msm-drm-final-audit
          retention-days: 14
          if-no-files-found: warn
          path: |
            stock-msm-drm-metadata.txt
            qgki-six-final.txt
            qgki-msm-drm-final-audit.txt
            final.stock-vendor-boot-module-summary.tsv
