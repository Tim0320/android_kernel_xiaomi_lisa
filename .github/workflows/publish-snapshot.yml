name: Publish lisa 5.4.289 QGKI snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-snapshot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout reconstruction metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git rsync bc bison flex libssl-dev libelf-dev

      - name: Reconstruct source tree
        run: |
          chmod +x scripts/bootstrap_reconstruction.sh scripts/check_reconstruction.sh
          scripts/bootstrap_reconstruction.sh

      - name: Publish squashed snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC="${RUNNER_TEMP}/lisa-reconstruction/kernel"
          cd "$SRC"
          git checkout --orphan publish-snapshot
          git reset
          git add -A
          git commit -m "lisa: publish reconstructed HyperOS 5.4.289 QGKI snapshot"
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/reconstruction/5.4.289-qgki-snapshot --force
