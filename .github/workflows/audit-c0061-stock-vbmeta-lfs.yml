name: Audit C0061 stock VBMeta LFS payloads (NOT FLASHABLE)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-c0061-stock-vbmeta-lfs.yml'
      - 'reconstruction/scripts/c0061_stock_vbmeta_lfs_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-vbmeta-readonly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Verify LFS materialization and inspect metadata
        run: |
          set -euo pipefail
          mkdir -p avb-report
          python3 reconstruction/scripts/c0061_stock_vbmeta_lfs_audit.py \
            reconstruction/stock/stock-Image-3.09/vbmeta.img \
            reconstruction/stock/stock-Image-3.09/vbmeta_system.img \
            > avb-report/stock-vbmeta-readonly.json
          grep -q '"signature_verified": false' avb-report/stock-vbmeta-readonly.json
          grep -q '"flash_authorized": false' avb-report/stock-vbmeta-readonly.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: c0061-stock-vbmeta-readonly-${{ github.run_id }}
          path: avb-report/stock-vbmeta-readonly.json
          if-no-files-found: warn
