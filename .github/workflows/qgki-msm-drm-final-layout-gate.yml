name: Final exact OS2.0.10 runtime layout gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-msm-drm-final-layout-gate.yml

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RECONSTRUCTION_SHA: ab491ef6ecd4d35f9edcaa8ad00b568306c6ce64
      STOCK_ORACLE_ARTIFACT_ID: "10713959003"
      COMPOSITE_ARTIFACT_ID: "10762792655"
      KERNEL_IMAGE_SHA256: 4aa9995ae5ecbd2e3beb3018cd19a11a80e8970eb96c540874be547d2ecd90c6
      TARGET_RELEASE: 5.4.289-qgki-g4c23b1a30923

    steps:
      - name: Checkout exact reconstructed kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECONSTRUCTION_SHA }}
          fetch-depth: 1

      - name: Authenticate reconstruction revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RECONSTRUCTION_SHA"
          grep -q 'ANDROID_VENDOR_DATA(1)' include/linux/rwsem.h
          echo "EXACT_RECONSTRUCTION_SHA=$RECONSTRUCTION_SHA"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 curl unzip xz-utils

      - name: Cache clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
              -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download exact OS2.0.10 stock oracle and exact composite Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p stock-oracle composite-evidence stock-kheaders

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STOCK_ORACLE_ARTIFACT_ID}/zip" \
            -o stock-oracle.zip
          unzip -q stock-oracle.zip -d stock-oracle

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPOSITE_ARTIFACT_ID}/zip" \
            -o composite-evidence.zip
          unzip -q composite-evidence.zip -d composite-evidence

          test -s stock-oracle/stock-kheaders.tar.xz
          tar -xJf stock-oracle/stock-kheaders.tar.xz -C stock-kheaders
          test -s stock-kheaders/include/linux/kconfig.h

          image="$(find composite-evidence -type f -path '*/out/arch/arm64/boot/Image' -print -quit)"
          report="$(find composite-evidence -type f -name os2-0-10-composite-report.txt -print -quit)"
          module_gate="$(find composite-evidence -type f -name qgki-module-oracle-current.txt -print -quit)"
          config="$(find composite-evidence -type f -name os2-0-10-effective.config -print -quit)"
          full_abi="$(find composite-evidence -type f -name composite-full-abi.txt -print -quit)"
          genksyms_failures="$(find composite-evidence -type f -name composite-genksyms-failures.txt -print -quit)"

          test -n "$image" && test -s "$image"
          test -n "$report" && test -s "$report"
          test -n "$module_gate" && test -s "$module_gate"
          test -n "$config" && test -s "$config"
          test -n "$full_abi" && test -s "$full_abi"
          test -n "$genksyms_failures"

          test "$(sha256sum "$image" | awk '{print $1}')" = "$KERNEL_IMAGE_SHA256"
          grep -Fqx "target_release=$TARGET_RELEASE" "$report"
          grep -Fqx "image_sha256=$KERNEL_IMAGE_SHA256" "$report"
          grep -Fqx 'crc_mismatches=0' "$report"
          grep -Fqx 'module_oracle_matches=736' "$report"
          grep -Fqx 'module_oracle_mismatches=0' "$report"
          grep -Fqx 'module_oracle_missing=0' "$report"
          grep -Fqx 'OS2_0_10_COMPOSITE_BUILD=PASS' "$report"
          grep -Fqx 'matches=736' "$module_gate"
          grep -Fqx 'mismatches=0' "$module_gate"
          grep -Fqx 'missing=0' "$module_gate"
          test ! -s "$genksyms_failures"

          cp "$image" exact-composite-Image
          cp "$report" os2-0-10-composite-report.txt
          cp "$module_gate" qgki-module-oracle-current.txt
          cp "$config" exact-composite.config
          cp "$full_abi" composite-full-abi.txt
          sha256sum exact-composite-Image | tee exact-composite-Image.sha256
          echo "EXACT_COMPOSITE_EVIDENCE=PASS"

      - name: Prepare headers from the exact composite config
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cp exact-composite.config out/.config
          cp exact-composite.config exact-composite.config.before-prepare

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig prepare scripts

          cmp -s exact-composite.config.before-prepare out/.config || {
            echo 'Exact composite config drifted when prepared against reconstruction SHA'
            diff -u exact-composite.config.before-prepare out/.config | head -200 || true
            exit 1
          }

          grep -Fqx '# CONFIG_ARM64_USE_LSE_ATOMICS is not set' out/.config
          grep -Fqx '# CONFIG_COMPAT_VDSO is not set' out/.config
          grep -Fqx '# CONFIG_RELR is not set' out/.config
          grep -Fqx 'CONFIG_QCOM_WATCHDOG_BARK_TIME=20000' out/.config
          grep -Fqx 'CONFIG_QCOM_WATCHDOG_PET_TIME=15000' out/.config
          echo "EXACT_COMPOSITE_CONFIG_PREPARE=PASS"

      - name: Compile exact current and stock field-offset probes
        env:
          CLANG_ROOT: ${{ runner.temp }}/clang-r383902b1
          STOCK_ROOT: ${{ github.workspace }}/stock-kheaders
        run: |
          set -euo pipefail

          cat > field_probe.c <<'EOF'
          #include <linux/sched.h>
          #include <linux/fs.h>
          #include <linux/notifier.h>
          #include <linux/rwsem.h>
          #include <drm/drm_panel.h>

          #define PROBE(name, expr) \
            unsigned long probe_##name(void) { return (unsigned long)(expr); }

          PROBE(task_size, sizeof(struct task_struct))
          PROBE(task_pid, __builtin_offsetof(struct task_struct, pid))
          PROBE(task_tgid, __builtin_offsetof(struct task_struct, tgid))
          PROBE(task_group_leader, __builtin_offsetof(struct task_struct, group_leader))
          PROBE(task_comm, __builtin_offsetof(struct task_struct, comm))

          PROBE(inode_size, sizeof(struct inode))
          PROBE(inode_i_mapping, __builtin_offsetof(struct inode, i_mapping))
          PROBE(inode_i_private, __builtin_offsetof(struct inode, i_private))

          PROBE(panel_size, sizeof(struct drm_panel))
          PROBE(panel_drm, __builtin_offsetof(struct drm_panel, drm))
          PROBE(panel_connector, __builtin_offsetof(struct drm_panel, connector))
          PROBE(panel_dev, __builtin_offsetof(struct drm_panel, dev))
          PROBE(panel_funcs, __builtin_offsetof(struct drm_panel, funcs))
          PROBE(panel_list, __builtin_offsetof(struct drm_panel, list))
          PROBE(panel_nh, __builtin_offsetof(struct drm_panel, nh))

          PROBE(blocking_notifier_size, sizeof(struct blocking_notifier_head))
          PROBE(blocking_notifier_rwsem,
                __builtin_offsetof(struct blocking_notifier_head, rwsem))
          PROBE(blocking_notifier_head,
                __builtin_offsetof(struct blocking_notifier_head, head))

          PROBE(rwsem_size, sizeof(struct rw_semaphore))
          EOF

          cat > build_probe.py <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          clang = Path(os.environ['CLANG_ROOT']) / 'bin/clang'
          stock = Path(os.environ['STOCK_ROOT'])
          root = Path.cwd()
          resource = subprocess.check_output(
              [str(clang), '-print-resource-dir'], text=True
          ).strip()

          current_inc = [
              root / 'arch/arm64/include',
              root / 'out/arch/arm64/include/generated',
              root / 'include',
              root / 'out/include',
              root / 'arch/arm64/include/uapi',
              root / 'out/arch/arm64/include/generated/uapi',
              root / 'include/uapi',
              root / 'out/include/generated/uapi',
          ]
          stock_inc = [
              stock / 'arch/arm64/include',
              stock / 'arch/arm64/include/generated',
              stock / 'include',
              stock / 'include/generated',
              stock / 'arch/arm64/include/uapi',
              stock / 'arch/arm64/include/generated/uapi',
              stock / 'include/uapi',
              stock / 'include/generated/uapi',
          ]

          def compile_probe(side, incs, kconfig):
              cmd = [
                  str(clang), '-target', 'aarch64-linux-gnu', '-nostdinc',
                  '-isystem', str(Path(resource) / 'include'),
                  '-D__KERNEL__', '-DKBUILD_MODNAME="field_probe"',
                  '-DKBUILD_BASENAME="field_probe"', '-include', str(kconfig),
                  '-O2', '-S', '-emit-llvm', 'field_probe.c', '-o', f'{side}-field-probe.ll',
              ]
              for inc in incs:
                  cmd.extend(['-I', str(inc)])
              subprocess.run(cmd, check=True)

          compile_probe('current', current_inc, root / 'include/linux/kconfig.h')
          compile_probe('stock', stock_inc, stock / 'include/linux/kconfig.h')

          rx = re.compile(
              r'define[^@]*@probe_([A-Za-z0-9_]+)\([^)]*\)[^{]*\{.*?ret i64 ([0-9]+)',
              re.S,
          )
          def parse(path):
              return {name: int(value) for name, value in rx.findall(Path(path).read_text())}

          current = parse('current-field-probe.ll')
          stockv = parse('stock-field-probe.ll')
          names = sorted(set(current) | set(stockv))
          lines = ['field\tcurrent\tstock\tmatch']
          for name in names:
              a = current.get(name)
              b = stockv.get(name)
              match = a == b
              print(f'FIELD_LAYOUT\t{name}\tcurrent={a}\tstock={b}\tmatch={int(match)}')
              lines.append(f'{name}\t{a}\t{b}\t{int(match)}')
          Path('field-layouts.tsv').write_text('\n'.join(lines) + '\n')

          required_equal = [
              'task_pid', 'task_tgid', 'task_group_leader', 'task_comm',
              'inode_i_mapping', 'inode_i_private',
              'panel_size', 'panel_drm', 'panel_connector', 'panel_dev',
              'panel_funcs', 'panel_list', 'panel_nh',
              'blocking_notifier_size', 'blocking_notifier_rwsem', 'blocking_notifier_head',
              'rwsem_size',
          ]
          bad = [name for name in required_equal if current.get(name) != stockv.get(name)]
          print(f'FIELD_LAYOUT_REQUIRED_EQUAL={len(required_equal)-len(bad)}/{len(required_equal)}')
          if bad:
              raise SystemExit('runtime layout mismatch: ' + ','.join(bad))
          PY

          python3 build_probe.py | tee field-layouts.log
          cat field-layouts.tsv

      - name: Audit display sources for ungated direct struct access
        run: |
          set -euo pipefail
          {
            echo '=== current-> member uses ==='
            git grep -n -E 'current->[A-Za-z0-9_]+' -- techpack/display/msm || true
            echo
            echo '=== direct inode i_* uses ==='
            git grep -n -E '(inode->[[:space:]]*i_|file_inode\([^)]*\)->i_)' -- techpack/display/msm || true
            echo
            echo '=== drm_panel notifier internals ==='
            git grep -n -E '(\.nh|->nh)[[:space:]]*\.(rwsem|head)' -- techpack/display/msm || true
          } | tee source-risk-audit.txt

          unexpected_inode="$(
            git grep -n -E '(inode->[[:space:]]*i_|file_inode\([^)]*\)->i_)' \
              -- techpack/display/msm 2>/dev/null \
              | grep -v -E -- '->i_(mapping|private)' || true
          )"
          test -z "$unexpected_inode" || {
            echo "$unexpected_inode"
            exit 1
          }

          direct_nh="$(
            git grep -n -E '(\.nh|->nh)[[:space:]]*\.(rwsem|head)' \
              -- techpack/display/msm 2>/dev/null || true
          )"
          test -z "$direct_nh" || {
            echo "$direct_nh"
            exit 1
          }
          echo 'SOURCE_RISK_AUDIT=PASS'

      - name: Record exact runtime layout gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rows = {}
          for line in Path('field-layouts.tsv').read_text().splitlines()[1:]:
              if not line.strip():
                  continue
              name, current, stock, match = line.split('\t')
              rows[name] = (int(current), int(stock), int(match))

          required = [
              'task_pid', 'task_tgid', 'task_group_leader', 'task_comm',
              'inode_i_mapping', 'inode_i_private',
              'panel_size', 'panel_drm', 'panel_connector', 'panel_dev',
              'panel_funcs', 'panel_list', 'panel_nh',
              'blocking_notifier_size', 'blocking_notifier_rwsem', 'blocking_notifier_head',
              'rwsem_size',
          ]
          passed = all(rows.get(name, (0, 0, 0))[2] == 1 for name in required)
          lines = [
              '# Exact OS2.0.10 runtime-layout gate',
              'reconstruction_sha=ab491ef6ecd4d35f9edcaa8ad00b568306c6ce64',
              'stock_oracle_artifact_id=10713959003',
              'composite_artifact_id=10762792655',
              'image_sha256=4aa9995ae5ecbd2e3beb3018cd19a11a80e8970eb96c540874be547d2ecd90c6',
              f'required_runtime_fields={len(required)}',
              f'required_runtime_field_offsets_equal={int(passed)}',
              f'rwsem_size_current={rows["rwsem_size"][0]}',
              f'rwsem_size_stock={rows["rwsem_size"][1]}',
              f'inode_i_private_current={rows["inode_i_private"][0]}',
              f'inode_i_private_stock={rows["inode_i_private"][1]}',
              f'panel_size_current={rows["panel_size"][0]}',
              f'panel_size_stock={rows["panel_size"][1]}',
              f'FINAL_RUNTIME_LAYOUT_GATE={"PASS" if passed else "FAIL"}',
          ]
          Path('final-runtime-layout-gate.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          if not passed:
              raise SystemExit('final exact runtime layout gate failed')
          PY

      - name: Upload exact runtime-layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-os2-0-10-exact-runtime-layout-gate
          retention-days: 14
          if-no-files-found: error
          path: |
            clang-version.txt
            exact-composite-Image.sha256
            os2-0-10-composite-report.txt
            qgki-module-oracle-current.txt
            exact-composite.config
            composite-full-abi.txt
            field-layouts.tsv
            field-layouts.log
            current-field-probe.ll
            stock-field-probe.ll
            source-risk-audit.txt
            final-runtime-layout-gate.txt
