name: Build Lisa Candidate0059 Android16 performance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-lisa-candidate-0059-ownership-identity.yml
      - reconstruction/scripts/candidate_0059_factory.py
      - reconstruction/scripts/candidate_0059_bpf_port.py
      - reconstruction/scripts/candidate_0059_perf_port.py
      - reconstruction/scripts/candidate_0059_preflight.py
      - reconstruction/scripts/candidate_0059_state_layer.py
      - reconstruction/scripts/candidate_0059_stage2_hooks.py
      - reconstruction/scripts/candidate_0059_stage3_accounting.py
      - reconstruction/scripts/candidate_0059_stage4_migt_sched.py
      - reconstruction/scripts/candidate_0059_stage5_game_load.py
      - reconstruction/scripts/candidate_0059_stage6_render.py
      - reconstruction/scripts/candidate_0059_stage7_migt_control.py
      - reconstruction/scripts/candidate_0059_stage9_freq_qos.py
      - reconstruction/scripts/test_candidate_0059_bpf_port.py
      - reconstruction/scripts/candidate_0059_qemu_probe.py
      - reconstruction/scripts/candidate_0059_ringbuf_probe.c
      - reconstruction/c0059_debug_provenance_android16.json
      - reconstruction/c0059_stock_runtime_props.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-candidate-0059-build
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Candidate0059 package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: false
          persist-credentials: false

      - name: Generate versioned Candidate0059 recipes
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_factory.py
          python3 reconstruction/scripts/test_candidate_0059_identity.py
          python3 reconstruction/scripts/test_candidate_0059_artifacts.py
          python3 reconstruction/scripts/test_candidate_0059_flash_contract.py
          python3 reconstruction/scripts/test_candidate_0059_bpf_port.py

      - name: Checkout exact pinned Lisa source
        uses: actions/checkout@v4
        with:
          repository: Tim0320/android_kernel_xiaomi_lisa
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel-preflight
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Apply Candidate0059 performance stages for gate
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_state_layer.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage2_hooks.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage3_accounting.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage4_migt_sched.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage5_game_load.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage6_render.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage7_migt_control.py apply --source kernel-preflight
          python3 reconstruction/scripts/candidate_0059_stage9_freq_qos.py apply --source kernel-preflight
          git -C kernel-preflight diff --check

      - name: Install preflight config dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Run Candidate0059 PREBUILD gate again
        run: |
          set -euo pipefail
          mkdir -p kernel-preflight/out
          cp kernel-preflight/reconstruction/stock_ikconfig kernel-preflight/out/.config
          kernel-preflight/scripts/config --file kernel-preflight/out/.config -e MIHW -e PACKAGE_RUNTIME_INFO -e MIGT
          make -C kernel-preflight O="$PWD/kernel-preflight/out" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          python3 reconstruction/scripts/candidate_0059_preflight.py             --phase prebuild             --source-root kernel-preflight             --config kernel-preflight/out/.config             --stock-props reconstruction/c0059_stock_runtime_props.txt             --debug-evidence reconstruction/c0059_debug_provenance_android16.json             --iorap-strategy defer-outside-c0059 | tee candidate-0059-preflight-result.txt
          grep -q '^CANDIDATE0059_PREBUILD=PASS$' candidate-0059-preflight-result.txt
          grep -q '^PERFORMANCE_BUILD_ALLOWED=true$' candidate-0059-preflight-result.txt

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact package commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Generate Candidate0059 build recipes
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_factory.py
          python3 reconstruction/scripts/test_candidate_0059_identity.py
          python3 reconstruction/scripts/test_candidate_0059_bpf_port.py
          python3 reconstruction/scripts/candidate_0059_build.py preflight

      - name: Materialize stock LFS inputs
        run: git lfs pull

      - name: Checkout exact reconstructed kernel
        id: kernel_source
        uses: actions/checkout@v4
        with:
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Checkout exact runtime reference
        id: runtime_reference
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8350
          ref: 46af56554ec50e3ff3752858bf38eaeeb852ca0d
          path: known-good-302
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-yaml curl unzip git rsync kmod

      - name: Prepare pinned compiler and stock oracles
        id: toolchain
        run: python3 reconstruction/scripts/candidate_0059_build.py prepare

      - name: Build and package Candidate0059
        id: compile
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_build.py build 2>&1 | tee candidate-0059-build.log

      - name: Mark available boot as unverified
        id: available
        if: ${{ always() }}
        run: |
          printf '%s\n'             'UNVERIFIED BUILD OUTPUT - DO NOT FLASH AS AN APPROVED RELEASE'             'This backup does not mean validation passed. Static checks are not a phone pass.'             > UNVERIFIED-DO-NOT-FLASH.txt
          if test -s boot.img; then
            echo 'boot_present=true' >> "$GITHUB_OUTPUT"
            sha256sum boot.img > unverified-boot.img.sha256
          fi

      - name: Save unverified boot before verification
        if: ${{ always() && steps.available.outputs.boot_present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-UNVERIFIED-boot-a${{ github.run_attempt }}
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            UNVERIFIED-DO-NOT-FLASH.txt
            boot.img
            boot.img.sha256
            unverified-boot.img.sha256
            candidate-0059-Image
            candidate-0059.config
            candidate-0059.ikconfig
            candidate-0059-manifest.txt
            candidate-0059-identity.json
            candidate-0059-performance-source.json
            candidate-0059-performance-scope.txt
            candidate-0059-bpf-source.json
            candidate-0059-bpf-scope.txt
            candidate-0059-build.log
            kernel/out/System.map
            kernel/out/Module.symvers

      - name: Save complete hashed verification checkpoint
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_artifacts.py save --archive .checkpoint-upload/checkpoint.tar.gz

      - name: Upload reusable Candidate0059 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-reverify-inputs-a${{ github.run_attempt }}
          retention-days: 14
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .checkpoint-upload/checkpoint.tar.gz
            .checkpoint-upload/checkpoint.tar.gz.sha256

      - name: Preserve build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-build-evidence-a${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            candidate-0059-*.log
            candidate-0059-*.json
            candidate-0059-*.txt
            candidate-0059-checks/
            kernel/out/.config
            kernel/out/System.map
            kernel/out/Module.symvers
            lisa-build-checkpoint.json

  verify:
    needs: [preflight, build]
    if: ${{ always() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      LISA_BUILD_COMMIT: ${{ github.sha }}
      LISA_BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout verifier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Generate identical Candidate0059 verifier recipes
        run: python3 reconstruction/scripts/candidate_0059_factory.py

      - name: Download compiled checkpoint only
        uses: actions/download-artifact@v4
        with:
          name: lisa-c0059-reverify-inputs-a${{ github.run_attempt }}
          path: .checkpoint-download

      - name: Install verifier tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-yaml binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-system-arm kmod curl unzip

      - name: Restore checkpoint and verify every saved hash
        run: |
          set -euo pipefail
          (cd .checkpoint-download && sha256sum -c checkpoint.tar.gz.sha256)
          python3 reconstruction/scripts/candidate_0059_artifacts.py restore             --archive .checkpoint-download/checkpoint.tar.gz             --commit "$LISA_BUILD_COMMIT"             --run "$LISA_BUILD_RUN_ID"

      - name: Revalidate inherited and Candidate0059 gates without make
        id: gates
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/test_candidate_0059_identity.py
          python3 reconstruction/scripts/test_candidate_0059_bpf_port.py
          python3 reconstruction/scripts/test_candidate_0059_artifacts.py
          GITHUB_SHA="$LISA_BUILD_COMMIT" python3 reconstruction/scripts/candidate_0059_build.py verify             2>&1 | tee candidate-0059-verify.log
          grep -q 'LISA_CANDIDATE_0059_VERIFICATION=PASS' candidate-0059-verify.log
          grep -q 'LISA_CANDIDATE_0059_BPF_LINKED_GATE=PASS' candidate-0059-verify.log
          grep -q 'LISA_CANDIDATE_0059_PERFORMANCE_LINKED_GATE=PASS' candidate-0059-verify.log

      - name: Execute actual Candidate0059 ARM64 Image BPF probe
        id: bpf_probe
        run: |
          set -euo pipefail
          python3 reconstruction/scripts/candidate_0059_qemu_probe.py
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          state = json.loads(Path('candidate-0059-bpf-qemu.json').read_text()).get('state')
          if state not in ('PASS', 'INCONCLUSIVE_BOOT'):
              raise SystemExit('Unexpected BPF guest state: ' + str(state))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('state=' + state + '\n')
          print('BPF_GUEST_STATE=' + str(state))
          PYCODE

      - name: Record independent verification status
        env:
          BPF_GUEST_STATE: ${{ steps.bpf_probe.outputs.state }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          p=Path('candidate-0059-verification.json')
          result=json.loads(p.read_text())
          h=hashlib.sha256(Path('boot.img').read_bytes()).hexdigest()
          checkpoint=json.loads(Path('lisa-build-checkpoint.json').read_text())
          if h != checkpoint['files']['boot.img']['sha256']:
              raise SystemExit('Verification changed boot bytes')
          result.update(
              bpf_arm64_guest_test=os.environ.get('BPF_GUEST_STATE'),
              phone_device_tested=False,
              android16_performance_runtime_tested=False,
              developer_options_postdevice_tested=False,
              checkpoint_boot_bytes_unchanged=True,
              verification_run_id=os.environ['GITHUB_RUN_ID'],
          )
          p.write_text(json.dumps(result,indent=2)+'\n')
          PYCODE

      - name: Publish static-verified Candidate0059 boot pending phone validation
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0059-static-verified-pending-device-a${{ github.run_attempt }}
          retention-days: 14
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            boot.img
            boot.img.sha256
            candidate-0059-Image
            candidate-0059.config
            candidate-0059.ikconfig
            candidate-0059-manifest.txt
            candidate-0059-identity.json
            candidate-0059-verification.json
            candidate-0059-bpf-verification.json
            candidate-0059-bpf-qemu.json
            candidate-0059-bpf-qemu.log
            candidate-0059-performance-verification.json
            candidate-0059-performance-source.json
            candidate-0059-performance-scope.txt
            candidate-0059-verify.log
            kernel/out/System.map
            kernel/out/Module.symvers

      - name: Preserve verifier evidence on pass or fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0059-verification-evidence-a${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            candidate-0059-*.json
            candidate-0059-*.txt
            candidate-0059-*.log
            candidate-0059-checks/
            lisa-build-checkpoint.json
