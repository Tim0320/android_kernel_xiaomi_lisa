name: Diagnose Lisa rebuilt kernel early boot failure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-early-boot-diff.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BOOT_ARTIFACT_ID: "10670548293"
      STOCK_BOOT: reconstruction/stock/stock-Image/boot.img

    steps:
      - name: Checkout stock images with Git LFS
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 1

      - name: Checkout reconstructed kernel source
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          path: reconstructed-source
          fetch-depth: 1

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file device-tree-compiler

      - name: Download rebuilt boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOOT_ARTIFACT_ID}/zip" \
            -o rebuilt-artifact.zip
          mkdir rebuilt-artifact
          unzip -q rebuilt-artifact.zip -d rebuilt-artifact
          find rebuilt-artifact -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Extract stock and rebuilt Image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          stock = Path("reconstruction/stock/stock-Image/boot.img").read_bytes()
          if stock[:8] != b"ANDROID!":
              raise SystemExit("invalid stock boot magic")
          kernel_size = struct.unpack_from("<I", stock, 8)[0]
          header_version = struct.unpack_from("<I", stock, 40)[0]
          page = 4096 if header_version >= 3 else struct.unpack_from("<I", stock, 36)[0]
          Path("stock-Image").write_bytes(stock[page:page + kernel_size])
          print(f"STOCK_BOOT_HEADER_VERSION={header_version}")
          print(f"STOCK_KERNEL_PAYLOAD_BYTES={kernel_size}")
          PY

          image="$(find rebuilt-artifact -type f -name rebuilt-Image -print -quit)"
          test -n "$image"
          test -s "$image"
          cp "$image" rebuilt-Image

          file stock-Image rebuilt-Image
          sha256sum stock-Image rebuilt-Image

      - name: Compare ARM64 Image headers and appended payloads
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee early-boot-image-diff.txt
          from pathlib import Path
          import hashlib, re, struct

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          def parse(path):
              b = Path(path).read_bytes()
              if len(b) < 64:
                  raise SystemExit(f"{path}: too small")
              magic = struct.unpack_from("<I", b, 0x38)[0]
              if magic != 0x644d5241:
                  raise SystemExit(f"{path}: bad ARM64 Image magic 0x{magic:08x}")
              h = {
                  "file_bytes": len(b),
                  "sha256": sha(b),
                  "code0": struct.unpack_from("<I", b, 0)[0],
                  "code1": struct.unpack_from("<I", b, 4)[0],
                  "text_offset": struct.unpack_from("<Q", b, 8)[0],
                  "image_size": struct.unpack_from("<Q", b, 16)[0],
                  "flags": struct.unpack_from("<Q", b, 24)[0],
                  "res2": struct.unpack_from("<Q", b, 32)[0],
                  "res3": struct.unpack_from("<Q", b, 40)[0],
                  "res4": struct.unpack_from("<Q", b, 48)[0],
                  "magic": magic,
                  "res5": struct.unpack_from("<I", b, 60)[0],
              }
              m = re.search(rb"Linux version ([^\x00\n]{1,500})", b)
              h["version"] = m.group(1).decode("utf-8", "replace") if m else "<missing>"
              declared = h["image_size"]
              if 0 < declared <= len(b):
                  h["trailing_bytes_after_image_size"] = len(b) - declared
                  h["trailing_sha256"] = sha(b[declared:]) if len(b) > declared else "-"
              else:
                  h["trailing_bytes_after_image_size"] = -1
                  h["trailing_sha256"] = "-"
              return b, h

          def fdt_candidates(b, start=0):
              out = []
              magic = b"\xd0\x0d\xfe\xed"
              pos = max(0, start)
              while True:
                  pos = b.find(magic, pos)
                  if pos < 0:
                      break
                  if pos + 40 <= len(b):
                      total = struct.unpack_from(">I", b, pos + 4)[0]
                      off_struct = struct.unpack_from(">I", b, pos + 8)[0]
                      off_strings = struct.unpack_from(">I", b, pos + 12)[0]
                      version = struct.unpack_from(">I", b, pos + 20)[0]
                      last = struct.unpack_from(">I", b, pos + 24)[0]
                      if 40 <= total <= len(b) - pos and 0 < off_struct < total and 0 < off_strings < total and 1 <= version <= 40 and 1 <= last <= version:
                          out.append((pos, total, version))
                  pos += 4
              return out

          stock_b, stock = parse("stock-Image")
          rebuilt_b, rebuilt = parse("rebuilt-Image")

          for name, h, blob in (("STOCK", stock, stock_b), ("REBUILT", rebuilt, rebuilt_b)):
              print(f"[{name}]")
              for k in ("file_bytes","sha256","code0","code1","text_offset","image_size","flags","res2","res3","res4","magic","res5","trailing_bytes_after_image_size","trailing_sha256","version"):
                  v = h[k]
                  if isinstance(v, int) and k not in ("file_bytes","image_size","trailing_bytes_after_image_size"):
                      print(f"{k}=0x{v:x}")
                  else:
                      print(f"{k}={v}")
              start = h["image_size"] if 0 < h["image_size"] < len(blob) else 0
              candidates = fdt_candidates(blob, start)
              print(f"valid_fdt_candidates_after_declared_image={len(candidates)}")
              for pos, total, version in candidates[:32]:
                  print(f"fdt offset={pos} size={total} version={version}")
              print()

          print("[COMPARE]")
          for k in ("text_offset","flags","res2","res3","res4","res5"):
              print(f"{k}_equal={int(stock[k] == rebuilt[k])}")
          print(f"stock_file_minus_declared={stock['file_bytes'] - stock['image_size'] if stock['image_size'] else -1}")
          print(f"rebuilt_file_minus_declared={rebuilt['file_bytes'] - rebuilt['image_size'] if rebuilt['image_size'] else -1}")
          print(f"file_size_delta={rebuilt['file_bytes'] - stock['file_bytes']}")

          critical = []
          if stock["text_offset"] != rebuilt["text_offset"]:
              critical.append("ARM64 text_offset differs")
          if stock["flags"] != rebuilt["flags"]:
              critical.append("ARM64 Image flags differ")
          stock_tail = stock["file_bytes"] - stock["image_size"] if stock["image_size"] else 0
          stock_fdts = fdt_candidates(stock_b, stock["image_size"] if stock["image_size"] else 0)
          rebuilt_fdts = fdt_candidates(rebuilt_b, rebuilt["image_size"] if rebuilt["image_size"] else 0)
          if stock_tail > 0 and stock_fdts and not rebuilt_fdts:
              critical.append("stock Image has appended valid FDT payload(s) that rebuilt Image lacks")

          print("CRITICAL_FINDINGS=" + ("; ".join(critical) if critical else "none-from-header-tail-check"))
          PY

      - name: Try extracting embedded kernel configs
        run: |
          set -euo pipefail
          extract="reconstructed-source/scripts/extract-ikconfig"
          chmod +x "$extract" || true
          for img in stock-Image rebuilt-Image; do
            if "$extract" "$img" > "$img.config" 2> "$img.ikconfig.err"; then
              echo "$img IKCONFIG=present"
            else
              echo "$img IKCONFIG=absent"
              : > "$img.config"
            fi
          done

          python3 - <<'PY' | tee early-boot-config-diff.txt
          from pathlib import Path

          keys = [
              "CONFIG_ARM64","CONFIG_64BIT","CONFIG_SMP","CONFIG_PREEMPT",
              "CONFIG_ARM64_4K_PAGES","CONFIG_ARM64_16K_PAGES","CONFIG_ARM64_64K_PAGES",
              "CONFIG_ARM64_VA_BITS","CONFIG_RANDOMIZE_BASE","CONFIG_RELOCATABLE",
              "CONFIG_BLK_DEV_INITRD","CONFIG_DEVTMPFS","CONFIG_DEVTMPFS_MOUNT",
              "CONFIG_TMPFS","CONFIG_PROC_FS","CONFIG_SYSFS","CONFIG_CGROUPS",
              "CONFIG_NAMESPACES","CONFIG_ANDROID_BINDER_IPC","CONFIG_ANDROID_BINDERFS",
              "CONFIG_MODULES","CONFIG_MODVERSIONS","CONFIG_MODULE_UNLOAD",
              "CONFIG_KALLSYMS","CONFIG_KALLSYMS_ALL","CONFIG_CMDLINE",
              "CONFIG_CMDLINE_FORCE","CONFIG_CMDLINE_EXTEND","CONFIG_EFI",
          ]

          def parse(p):
              d = {}
              for raw in Path(p).read_text(errors="replace").splitlines():
                  if raw.startswith("# CONFIG_") and raw.endswith(" is not set"):
                      d[raw.split()[1]] = "n"
                  elif raw.startswith("CONFIG_") and "=" in raw:
                      k,v = raw.split("=",1)
                      d[k] = v
              return d

          a = parse("stock-Image.config")
          b = parse("rebuilt-Image.config")
          print(f"STOCK_CONFIG_KEYS={len(a)}")
          print(f"REBUILT_CONFIG_KEYS={len(b)}")
          if not a or not b:
              print("CONFIG_COMPARE=unavailable")
          else:
              diff = 0
              for k in keys:
                  av = a.get(k, "<missing>")
                  bv = b.get(k, "<missing>")
                  same = av == bv
                  diff += int(not same)
                  print(f"{k}\tstock={av}\trebuilt={bv}\tequal={int(same)}")
              print(f"BOOT_CRITICAL_CONFIG_DIFF_COUNT={diff}")
          PY

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Lisa early boot binary diagnosis"
            echo
            cat early-boot-image-diff.txt 2>/dev/null || true
            echo
            cat early-boot-config-diff.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-early-boot-diagnosis
          retention-days: 7
          if-no-files-found: warn
          path: |
            early-boot-image-diff.txt
            early-boot-config-diff.txt
            stock-Image.config
            rebuilt-Image.config
            stock-Image.ikconfig.err
            rebuilt-Image.ikconfig.err
