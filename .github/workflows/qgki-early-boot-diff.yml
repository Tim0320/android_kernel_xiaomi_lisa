name: Diagnose Lisa Candidate 0005 early boot against exact OS2.0.10

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-early-boot-diff.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE_ARTIFACT_ID: "10754191797"
      BASELINE_IMAGE_SHA256: "2162041efe1e4ac3e86bd934d4ccd9a4e00c5cd80e23c8085dfd0e0995430166"
      BOOT_ARTIFACT_ID: "10755230538"
      REBUILT_IMAGE_SHA256: "617c015a74e86b9a98479b6f4c657335484aa6351723cd41615e9f717226afb2"
      TARGET_RELEASE: "5.4.289-qgki-g4c23b1a30923"

    steps:
      - name: Checkout diagnostic metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout reconstructed kernel source
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          path: reconstructed-source
          fetch-depth: 1

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file device-tree-compiler binutils-aarch64-linux-gnu

      - name: Download exact OS2.0.10 baseline and Candidate 0005 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$output"
          }

          echo "BASELINE_ARTIFACT_ID=${BASELINE_ARTIFACT_ID}"
          echo "BOOT_ARTIFACT_ID=${BOOT_ARTIFACT_ID}"
          download_artifact "$BASELINE_ARTIFACT_ID" baseline-artifact.zip
          download_artifact "$BOOT_ARTIFACT_ID" rebuilt-artifact.zip
          mkdir baseline-artifact rebuilt-artifact
          unzip -q baseline-artifact.zip -d baseline-artifact
          unzip -q rebuilt-artifact.zip -d rebuilt-artifact
          find baseline-artifact rebuilt-artifact -maxdepth 4 -type f -printf '%p %s bytes\n' | sort

      - name: Authenticate exact stock and Candidate 0005 Images
        run: |
          set -euo pipefail
          stock_image="$(find baseline-artifact -type f -name official-stock-Image -print -quit)"
          rebuilt_image="$(find rebuilt-artifact -type f -name rebuilt-Image -print -quit)"
          test -n "$stock_image"
          test -s "$stock_image"
          test -n "$rebuilt_image"
          test -s "$rebuilt_image"
          cp "$stock_image" stock-Image
          cp "$rebuilt_image" rebuilt-Image

          test "$(sha256sum stock-Image | awk '{print $1}')" = "$BASELINE_IMAGE_SHA256"
          test "$(sha256sum rebuilt-Image | awk '{print $1}')" = "$REBUILT_IMAGE_SHA256"
          grep -aFq "$TARGET_RELEASE" rebuilt-Image

          file stock-Image rebuilt-Image
          sha256sum stock-Image rebuilt-Image

      - name: Classify ARM64 Image entry and memory layout
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee early-boot-image-diff.txt
          from pathlib import Path
          import hashlib, re, struct

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          def decode_b(word, insn_off=4):
              if word & 0x7c000000 != 0x14000000:
                  return None
              imm = word & 0x03ffffff
              if imm & (1 << 25):
                  imm -= 1 << 26
              return insn_off + (imm << 2)

          def parse(path):
              b = Path(path).read_bytes()
              if len(b) < 64:
                  raise SystemExit(f"{path}: too small")
              magic = struct.unpack_from("<I", b, 0x38)[0]
              if magic != 0x644d5241:
                  raise SystemExit(f"{path}: bad ARM64 Image magic 0x{magic:08x}")
              h = {
                  "file_bytes": len(b),
                  "sha256": sha(b),
                  "code0": struct.unpack_from("<I", b, 0)[0],
                  "code1": struct.unpack_from("<I", b, 4)[0],
                  "text_offset": struct.unpack_from("<Q", b, 8)[0],
                  "image_size": struct.unpack_from("<Q", b, 16)[0],
                  "flags": struct.unpack_from("<Q", b, 24)[0],
                  "res2": struct.unpack_from("<Q", b, 32)[0],
                  "res3": struct.unpack_from("<Q", b, 40)[0],
                  "res4": struct.unpack_from("<Q", b, 48)[0],
                  "magic": magic,
                  "res5": struct.unpack_from("<I", b, 60)[0],
              }
              h["branch_target"] = decode_b(h["code1"])
              h["branch_target_valid"] = h["branch_target"] is not None and 64 <= h["branch_target"] < len(b)
              h["memory_tail_bytes"] = h["image_size"] - len(b)
              h["image_size_covers_file"] = h["image_size"] >= len(b)
              m = re.search(rb"Linux version ([^\x00\n]{1,500})", b)
              h["version"] = m.group(1).decode("utf-8", "replace") if m else "<missing>"
              return b, h

          def fdt_candidates(b):
              out = []
              magic = b"\xd0\x0d\xfe\xed"
              pos = 0
              while True:
                  pos = b.find(magic, pos)
                  if pos < 0:
                      break
                  if pos + 40 <= len(b):
                      total = struct.unpack_from(">I", b, pos + 4)[0]
                      off_struct = struct.unpack_from(">I", b, pos + 8)[0]
                      off_strings = struct.unpack_from(">I", b, pos + 12)[0]
                      version = struct.unpack_from(">I", b, pos + 20)[0]
                      last = struct.unpack_from(">I", b, pos + 24)[0]
                      if 40 <= total <= len(b) - pos and 0 < off_struct < total and 0 < off_strings < total and 1 <= version <= 40 and 1 <= last <= version:
                          out.append((pos, total, version))
                  pos += 4
              return out

          stock_b, stock = parse("stock-Image")
          rebuilt_b, rebuilt = parse("rebuilt-Image")

          for name, h, blob in (("STOCK", stock, stock_b), ("REBUILT", rebuilt, rebuilt_b)):
              print(f"[{name}]")
              for k in ("file_bytes","sha256","code0","code1","branch_target","branch_target_valid","text_offset","image_size","memory_tail_bytes","image_size_covers_file","flags","res2","res3","res4","magic","res5","version"):
                  v = h[k]
                  if isinstance(v, int) and k in ("code0","code1","text_offset","flags","res2","res3","res4","magic","res5","branch_target"):
                      print(f"{k}=0x{v:x}")
                  else:
                      print(f"{k}={v}")
              candidates = fdt_candidates(blob)
              print(f"valid_fdt_candidates_total={len(candidates)}")
              for pos, total, version in candidates[:32]:
                  print(f"fdt offset={pos} size={total} version={version}")
              print()

          print("[COMPARE]")
          for k in ("text_offset","flags","res2","res3","res4","res5"):
              print(f"{k}_equal={int(stock[k] == rebuilt[k])}")
          print(f"code0_equal={int(stock['code0'] == rebuilt['code0'])}")
          print(f"code1_equal={int(stock['code1'] == rebuilt['code1'])}")
          print(f"image_size_equal={int(stock['image_size'] == rebuilt['image_size'])}")
          print(f"file_size_delta={rebuilt['file_bytes'] - stock['file_bytes']}")
          print(f"memory_tail_delta={rebuilt['memory_tail_bytes'] - stock['memory_tail_bytes']}")
          common = min(len(stock_b), len(rebuilt_b))
          first_diff = next((i for i in range(common) if stock_b[i] != rebuilt_b[i]), common)
          print(f"first_byte_diff_offset={first_diff}")
          print(f"first_64_bytes_equal={int(stock_b[:64] == rebuilt_b[:64])}")
          print(f"first_4096_bytes_equal={int(stock_b[:4096] == rebuilt_b[:4096])}")
          print(f"stock_first_64_sha256={sha(stock_b[:64])}")
          print(f"rebuilt_first_64_sha256={sha(rebuilt_b[:64])}")
          print(f"stock_first_4096_sha256={sha(stock_b[:4096])}")
          print(f"rebuilt_first_4096_sha256={sha(rebuilt_b[:4096])}")

          structural = {
              "stock_branch_target_valid": stock["branch_target_valid"],
              "rebuilt_branch_target_valid": rebuilt["branch_target_valid"],
              "stock_image_size_covers_file": stock["image_size_covers_file"],
              "rebuilt_image_size_covers_file": rebuilt["image_size_covers_file"],
              "text_offset_equal": stock["text_offset"] == rebuilt["text_offset"],
              "flags_equal": stock["flags"] == rebuilt["flags"],
              "reserved_equal": all(stock[k] == rebuilt[k] for k in ("res2","res3","res4","res5")),
              "magic_equal": stock["magic"] == rebuilt["magic"] == 0x644d5241,
              "code0_equal": stock["code0"] == rebuilt["code0"],
          }
          for k, v in structural.items():
              print(f"check_{k}={int(v)}")
          failed = [k for k, v in structural.items() if not v]
          if failed:
              print("EARLY_IMAGE_STRUCTURAL_GATE=FAIL:" + ",".join(failed))
              raise SystemExit("malformed early Image structure: " + ", ".join(failed))
          print("EARLY_IMAGE_STRUCTURAL_GATE=PASS")
          print("NOTE=code1 and image_size are linker-layout values; numerical inequality alone is not classified as a boot failure when both branch targets and memory extents are structurally valid")
          PY

      - name: Disassemble both decoded entry targets
        run: |
          set -euo pipefail
          python3 - <<'PY' > entry-targets.env
          from pathlib import Path
          import struct
          def target(path):
              b=Path(path).read_bytes()
              w=struct.unpack_from('<I',b,4)[0]
              imm=w & 0x03ffffff
              if imm & (1<<25): imm -= 1<<26
              return 4 + (imm<<2)
          print(f"STOCK_ENTRY={target('stock-Image')}")
          print(f"REBUILT_ENTRY={target('rebuilt-Image')}")
          PY
          source entry-targets.env
          {
            echo "[STOCK_ENTRY target=$STOCK_ENTRY]"
            aarch64-linux-gnu-objdump -D -b binary -m aarch64 \
              --start-address="$STOCK_ENTRY" --stop-address="$((STOCK_ENTRY+256))" stock-Image
            echo
            echo "[REBUILT_ENTRY target=$REBUILT_ENTRY]"
            aarch64-linux-gnu-objdump -D -b binary -m aarch64 \
              --start-address="$REBUILT_ENTRY" --stop-address="$((REBUILT_ENTRY+256))" rebuilt-Image
          } | tee entry-target-disassembly.txt

      - name: Extract and compare complete embedded kernel configs
        run: |
          set -euo pipefail
          extract="reconstructed-source/scripts/extract-ikconfig"
          chmod +x "$extract" || true
          for img in stock-Image rebuilt-Image; do
            "$extract" "$img" > "$img.config" 2> "$img.ikconfig.err"
            test -s "$img.config"
          done

          python3 - <<'PY' | tee full-config-diff-summary.txt
          from pathlib import Path

          def parse(p):
              d = {}
              for raw in Path(p).read_text(errors="replace").splitlines():
                  if raw.startswith("# CONFIG_") and raw.endswith(" is not set"):
                      d[raw.split()[1]] = "n"
                  elif raw.startswith("CONFIG_") and "=" in raw:
                      k,v = raw.split("=",1)
                      d[k] = v
              return d

          stock = parse("stock-Image.config")
          rebuilt = parse("rebuilt-Image.config")
          keys = sorted(set(stock) | set(rebuilt))
          diffs = [(k, stock.get(k,"<missing>"), rebuilt.get(k,"<missing>")) for k in keys if stock.get(k) != rebuilt.get(k)]
          Path("full-config-diff.txt").write_text("\n".join(f"{k}\tstock={a}\trebuilt={b}" for k,a,b in diffs) + "\n")

          prefixes = (
              "CONFIG_ARM64", "CONFIG_ARM_", "CONFIG_ARCH_", "CONFIG_CPU_", "CONFIG_EFI",
              "CONFIG_PSCI", "CONFIG_MMU", "CONFIG_RANDOMIZE", "CONFIG_RELOCATABLE",
              "CONFIG_SMP", "CONFIG_PREEMPT", "CONFIG_VIRTUALIZATION", "CONFIG_HYPERVISOR",
              "CONFIG_QCOM", "CONFIG_ARM_SMMU", "CONFIG_IOMMU", "CONFIG_DMA", "CONFIG_CMA",
              "CONFIG_SPARSEMEM", "CONFIG_ZONE", "CONFIG_OF", "CONFIG_CLK", "CONFIG_COMMON_CLK",
              "CONFIG_REGULATOR", "CONFIG_PINCTRL", "CONFIG_SERIAL", "CONFIG_PRINTK",
              "CONFIG_PSTORE", "CONFIG_PANIC", "CONFIG_CMDLINE", "CONFIG_KASLR"
          )
          sensitive = [d for d in diffs if d[0].startswith(prefixes)]
          Path("early-sensitive-config-diff.txt").write_text("\n".join(f"{k}\tstock={a}\trebuilt={b}" for k,a,b in sensitive) + "\n")

          print(f"STOCK_CONFIG_KEYS={len(stock)}")
          print(f"REBUILT_CONFIG_KEYS={len(rebuilt)}")
          print(f"FULL_CONFIG_DIFF_COUNT={len(diffs)}")
          print(f"EARLY_SENSITIVE_CONFIG_DIFF_COUNT={len(sensitive)}")
          print("--- early-sensitive differences ---")
          for k,a,b in sensitive[:240]:
              print(f"{k}\tstock={a}\trebuilt={b}")
          PY

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Lisa exact Candidate 0005 early-boot diagnosis"
            echo
            cat early-boot-image-diff.txt 2>/dev/null || true
            echo
            cat full-config-diff-summary.txt 2>/dev/null || true
            echo
            sed -n '1,220p' entry-target-disassembly.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-early-boot-diagnosis
          retention-days: 7
          if-no-files-found: warn
          path: |
            early-boot-image-diff.txt
            entry-targets.env
            entry-target-disassembly.txt
            full-config-diff-summary.txt
            full-config-diff.txt
            early-sensitive-config-diff.txt
            stock-Image.config
            rebuilt-Image.config
            stock-Image.ikconfig.err
            rebuilt-Image.ikconfig.err
