name: Minimize final six QGKI private headers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/abi-qgki-six-minimal-headers.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-qgki-six-minimal-headers
  cancel-in-progress: true

jobs:
  minimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout reconstructed kernel
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 curl xz-utils unzip git rsync

      - name: Cache clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
              -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download exact stock IKHEADERS
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_KHEADERS_ARTIFACT_ID: "10637733529"
        run: |
          set -euo pipefail
          mkdir -p stock-artifact
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STOCK_KHEADERS_ARTIFACT_ID}/zip" \
            -o stock-kheaders.zip
          unzip -q stock-kheaders.zip -d stock-artifact
          test -d stock-artifact/stock-kheaders
          test "$(find stock-artifact/stock-kheaders -type f -name '*.h' | wc -l)" -eq 7806

      - name: Fetch redwood header donor
        run: |
          set -euo pipefail
          rm -rf donor-redwood
          git clone --filter=blob:none --no-checkout \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git donor-redwood
          git -C donor-redwood fetch --depth=1 origin redwood-s-oss
          git -C donor-redwood checkout --detach FETCH_HEAD
          echo "REDWOOD_HEAD=$(git -C donor-redwood rev-parse HEAD)" | tee donor-head.txt

          for f in \
            fs/proc/internal.h \
            kernel/sched/features.h \
            kernel/sched/pelt.h \
            kernel/sched/sched.h; do
            test -f "donor-redwood/$f"
          done

      - name: Prepare exact stock-config build environment
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cp reconstruction/stock_ikconfig out/.config
          scripts/config --file out/.config --enable BOARD_XIAOMI_LISA

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig prepare scripts

      - name: Stage stock global genksyms headers
        env:
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          rm -rf "$STOCK_ABI_ROOT"
          mkdir -p "$STOCK_ABI_ROOT"
          rsync -a stock-artifact/stock-kheaders/ "$STOCK_ABI_ROOT/"
          test "$(find "$STOCK_ABI_ROOT" -type f -name '*.h' | wc -l)" -eq 7806

      - name: Patch direct genksyms output and stock global route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/Makefile.build")
          s = p.read_text()

          old = '    $(call cmd_gensymtypes_c,true,$@) >/dev/null;                           \\\n'
          new = '    $(call cmd_gensymtypes_c,true,$@) >$@.symversions;                      \\\n'
          if old not in s:
              raise SystemExit("direct genksyms output rule not found")
          s = s.replace(old, new, 1)

          stock = (
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated "
              "-I$(STOCK_ABI_ROOT)/include "
              "-I$(STOCK_ABI_ROOT)/include/generated "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated/uapi "
              "-I$(STOCK_ABI_ROOT)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/include/generated/uapi"
          )

          lines = s.splitlines(keepends=True)
          done = False
          for i, line in enumerate(lines):
              if "$(CPP) -D__GENKSYMS__ $(c_flags) $< |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {stock} -D__GENKSYMS__",
                      1,
                  )
                  done = True
                  break

          if not done:
              raise SystemExit("C genksyms CPP rule not found")
          p.write_text("".join(lines))
          PY

      - name: Test exact proc internal header
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          mkdir -p minimal-results
          : > minimal-results/proc-status.txt

          git checkout -- fs/proc
          cp donor-redwood/fs/proc/internal.h fs/proc/internal.h
          rm -rf out/fs/proc

          set +e
          make -j1 O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KBUILD_SYMTYPES=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            fs/proc/generic.symtypes \
            > minimal-results/proc-genksyms.log 2>&1
          gen_rc=$?

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            fs/proc/built-in.a \
            > minimal-results/proc-normal-compile.log 2>&1
          compile_rc=$?
          set -e

          echo "PROC_INTERNAL_GENKSYMS_RC=$gen_rc" | tee -a minimal-results/proc-status.txt
          echo "PROC_INTERNAL_NORMAL_COMPILE_RC=$compile_rc" | tee -a minimal-results/proc-status.txt

          sym="out/fs/proc/generic.symtypes.symversions"
          if [[ -s "$sym" ]]; then
            cp "$sym" minimal-results/proc-internal.symversions
          else
            : > minimal-results/proc-internal.symversions
          fi

          if [[ "$compile_rc" -ne 0 ]]; then
            tail -n 120 minimal-results/proc-normal-compile.log || true
          fi

      - name: Test all minimal scheduler header subsets
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          mkdir -p minimal-results
          : > minimal-results/sched-status.tsv

          test_sched_variant() {
            local variant="$1"
            shift
            local headers=("$@")

            echo "=== SCHED_MINIMAL_VARIANT $variant ==="
            git checkout -- kernel/sched
            rm -rf out/kernel/sched

            for h in "${headers[@]}"; do
              cp "donor-redwood/kernel/sched/$h" "kernel/sched/$h"
            done

            set +e
            make -j1 O=out \
              ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KBUILD_SYMTYPES=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              kernel/sched/core.symtypes \
              >"minimal-results/${variant}-genksyms.log" 2>&1
            gen_rc=$?

            make -j"$(nproc)" O=out \
              ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              kernel/sched/built-in.a \
              >"minimal-results/${variant}-normal-compile.log" 2>&1
            compile_rc=$?
            set -e

            printf '%s\tgenksyms_rc=%s\tnormal_compile_rc=%s\theaders=%s\n' \
              "$variant" "$gen_rc" "$compile_rc" "${headers[*]}" \
              | tee -a minimal-results/sched-status.tsv

            sym="out/kernel/sched/core.symtypes.symversions"
            if [[ -s "$sym" ]]; then
              cp "$sym" "minimal-results/${variant}.symversions"
            else
              : > "minimal-results/${variant}.symversions"
            fi

            if [[ "$compile_rc" -ne 0 ]]; then
              tail -n 80 "minimal-results/${variant}-normal-compile.log" || true
            fi
          }

          test_sched_variant sched-features features.h
          test_sched_variant sched-pelt pelt.h
          test_sched_variant sched-sched sched.h
          test_sched_variant sched-features-pelt features.h pelt.h
          test_sched_variant sched-features-sched features.h sched.h
          test_sched_variant sched-pelt-sched pelt.h sched.h
          test_sched_variant sched-all features.h pelt.h sched.h

      - name: Score minimal private header variants
        run: |
          set -euo pipefail

          python3 - minimal-results minimal-header-summary.txt <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          out = Path(sys.argv[2])

          proc_expected = {
              "proc_create_data": 0xa187c33a,
              "proc_mkdir": 0xd8fd7935,
              "proc_remove": 0x0420ade2,
              "remove_proc_entry": 0x05ba4e75,
          }
          sched_expected = {
              "sched_setscheduler": 0xe09be37d,
              "wake_up_process": 0xfa54581b,
          }

          rx = re.compile(r"^__crc_([A-Za-z0-9_.$]+) = (0x[0-9a-fA-F]+);$")

          def parse(path):
              got = {}
              for raw in path.read_text(errors="replace").splitlines():
                  m = rx.match(raw.strip())
                  if m:
                      got[m.group(1)] = int(m.group(2), 16)
              return got

          lines = []

          proc = parse(root / "proc-internal.symversions")
          pscore = sum(proc.get(s) == crc for s, crc in proc_expected.items())
          print(f"PROC_INTERNAL_HEADER_SCORE={pscore}/4")
          lines.append(f"proc-internal\t{pscore}/4")

          for path in sorted(root.glob("sched-*.symversions")):
              got = parse(path)
              score = sum(got.get(s) == crc for s, crc in sched_expected.items())
              print(f"SCHED_MINIMAL_SCORE\t{path.stem}\t{score}/2")
              lines.append(f"{path.stem}\t{score}/2")

              for sym, expected in sched_expected.items():
                  val = got.get(sym)
                  status = "MATCH" if val == expected else ("MISMATCH" if val is not None else "MISSING")
                  print(
                      f"SCHED_MINIMAL_SYMBOL\t{path.stem}\t{status}\t{sym}\t"
                      f"candidate={(f'0x{val:08x}' if val is not None else 'MISSING')}\t"
                      f"stock=0x{expected:08x}"
                  )

          out.write_text("\n".join(lines) + "\n")
          PY

          cat minimal-header-summary.txt
          cat minimal-results/proc-status.txt
          cat minimal-results/sched-status.tsv

      - name: Upload minimal-header evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-six-minimal-headers
          retention-days: 14
          if-no-files-found: warn
          path: |
            clang-version.txt
            donor-head.txt
            minimal-header-summary.txt
            minimal-results/
