name: Fetch exact Lisa OS2.0.10 stock baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fetch-lisa-os2-0-10-baseline.yml

permissions:
  contents: read

concurrency:
  group: lisa-os2-0-10-stock-baseline
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      TARGET_VERSION: OS2.0.10.0.UKOCNXM
      TARGET_RELEASE: 5.4.289-qgki-g4c23b1a30923
      TARGET_COMMIT_TAG: g4c23b1a30923
      OTA_URL: https://bigota.d.miui.com/OS2.0.10.0.UKOCNXM/lisa-ota_full-OS2.0.10.0.UKOCNXM-user-14.0-698602d09c.zip
      EXPECTED_VENDOR_BOOT_SHA256: 6d2c626cc325058ba4c6f16a8f4043978404dfb5ce2f420d770f53d1f5d089f2
      EXPECTED_DTBO_SHA256: 423828174f86a7aab8823fc1cf5347e9cc97f0f41c246c489bdf5793d79a922e

    steps:
      - name: Checkout reconstruction metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install payload and inspection dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            file binutils git python3 pkg-config \
            libbrotli-dev liblzma-dev libzstd-dev

      - name: Build pinned URL-aware payload dumper
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/xishang0128/payload-dumper-go.git /tmp/payload-dumper-go
          cd /tmp/payload-dumper-go
          git checkout --detach 4cc6ef94039470d659e4199c67f76d8962280023
          go build -trimpath -o "$GITHUB_WORKSPACE/payload-dumper" ./cmd/payload-dumper
          "$GITHUB_WORKSPACE/payload-dumper" --help | sed -n '1,80p'

      - name: Extract exact OS2.0.10 boot-chain partitions
        run: |
          set -euo pipefail
          rm -rf official
          mkdir -p official
          printf '%s\n' "$OTA_URL" | tee ota-source-url.txt

          ./payload-dumper extract "$OTA_URL" \
            -p boot,vendor_boot,dtbo,vbmeta,vbmeta_system \
            -o official \
            --http-workers 4 \
            --part-size 8M

          for part in boot vendor_boot dtbo vbmeta vbmeta_system; do
            test -s "official/$part.img"
          done

          ls -lh official
          sha256sum official/*.img | sort | tee official-partition-sha256.txt

      - name: Record official versus live boot-chain partition drift
        run: |
          set -euo pipefail
          vendor_boot_sha="$(sha256sum official/vendor_boot.img | awk '{print $1}')"
          dtbo_sha="$(sha256sum official/dtbo.img | awk '{print $1}')"

          vendor_match=0
          dtbo_match=0
          if [[ "$vendor_boot_sha" = "$EXPECTED_VENDOR_BOOT_SHA256" ]]; then vendor_match=1; fi
          if [[ "$dtbo_sha" = "$EXPECTED_DTBO_SHA256" ]]; then dtbo_match=1; fi

          {
            echo "OFFICIAL_VENDOR_BOOT_SHA256=$vendor_boot_sha"
            echo "LIVE_VENDOR_BOOT_SHA256=$EXPECTED_VENDOR_BOOT_SHA256"
            echo "OFFICIAL_DTBO_SHA256=$dtbo_sha"
            echo "LIVE_DTBO_A_SHA256=$EXPECTED_DTBO_SHA256"
            echo "LIVE_VENDOR_BOOT_BYTE_MATCH=$vendor_match"
            echo "LIVE_DTBO_BYTE_MATCH=$dtbo_match"
            if [[ "$vendor_match" = 1 && "$dtbo_match" = 1 ]]; then
              echo "LIVE_FIRMWARE_PARTITION_BYTES=EXACT"
            else
              echo "LIVE_FIRMWARE_PARTITION_BYTES=DRIFT"
            fi
          } | tee live-partition-compare.txt

          # A whole-partition byte mismatch is evidence, not a reason to reject
          # the official boot.img.  The live device may contain post-install or
          # recovery changes in vendor_boot/dtbo.  Kernel compatibility is gated
          # below by the target release independently observed from live modules.

      - name: Gate target release against live device ABI evidence
        run: |
          set -euo pipefail
          test -s reconstruction/device_os2_0_10_probe.txt
          grep -Fqx -- "- expected_stock_qgki_release=$TARGET_RELEASE" reconstruction/device_os2_0_10_probe.txt
          grep -Fq "vermagic=$TARGET_RELEASE SMP preempt mod_unload modversions aarch64" reconstruction/device_os2_0_10_probe.txt
          grep -Fq 'module_layout_crc=0xba39cbb8' reconstruction/device_os2_0_10_probe.txt
          {
            echo "LIVE_TARGET_RELEASE_ORACLE=$TARGET_RELEASE"
            echo "LIVE_MODULE_LAYOUT_ORACLE=0xba39cbb8"
            echo "LIVE_ABI_RELEASE_GATE=PASS"
          } | tee live-abi-release-gate.txt

      - name: Validate and extract exact official stock boot Image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import re
          import struct
          from pathlib import Path

          boot = Path("official/boot.img").read_bytes()
          if boot[:8] != b"ANDROID!":
              raise SystemExit("official boot.img has invalid Android boot magic")

          def u32(off):
              return struct.unpack_from("<I", boot, off)[0]

          def align(v, a):
              return (v + a - 1) // a * a

          kernel_size = u32(8)
          ramdisk_size = u32(12)
          os_version = u32(16)
          header_size = u32(20)
          header_version = u32(40)

          if header_version != 3:
              raise SystemExit(f"expected Android boot header v3, got {header_version}")
          if not (0 < header_size <= 4096):
              raise SystemExit(f"invalid Android boot header size {header_size}")

          page = 4096
          kernel_off = page
          kernel_end = kernel_off + kernel_size
          ramdisk_off = align(kernel_end, page)
          ramdisk_end = ramdisk_off + ramdisk_size
          if kernel_size <= 0 or kernel_end > len(boot):
              raise SystemExit("kernel payload is truncated")
          if ramdisk_end > len(boot):
              raise SystemExit("ramdisk payload is truncated")

          kernel = boot[kernel_off:kernel_end]
          if len(kernel) < 64:
              raise SystemExit("kernel Image is too small")
          image_magic = struct.unpack_from("<I", kernel, 0x38)[0]
          if image_magic != 0x644D5241:
              raise SystemExit(f"kernel payload is not ARM64 Image: 0x{image_magic:08x}")

          target_release = b"5.4.289-qgki-g4c23b1a30923"
          if target_release not in kernel:
              raise SystemExit("official OS2.0.10 boot does not contain expected g4c23 QGKI release")

          version = re.search(rb"Linux version ([^\x00\n]{1,500})", kernel)
          if not version:
              raise SystemExit("Linux version string not found in official stock Image")

          image_header = {
              "code0": struct.unpack_from("<I", kernel, 0)[0],
              "code1": struct.unpack_from("<I", kernel, 4)[0],
              "text_offset": struct.unpack_from("<Q", kernel, 8)[0],
              "image_size": struct.unpack_from("<Q", kernel, 16)[0],
              "flags": struct.unpack_from("<Q", kernel, 24)[0],
              "res2": struct.unpack_from("<Q", kernel, 32)[0],
              "res3": struct.unpack_from("<Q", kernel, 40)[0],
              "res4": struct.unpack_from("<Q", kernel, 48)[0],
              "magic": image_magic,
              "res5": struct.unpack_from("<I", kernel, 60)[0],
          }

          Path("official-stock-Image").write_bytes(kernel)
          Path("official-kernel-version.txt").write_text(
              version.group(0).decode("utf-8", "replace") + "\n"
          )
          lines = [
              f"boot_bytes={len(boot)}",
              f"boot_sha256={hashlib.sha256(boot).hexdigest()}",
              f"boot_header_version={header_version}",
              f"boot_header_size={header_size}",
              f"boot_os_version_raw=0x{os_version:08x}",
              f"kernel_offset={kernel_off}",
              f"kernel_bytes={kernel_size}",
              f"kernel_sha256={hashlib.sha256(kernel).hexdigest()}",
              f"ramdisk_offset={ramdisk_off}",
              f"ramdisk_bytes={ramdisk_size}",
              f"ramdisk_end={ramdisk_end}",
          ]
          for key, value in image_header.items():
              lines.append(f"arm64_{key}=0x{value:x}")
          lines += [
              "arm64_image_magic=PASS",
              "target_release=5.4.289-qgki-g4c23b1a30923",
              "target_release_present=PASS",
          ]
          Path("official-boot-layout.txt").write_text("\n".join(lines) + "\n")
          PY

          file official/boot.img official-stock-Image
          cat official-boot-layout.txt
          cat official-kernel-version.txt
          grep -F "$TARGET_RELEASE" official-kernel-version.txt

      - name: Record OS2.0.10 stock boot baseline gate
        run: |
          set -euo pipefail
          boot_sha="$(sha256sum official/boot.img | awk '{print $1}')"
          boot_bytes="$(stat -c '%s' official/boot.img)"
          image_sha="$(sha256sum official-stock-Image | awk '{print $1}')"
          vendor_boot_sha="$(sha256sum official/vendor_boot.img | awk '{print $1}')"
          dtbo_sha="$(sha256sum official/dtbo.img | awk '{print $1}')"
          vendor_match="$(awk -F= '$1=="LIVE_VENDOR_BOOT_BYTE_MATCH" {print $2}' live-partition-compare.txt)"
          dtbo_match="$(awk -F= '$1=="LIVE_DTBO_BYTE_MATCH" {print $2}' live-partition-compare.txt)"

          grep -F "$TARGET_RELEASE" official-kernel-version.txt
          grep -Fqx 'arm64_image_magic=PASS' official-boot-layout.txt
          grep -Fqx 'target_release_present=PASS' official-boot-layout.txt
          grep -Fqx 'LIVE_ABI_RELEASE_GATE=PASS' live-abi-release-gate.txt

          {
            echo "# Lisa OS2.0.10.0.UKOCNXM stock boot baseline"
            echo "target_version=$TARGET_VERSION"
            echo "target_release=$TARGET_RELEASE"
            echo "ota_url=$OTA_URL"
            echo "official_boot_sha256=$boot_sha"
            echo "official_boot_bytes=$boot_bytes"
            echo "official_image_sha256=$image_sha"
            echo "official_vendor_boot_sha256=$vendor_boot_sha"
            echo "official_dtbo_sha256=$dtbo_sha"
            echo "live_vendor_boot_sha256=$EXPECTED_VENDOR_BOOT_SHA256"
            echo "live_dtbo_sha256=$EXPECTED_DTBO_SHA256"
            echo "live_vendor_boot_byte_match=$vendor_match"
            echo "live_dtbo_byte_match=$dtbo_match"
            echo "live_target_release_oracle=1"
            echo "target_release_present=1"
            echo "baseline_class=official_os2_0_10_boot_with_live_g4c23_abi_oracle"
            echo "OS2_0_10_STOCK_BOOT_GATE=PASS"
          } | tee baseline-report.txt

      - name: Upload exact OS2.0.10 stock baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-os2-0-10-stock-baseline
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn
          path: |
            ota-source-url.txt
            official-partition-sha256.txt
            live-partition-compare.txt
            live-abi-release-gate.txt
            official-boot-layout.txt
            official-kernel-version.txt
            baseline-report.txt
            official-stock-Image
            official/boot.img
            official/vendor_boot.img
            official/dtbo.img
            official/vbmeta.img
            official/vbmeta_system.img
