name: Build Lisa QGKI six-symbol compatibility prototype

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-kernel-qgki-six-compat.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-qgki-six-compat
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout reconstructed kernel and stock images
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          lfs: true
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio file gzip lz4 zstd xz-utils \
            python3 python3-pyelftools curl unzip git rsync kmod

      - name: Cache clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
              -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download exact stock IKHEADERS
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_KHEADERS_ARTIFACT_ID: "10637733529"
        run: |
          set -euo pipefail
          mkdir -p stock-artifact
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STOCK_KHEADERS_ARTIFACT_ID}/zip" \
            -o stock-kheaders.zip
          unzip -q stock-kheaders.zip -d stock-artifact
          test -d stock-artifact/stock-kheaders
          test "$(find stock-artifact/stock-kheaders -type f -name '*.h' | wc -l)" -eq 7806

      - name: Apply six-symbol runtime and genksyms compatibility layer
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # 1. Keep current proc_ops callers unchanged at source level by
          # redirecting their proc_create_data() calls to a new current-ABI
          # symbol. The original proc_create_data symbol will be reintroduced
          # below with the exact stock file_operations ABI.
          path = Path("include/linux/proc_fs.h")
          text = path.read_text()

          old = """extern struct proc_dir_entry *proc_create_data(const char *, umode_t,
					       struct proc_dir_entry *,
					       const struct proc_ops *,
					       void *);
"""
          new = """extern struct proc_dir_entry *proc_create_data_proc_ops(const char *, umode_t,
							struct proc_dir_entry *,
							const struct proc_ops *,
							void *);
#define proc_create_data proc_create_data_proc_ops
"""
          if old not in text:
              raise SystemExit("current proc_create_data prototype block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2. Give genksyms the exact stock private proc_dir_entry field while
          # normal compilation keeps the current proc_ops runtime plus an
          # embedded adapter for legacy file_operations callers.
          path = Path("fs/proc/internal.h")
          text = path.read_text()

          old = """	const struct inode_operations *proc_iops;
	union {
		const struct proc_ops *proc_ops;
		const struct file_operations *proc_dir_ops;
	};
	const struct dentry_operations *proc_dops;
"""
          new = """	const struct inode_operations *proc_iops;
#ifdef __GENKSYMS__
	const struct file_operations *proc_fops;
#else
	union {
		const struct proc_ops *proc_ops;
		const struct file_operations *proc_dir_ops;
	};
	struct proc_ops legacy_proc_ops;
#endif
	const struct dentry_operations *proc_dops;
"""
          if old not in text:
              raise SystemExit("proc_dir_entry operations field block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 3. Rename the current proc_ops implementation to a separate symbol.
          # Existing reconstructed callers reach it through the header macro.
          path = Path("fs/proc/generic.c")
          text = path.read_text()

          old = """struct proc_dir_entry *proc_create_data(const char *name, umode_t mode,
		struct proc_dir_entry *parent,
		const struct proc_ops *proc_ops, void *data)
{
	struct proc_dir_entry *p;

	p = proc_create_reg(name, mode, &parent, data);
	if (!p)
		return NULL;
	p->proc_ops = proc_ops;
	return proc_register(parent, p);
}
EXPORT_SYMBOL(proc_create_data);
 
struct proc_dir_entry *proc_create(const char *name, umode_t mode,
				   struct proc_dir_entry *parent,
				   const struct proc_ops *proc_ops)
{
	return proc_create_data(name, mode, parent, proc_ops, NULL);
}
EXPORT_SYMBOL(proc_create);
"""
          new = """struct proc_dir_entry *proc_create_data_proc_ops(const char *name, umode_t mode,
		struct proc_dir_entry *parent,
		const struct proc_ops *proc_ops, void *data)
{
	struct proc_dir_entry *p;

	p = proc_create_reg(name, mode, &parent, data);
	if (!p)
		return NULL;
	p->proc_ops = proc_ops;
	return proc_register(parent, p);
}
EXPORT_SYMBOL(proc_create_data_proc_ops);

struct proc_dir_entry *proc_create(const char *name, umode_t mode,
				   struct proc_dir_entry *parent,
				   const struct proc_ops *proc_ops)
{
	return proc_create_data_proc_ops(name, mode, parent, proc_ops, NULL);
}
EXPORT_SYMBOL(proc_create);

#undef proc_create_data

/*
 * Stock lisa QGKI compatibility entry point.
 *
 * HyperOS msm_drm.ko was built against the pre-proc_ops ABI. Preserve that
 * exported ABI while translating the legacy file_operations callbacks into
 * the current proc_ops dispatcher used internally by this reconstructed tree.
 */
struct proc_dir_entry *proc_create_data(const char *name, umode_t mode,
		struct proc_dir_entry *parent,
		const struct file_operations *proc_fops, void *data)
{
	struct proc_dir_entry *p;
	struct proc_ops *ops;

	p = proc_create_reg(name, mode, &parent, data);
	if (!p)
		return NULL;

	ops = &p->legacy_proc_ops;
	if (proc_fops) {
		ops->proc_open = proc_fops->open;
		ops->proc_read = proc_fops->read;
		ops->proc_write = proc_fops->write;
		ops->proc_lseek = proc_fops->llseek;
		ops->proc_release = proc_fops->release;
		ops->proc_poll = proc_fops->poll;
		ops->proc_ioctl = proc_fops->unlocked_ioctl;
#ifdef CONFIG_COMPAT
		ops->proc_compat_ioctl = proc_fops->compat_ioctl;
#endif
		ops->proc_mmap = proc_fops->mmap;
		ops->proc_get_unmapped_area = proc_fops->get_unmapped_area;
	}

	p->proc_ops = ops;
	return proc_register(parent, p);
}
EXPORT_SYMBOL(proc_create_data);
"""
          if old not in text:
              raise SystemExit("current proc_create_data implementation block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 4. The stock config has CONFIG_PERF_HUMANTASK=y and
          # CONFIG_FAIR_GROUP_SCHED=n. The only active redwood/stock private
          # scheduler type-graph difference required for these two CRCs is the
          # historical cfs_rq::min_vruntimex member. Expose it to genksyms
          # only; do not alter runtime layout or scheduler implementation.
          path = Path("kernel/sched/sched.h")
          text = path.read_text()

          old = """	u64			exec_clock;
	u64			min_vruntime;
#ifndef CONFIG_64BIT
"""
          new = """	u64			exec_clock;
	u64			min_vruntime;
#if defined(__GENKSYMS__) && defined(CONFIG_PERF_HUMANTASK)
	u64			min_vruntimex;
#endif
#ifndef CONFIG_64BIT
"""
          if old not in text:
              raise SystemExit("scheduler min_vruntime insertion point not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git diff -- include/linux/proc_fs.h fs/proc/internal.h fs/proc/generic.c kernel/sched/sched.h \
            > qgki-six-compat.patch
          cat qgki-six-compat.patch

      - name: Generate exact stock-config build environment
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cp reconstruction/stock_ikconfig out/.config
          scripts/config --file out/.config --enable BOARD_XIAOMI_LISA

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- prepare scripts

      - name: Stage complete stock global genksyms headers
        env:
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          rm -rf "$STOCK_ABI_ROOT"
          mkdir -p "$STOCK_ABI_ROOT"
          rsync -a stock-artifact/stock-kheaders/ "$STOCK_ABI_ROOT/"
          test "$(find "$STOCK_ABI_ROOT" -type f -name '*.h' | wc -l)" -eq 7806

      - name: Route genksyms through stock global headers
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/Makefile.build")
          s = p.read_text()

          stock = (
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated "
              "-I$(STOCK_ABI_ROOT)/include "
              "-I$(STOCK_ABI_ROOT)/include/generated "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated/uapi "
              "-I$(STOCK_ABI_ROOT)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/include/generated/uapi"
          )

          conditional = (
              "$(if $(or "
              "$(findstring /lib/zstd/,$<),"
              "$(findstring /drivers/android/vendor_hooks.c,$<)"
              f"),,{stock})"
          )

          lines = s.splitlines(keepends=True)
          c_done = False
          asm_done = False

          for i, line in enumerate(lines):
              if not c_done and "$(CPP) -D__GENKSYMS__ $(c_flags) $< |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {conditional} -D__GENKSYMS__",
                      1,
                  )
                  c_done = True
                  continue
              if not asm_done and "$(CPP) -D__GENKSYMS__ $(c_flags) -xc - |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {stock} -D__GENKSYMS__",
                      1,
                  )
                  asm_done = True

          if not c_done:
              raise SystemExit("C genksyms rule not found")
          if not asm_done:
              raise SystemExit("ASM genksyms rule not found")

          p.write_text("".join(lines))
          PY

      - name: Full build
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tee qgki-six-build.log

      - name: Validate six exact stock CRCs and core outputs
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers

          python3 - out/Module.symvers qgki-six-crc.txt <<'PY'
          import sys
          from pathlib import Path

          expected = {
              "proc_create_data": 0xa187c33a,
              "proc_mkdir": 0xd8fd7935,
              "proc_remove": 0x0420ade2,
              "remove_proc_entry": 0x05ba4e75,
              "sched_setscheduler": 0xe09be37d,
              "wake_up_process": 0xfa54581b,
          }

          got = {}
          for raw in Path(sys.argv[1]).read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) >= 3:
                  try:
                      got[p[1]] = int(p[0], 16)
                  except ValueError:
                      pass

          lines = []
          score = 0
          for sym, exp in expected.items():
              val = got.get(sym)
              ok = val == exp
              score += int(ok)
              line = (
                  f"{sym}\tcurrent="
                  + (f"0x{val:08x}" if val is not None else "MISSING")
                  + f"\tstock=0x{exp:08x}\tmatch={int(ok)}"
              )
              print("QGKI_SIX_CRC\t" + line)
              lines.append(line)

          print(f"QGKI_SIX_CRC_SCORE={score}/6")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n")

          if score != 6:
              raise SystemExit(f"expected 6/6, got {score}/6")
          PY

          grep -q 'proc_create_data_proc_ops' out/Module.symvers
          echo "QGKI_PROC_CURRENT_ABI_SYMBOL_PRESENT=1"

          source reconstruction/manifest.env
          for ko in \
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko \
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko \
            out/drivers/misc/mi-memory/mi_memory.ko \
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko; do
            test -s "$ko"
            actual="$(strings -a "$ko" | sed -n 's/^vermagic=//p' | head -n1 | awk '{print $1}')"
            echo "QGKI_SIX_VERMAGIC\t$ko\t$actual"
            test "$actual" = "$TARGET_VERMAGIC"
          done

      - name: Extract exact stock msm_drm module
        run: |
          set -euo pipefail
          img="reconstruction/stock/stock-Image/vendor_boot.img"
          test -s "$img"

          rm -rf stock-msm-drm
          mkdir -p stock-msm-drm/root

          python3 - "$img" stock-msm-drm/vendor_ramdisk.gz <<'PY'
          import struct
          import sys
          from pathlib import Path

          data = Path(sys.argv[1]).read_bytes()
          if data[:8] != b"VNDRBOOT":
              raise SystemExit("bad vendor_boot magic")

          def u32(off):
              return struct.unpack_from("<I", data, off)[0]

          def align(v, a):
              return (v + a - 1) // a * a

          page = u32(12)
          ramdisk_size = u32(24)
          header_size = u32(2096)
          off = align(header_size, page)

          Path(sys.argv[2]).write_bytes(data[off:off + ramdisk_size])
          print(f"QGKI_VENDOR_RAMDISK_BYTES={ramdisk_size}")
          PY

          gzip -dc stock-msm-drm/vendor_ramdisk.gz > stock-msm-drm/vendor_ramdisk.cpio
          (
            cd stock-msm-drm/root
            cpio --quiet -idm --no-absolute-filenames < ../vendor_ramdisk.cpio
          )

          msm="$(find stock-msm-drm/root -type f -path '*/lib/modules/msm_drm.ko' -print -quit)"
          test -n "$msm"
          cp "$msm" stock-msm-drm/msm_drm.ko
          test -s stock-msm-drm/msm_drm.ko

          strings -a stock-msm-drm/msm_drm.ko | grep '^vermagic=' | tee stock-msm-drm/vermagic.txt

      - name: Audit all 736 msm_drm imports against rebuilt kernel
        run: |
          set -euo pipefail

          python3 - stock-msm-drm/msm_drm.ko out/Module.symvers qgki-msm-drm-abi.txt <<'PY'
          import sys
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          module_path = Path(sys.argv[1])
          symvers_path = Path(sys.argv[2])
          out_path = Path(sys.argv[3])

          with module_path.open("rb") as f:
              elf = ELFFile(f)
              sec = elf.get_section_by_name("__versions")
              if sec is None:
                  raise SystemExit("msm_drm.ko has no __versions")
              data = sec.data()

          if len(data) % 64:
              raise SystemExit(f"unexpected __versions size {len(data)}")

          required = {}
          for off in range(0, len(data), 64):
              chunk = data[off:off + 64]
              crc = int.from_bytes(chunk[:8], "little") & 0xffffffff
              name = chunk[8:].split(b"\0", 1)[0].decode("ascii", "replace")
              if name:
                  required[name] = crc

          current = {}
          for raw in symvers_path.read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) >= 3:
                  try:
                      current[p[1]] = int(p[0], 16)
                  except ValueError:
                      pass

          matches = []
          mismatches = []
          missing = []

          for sym, exp in sorted(required.items()):
              got = current.get(sym)
              if got is None:
                  missing.append((sym, exp))
              elif got == exp:
                  matches.append((sym, exp))
              else:
                  mismatches.append((sym, exp, got))

          print(f"QGKI_MSM_DRM_IMPORTS={len(required)}")
          print(f"QGKI_MSM_DRM_MATCHES={len(matches)}")
          print(f"QGKI_MSM_DRM_MISMATCHES={len(mismatches)}")
          print(f"QGKI_MSM_DRM_MISSING={len(missing)}")

          lines = [
              f"imports={len(required)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"missing={len(missing)}",
              "",
              "## MISMATCH",
          ]

          for sym, exp, got in mismatches:
              line = f"{sym}\tstock=0x{exp:08x}\tcurrent=0x{got:08x}"
              print("QGKI_MSM_DRM_MISMATCH\t" + line)
              lines.append(line)

          lines += ["", "## MISSING"]
          for sym, exp in missing:
              line = f"{sym}\tstock=0x{exp:08x}"
              print("QGKI_MSM_DRM_MISSING_SYMBOL\t" + line)
              lines.append(line)

          out_path.write_text("\n".join(lines) + "\n")

          if len(required) != 736:
              raise SystemExit(f"expected 736 imports, got {len(required)}")
          if mismatches or missing:
              raise SystemExit(
                  f"msm_drm not compatible: {len(mismatches)} mismatches, "
                  f"{len(missing)} missing"
              )
          PY

          cat qgki-msm-drm-abi.txt

      - name: Summarize genksyms failures
        if: always()
        run: |
          set -euo pipefail
          if [[ -f qgki-six-build.log ]]; then
            grep 'version generation failed' qgki-six-build.log > qgki-six-genksyms-failures.txt || true
          else
            : > qgki-six-genksyms-failures.txt
          fi
          echo "QGKI_SIX_GENKSYMS_FAILURES=$(wc -l < qgki-six-genksyms-failures.txt)"
          cat qgki-six-genksyms-failures.txt || true

      - name: Upload QGKI six-symbol compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-six-compat-evidence
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            clang-version.txt
            qgki-six-compat.patch
            qgki-six-build.log
            qgki-six-crc.txt
            qgki-msm-drm-abi.txt
            qgki-six-genksyms-failures.txt
            stock-msm-drm/vermagic.txt
            stock-msm-drm/msm_drm.ko
            out/.config
            out/Module.symvers
            out/arch/arm64/boot/Image
