name: Build Lisa QGKI runtime-layout compatibility prototype
# source-validation-trigger: 8899b7be79e2799170a12d549201498ac38197db

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-kernel-qgki-six-compat.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-qgki-six-compat
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout reconstructed kernel and stock images
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          lfs: true
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio file gzip lz4 zstd xz-utils \
            python3 python3-pyelftools curl unzip git rsync kmod

      - name: Cache clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
              -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download exact stock IKHEADERS
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_KHEADERS_ARTIFACT_ID: "10637733529"
        run: |
          set -euo pipefail
          mkdir -p stock-artifact
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STOCK_KHEADERS_ARTIFACT_ID}/zip" \
            -o stock-kheaders.zip
          unzip -q stock-kheaders.zip -d stock-artifact
          test -d stock-artifact/stock-kheaders
          test "$(find stock-artifact/stock-kheaders -type f -name '*.h' | wc -l)" -eq 7806

      - name: Apply six-symbol runtime and genksyms compatibility layer
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # 1. Keep current proc_ops callers unchanged at source level by
          # redirecting their proc_create_data() calls to a new current-ABI
          # symbol. The original proc_create_data symbol will be reintroduced
          # below with the exact stock file_operations ABI.
          path = Path("include/linux/proc_fs.h")
          text = path.read_text()

          old = """extern struct proc_dir_entry *proc_create_data(const char *, umode_t,
          					       struct proc_dir_entry *,
          					       const struct proc_ops *,
          					       void *);
          """
          new = """extern struct proc_dir_entry *proc_create_data_proc_ops(const char *, umode_t,
          							struct proc_dir_entry *,
          							const struct proc_ops *,
          							void *);
          #define proc_create_data proc_create_data_proc_ops
          """
          if old not in text:
              raise SystemExit("current proc_create_data prototype block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2. Give genksyms the exact stock private proc_dir_entry field while
          # normal compilation keeps the current proc_ops runtime plus an
          # embedded adapter for legacy file_operations callers.
          path = Path("fs/proc/internal.h")
          text = path.read_text()

          old = """	const struct inode_operations *proc_iops;
          	union {
          		const struct proc_ops *proc_ops;
          		const struct file_operations *proc_dir_ops;
          	};
          	const struct dentry_operations *proc_dops;
          """
          new = """	const struct inode_operations *proc_iops;
          #ifdef __GENKSYMS__
          	const struct file_operations *proc_fops;
          #else
          	union {
          		const struct proc_ops *proc_ops;
          		const struct file_operations *proc_dir_ops;
          	};
          	struct proc_ops legacy_proc_ops;
          #endif
          	const struct dentry_operations *proc_dops;
          """
          if old not in text:
              raise SystemExit("proc_dir_entry operations field block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 3. Rename the current proc_ops implementation to a separate symbol.
          # Existing reconstructed callers reach it through the header macro.
          path = Path("fs/proc/generic.c")
          text = path.read_text()

          old = """struct proc_dir_entry *proc_create_data(const char *name, umode_t mode,
          		struct proc_dir_entry *parent,
          		const struct proc_ops *proc_ops, void *data)
          {
          	struct proc_dir_entry *p;

          	p = proc_create_reg(name, mode, &parent, data);
          	if (!p)
          		return NULL;
          	p->proc_ops = proc_ops;
          	return proc_register(parent, p);
          }
          EXPORT_SYMBOL(proc_create_data);
           
          struct proc_dir_entry *proc_create(const char *name, umode_t mode,
          				   struct proc_dir_entry *parent,
          				   const struct proc_ops *proc_ops)
          {
          	return proc_create_data(name, mode, parent, proc_ops, NULL);
          }
          EXPORT_SYMBOL(proc_create);
          """
          new = """struct proc_dir_entry *proc_create_data_proc_ops(const char *name, umode_t mode,
          		struct proc_dir_entry *parent,
          		const struct proc_ops *proc_ops, void *data)
          {
          	struct proc_dir_entry *p;

          	p = proc_create_reg(name, mode, &parent, data);
          	if (!p)
          		return NULL;
          	p->proc_ops = proc_ops;
          	return proc_register(parent, p);
          }
          EXPORT_SYMBOL(proc_create_data_proc_ops);

          struct proc_dir_entry *proc_create(const char *name, umode_t mode,
          				   struct proc_dir_entry *parent,
          				   const struct proc_ops *proc_ops)
          {
          	return proc_create_data_proc_ops(name, mode, parent, proc_ops, NULL);
          }
          EXPORT_SYMBOL(proc_create);

          #undef proc_create_data

          /*
           * Stock lisa QGKI compatibility entry point.
           *
           * HyperOS msm_drm.ko was built against the pre-proc_ops ABI. Preserve that
           * exported ABI while translating the legacy file_operations callbacks into
           * the current proc_ops dispatcher used internally by this reconstructed tree.
           */
          struct proc_dir_entry *proc_create_data(const char *name, umode_t mode,
          		struct proc_dir_entry *parent,
          		const struct file_operations *proc_fops, void *data)
          {
          	struct proc_dir_entry *p;
          	struct proc_ops *ops;

          	p = proc_create_reg(name, mode, &parent, data);
          	if (!p)
          		return NULL;

          	ops = &p->legacy_proc_ops;
          	if (proc_fops) {
          		ops->proc_open = proc_fops->open;
          		ops->proc_read = proc_fops->read;
          		ops->proc_write = proc_fops->write;
          		ops->proc_lseek = proc_fops->llseek;
          		ops->proc_release = proc_fops->release;
          		ops->proc_poll = proc_fops->poll;
          		ops->proc_ioctl = proc_fops->unlocked_ioctl;
          #ifdef CONFIG_COMPAT
          		ops->proc_compat_ioctl = proc_fops->compat_ioctl;
          #endif
          		ops->proc_mmap = proc_fops->mmap;
          		ops->proc_get_unmapped_area = proc_fops->get_unmapped_area;
          	}

          	p->proc_ops = ops;
          	return proc_register(parent, p);
          }
          EXPORT_SYMBOL(proc_create_data);
          """
          if old not in text:
              raise SystemExit("current proc_create_data implementation block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 4. The stock config has CONFIG_PERF_HUMANTASK=y and
          # CONFIG_FAIR_GROUP_SCHED=n. The only active redwood/stock private
          # scheduler type-graph difference required for these two CRCs is the
          # historical cfs_rq::min_vruntimex member. Expose it to genksyms
          # only; do not alter runtime layout or scheduler implementation.
          path = Path("kernel/sched/sched.h")
          text = path.read_text()

          old = """	u64			exec_clock;
          	u64			min_vruntime;
          #ifndef CONFIG_64BIT
          """
          new = """	u64			exec_clock;
          	u64			min_vruntime;
          #if defined(__GENKSYMS__) && defined(CONFIG_PERF_HUMANTASK)
          	u64			min_vruntimex;
          #endif
          #ifndef CONFIG_64BIT
          """
          if old not in text:
              raise SystemExit("scheduler min_vruntime insertion point not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 5. Restore the exact stock runtime rw_semaphore reserve.
          #
          # Stock Lisa IKHEADERS include ANDROID_VENDOR_DATA(1) at the end of
          # struct rw_semaphore. The current reconstructed tree lacks it.
          # This one 8-byte reserve fixes both:
          #   - inode::i_private: current 624 -> stock 640, because inode
          #     contains two rw_semaphore instances before i_private;
          #   - drm_panel: current 96 -> stock 104, because panel->nh embeds
          #     blocking_notifier_head -> rw_semaphore.
          path = Path("include/linux/rwsem.h")
          text = path.read_text()

          include_old = """#ifdef CONFIG_RWSEM_SPIN_ON_OWNER
          #include <linux/osq_lock.h>
          #endif
          """
          include_new = """#ifdef CONFIG_RWSEM_SPIN_ON_OWNER
          #include <linux/osq_lock.h>
          #endif
          #include <linux/android_vendor.h>
          """
          if include_old not in text:
              raise SystemExit("rwsem include insertion point not found")
          text = text.replace(include_old, include_new, 1)

          struct_old = """#ifdef CONFIG_DEBUG_LOCK_ALLOC
          	struct lockdep_map	dep_map;
          #endif
          };
          """
          struct_new = """#ifdef CONFIG_DEBUG_LOCK_ALLOC
          	struct lockdep_map	dep_map;
          #endif
          	ANDROID_VENDOR_DATA(1);
          };
          """
          if struct_old not in text:
              raise SystemExit("rwsem struct insertion point not found")
          text = text.replace(struct_old, struct_new, 1)
          path.write_text(text)
          PY

          git diff -- include/linux/proc_fs.h fs/proc/internal.h fs/proc/generic.c kernel/sched/sched.h include/linux/rwsem.h \
            > qgki-six-compat.patch
          cat qgki-six-compat.patch

      - name: Apply Lisa persistent early-boot logging diagnostics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/mtd/mtdoops.c")
          s = p.read_text()

          old = "#define MTDOOPS_MAX_MTD_SIZE (8 * 1024 * 1024)"
          new = "#define MTDOOPS_MAX_MTD_SIZE (16 * 1024 * 1024)"
          if old not in s:
              raise SystemExit("mtdoops max-size anchor not found")
          s = s.replace(old, new, 1)

          old = "cxt->dump.max_reason = KMSG_DUMP_OOPS;"
          new = "cxt->dump.max_reason = KMSG_DUMP_POWEROFF;"
          if old not in s:
              raise SystemExit("mtdoops max_reason anchor not found")
          s = s.replace(old, new, 1)

          old = (
              "\tif (reason != KMSG_DUMP_OOPS) {\n"
              "\t\t/* Panics must be written immediately */\n"
              "\t\tmtdoops_write(cxt, 1);\n"
              "\t} else {\n"
              "\t\t/* For other cases, schedule work to write it \"nicely\" */\n"
              "\t\tschedule_work(&cxt->work_write);\n"
              "\t}\n"
          )
          new = (
              "\tif (reason == KMSG_DUMP_PANIC) {\n"
              "\t\t/* Keep the upstream panic path unchanged. */\n"
              "\t\tmtdoops_write(cxt, 1);\n"
              "\t} else if (reason == KMSG_DUMP_OOPS) {\n"
              "\t\t/* Oopses may use the normal deferred write path. */\n"
              "\t\tschedule_work(&cxt->work_write);\n"
              "\t} else {\n"
              "\t\t/* Persist orderly restart/halt/poweroff before power loss. */\n"
              "\t\tmtdoops_write(cxt, 0);\n"
              "\t\tmtd_sync(cxt->mtd);\n"
              "\t}\n"
          )
          if old not in s:
              raise SystemExit("mtdoops dump-path anchor not found")
          s = s.replace(old, new, 1)

          old = "\tfind_next_position(cxt);\n"
          new = (
              "\tfind_next_position(cxt);\n"
              "\t/* Ensure a full historical ring has a writable slot. */\n"
              "\tflush_work(&cxt->work_erase);\n"
              "\tprintk(KERN_INFO \"mtdoops: Lisa diagnostic logger ready, "
              "pages=%d record=%lu\\n\", cxt->oops_pages, record_size);\n"
          )
          if old not in s:
              raise SystemExit("mtdoops attach anchor not found")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff -- drivers/mtd/mtdoops.c > lisa-mtdoops-diagnostic.patch
          cat lisa-mtdoops-diagnostic.patch

      - name: Generate exact stock-config build environment
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cp reconstruction/stock_ikconfig out/.config
          scripts/config --file out/.config --enable BOARD_XIAOMI_LISA

          # Restore Lisa stock watchdog timing constraints in the donor Kconfig.
          # The donor hard-locks bark/pet to 11000/9360, while stock IKCONFIG
          # requires 20000/15000. Without changing the Kconfig range,
          # olddefconfig silently rewrites the stock values back to donor values.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("drivers/soc/qcom/Kconfig")
          s = p.read_text()
          pairs = [
              ("default 11000\n\trange 11000 11000",
               "default 20000\n\trange 20000 20000"),
              ("default 9360\n\trange 9360 9360",
               "default 15000\n\trange 15000 15000"),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f"watchdog Kconfig block not found: {old!r}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          # Align a minimal set of runtime-affecting options with stock Lisa.
          # These exist in the donor Kconfig and can change early-boot behavior.
          scripts/config --file out/.config --disable ARM64_USE_LSE_ATOMICS
          scripts/config --file out/.config --disable COMPAT_VDSO
          scripts/config --file out/.config --disable RELR
          scripts/config --file out/.config --set-val QCOM_WATCHDOG_BARK_TIME 20000
          scripts/config --file out/.config --set-val QCOM_WATCHDOG_PET_TIME 15000

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          grep -E '^(# )?CONFIG_(ARM64_USE_LSE_ATOMICS|COMPAT_VDSO|RELR|QCOM_WATCHDOG_BARK_TIME|QCOM_WATCHDOG_PET_TIME)' out/.config || true
          grep -Fqx '# CONFIG_ARM64_USE_LSE_ATOMICS is not set' out/.config
          grep -Fqx '# CONFIG_COMPAT_VDSO is not set' out/.config
          grep -Fqx '# CONFIG_RELR is not set' out/.config
          grep -Fqx 'CONFIG_QCOM_WATCHDOG_BARK_TIME=20000' out/.config
          grep -Fqx 'CONFIG_QCOM_WATCHDOG_PET_TIME=15000' out/.config
          echo "EARLY_BOOT_RUNTIME_CONFIG_ALIGNMENT=PASS"

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- prepare scripts

      - name: Stage complete stock global genksyms headers
        env:
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -euo pipefail
          rm -rf "$STOCK_ABI_ROOT"
          mkdir -p "$STOCK_ABI_ROOT"
          rsync -a stock-artifact/stock-kheaders/ "$STOCK_ABI_ROOT/"
          test "$(find "$STOCK_ABI_ROOT" -type f -name '*.h' | wc -l)" -eq 7806

      - name: Route genksyms through stock global headers
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/Makefile.build")
          s = p.read_text()

          stock = (
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated "
              "-I$(STOCK_ABI_ROOT)/include "
              "-I$(STOCK_ABI_ROOT)/include/generated "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/arch/$(SRCARCH)/include/generated/uapi "
              "-I$(STOCK_ABI_ROOT)/include/uapi "
              "-I$(STOCK_ABI_ROOT)/include/generated/uapi"
          )

          conditional = (
              "$(if $(or "
              "$(findstring /lib/zstd/,$<),"
              "$(findstring /drivers/android/vendor_hooks.c,$<)"
              f"),,{stock})"
          )

          lines = s.splitlines(keepends=True)
          c_done = False
          asm_done = False

          for i, line in enumerate(lines):
              if not c_done and "$(CPP) -D__GENKSYMS__ $(c_flags) $< |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {conditional} -D__GENKSYMS__",
                      1,
                  )
                  c_done = True
                  continue
              if not asm_done and "$(CPP) -D__GENKSYMS__ $(c_flags) -xc - |" in line:
                  lines[i] = line.replace(
                      "$(CPP) -D__GENKSYMS__",
                      f"$(CPP) {stock} -D__GENKSYMS__",
                      1,
                  )
                  asm_done = True

          if not c_done:
              raise SystemExit("C genksyms rule not found")
          if not asm_done:
              raise SystemExit("ASM genksyms rule not found")

          p.write_text("".join(lines))
          PY

      - name: Full build
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tee qgki-six-build.log

      - name: Assert stock-compatible runtime field layouts
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail

          cat > qgki-runtime-layout-assert.c <<'EOF'
          #include <linux/rwsem.h>
          #include <linux/notifier.h>
          #include <linux/fs.h>
          #include <linux/sched.h>
          #include <drm/drm_panel.h>

          _Static_assert(sizeof(struct rw_semaphore) == 48,
                         "rw_semaphore must match stock Lisa");
          _Static_assert(sizeof(struct blocking_notifier_head) == 56,
                         "blocking_notifier_head must match stock Lisa");

          _Static_assert(sizeof(struct inode) == 664,
                         "inode size must match stock Lisa");
          _Static_assert(__builtin_offsetof(struct inode, i_mapping) == 48,
                         "inode i_mapping offset must match stock Lisa");
          _Static_assert(__builtin_offsetof(struct inode, i_private) == 640,
                         "inode i_private offset must match stock Lisa");

          _Static_assert(sizeof(struct drm_panel) == 104,
                         "drm_panel size must match stock Lisa");
          _Static_assert(__builtin_offsetof(struct drm_panel, drm) == 0,
                         "drm_panel drm offset");
          _Static_assert(__builtin_offsetof(struct drm_panel, connector) == 8,
                         "drm_panel connector offset");
          _Static_assert(__builtin_offsetof(struct drm_panel, dev) == 16,
                         "drm_panel dev offset");
          _Static_assert(__builtin_offsetof(struct drm_panel, funcs) == 24,
                         "drm_panel funcs offset");
          _Static_assert(__builtin_offsetof(struct drm_panel, list) == 32,
                         "drm_panel list offset");
          _Static_assert(__builtin_offsetof(struct drm_panel, nh) == 48,
                         "drm_panel nh offset");

          _Static_assert(__builtin_offsetof(struct task_struct, pid) == 1616,
                         "task_struct pid offset");
          _Static_assert(__builtin_offsetof(struct task_struct, tgid) == 1620,
                         "task_struct tgid offset");
          _Static_assert(__builtin_offsetof(struct task_struct, group_leader) == 1680,
                         "task_struct group_leader offset");
          _Static_assert(__builtin_offsetof(struct task_struct, comm) == 2072,
                         "task_struct comm offset");
          EOF

          RES="$("${RUNNER_TEMP}/clang-r383902b1/bin/clang" -print-resource-dir)"
          "${RUNNER_TEMP}/clang-r383902b1/bin/clang" \
            -target aarch64-linux-gnu \
            -nostdinc -isystem "$RES/include" \
            -D__KERNEL__ \
            -DKBUILD_MODNAME='"qgki_runtime_layout_assert"' \
            -DKBUILD_BASENAME='"qgki_runtime_layout_assert"' \
            -include include/linux/kconfig.h \
            -I arch/arm64/include \
            -I out/arch/arm64/include/generated \
            -I include \
            -I out/include \
            -I arch/arm64/include/uapi \
            -I out/arch/arm64/include/generated/uapi \
            -I include/uapi \
            -I out/include/generated/uapi \
            -fsyntax-only qgki-runtime-layout-assert.c

          echo "QGKI_RUNTIME_RWSEM_SIZE=48"
          echo "QGKI_RUNTIME_BLOCKING_NOTIFIER_SIZE=56"
          echo "QGKI_RUNTIME_INODE_SIZE=664"
          echo "QGKI_RUNTIME_INODE_I_PRIVATE=640"
          echo "QGKI_RUNTIME_DRM_PANEL_SIZE=104"
          echo "QGKI_RUNTIME_LAYOUT_ASSERTIONS=PASS"

      - name: Validate six exact stock CRCs and core outputs
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers

          python3 - out/Module.symvers qgki-six-crc.txt <<'PY'
          import sys
          from pathlib import Path

          expected = {
              "proc_create_data": 0xa187c33a,
              "proc_mkdir": 0xd8fd7935,
              "proc_remove": 0x0420ade2,
              "remove_proc_entry": 0x05ba4e75,
              "sched_setscheduler": 0xe09be37d,
              "wake_up_process": 0xfa54581b,
          }

          got = {}
          for raw in Path(sys.argv[1]).read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) >= 3:
                  try:
                      got[p[1]] = int(p[0], 16)
                  except ValueError:
                      pass

          lines = []
          score = 0
          for sym, exp in expected.items():
              val = got.get(sym)
              ok = val == exp
              score += int(ok)
              line = (
                  f"{sym}\tcurrent="
                  + (f"0x{val:08x}" if val is not None else "MISSING")
                  + f"\tstock=0x{exp:08x}\tmatch={int(ok)}"
              )
              print("QGKI_SIX_CRC\t" + line)
              lines.append(line)

          print(f"QGKI_SIX_CRC_SCORE={score}/6")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n")

          if score != 6:
              raise SystemExit(f"expected 6/6, got {score}/6")
          PY

          grep -q 'proc_create_data_proc_ops' out/Module.symvers
          echo "QGKI_PROC_CURRENT_ABI_SYMBOL_PRESENT=1"

          source reconstruction/manifest.env
          for ko in \
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko \
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko \
            out/drivers/misc/mi-memory/mi_memory.ko \
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko; do
            test -s "$ko"
            actual="$(strings -a "$ko" | sed -n 's/^vermagic=//p' | head -n1 | awk '{print $1}')"
            echo "QGKI_SIX_VERMAGIC\t$ko\t$actual"
            test "$actual" = "$TARGET_VERMAGIC"
          done

      - name: Download exact stock msm_drm import oracle
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR_BOOT_ARTIFACT_ID: "10648361196"
        run: |
          set -euo pipefail
          rm -rf vendor-abi-oracle
          mkdir -p vendor-abi-oracle

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VENDOR_BOOT_ARTIFACT_ID}/zip" \
            -o vendor-abi-oracle.zip

          unzip -q vendor-abi-oracle.zip -d vendor-abi-oracle

          imports="$(find vendor-abi-oracle -type f -name stock-vendor-boot-module-imports.tsv -print -quit)"
          summary="$(find vendor-abi-oracle -type f -name stock-vendor-boot-module-summary.tsv -print -quit)"
          test -n "$imports"
          test -n "$summary"

          cp "$imports" stock-msm-drm-imports.tsv
          cp "$summary" stock-msm-drm-summary.tsv

      - name: Audit all 736 stock msm_drm imports against rebuilt kernel
        run: |
          set -euo pipefail

          python3 - stock-msm-drm-imports.tsv stock-msm-drm-summary.tsv out/Module.symvers qgki-msm-drm-abi.txt <<'PY'
          import sys
          from pathlib import Path

          imports_path = Path(sys.argv[1])
          summary_path = Path(sys.argv[2])
          symvers_path = Path(sys.argv[3])
          out_path = Path(sys.argv[4])

          qgki_rows = []
          for raw in summary_path.read_text(errors="replace").splitlines():
              p = raw.split("\t")
              if len(p) >= 6 and p[0].endswith("/lib/modules/msm_drm.ko"):
                  qgki_rows.append(p)

          if len(qgki_rows) != 1:
              raise SystemExit(f"expected one stock msm_drm row, got {len(qgki_rows)}")

          module, machine, vermagic, layout, version_count, status = qgki_rows[0]
          expected_vermagic = (
              "5.4.289-qgki-g5987d69e25da "
              "SMP preempt mod_unload modversions aarch64"
          )

          print(f"QGKI_STOCK_MSM_DRM_VERMAGIC={vermagic}")
          print(f"QGKI_STOCK_MSM_DRM_LAYOUT={layout}")
          print(f"QGKI_STOCK_MSM_DRM_VERSION_ENTRIES={version_count}")

          if vermagic != expected_vermagic:
              raise SystemExit("stock msm_drm vermagic changed")
          if layout.lower() != "0xba39cbb8":
              raise SystemExit("stock msm_drm module_layout changed")
          if int(version_count) != 736:
              raise SystemExit("stock msm_drm __versions count changed")
          if status != "OK":
              raise SystemExit("stock msm_drm parse status is not OK")

          required = {}
          rows = 0
          for raw in imports_path.read_text(errors="replace").splitlines():
              p = raw.split("\t")
              if len(p) < 5:
                  continue
              module, vermagic, layout, symbol, crc_text = p[:5]
              if not module.endswith("/lib/modules/msm_drm.ko"):
                  continue
              rows += 1
              required[symbol] = int(crc_text, 16)

          current = {}
          for raw in symvers_path.read_text(errors="replace").splitlines():
              p = raw.split()
              if len(p) >= 3:
                  try:
                      current[p[1]] = int(p[0], 16)
                  except ValueError:
                      pass

          matches = []
          mismatches = []
          missing = []

          for sym, exp in sorted(required.items()):
              got = current.get(sym)
              if got is None:
                  missing.append((sym, exp))
              elif got == exp:
                  matches.append((sym, exp))
              else:
                  mismatches.append((sym, exp, got))

          print(f"QGKI_MSM_DRM_VERSION_ROWS={rows}")
          print(f"QGKI_MSM_DRM_IMPORTS={len(required)}")
          print(f"QGKI_MSM_DRM_MATCHES={len(matches)}")
          print(f"QGKI_MSM_DRM_MISMATCHES={len(mismatches)}")
          print(f"QGKI_MSM_DRM_MISSING={len(missing)}")
          print(
              f"QGKI_MSM_DRM_MATCH_RATE="
              f"{len(matches)/len(required):.6f}"
          )

          lines = [
              f"version_rows={rows}",
              f"imports={len(required)}",
              f"matches={len(matches)}",
              f"mismatches={len(mismatches)}",
              f"missing={len(missing)}",
              "",
              "## MISMATCH",
          ]
          for sym, exp, got in mismatches:
              lines.append(
                  f"{sym}\tstock=0x{exp:08x}\tcurrent=0x{got:08x}"
              )
          lines += ["", "## MISSING"]
          for sym, exp in missing:
              lines.append(f"{sym}\tstock=0x{exp:08x}")

          out_path.write_text("\n".join(lines) + "\n")

          if rows != 736 or len(required) != 736:
              raise SystemExit(
                  f"expected 736 stock msm_drm imports, rows={rows}, "
                  f"unique={len(required)}"
              )
          if mismatches or missing:
              raise SystemExit(
                  f"stock msm_drm ABI failed: {len(mismatches)} mismatches, "
                  f"{len(missing)} missing"
              )
          PY

          cat qgki-msm-drm-abi.txt

      - name: Summarize genksyms failures
        if: always()
        run: |
          set -euo pipefail
          if [[ -f qgki-six-build.log ]]; then
            grep 'version generation failed' qgki-six-build.log > qgki-six-genksyms-failures.txt || true
          else
            : > qgki-six-genksyms-failures.txt
          fi
          echo "QGKI_SIX_GENKSYMS_FAILURES=$(wc -l < qgki-six-genksyms-failures.txt)"
          cat qgki-six-genksyms-failures.txt || true

      - name: Upload QGKI six-symbol compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-six-compat-evidence
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            clang-version.txt
            qgki-six-compat.patch
            lisa-mtdoops-diagnostic.patch
            qgki-six-build.log
            qgki-six-crc.txt
            qgki-runtime-layout-assert.c
            qgki-msm-drm-abi.txt
            qgki-six-genksyms-failures.txt
            stock-msm-drm-summary.tsv
            out/.config
            out/Module.symvers
            out/arch/arm64/boot/Image
