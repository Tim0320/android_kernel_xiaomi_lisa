name: Prototype Lisa Candidate0061 NFC built-in Image (NOT FLASHABLE)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Choose audit-only or ~50-minute NFC built-in build (NOT FLASHABLE)'
        type: choice
        required: true
        default: audit-only
        options:
          - audit-only
          - build-prototype

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: lisa-c0061-nfc-builtin-prototype
  cancel-in-progress: true

jobs:
  optional-audit:
    if: ${{ inputs.run_mode == 'audit-only' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate AVB descriptor audit tool without making a boot
        run: |
          set -euo pipefail
          python3 -m py_compile reconstruction/scripts/candidate_0061_avb_descriptor_gate.py
          echo 'AUDIT_TOOL_SYNTAX=PASS; DEVICE_AVB=UNVERIFIED; NOT_FLASHABLE'
      - name: Gate known experimental Boot embedded AVB mismatch (no kernel build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p avb-audit
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/11674463191/zip > avb-audit/artifact.zip
          unzip -oq avb-audit/artifact.zip -d avb-audit
          test -f avb-audit/boot.img
          echo '6d4bde9703183308808825ee2fe726850f9a5bcbd70869c6b269ca745355159e  avb-audit/boot.img' | sha256sum -c -
          python3 reconstruction/scripts/candidate_0061_avb_descriptor_gate.py \
            --boot avb-audit/boot.img --expect-mismatch --json avb-audit/descriptor.json
          echo 'KNOWN_EXPERIMENT_AVB_MISMATCH=CONFIRMED; NOT_FLASHABLE'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: lisa-c0061-avb-readonly-audit-${{ github.run_id }}
          path: avb-audit/descriptor.json
          if-no-files-found: warn
  nfc-builtin-prototype:
    if: ${{ inputs.run_mode == 'build-prototype' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout Candidate0061 package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: package
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Checkout frozen Lisa 5.4.289 source
        uses: actions/checkout@v4
        with:
          repository: Tim0320/android_kernel_xiaomi_lisa
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Fetch Direct-302 provenance and semantic oracles
        run: |
          set -euo pipefail
          stable=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git -C kernel fetch --no-tags --depth=1 "$stable" \
            refs/tags/v5.4.289:refs/tags/upstream-v5.4.289 \
            refs/tags/v5.4.292:refs/tags/upstream-v5.4.292 \
            refs/tags/v5.4.296:refs/tags/upstream-v5.4.296 \
            refs/tags/v5.4.299:refs/tags/upstream-v5.4.299 \
            refs/tags/v5.4.302:refs/tags/upstream-v5.4.302

          aosp=https://android.googlesource.com/kernel/common
          git -C kernel fetch --no-tags --depth=1 "$aosp" \
            refs/tags/android11-5.4.302_r00:refs/tags/aosp-android11-5.4.302

          miyume=https://github.com/MiYume0721/android_kernel_xiaomi_sm8350_miyume.git
          git -C kernel fetch --no-tags --depth=1 "$miyume" \
            refs/heads/main:refs/tags/miyume-sm8350-5.4.302

          clo=https://git.codelinaro.org/clo/la/kernel/msm-5.4.git
          if git -C kernel fetch --no-tags --depth=1 "$clo" \
              refs/heads/kernel.lnx.5.4.r1-rel:refs/tags/clo-msm-5.4-r1-rel; then
            echo "C0061_DIRECT_302_CLO_FETCH=PASS"
          else
            echo "C0061_DIRECT_302_CLO_FETCH=UNAVAILABLE"
          fi

      - name: Materialize Candidate0058 BPF Stage-A payload
        run: |
          set -euo pipefail
          cat package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part00 \
              package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part01 \
              package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part02 \
              package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz.part03 \
            > package/reconstruction/overlays/candidate_0058_bpf_ringbuf.patch.gz

      - name: Materialize durable stock ABI oracle
        id: stock_abi
        run: |
          set -euo pipefail
          git -C package lfs install --local
          git -C package lfs pull --include="reconstruction/stock/stock-Image/boot.img"
          boot="package/reconstruction/stock/stock-Image/boot.img"
          test -s "$boot"
          test "$(stat -c %s "$boot")" -eq 201326592
          test "$(sha256sum "$boot" | awk '{print $1}')" = e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
          mkdir -p stock-abi
          python3 package/reconstruction/scripts/extract_stock_ikheaders_from_boot.py \
            --boot "$boot" --out stock-abi/stock-kheaders \
            --manifest candidate-0061-direct-302-stock-ikheaders.json \
            2>&1 | tee candidate-0061-direct-302-stock-ikheaders.log
          grep -q '^LISA_STOCK_IKHEADERS_EXTRACT=PASS$' candidate-0061-direct-302-stock-ikheaders.log

      - name: Recreate frozen Candidate0059 source contract
        id: c0059
        env:
          PYTHONPATH: ${{ github.workspace }}/package/reconstruction/scripts
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
        run: |
          set -euo pipefail
          rm -rf kernel/out && mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          python3 package/reconstruction/scripts/candidate_0059_factory.py
          python3 package/reconstruction/scripts/candidate_0061_recreate_c0059_uplift.py \
            --package package --kernel kernel \
            2>&1 | tee candidate-0061-direct-302-c0059-source.log
          grep -q '^C0061_C0059_IPA_PAS_INHERITANCE=PASS$' candidate-0061-direct-302-c0059-source.log
          grep -q '^C0061_C0059_QXM_IPA_QOS_INHERITANCE=PASS$' candidate-0061-direct-302-c0059-source.log
          grep -q '^C0061_C0059_STOCK_WATCHDOG_KCONFIG_INHERITANCE=PASS$' candidate-0061-direct-302-c0059-source.log
          grep -q '^C0061_C0059_STOCK_WATCHDOG_FINAL_GATE=PASS$' candidate-0061-direct-302-c0059-source.log
          grep -q '^C0061_C0059_RAW_LATCH_INHERITANCE=PASS$' candidate-0061-direct-302-c0059-source.log
          grep -q '^C0061_C0059_RAW_LATCH_FINAL_GATE=PASS$' candidate-0061-direct-302-c0059-source.log
          grep -q '^C0059_INHERITED_SOURCE_STACK_RECREATED=PASS$' candidate-0061-direct-302-c0059-source.log

      - name: Install integrated build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 curl xz-utils unzip git rsync kmod file

      - name: Cache stock-generation AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install exact stock-generation clang
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'

      - name: Prepare Candidate0059 same-run control config
        id: control_config
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          rm -rf kernel/out
          mkdir -p kernel/out
          cp kernel/reconstruction/stock_ikconfig kernel/out/.config
          kernel/scripts/config --file kernel/out/.config --set-str LOCALVERSION "-qgki-lisa-c0059-r43da7c5-by-Tim0320" -d LOCALVERSION_AUTO -d COMPAT_VDSO -d ARM64_USE_LSE_ATOMICS -d RELR -e PERF_HELPER -e MILLET_CGROUP -e MILLET_SIG -e MILLET_BINDER -e MILLET_PKG -e MILLET_BINDER_GKI -e MILLET_CORE -e MILLET_HS -e BOARD_XIAOMI_LISA -e MIHW -e PACKAGE_RUNTIME_INFO -e MIGT --set-val QCOM_WATCHDOG_BARK_TIME 20000 --set-val QCOM_WATCHDOG_PET_TIME 15000
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LOCALVERSION= olddefconfig prepare scripts 2>&1 | tee candidate-0061-integrated-control-config.log
          grep -q '^CONFIG_MIHW=y$' kernel/out/.config
          grep -q '^CONFIG_MIGT=y$' kernel/out/.config
          grep -q '^CONFIG_PACKAGE_RUNTIME_INFO=y$' kernel/out/.config
          grep -q '^CONFIG_MODVERSIONS=y$' kernel/out/.config
          grep -q '^CONFIG_CFI_CLANG=y$' kernel/out/.config
          grep -q '^CONFIG_NFC_QTI_I2C=m$' kernel/out/.config
          grep -q '^CONFIG_I2C=y$' kernel/out/.config
          grep -q '^CONFIG_QCOM_WATCHDOG_BARK_TIME=20000$' kernel/out/.config
          grep -q '^CONFIG_QCOM_WATCHDOG_PET_TIME=15000$' kernel/out/.config
          grep -q '^CONFIG_LOCALVERSION="-qgki-lisa-c0059-r43da7c5-by-Tim0320"$' kernel/out/.config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' kernel/out/.config
          cp kernel/out/.config candidate-0061-integrated-control.config
          sha256sum candidate-0061-integrated-control.config | tee candidate-0061-integrated-control-config.sha256
          echo C0061_INTEGRATED_CONTROL_CONFIG=PASS

      - name: Build Candidate0059 same-run ABI control
        id: control_build
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LOCALVERSION= Image modules dtbs 2>&1 | tee candidate-0061-integrated-control-build.log
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/Module.symvers
          test "$(find kernel/out -name '*.ko' -type f | wc -l)" -gt 0
          cp kernel/out/Module.symvers candidate-0061-integrated-control.Module.symvers
          sha256sum candidate-0061-integrated-control.Module.symvers | tee candidate-0061-integrated-control.Module.symvers.sha256
          sha256sum kernel/out/arch/arm64/boot/Image | tee candidate-0061-integrated-control-Image.sha256
          echo C0061_INTEGRATED_C0059_CONTROL_COMPILE_MODPOST=PASS

      - name: Restore Candidate0059 ABI compatibility contract
        id: compat
        env:
          PYTHONPATH: ${{ github.workspace }}/package/reconstruction/scripts
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee candidate-0061-direct-302-compat.log
          from pathlib import Path
          import candidate_0061_c0059_abi_compat as compat
          compat.apply(Path("package").resolve(), Path("kernel").resolve())
          print("C0061_DIRECT_302_C0059_ABI_COMPAT=PASS")
          PY
          grep -q '^C0061_DIRECT_302_C0059_ABI_COMPAT=PASS$' candidate-0061-direct-302-compat.log
          git -C kernel diff --check

      - name: Scan complete 5.4.289 to 5.4.302 semantic surface
        id: scan
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_direct_302_scan.py \
            --source kernel --out candidate-0061-direct-302-scan.json \
            2>&1 | tee candidate-0061-direct-302-scan.log
          grep -q '^C0061_DIRECT_302_SCAN=PASS$' candidate-0061-direct-302-scan.log
          count="$(python3 -c "import json;print(json.load(open('candidate-0061-direct-302-scan.json'))['semantic_review_count'])")"
          echo "semantic_review_count=$count" >> "$GITHUB_OUTPUT"

      - name: Apply Direct-302 semantic review decisions
        id: review
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_direct_302_review_gate.py \
            --scan candidate-0061-direct-302-scan.json \
            2>&1 | tee candidate-0061-direct-302-review.log
          grep -q '^C0061_DIRECT_302_REVIEW_GATE=PASS$' candidate-0061-direct-302-review.log
          raw="$(python3 -c 'import json; p=json.load(open("candidate-0061-direct-302-scan.json")); print(p["semantic_review_count"])')"
          reviewed="$(python3 -c 'import json; p=json.load(open("candidate-0061-direct-302-scan.json")); print(p["reviewed_semantic_count"])')"
          unresolved="$(python3 -c 'import json; p=json.load(open("candidate-0061-direct-302-scan.json")); print(p["unresolved_semantic_count"])')"
          echo "semantic_review_count=$raw" >> "$GITHUB_OUTPUT"
          echo "reviewed_semantic_count=$reviewed" >> "$GITHUB_OUTPUT"
          echo "unresolved_semantic_count=$unresolved" >> "$GITHUB_OUTPUT"

      - name: Gate Direct-302 semantic closure
        id: closure
        run: |
          set -euo pipefail
          count="${{ steps.review.outputs.unresolved_semantic_count }}"
          if [ "$count" -ne 0 ]; then
            echo "C0061_DIRECT_302_SEMANTIC_CLOSURE=BLOCKED unresolved=$count"
            exit 1
          fi
          echo "C0061_DIRECT_302_SEMANTIC_CLOSURE=PASS raw=${{ steps.review.outputs.semantic_review_count }} reviewed=${{ steps.review.outputs.reviewed_semantic_count }} unresolved=$count"

      - name: Materialize Direct-302 source tree
        id: apply
        env:
          PYTHONPATH: ${{ github.workspace }}/package/reconstruction/scripts
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_direct_302_apply.py \
            --source kernel \
            --scan candidate-0061-direct-302-scan.json \
            --report candidate-0061-direct-302-apply.json \
            2>&1 | tee candidate-0061-direct-302-apply.log
          grep -q '^C0061_DIRECT_302_APPLY=PASS$' candidate-0061-direct-302-apply.log
          grep -q '^source_identity=5.4.302$' candidate-0061-direct-302-apply.log
          grep -q '^git_diff_check=PASS$' candidate-0061-direct-302-apply.log

      - name: Restore C0059 KMI exports after Direct-302 materialization
        id: post_compat
        env:
          PYTHONPATH: ${{ github.workspace }}/package/reconstruction/scripts
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee candidate-0061-direct-302-post-compat.log
          from pathlib import Path
          import candidate_0061_c0059_abi_compat as compat
          compat.apply(Path("package").resolve(), Path("kernel").resolve())
          print("C0061_DIRECT_302_POST_COMPAT=PASS")
          PY
          grep -q '^C0061_DIRECT_302_POST_COMPAT=PASS$' candidate-0061-direct-302-post-compat.log
          grep -q 'irq_set_affinity_hint' package/candidate-0061-c0059-abi-compat.txt
          grep -q 'qdisc_warn_nonwc' package/candidate-0061-c0059-abi-compat.txt
          grep -q 'EXPORT_SYMBOL_GPL(irq_set_affinity_hint);' kernel/kernel/irq/manage.c
          grep -q 'EXPORT_SYMBOL(qdisc_warn_nonwc);' kernel/net/sched/sch_api.c
          grep -q 'static inline unsigned int qdisc_peek_len' kernel/include/net/pkt_sched.h
          grep -q '__irq_apply_affinity_hint' kernel/include/linux/interrupt.h
          grep -q '^SUBLEVEL = 302$' kernel/Makefile
          git -C kernel diff --check

      - name: Gate Candidate0059 runtime contract after Direct-302
        id: runtime_contract
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_c0059_runtime_contract_gate.py \
            --source kernel \
            --json candidate-0061-post-302-runtime-contract.json \
            2>&1 | tee candidate-0061-post-302-runtime-contract.log
          grep -q '^C0061_POST_302_C0059_RUNTIME_CONTRACT=PASS$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_qxm_ipa_qos_hard_disabled=1$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_qxm_ipa_qosbox_null=1$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_qxm_ipa_runtime_marker=1$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_watchdog_bark_default_20000=1$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_watchdog_bark_range_11000_20000=1$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_watchdog_pet_default_15000=1$' candidate-0061-post-302-runtime-contract.log
          grep -q '^RUNTIME_CONTRACT_watchdog_pet_range_9360_15000=1$' candidate-0061-post-302-runtime-contract.log
          git -C kernel diff --check

      - name: Apply device-evidence NFC cdev race guard
        id: nfc_guard
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_nfc_cdev_guard.py \
            --source kernel \
            --json candidate-0061-nfc-cdev-guard.json \
            2>&1 | tee candidate-0061-nfc-cdev-guard.log
          grep -q '^C0061_NFC_CDEV_GUARD=PASS$' candidate-0061-nfc-cdev-guard.log
          grep -q '^NFC_CDEV_open_checks_inode_before_container_of=1$' candidate-0061-nfc-cdev-guard.log
          grep -q '^NFC_CDEV_close_prefers_private_data=1$' candidate-0061-nfc-cdev-guard.log
          grep -q 'NFC cdev unavailable' kernel/drivers/nfc/qti/nfc_common.c
          git -C kernel diff --check

      - name: Prepare integrated 5.4.302 target config
        id: target_config
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          rm -rf kernel/out
          mkdir -p kernel/out
          cp candidate-0061-integrated-control.config kernel/out/.config
          short="${GITHUB_SHA:0:7}"
          kernel/scripts/config --file kernel/out/.config --set-str LOCALVERSION "-qgki-lisa-c0061-r${short}-by-Tim0320" -d LOCALVERSION_AUTO
          kernel/scripts/config --file kernel/out/.config -e NFC_QTI_I2C
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LOCALVERSION= olddefconfig prepare scripts 2>&1 | tee candidate-0061-integrated-target-config.log
          grep -q '^CONFIG_MIHW=y$' kernel/out/.config
          grep -q '^CONFIG_MIGT=y$' kernel/out/.config
          grep -q '^CONFIG_PACKAGE_RUNTIME_INFO=y$' kernel/out/.config
          grep -q '^CONFIG_MODVERSIONS=y$' kernel/out/.config
          grep -q '^CONFIG_CFI_CLANG=y$' kernel/out/.config
          grep -q '^CONFIG_NFC_QTI_I2C=y$' kernel/out/.config
          grep -q '^CONFIG_I2C=y$' kernel/out/.config
          grep -q '^CONFIG_QCOM_WATCHDOG_BARK_TIME=20000$' kernel/out/.config
          grep -q '^CONFIG_QCOM_WATCHDOG_PET_TIME=15000$' kernel/out/.config
          grep -q "^CONFIG_LOCALVERSION=\"-qgki-lisa-c0061-r${short}-by-Tim0320\"$" kernel/out/.config
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' kernel/out/.config
          grep -q '^SUBLEVEL = 302$' kernel/Makefile
          cp kernel/out/.config candidate-0061-integrated-target.config
          diff -u candidate-0061-integrated-control.config candidate-0061-integrated-target.config > candidate-0061-integrated-config.diff || true
          sha256sum candidate-0061-integrated-target.config | tee candidate-0061-integrated-target-config.sha256
          echo C0061_INTEGRATED_302_CONFIG=PASS

      - name: Compile integrated 5.4.302 Image modules dtbs
        id: target_build
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ github.workspace }}/stock-abi/stock-kheaders
          CONFIG_USE_COMMON_CAMERA: y
        run: |
          set -euo pipefail
          make -C kernel -j"$(nproc)" O="$PWD/kernel/out" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- LOCALVERSION= Image modules dtbs 2>&1 | tee candidate-0061-integrated-build.log
          test -s kernel/out/arch/arm64/boot/Image
          test -s kernel/out/Module.symvers
          test -s kernel/out/System.map
          test "$(find kernel/out -name '*.ko' -type f | wc -l)" -gt 0
          sha256sum kernel/out/arch/arm64/boot/Image | tee candidate-0061-integrated-Image.sha256
          echo C0061_INTEGRATED_302_COMPILE_MODPOST=PASS


      - name: Verify guarded NFC is built into Image (EXPERIMENT; NOT FLASHABLE)
        id: nfc_module_inventory
        shell: bash
        run: |
          set -euo pipefail
          find kernel/out -type f -name '*.ko' -print | sort | tee candidate-0061-module-inventory.txt
          find kernel/out -type f -name 'nfc_i2c.ko' -print | tee candidate-0061-nfc-module-candidates.txt
          test ! -s candidate-0061-nfc-module-candidates.txt
          grep -qx 'CONFIG_NFC_QTI_I2C=y' kernel/out/.config
          test -s kernel/out/vmlinux
          strings kernel/out/vmlinux | grep -F 'NFC cdev unavailable' > /dev/null
          mkdir -p candidate-0061-runtime-modules
          echo 'BUILTIN_NFC_GUARD_PRESENT_NO_VENDOR_MODULE_DEPLOYED=PASS' | tee candidate-0061-nfc-runtime-module-gate.txt
          echo 'EXPERIMENT_NOT_FLASHABLE' > candidate-0061-nfc-module-modinfo.txt
          echo 'UNVERIFIED_ANDROID_OLD_VENDOR_MODULE_RELOAD' > candidate-0061-nfc-builtin-runtime-risk.txt

      - name: Audit integrated 5.4.302 ABI and KMI
        id: abi
        if: ${{ steps.target_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 - candidate-0061-integrated-control.Module.symvers kernel/out/Module.symvers candidate-0061-integrated-abi.json <<'PY'
          import json, sys
          from pathlib import Path
          def load(path):
              out = {}
              for raw in Path(path).read_text(errors="replace").splitlines():
                  fields = raw.split()
                  if len(fields) >= 2:
                      out[fields[1]] = fields[0].lower()
              return out
          control = load(sys.argv[1])
          target = load(sys.argv[2])
          changed = {k: {"control": control[k], "target": target[k]} for k in sorted(control.keys() & target.keys()) if control[k] != target[k]}
          removed = {k: control[k] for k in sorted(control.keys() - target.keys())}
          added = {k: target[k] for k in sorted(target.keys() - control.keys())}
          compat = {"lisa_mtdoops_checkpoint", "qcom_scm_get_download_mode"}
          result = {
              "control": "same-run frozen Candidate0059 source/config control",
              "target": "Candidate0061 Direct 5.4.302 integrated target",
              "changed_crc_count": len(changed),
              "removed_symbol_count": len(removed),
              "added_symbol_count": len(added),
              "changed": changed,
              "removed": removed,
              "added": added,
              "provenance_contract": {
                  "source_delta": "official Linux stable v5.4.289->v5.4.302 plus 34 reviewed Direct-302 semantic adapters including runtime-PM MIXED_CONFLICT",
                  "compat_symbols": sorted(compat),
                  "rule": "removed must be zero; changed/added occur only after reviewed stable materialization and C0059 ABI compatibility layer",
              },
              "compat_added_present": sorted(compat & set(added)),
          }
          Path(sys.argv[3]).write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({"changed_crc_count": len(changed), "removed_symbol_count": len(removed), "added_symbol_count": len(added), "compat_added_present": sorted(compat & set(added))}, sort_keys=True))
          if removed:
              raise SystemExit("C0061_ABI_REMOVED_SYMBOLS_NONZERO")
          print("C0061_INTEGRATED_ABI_KMI_GATE=PASS removed=0")
          PY

      - name: Gate every changed or added ABI symbol to provenance
        id: abi_provenance
        if: ${{ steps.abi.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 package/reconstruction/scripts/candidate_0061_abi_provenance_gate.py \
            --abi candidate-0061-integrated-abi.json \
            --scan candidate-0061-direct-302-scan.json \
            --package package \
            --json candidate-0061-integrated-abi-provenance.json \
            2>&1 | tee candidate-0061-integrated-abi-provenance.log
          grep -q '^C0061_ABI_PROVENANCE_GATE=PASS ' candidate-0061-integrated-abi-provenance.log

      - name: Gate integrated 5.4.302 kernel identity
        id: identity
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          expected="5.4.302-qgki-lisa-c0061-r${short}-by-Tim0320"
          actual="$(make -s -C kernel O="$PWD/kernel/out" ARCH=arm64 LOCALVERSION= kernelrelease)"
          echo "expected_kernelrelease=$expected" | tee candidate-0061-integrated-identity.txt
          echo "actual_kernelrelease=$actual" | tee -a candidate-0061-integrated-identity.txt
          test "$actual" = "$expected"
          grep -aFq "$expected" kernel/out/arch/arm64/boot/Image
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image=Path("kernel/out/arch/arm64/boot/Image").read_bytes()
          if len(image) < 0x3c or struct.unpack_from("<I", image, 0x38)[0] != 0x644D5241:
              raise SystemExit("ARM64 Image magic mismatch")
          print("C0061_INTEGRATED_ARM64_IMAGE_MAGIC=PASS")
          PY
          sha256sum kernel/out/arch/arm64/boot/Image | tee -a candidate-0061-integrated-identity.txt
          echo C0061_INTEGRATED_IDENTITY_GATE=PASS | tee -a candidate-0061-integrated-identity.txt

      - name: Package and statically validate Candidate0061 boot.img
        id: package_boot
        env:
          STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
          STOCK_BOOT_BYTES: "201326592"
          STOCK_KERNEL_REGION_BYTES: "51436032"
          STOCK_RAMDISK_BYTES: "19883180"
          STOCK_RAMDISK_SHA256: 0dc218f3167e560444634a6a8cf969eb4470bcf452837a3e23bf45ea0a6819ae
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          target="5.4.302-qgki-lisa-c0061-r${short}-by-Tim0320"
          python3 package/reconstruction/scripts/candidate_0061_fixed_region_boot.py \
            --stock package/reconstruction/stock/stock-Image/boot.img \
            --kernel kernel/out/arch/arm64/boot/Image \
            --out boot.img \
            --validation candidate-0061-integrated-boot-validation.txt \
            --target-release "$target" \
            --expected-stock-sha "$STOCK_BOOT_SHA256" \
            --expected-partition-size "$STOCK_BOOT_BYTES" \
            --expected-stock-kernel-size "$STOCK_KERNEL_REGION_BYTES" \
            --expected-stock-ramdisk-size "$STOCK_RAMDISK_BYTES" \
            --expected-stock-ramdisk-sha "$STOCK_RAMDISK_SHA256"
          sha256sum boot.img | tee boot.img.sha256
          grep -q '^C0061_INTEGRATED_BOOT_STATIC_GATE=PASS$' candidate-0061-integrated-boot-validation.txt
          grep -q '^C0061_FIXED_REGION_BOOT_GATE=PASS$' candidate-0061-integrated-boot-validation.txt
          grep -qx 'CONFIG_NFC_QTI_I2C=y' kernel/out/.config
          grep -q '^check_header_page_byte_exact=1$' candidate-0061-integrated-boot-validation.txt
          grep -q '^check_changed_bytes_outside_kernel_region_zero=1$' candidate-0061-integrated-boot-validation.txt
          grep -q '^check_stock_avb0_metadata_byte_exact=1$' candidate-0061-integrated-boot-validation.txt
          grep -q '^check_stock_avbf_footer_byte_exact=1$' candidate-0061-integrated-boot-validation.txt

      - name: Report integrated 5.4.302 gate evidence
