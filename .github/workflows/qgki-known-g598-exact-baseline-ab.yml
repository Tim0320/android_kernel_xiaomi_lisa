name: Repack Lisa Candidate 0007 known-g598 A/B on exact OS2.0.10

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-known-g598-exact-baseline-ab.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-candidate-0007-known-g598-exact-os2-0-10
  cancel-in-progress: true

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASELINE_ARTIFACT_ID: "10754191797"
      BASELINE_BOOT_SHA256: 0959eaa1bc914d570792b53207fc9f481b3986c8b9f2a0ec2a76a1fd625a3c1f
      BASELINE_IMAGE_SHA256: 2162041efe1e4ac3e86bd934d4ccd9a4e00c5cd80e23c8085dfd0e0995430166
      BASELINE_RELEASE: 5.4.289-qgki-g4c23b1a30923
      G598_ARTIFACT_ID: "10710943414"
      G598_IMAGE_SHA256: 492b0b3910d1425cf434ec946851de73d40003f14adb29e695403bf5b60c2b55
      G598_RELEASE: 5.4.289-qgki-g5987d69e25da
      G598_SOURCE_SHA: 6e568aabc77a06fa787baec1d9e60e4b559874a3
      STOCK_BOOT_BYTES: "201326592"

    steps:
      - name: Install verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip file python3

      - name: Download exact OS2.0.10 baseline and known-g598 Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline-evidence g598-evidence

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl -fL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "$output"
          }

          download_artifact "$BASELINE_ARTIFACT_ID" baseline-evidence.zip
          unzip -q baseline-evidence.zip -d baseline-evidence
          download_artifact "$G598_ARTIFACT_ID" g598-evidence.zip
          unzip -q g598-evidence.zip -d g598-evidence

          find baseline-evidence g598-evidence -maxdepth 6 -type f -printf '%p %s bytes\n' | sort | tee artifact-files.txt

      - name: Authenticate exact OS2.0.10 stock baseline
        run: |
          set -euo pipefail
          stock_boot="$(find baseline-evidence -type f -path '*/official/boot.img' -print -quit)"
          stock_image="$(find baseline-evidence -type f -name official-stock-Image -print -quit)"
          baseline_report="$(find baseline-evidence -type f -name baseline-report.txt -print -quit)"
          stock_layout="$(find baseline-evidence -type f -name official-boot-layout.txt -print -quit)"

          test -n "$stock_boot" && test -s "$stock_boot"
          test -n "$stock_image" && test -s "$stock_image"
          test -n "$baseline_report" && test -s "$baseline_report"
          test -n "$stock_layout" && test -s "$stock_layout"

          test "$(sha256sum "$stock_boot" | awk '{print $1}')" = "$BASELINE_BOOT_SHA256"
          test "$(sha256sum "$stock_image" | awk '{print $1}')" = "$BASELINE_IMAGE_SHA256"
          test "$(stat -c '%s' "$stock_boot")" = "$STOCK_BOOT_BYTES"
          grep -Fqx "target_release=$BASELINE_RELEASE" "$baseline_report"
          grep -Fqx "official_boot_sha256=$BASELINE_BOOT_SHA256" "$baseline_report"
          grep -Fqx "official_image_sha256=$BASELINE_IMAGE_SHA256" "$baseline_report"
          grep -Fqx 'OS2_0_10_STOCK_BOOT_GATE=PASS' "$baseline_report"
          grep -Fqx 'arm64_image_magic=PASS' "$stock_layout"

          cp "$stock_boot" stock-boot.img
          cp "$stock_image" stock-Image
          cp "$baseline_report" baseline-report.txt
          cp "$stock_layout" official-boot-layout.txt
          sha256sum stock-boot.img stock-Image | tee exact-baseline.sha256

      - name: Authenticate known-g598 Image that reached Linux
        run: |
          set -euo pipefail
          image="$(find g598-evidence -type f -path '*/out/arch/arm64/boot/Image' -print -quit)"
          if [[ -z "$image" ]]; then
            image="$(find g598-evidence -type f -name Image -print -quit)"
          fi
          image_sha_file="$(find g598-evidence -type f -name rebuilt-image-sha256.txt -print -quit)"

          test -n "$image" && test -s "$image"
          test "$(sha256sum "$image" | awk '{print $1}')" = "$G598_IMAGE_SHA256"
          if [[ -n "$image_sha_file" ]]; then
            grep -Fq "$G598_IMAGE_SHA256" "$image_sha_file"
          fi

          cp "$image" known-g598-Image

          python3 - <<'PY' | tee known-g598-image-validation.txt
          from pathlib import Path
          import hashlib, struct, os

          b = Path("known-g598-Image").read_bytes()
          target = os.environ["G598_RELEASE"].encode()
          sha = hashlib.sha256(b).hexdigest()
          magic = struct.unpack_from("<I", b, 0x38)[0]
          text_offset = struct.unpack_from("<Q", b, 8)[0]
          image_size = struct.unpack_from("<Q", b, 16)[0]
          flags = struct.unpack_from("<Q", b, 24)[0]

          print(f"sha256={sha}")
          print(f"file_bytes={len(b)}")
          print(f"magic=0x{magic:08x}")
          print(f"text_offset=0x{text_offset:x}")
          print(f"image_size=0x{image_size:x}")
          print(f"flags=0x{flags:x}")
          print(f"target_release_present={int(target in b)}")

          if sha != os.environ["G598_IMAGE_SHA256"]:
              raise SystemExit("known-g598 Image SHA mismatch")
          if magic != 0x644D5241:
              raise SystemExit("known-g598 Image ARM64 magic mismatch")
          if text_offset != 0x80000:
              raise SystemExit("known-g598 Image text_offset mismatch")
          if flags != 0xA:
              raise SystemExit("known-g598 Image flags mismatch")
          if target not in b:
              raise SystemExit("known-g598 release missing")
          print("KNOWN_G598_IMAGE_GATE=PASS")
          PY

      - name: Compare stock and known-g598 ARM64 headers
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee known-g598-vs-stock-header.txt
          from pathlib import Path
          import struct

          def parse(path):
              b=Path(path).read_bytes()
              return {
                  "code0": struct.unpack_from("<I", b, 0)[0],
                  "code1": struct.unpack_from("<I", b, 4)[0],
                  "text_offset": struct.unpack_from("<Q", b, 8)[0],
                  "image_size": struct.unpack_from("<Q", b, 16)[0],
                  "flags": struct.unpack_from("<Q", b, 24)[0],
                  "res2": struct.unpack_from("<Q", b, 32)[0],
                  "res3": struct.unpack_from("<Q", b, 40)[0],
                  "res4": struct.unpack_from("<Q", b, 48)[0],
                  "magic": struct.unpack_from("<I", b, 0x38)[0],
                  "res5": struct.unpack_from("<I", b, 60)[0],
                  "file_bytes": len(b),
              }

          stock=parse("stock-Image")
          test=parse("known-g598-Image")
          for k in stock:
              sv=stock[k]
              tv=test[k]
              print(f"{k}: stock={sv:#x} g598={tv:#x} equal={int(sv==tv)}")
          for k in ("text_offset","flags","res2","res3","res4","magic","res5"):
              if stock[k] != test[k]:
                  raise SystemExit(f"critical ARM64 hard field differs: {k}")
          print("KNOWN_G598_ARM64_HEADER_GATE=PASS")
          PY

      - name: Repack diagnostic Candidate 0007 on exact OS2.0.10 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, os

          stock=Path("stock-boot.img").read_bytes()
          kernel=Path("known-g598-Image").read_bytes()
          target=os.environ["G598_RELEASE"].encode()
          page=4096

          def align(v,a):
              return (v+a-1)//a*a
          def sha(b):
              return hashlib.sha256(b).hexdigest()

          if stock[:8] != b"ANDROID!":
              raise SystemExit("stock baseline is not Android boot image")
          if len(stock) != int(os.environ["STOCK_BOOT_BYTES"]):
              raise SystemExit("unexpected stock boot size")
          if struct.unpack_from("<I", stock, 40)[0] != 3:
              raise SystemExit("expected Android boot header v3")
          if struct.unpack_from("<I", kernel, 0x38)[0] != 0x644D5241:
              raise SystemExit("known-g598 Image lacks ARM64 magic")
          if target not in kernel:
              raise SystemExit("known-g598 release missing")

          stock_kernel_size=struct.unpack_from("<I", stock, 8)[0]
          ramdisk_size=struct.unpack_from("<I", stock, 12)[0]
          stock_ramdisk_off=align(page+stock_kernel_size,page)
          ramdisk=stock[stock_ramdisk_off:stock_ramdisk_off+ramdisk_size]
          if len(ramdisk) != ramdisk_size:
              raise SystemExit("stock ramdisk truncated")

          header=bytearray(stock[:page])
          struct.pack_into("<I",header,8,len(kernel))
          out=bytearray(header)
          out.extend(kernel)
          out.extend(b"\0"*(align(len(out),page)-len(out)))
          new_ramdisk_off=len(out)
          out.extend(ramdisk)
          out.extend(b"\0"*(align(len(out),page)-len(out)))
          logical_end=len(out)
          if logical_end > len(stock):
              raise SystemExit("diagnostic boot exceeds stock partition")
          out.extend(b"\0"*(len(stock)-len(out)))
          out=bytes(out)
          Path("boot.img").write_bytes(out)

          ksz=struct.unpack_from("<I",out,8)[0]
          rsz=struct.unpack_from("<I",out,12)[0]
          roff=align(page+ksz,page)
          kout=out[page:page+ksz]
          rout=out[roff:roff+rsz]

          checks={
              "android_magic":out[:8]==b"ANDROID!",
              "header_v3":struct.unpack_from("<I",out,40)[0]==3,
              "header_metadata_except_kernel_size_preserved":out[12:page]==stock[12:page],
              "kernel_hash_exact":sha(kout)==sha(kernel),
              "ramdisk_hash_preserved":sha(rout)==sha(ramdisk),
              "partition_size_preserved":len(out)==len(stock),
              "target_release_present":target in kout,
              "tail_zeroed":not any(out[logical_end:]),
              "stale_avb_footer_absent":not(len(out)>=64 and out[-64:-60]==b"AVBf"),
          }
          failed=[k for k,v in checks.items() if not v]
          lines=[
              "# Lisa Candidate 0007 controlled A/B diagnostic",
              "purpose=known-g598-kernel_on_exact-OS2.0.10-baseline",
              f"stock_boot_sha256={sha(stock)}",
              f"known_g598_image_sha256={sha(kernel)}",
              f"known_g598_image_bytes={len(kernel)}",
              f"stock_ramdisk_sha256={sha(ramdisk)}",
              f"new_ramdisk_offset={new_ramdisk_off}",
              f"new_logical_end={logical_end}",
              f"new_boot_bytes={len(out)}",
              f"new_boot_sha256={sha(out)}",
          ]
          lines += [f"check_{k}={int(v)}" for k,v in checks.items()]
          Path("candidate-0007-static-validation.txt").write_text("\n".join(lines)+"\n")
          print(Path("candidate-0007-static-validation.txt").read_text(),end="")
          if failed:
              raise SystemExit("Candidate 0007 validation failed: "+", ".join(failed))
          PY
          sha256sum boot.img | tee boot.img.sha256
          file boot.img

      - name: Final Candidate 0007 A/B diagnostic gate
        run: |
          set -euo pipefail
          grep -Fqx 'KNOWN_G598_IMAGE_GATE=PASS' known-g598-image-validation.txt
          grep -Fqx 'KNOWN_G598_ARM64_HEADER_GATE=PASS' known-g598-vs-stock-header.txt
          grep -Fqx "stock_boot_sha256=$BASELINE_BOOT_SHA256" candidate-0007-static-validation.txt
          grep -Fqx "known_g598_image_sha256=$G598_IMAGE_SHA256" candidate-0007-static-validation.txt
          grep -Fqx 'check_android_magic=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_header_v3=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_header_metadata_except_kernel_size_preserved=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_kernel_hash_exact=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_ramdisk_hash_preserved=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_partition_size_preserved=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_target_release_present=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_tail_zeroed=1' candidate-0007-static-validation.txt
          grep -Fqx 'check_stale_avb_footer_absent=1' candidate-0007-static-validation.txt

          boot_sha="$(sha256sum boot.img | awk '{print $1}')"
          {
            echo '# Lisa Candidate 0007 controlled A/B'
            echo "baseline_artifact_id=$BASELINE_ARTIFACT_ID"
            echo "g598_artifact_id=$G598_ARTIFACT_ID"
            echo "g598_source_sha=$G598_SOURCE_SHA"
            echo "g598_image_sha256=$G598_IMAGE_SHA256"
            echo "boot_img_sha256=$boot_sha"
            echo "kernel_release=$G598_RELEASE"
            echo 'known_real_device_evidence=entered-linux-and-registered-ramoops'
            echo 'vendor_module_compatibility=NOT_A_FINAL_GATE'
            echo 'purpose=isolate-exact-baseline-vs-g4c23-composite-regression'
            echo 'LISA_CANDIDATE_0007_AB_GATE=PASS'
          } | tee candidate-0007-report.txt

      - name: Upload Candidate 0007 diagnostic boot.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0007-known-g598-exact-os2-0-10-ab
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
          path: |
            boot.img
            boot.img.sha256
            candidate-0007-report.txt
            candidate-0007-static-validation.txt
            known-g598-image-validation.txt
            known-g598-vs-stock-header.txt
            known-g598-Image
            exact-baseline.sha256
            baseline-report.txt
            official-boot-layout.txt
            stock-Image
            artifact-files.txt
