name: Probe exact Lahaina tag-tip QGKI ABI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/abi-lahaina-tagtip-matrix.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lahaina-16700-mirror
            repo: https://github.com/Skywalker-I005/Skywalker-ZS673KS.git
            ref: 58f8584f8aef8b3d493a81e1a0ce5c34d6dd2d22
            source: merge-snapshot
          - label: lahaina-18400.02-qssi12
            repo: https://github.com/Wcoom/kernel_xiaomi_haydn.git
            ref: cc27e795a125d4c26bc843c34a6e6574fb5a836e
            source: exact-tag-parent
          - label: lahaina-18600.02-qssi12
            repo: https://github.com/PixelExperience-Lemonadep/kernel_oneplus_sm8350.git
            ref: 846e80aba10f06141d1a125745a59f74610b812c
            source: exact-tag-parent
          - label: lahaina-18900-qssi12
            repo: https://github.com/SparkOS-lemonade-lemonadep/kernel_oneplus_sm8350.git
            ref: cda32b04803a5fb8e9f9b7368f9be022d2576ba0
            source: exact-tag-parent
          - label: lahaina-19500-qssi12
            repo: https://github.com/MCterra10/Kirisakura_SAKE_Zenfone_8.git
            ref: bcf162c8441e7ee4f9e33de4c57ab53a9a03e2f3
            source: exact-tag-parent
          - label: lahaina-19800.01-qssi12
            repo: https://github.com/xiaomi-lisa-devs/android_kernel_xiaomi_sm8350-old.git
            ref: 5223d47048579451e35627b9aa90cce54b6aa8d9
            source: exact-tag-parent
          - label: lahaina-20000.01-qssi12
            repo: https://github.com/Edward-Projects/android_kernel_asus_sm8350.git
            ref: 72be295fb59a844e42d772bf49d1f98646641d3f
            source: exact-tag-parent

    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc bison flex build-essential libssl-dev libelf-dev             gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git curl rsync

      - name: Cache AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install AOSP clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ -x "$DEST/bin/clang" ]] && "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'; then
            exit 0
          fi
          curl -L --fail --retry 5             "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"             -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$DEST"

      - name: Fetch exact mirrored Qualcomm revision
        run: |
          set -euo pipefail
          mkdir kernel
          git -C kernel init
          git -C kernel remote add origin "${{ matrix.repo }}"
          git -C kernel fetch --depth=1 origin "${{ matrix.ref }}"
          git -C kernel checkout --detach FETCH_HEAD
          cd kernel

          echo "LAHAINA_LABEL=${{ matrix.label }}"
          echo "LAHAINA_SOURCE=${{ matrix.source }}"
          echo "LAHAINA_EXPECTED_REF=${{ matrix.ref }}"
          echo "LAHAINA_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"

          echo "=== kernel version ==="
          sed -n '1,6p' Makefile
          echo "=== GKI version ==="
          cat android/GKI_VERSION 2>/dev/null || true

          echo "=== lower-layer hashes ==="
          for p in             android/abi_gki_aarch64_qcom             android/abi_gki_aarch64_qcom_internal             arch/arm64/configs/vendor/lahaina_GKI.config             arch/arm64/configs/vendor/lahaina_QGKI.config             include/linux/android_kabi.h             include/linux/device.h             include/linux/module.h             include/scsi/scsi_device.h; do
            if [[ -f "$p" ]]; then
              sha256sum "$p"
            else
              echo "MISSING $p"
            fi
          done

      - name: Generate native Lahaina QGKI defconfig
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          TARGET_BUILD_VARIANT: user
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export REAL_CC=clang
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          test -f arch/arm64/configs/vendor/lahaina_GKI.config
          test -f arch/arm64/configs/vendor/lahaina_QGKI.config
          chmod +x scripts/gki/generate_defconfig.sh

          scripts/gki/generate_defconfig.sh vendor/lahaina-qgki_defconfig

          mkdir -p out
          make O=out             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             CLANG_TRIPLE=aarch64-linux-gnu-             vendor/lahaina-qgki_defconfig

          echo "=== native qgki identity ==="
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_QGKI|CONFIG_ARCH_LAHAINA|CONFIG_ARCH_YUPIK|CONFIG_MODVERSIONS|CONFIG_TRIM_UNUSED_KSYMS)=' out/.config || true

          make -j"$(nproc)" O=out             ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_COMPAT=arm-linux-gnueabi-             CLANG_TRIPLE=aarch64-linux-gnu- prepare scripts

      - name: Build core ABI objects
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set +e
          cd kernel
          targets=(
            kernel/module.o
            drivers/base/core.o
            drivers/base/platform.o
            drivers/base/power/runtime.o
            drivers/of/base.o
            drivers/of/address.o
            drivers/clk/clk.o
            drivers/iommu/iommu.o
            drivers/regulator/core.o
            kernel/kthread.o
            kernel/irq/irqdomain.o
            fs/sysfs/group.o
            lib/kobject.o
            mm/page_alloc.o
            kernel/dma/direct.o
            kernel/dma/mapping.o
            drivers/dma-buf/dma-buf.o
          )
          for t in "${targets[@]}"; do
            make -j"$(nproc)" O=out KBUILD_SYMTYPES=1               ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1               CROSS_COMPILE=aarch64-linux-gnu-               CROSS_COMPILE_COMPAT=arm-linux-gnueabi-               CLANG_TRIPLE=aarch64-linux-gnu- "$t" || true
          done
          exit 0

      - name: Score exact tag-tip QGKI fingerprint
        run: |
          set -euo pipefail
          cd kernel
          find out -name '*.symversions' -type f -print0 | xargs -0 cat > /tmp/all.symversions || true
          label="${{ matrix.label }}"
          score=0
          total=0

          check() {
            local symbol="$1" expected="$2"
            local actual
            total=$((total+1))
            actual="$(sed -n "s/^__crc_${symbol} = \(0x[0-9a-fA-F]*\);/\1/p" /tmp/all.symversions | head -n1)"
            actual="${actual,,}"
            echo "$label: $symbol candidate=${actual:-MISSING} stock=$expected"
            [[ "$actual" == "$expected" ]] && score=$((score+1)) || true
          }

          check module_layout 0xba39cbb8
          check device_register 0xcf9bcdee
          check device_unregister 0x4678e0d9
          check dev_driver_string 0x22a8544f
          check device_create 0xbebfb31d
          check __platform_driver_register 0x8a28799a
          check platform_driver_unregister 0xb1643fd1
          check platform_get_irq 0xbcc683a6
          check platform_get_resource 0x0b50f5aa
          check platform_get_resource_byname 0x67870233
          check __pm_runtime_resume 0xd7ceaec5
          check pm_runtime_enable 0x69233960
          check of_find_property 0x7bfb6ef3
          check of_get_property 0x3f86cb17
          check of_parse_phandle 0x5d8562ca
          check of_address_to_resource 0x6f7055af
          check of_device_is_compatible 0xb56ea40d
          check clk_get 0xf8127647
          check clk_register 0xab9a55da
          check iommu_attach_device 0x0c54e55f
          check iommu_map 0xa106c11d
          check iommu_unmap 0xe1da4443
          check regulator_get 0xf7c6097c
          check regulator_enable 0x691df2d6
          check regulator_set_voltage 0x54cdbf0a
          check kthread_create_on_node 0x947eb746
          check kthread_stop 0x97198f13
          check irq_domain_remove 0x160aa18c
          check irq_find_mapping 0x6fb78324
          check sysfs_create_group 0x0965d890
          check kobject_create_and_add 0x93a00376
          check __free_pages 0x419e8d31
          check adjust_managed_page_count 0xcf0c4b39
          check dma_direct_map_page 0x803f2855
          check dma_direct_map_sg 0x9e7457c3
          check dma_alloc_attrs 0x1c3c2bb3
          check dma_buf_attach 0x995856d1
          check dma_buf_map_attachment 0x3d20e038

          echo "TAGTIP_QGKI_SCORE=$score/$total"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagtip-qgki-${{ matrix.label }}
          retention-days: 5
          include-hidden-files: true
          path: |
            kernel/out/.config
            kernel/out/**/*.symversions
            kernel/out/**/*.symtypes
            kernel/android/GKI_VERSION
            kernel/android/abi_gki_aarch64_qcom
            kernel/android/abi_gki_aarch64_qcom_internal
            kernel/arch/arm64/configs/vendor/lahaina_GKI.config
            kernel/arch/arm64/configs/vendor/lahaina_QGKI.config
