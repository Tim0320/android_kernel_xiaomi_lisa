name: Build Lisa CN firmware control pack for TW super

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-lisa-cn-firmware-tw-super-control.yml

permissions:
  contents: read

# Deliberately reuse the previous comparison concurrency group so this
# replaces the slow full TW-fastboot download experiment.
concurrency:
  group: lisa-tw-fastboot-vs-cn-early-firmware
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CN_OTA_URL: https://bigota.d.miui.com/OS2.0.16.0.UKOCNXM/lisa-ota_full-OS2.0.16.0.UKOCNXM-user-14.0-6326c122fd.zip
      EXPECT_CN_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
      EXPECT_CN_VENDOR_BOOT_SHA256: c0a7528e8eacd2a86270ee017dfe90e657f1a0c5c40527869f89e915c2954a5a
      EXPECT_CN_DTBO_SHA256: db7c50147d8217c41cd86e53dda6e8ce93a5928a8f06ece8da92955a9c0e7ba7

    steps:
      - name: Checkout reconstruction metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install extraction dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git pkg-config libbrotli-dev liblzma-dev libzstd-dev

      - name: Build pinned payload dumper
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/xishang0128/payload-dumper-go.git /tmp/payload-dumper-go
          cd /tmp/payload-dumper-go
          git checkout --detach 4cc6ef94039470d659e4199c67f76d8962280023
          go build -trimpath -o "$GITHUB_WORKSPACE/payload-dumper" ./cmd/payload-dumper

      - name: Confirm CN OTA partition inventory
        run: |
          set -euo pipefail
          ./payload-dumper list "$CN_OTA_URL" | tee cn-partitions.txt

          python3 - <<'PY'
          from pathlib import Path

          requested = [
              'abl','aop','bluetooth','boot','cpucp','devcfg','dsp','dtbo',
              'featenabler','hyp','imagefv','keymaster','modem','qupfw','shrm',
              'tz','uefisecapp','vendor_boot','xbl','xbl_config'
          ]
          text = Path('cn-partitions.txt').read_text(errors='replace')
          listed = {
              line.split()[0]
              for line in text.splitlines()
              if line.strip() and not line.startswith('Total ') and not line.startswith('Elapsed time:')
          }
          present = [p for p in requested if p in listed]
          missing = [p for p in requested if p not in present]
          Path('selected-cn-partitions.txt').write_text('\n'.join(present) + '\n')
          Path('cn-partition-selection.txt').write_text(
              'present=' + ','.join(present) + '\n' +
              'missing=' + ','.join(missing) + '\n'
          )
          if any(p not in present for p in ('boot','vendor_boot','dtbo','abl','xbl','xbl_config')):
              raise SystemExit('critical CN boot/firmware partition missing')
          print(Path('cn-partition-selection.txt').read_text(), end='')
          PY

      - name: Extract CN control firmware
        run: |
          set -euo pipefail
          mkdir -p package/images
          parts="$(paste -sd, selected-cn-partitions.txt)"
          ./payload-dumper extract "$CN_OTA_URL" \
            -p "$parts" \
            -o package/images \
            --http-workers 4 \
            --part-size 8M
          sha256sum package/images/*.img | sort | tee package/SHA256SUMS.txt

      - name: Authenticate known CN boot chain
        run: |
          set -euo pipefail
          boot_sha="$(sha256sum package/images/boot.img | awk '{print $1}')"
          vendor_boot_sha="$(sha256sum package/images/vendor_boot.img | awk '{print $1}')"
          dtbo_sha="$(sha256sum package/images/dtbo.img | awk '{print $1}')"

          test "$boot_sha" = "$EXPECT_CN_BOOT_SHA256"
          test "$vendor_boot_sha" = "$EXPECT_CN_VENDOR_BOOT_SHA256"
          test "$dtbo_sha" = "$EXPECT_CN_DTBO_SHA256"

          {
            echo "CN_BOOT_EXACT=PASS"
            echo "CN_VENDOR_BOOT_EXACT=PASS"
            echo "CN_DTBO_EXACT=PASS"
            echo "cn_boot_sha256=$boot_sha"
            echo "cn_vendor_boot_sha256=$vendor_boot_sha"
            echo "cn_dtbo_sha256=$dtbo_sha"
          } | tee package/cn-control-gate.txt

      - name: Write controlled flash matrix
        run: |
          set -euo pipefail
          cat > package/FLASH_MATRIX.md <<'EOF'
          # Lisa CN firmware + TW super control

          Purpose: normalize the pre-kernel firmware and stock boot chain to CN OS2.0.16.0.UKOCNXM while preserving the current Taiwan OS2.0.5.0.UKOTWXM dynamic userspace in `super`.

          ## Preserve from TW / current device

          - `super`
          - `vbmeta_system` (and `vbmeta_vendor` if present)
          - `userdata`
          - slot B is intentionally left untouched as a fallback

          Keep the current top-level `vbmeta` for the first control test. The bootloader is unlocked/orange and can tolerate the CN `boot_a`/`vendor_boot_a`/`dtbo_a` hash mismatch, while keeping the TW AVB chain for the TW logical partitions avoids introducing a second userspace-verification variable.

          ## Flash CN to slot A only

          The package contains CN OS2.0.16 images for the following logical firmware names when available:

          `abl aop bluetooth cpucp devcfg dsp featenabler hyp imagefv keymaster modem qupfw shrm tz uefisecapp xbl xbl_config`

          It also contains the CN control boot chain:

          `boot vendor_boot dtbo`

          ## Test sequence

          1. Start from working fastboot/bootloader access and keep slot B untouched.
          2. Flash the listed CN firmware images to their `_a` partition names.
          3. Flash CN stock `boot_a`, `vendor_boot_a`, and `dtbo_a`.
          4. Do not flash `super`, `vbmeta_system`, or userdata.
          5. Set active slot A and boot.
          6. If this CN-stock-control + TW-super combination boots, replace only `boot_a` with the reconstructed Candidate 0008 boot and test again. That isolates the reconstructed kernel from firmware/userspace variables.

          This package intentionally does not auto-flash a device.
          EOF

          cat > package/verify-package.ps1 <<'EOF'
          $ErrorActionPreference = 'Stop'
          Get-Content "$PSScriptRoot\SHA256SUMS.txt" | ForEach-Object {
              if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
                  $expected = $matches[1]
                  $path = Join-Path $PSScriptRoot ($matches[2] -replace '^package/', '')
                  $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
                  if ($actual -ne $expected) { throw "SHA256 mismatch: $path" }
              }
          }
          Write-Host 'PACKAGE_SHA256_GATE=PASS'
          EOF

      - name: Final static gate
        run: |
          set -euo pipefail
          grep -Fqx 'CN_BOOT_EXACT=PASS' package/cn-control-gate.txt
          grep -Fqx 'CN_VENDOR_BOOT_EXACT=PASS' package/cn-control-gate.txt
          grep -Fqx 'CN_DTBO_EXACT=PASS' package/cn-control-gate.txt
          test -s package/images/abl.img
          test -s package/images/xbl.img
          test -s package/images/xbl_config.img
          test -s package/FLASH_MATRIX.md
          echo 'LISA_CN_FIRMWARE_TW_SUPER_CONTROL_GATE=PASS' | tee package/final-gate.txt

      - name: Upload CN firmware control package
        uses: actions/upload-artifact@v4
        with:
          name: lisa-cn-os2-0-16-firmware-tw-super-control
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            package/
            cn-partition-selection.txt
