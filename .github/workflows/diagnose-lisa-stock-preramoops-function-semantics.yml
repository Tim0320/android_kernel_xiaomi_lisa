name: Diagnose Lisa stock pre-ramoops function semantics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-lisa-stock-preramoops-function-semantics.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-stock-preramoops-function-semantics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STOCK_BOOT: stock-main/reconstruction/stock/stock-Image/boot.img
      STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
      C0014_ARTIFACT_ID: "10802392237"
      C0014_IMAGE_SHA256: 47b1a9126866c31db49ae0bdf06bb7e0205ae516dcc65552d231914c126b7094

    steps:
      - name: Checkout healthy stock boot
        uses: actions/checkout@v4
        with:
          ref: main
          path: stock-main
          lfs: true
          fetch-depth: 1

      - name: Checkout reconstructed source
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          path: reconstructed-source
          fetch-depth: 1

      - name: Install recovery and disassembly tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip curl unzip binutils-aarch64-linux-gnu
          python3 -m pip install --break-system-packages pyelftools \
            git+https://github.com/marin-m/vmlinux-to-elf.git@19683fb95b29cd31362d49e6f48ab8368f96cbdf
          command -v kallsyms-finder
          command -v vmlinux-to-elf
          command -v aarch64-linux-gnu-objdump

      - name: Extract exact stock and Candidate 0014 Images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$STOCK_BOOT" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import struct

          boot = Path("stock-main/reconstruction/stock/stock-Image/boot.img").read_bytes()
          if boot[:8] != b"ANDROID!":
              raise SystemExit("bad stock boot magic")
          kernel_size = struct.unpack_from("<I", boot, 8)[0]
          Path("stock-Image").write_bytes(boot[4096:4096 + kernel_size])
          print(f"STOCK_IMAGE_BYTES={kernel_size}")
          PY

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C0014_ARTIFACT_ID}/zip" \
            -o c0014.zip
          mkdir -p c0014
          unzip -q c0014.zip -d c0014
          img="$(find c0014 -type f -name candidate-0014-Image -print -quit)"
          test -n "$img"
          test -s "$img"
          cp "$img" candidate-0014-Image
          test "$(sha256sum candidate-0014-Image | awk '{print $1}')" = "$C0014_IMAGE_SHA256"

      - name: Recover kallsyms and ELF
        run: |
          set -euo pipefail
          kallsyms-finder stock-Image > stock.kallsyms
          kallsyms-finder candidate-0014-Image > c0014.kallsyms
          test -s stock.kallsyms
          test -s c0014.kallsyms
          vmlinux-to-elf stock-Image stock.elf > stock-vmlinux-to-elf.log 2>&1
          vmlinux-to-elf candidate-0014-Image c0014.elf > c0014-vmlinux-to-elf.log 2>&1
          test -s stock.elf
          test -s c0014.elf

      - name: Resolve initcall stubs and follow CFI jump tables
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import struct
          import subprocess
          from elftools.elf.elffile import ELFFile

          targets = [
              "cpufreq_times_init",
              "pm_debug_init",
              "alarm_record_init",
              "uevent_record_init",
          ]
          line_rx = re.compile(r"^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.+?)\s*$")
          branch_rx = re.compile(r"\b(?:b|bl)\s+([0-9a-fA-F]+)\s+<([^>]+)>")

          def parse(path):
              rows = []
              for raw in Path(path).read_text(errors="replace").splitlines():
                  match = line_rx.match(raw)
                  if match:
                      rows.append((int(match.group(1), 16), match.group(2), match.group(3)))
              return rows

          def disassemble(start, stop):
              return subprocess.run(
                  [
                      "aarch64-linux-gnu-objdump", "-d",
                      f"--start-address=0x{start:x}",
                      f"--stop-address=0x{stop:x}",
                      "stock.elf",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          stock = parse("stock.kallsyms")
          cand = parse("c0014.kallsyms")
          text_addrs = sorted({addr for addr, typ, _ in stock if typ in "TtWw"})
          if not text_addrs:
              raise SystemExit("no stock text symbols")
          image_base = text_addrs[0]
          u64_mask = (1 << 64) - 1

          def next_text(addr, cap):
              greater = [value for value in text_addrs if value > addr]
              return min(greater[0] if greater else addr + cap, addr + cap)

          def names_at(addr):
              return sorted(name for value, typ, name in stock if value == addr and typ in "TtWw")

          def resolve_relocated_pointer(path, vaddr):
              with open(path, "rb") as stream:
                  elf = ELFFile(stream)
                  for section in elf.iter_sections():
                      if section["sh_type"] not in ("SHT_RELA", "SHT_REL"):
                          continue
                      for reloc in section.iter_relocations():
                          if int(reloc["r_offset"]) != vaddr:
                              continue
                          rtype = int(reloc["r_info_type"])
                          if section["sh_type"] == "SHT_RELA":
                              target = int(reloc["r_addend"]) & u64_mask
                              return target, f"elf-reloc-section:{section.name}:type={rtype}"
                          raise SystemExit(f"REL without addend at initcall slot 0x{vaddr:x}")

              syms = {
                  name: addr
                  for addr, _, name in stock
                  if name in ("__rela_dyn_start", "__rela_dyn_end")
              }
              if "__rela_dyn_start" not in syms or "__rela_dyn_end" not in syms:
                  raise SystemExit(f"no relocation source for initcall slot 0x{vaddr:x}")

              raw = Path("stock-Image").read_bytes()
              off_start = syms["__rela_dyn_start"] - image_base
              off_end = syms["__rela_dyn_end"] - image_base
              if off_start < 0 or off_end > len(raw) or off_end <= off_start:
                  raise SystemExit("bad raw .rela.dyn bounds")
              if (off_end - off_start) % 24:
                  raise SystemExit("raw .rela.dyn size is not Elf64_Rela aligned")

              for off in range(off_start, off_end, 24):
                  r_offset, r_info, r_addend = struct.unpack_from("<QQq", raw, off)
                  if r_offset == vaddr:
                      return int(r_addend) & u64_mask, f"raw-rela-dyn:type={r_info & 0xffffffff}:entry_off=0x{off:x}"
              raise SystemExit(f"no relocation found for initcall slot 0x{vaddr:x}")

          cand_init_targets = {
              target
              for _, _, name in cand
              if name.startswith("__initcall_")
              for target in targets
              if target in name
          }

          output_rows = []
          for target in targets:
              entries = [
                  (addr, name)
                  for addr, _, name in stock
                  if name.startswith("__initcall_") and target in name
              ]
              if len(entries) != 1:
                  raise SystemExit(f"expected one stock initcall pointer for {target}, got {entries}")

              ptr_addr, init_symbol = entries[0]
              stub_start, reloc_source = resolve_relocated_pointer("stock.elf", ptr_addr)
              if not (image_base <= stub_start < image_base + 0x40000000):
                  raise SystemExit(f"decoded target outside stock VA range for {target}: 0x{stub_start:x}")

              stub_stop = next_text(stub_start, 0x40)
              stub_text = disassemble(stub_start, stub_stop)
              Path(f"stock-{target}-stub.S").write_text(stub_text)
              stub_names = names_at(stub_start)

              impl_start = stub_start
              impl_source = "direct-initcall-target"
              if any(".cfi_jt" in name for name in stub_names):
                  branch = None
                  for line in stub_text.splitlines():
                      match = branch_rx.search(line)
                      if match:
                          branch = (int(match.group(1), 16), match.group(2).split("+", 1)[0])
                          break
                  if branch is None:
                      raise SystemExit(f"CFI jump-table stub for {target} has no direct branch")
                  impl_start = branch[0]
                  impl_source = f"cfi-jt-branch:{branch[1]}"

              impl_stop = next_text(impl_start, 0x10000)
              if impl_stop <= impl_start:
                  raise SystemExit(f"bad implementation range for {target}")
              impl_text = disassemble(impl_start, impl_stop)
              if not impl_text.strip():
                  raise SystemExit(f"empty implementation disassembly for {target}")
              Path(f"stock-{target}-body.S").write_text(impl_text)
              impl_names = names_at(impl_start)

              output_rows.append((
                  target,
                  stub_start,
                  stub_stop,
                  stub_stop - stub_start,
                  impl_start,
                  impl_stop,
                  impl_stop - impl_start,
                  int(target in cand_init_targets),
                  ptr_addr,
                  init_symbol,
                  ",".join(stub_names) if stub_names else "<none>",
                  ",".join(impl_names) if impl_names else "<none>",
                  reloc_source,
                  impl_source,
              ))

          header = (
              "function\tstub_start\tstub_stop\tstub_bytes\timpl_start\timpl_stop\timpl_bytes\t"
              "present_in_c0014\tstock_initcall_ptr\tstock_initcall_symbol\tstub_symbols\timpl_symbols\t"
              "relocation_source\timplementation_source"
          )
          lines = [
              f"{target}\t0x{stub_start:x}\t0x{stub_stop:x}\t{stub_size}\t"
              f"0x{impl_start:x}\t0x{impl_stop:x}\t{impl_size}\t{present}\t"
              f"0x{ptr:x}\t{init_symbol}\t{stub_symbols}\t{impl_symbols}\t{reloc_source}\t{impl_source}"
              for (
                  target, stub_start, stub_stop, stub_size, impl_start, impl_stop, impl_size,
                  present, ptr, init_symbol, stub_symbols, impl_symbols, reloc_source, impl_source
              ) in output_rows
          ]
          Path("bounded-ranges.tsv").write_text(header + "\n" + "\n".join(lines) + "\n")
          Path("bounded-ranges.txt").write_text(
              header + "\n" + "\n".join(lines) + "\nCFI_JUMP_TABLE_FOLLOW=PASS\n"
          )
          print(Path("bounded-ranges.txt").read_text())
          PY

      - name: Classify implementation callees
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              "cpufreq_times_init",
              "pm_debug_init",
              "alarm_record_init",
              "uevent_record_init",
          ]
          branch_rx = re.compile(r"\b(?:bl|b)\s+[0-9a-fA-F]+\s+<([^>]+)>")
          kallsyms_rx = re.compile(r"^[0-9a-fA-F]+\s+[A-Za-z?]\s+(.+?)\s*$")
          hash_rx = re.compile(r"\$[0-9a-fA-F]{16,}$")

          def normalize(name):
              name = name.split("+", 1)[0]
              name = name.removesuffix(".cfi_jt")
              return hash_rx.sub("", name)

          candidate_symbols = set()
          for raw in Path("c0014.kallsyms").read_text(errors="replace").splitlines():
              match = kallsyms_rx.match(raw)
              if match:
                  candidate_symbols.add(normalize(match.group(1)))

          debug_terms = (
              "proc_", "debug", "trace", "record", "log", "sysfs", "seq_",
              "kobject", "uevent", "alarm", "time_in_state", "uid_", "stats",
          )
          critical_terms = (
              "panic", "restart", "reboot", "poweroff", "power_off", "watchdog",
              "psci", "scm", "smmu", "iommu", "irq", "gic", "mmu", "clk",
              "regulator", "ufs", "qcom", "rpmh", "spmi", "thermal",
          )

          summary = []
          for target in targets:
              text = Path(f"stock-{target}-body.S").read_text(errors="replace")
              calls = []
              for line in text.splitlines():
                  match = branch_rx.search(line)
                  if not match:
                      continue
                  callee = normalize(match.group(1))
                  if callee != normalize(target) and callee not in calls:
                      calls.append(callee)

              joined = " ".join([target] + calls).lower()
              debug_hits = sorted({term for term in debug_terms if term in joined})
              critical_hits = sorted({term for term in critical_terms if term in joined})
              missing = [callee for callee in calls if callee not in candidate_symbols]
              if critical_hits:
                  role = "needs-critical-review"
              elif debug_hits:
                  role = "likely-observability-accounting"
              else:
                  role = "undetermined"

              summary.extend([
                  f"TARGET={target}",
                  f"BODY_DIRECT_CALL_COUNT={len(calls)}",
                  "BODY_DIRECT_CALLS=" + ",".join(calls),
                  f"BODY_DIRECT_CALLS_MISSING_IN_C0014={len(missing)}",
                  "BODY_MISSING_CALLEES=" + ",".join(missing),
                  "DEBUG_RECORD_HINTS=" + ",".join(debug_hits),
                  "PLATFORM_CRITICAL_HINTS=" + ",".join(critical_hits),
                  f"SEMANTIC_ROLE={role}",
                  "",
              ])

          Path("function-semantics-summary.txt").write_text("\n".join(summary) + "\n")
          print(Path("function-semantics-summary.txt").read_text())
          PY

      - name: Cross-check reconstructed source lineage
        run: |
          set -euo pipefail
          {
            echo '### reconstructed-source SHA'
            git -C reconstructed-source rev-parse HEAD
            echo
            echo '### cpufreq_times source tail'
            tail -n 60 reconstructed-source/drivers/cpufreq/cpufreq_times.c
            echo
            echo '### exact target search'
            for fn in cpufreq_times_init pm_debug_init alarm_record_init uevent_record_init; do
              echo "## $fn"
              git -C reconstructed-source grep -n -F "$fn" -- '*.c' '*.h' '*.S' '*Kconfig*' '*Makefile*' || true
            done
          } | tee reconstructed-lineage.txt

      - name: Final gate
        run: |
          set -euo pipefail
          grep -Fq 'CFI_JUMP_TABLE_FOLLOW=PASS' bounded-ranges.txt
          for fn in cpufreq_times_init pm_debug_init alarm_record_init uevent_record_init; do
            grep -Fq "TARGET=${fn}" function-semantics-summary.txt
            test -s "stock-${fn}-stub.S"
            test -s "stock-${fn}-body.S"
          done
          {
            cat bounded-ranges.tsv
            cat function-semantics-summary.txt
            echo 'LISA_STOCK_PRERAMOOPS_FUNCTION_SEMANTICS=PASS'
          } | tee final.txt

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-stock-preramoops-function-semantics
          retention-days: 14
          if-no-files-found: warn
          path: |
            final.txt
            bounded-ranges.txt
            bounded-ranges.tsv
            function-semantics-summary.txt
            reconstructed-lineage.txt
            stock-*-stub.S
            stock-*-body.S
            stock.kallsyms
            c0014.kallsyms
            stock-vmlinux-to-elf.log
            c0014-vmlinux-to-elf.log
