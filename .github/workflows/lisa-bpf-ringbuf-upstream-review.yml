name: Review pinned upstream BPF ring buffer patches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/lisa-bpf-ringbuf-upstream-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch explicitly pinned public upstream patches
        run: |
          set -euo pipefail
          mkdir upstream
          for sha in 457f44363a8894135c85b7a9afd2bd8196db24ab 5b029a32cfe4600f5e10e36b41778506b90fd4de 4e9077638301816a7d73fa1e1b4c1db4a7e3b59c; do
            curl --retry 3 --fail --location "https://github.com/torvalds/linux/commit/$sha.patch" -o "upstream/$sha.patch"
            grep -Fq "From $sha " "upstream/$sha.patch"
          done
          (cd upstream && sha256sum *.patch > SHA256SUMS)
          printf '%s\n' 'Signed upstream sources for audit; no runtime patch or boot is built by this job.' > upstream/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lisa-upstream-ringbuf-patches
          retention-days: 14
          if-no-files-found: error
          path: upstream/
