name: Diagnose Lisa known-good early entry path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-lisa-known-good-early-entry.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-known-good-early-entry
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STOCK_BOOT: stock-main/reconstruction/stock/stock-Image/boot.img
      STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
      C0014_ARTIFACT_ID: "10802392237"
      C0014_IMAGE_SHA256: 47b1a9126866c31db49ae0bdf06bb7e0205ae516dcc65552d231914c126b7094

    steps:
      - name: Checkout known-good stock boot
        uses: actions/checkout@v4
        with:
          ref: main
          path: stock-main
          lfs: true
          fetch-depth: 1

      - name: Install recovery and disassembly tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip curl unzip binutils-aarch64-linux-gnu
          python3 -m pip install --break-system-packages \
            git+https://github.com/marin-m/vmlinux-to-elf.git@19683fb95b29cd31362d49e6f48ab8368f96cbdf
          command -v kallsyms-finder
          command -v vmlinux-to-elf
          command -v aarch64-linux-gnu-objdump

      - name: Extract exact Images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$STOCK_BOOT" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("stock-main/reconstruction/stock/stock-Image/boot.img").read_bytes()
          if b[:8] != b"ANDROID!":
              raise SystemExit("bad stock boot")
          ksz=struct.unpack_from("<I", b, 8)[0]
          Path("stock-Image").write_bytes(b[4096:4096+ksz])
          PY

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C0014_ARTIFACT_ID}/zip" \
            -o c0014.zip
          mkdir c0014
          unzip -q c0014.zip -d c0014
          img="$(find c0014 -type f -name candidate-0014-Image -print -quit)"
          test -n "$img" && test -s "$img"
          cp "$img" candidate-0014-Image
          test "$(sha256sum candidate-0014-Image | awk '{print $1}')" = "$C0014_IMAGE_SHA256"

      - name: Recover kallsyms and ELF
        run: |
          set -euo pipefail
          kallsyms-finder stock-Image > stock.kallsyms
          kallsyms-finder candidate-0014-Image > c0014.kallsyms
          test -s stock.kallsyms
          test -s c0014.kallsyms

          vmlinux-to-elf stock-Image stock.elf >/tmp/stock-vmlinux-to-elf.log 2>&1
          vmlinux-to-elf candidate-0014-Image c0014.elf >/tmp/c0014-vmlinux-to-elf.log 2>&1
          test -s stock.elf
          test -s c0014.elf

      - name: Compare early entry symbol anchors
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee early-entry-anchor-summary.txt
          from pathlib import Path
          import re

          line_rx=re.compile(r"^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.+?)\s*$")

          def parse(path):
              out={}
              for raw in Path(path).read_text(errors="replace").splitlines():
                  m=line_rx.match(raw)
                  if m:
                      out[m.group(3)]=(int(m.group(1),16),m.group(2))
              return out

          s=parse("stock.kallsyms")
          c=parse("c0014.kallsyms")

          targets=[
            "_text","stext","__primary_switch","__primary_switched",
            "__cpu_setup","__enable_mmu","__create_page_tables",
            "start_kernel","setup_arch","setup_machine_fdt",
            "early_fixmap_init","paging_init","bootmem_init",
            "memblock_init","mm_init","trap_init","irqchip_init",
            "time_init","console_init","rest_init"
          ]

          first_missing=None
          lines=[]
          for name in targets:
              sv=s.get(name); cv=c.get(name)
              lines.append(f"TARGET={name} STOCK_PRESENT={int(sv is not None)} C0014_PRESENT={int(cv is not None)}")
              if sv:
                  lines.append(f"STOCK_{name}_ADDR={sv[0]:016x}")
              if cv:
                  lines.append(f"C0014_{name}_ADDR={cv[0]:016x}")
              if sv and not cv and first_missing is None:
                  first_missing=name

          common=[name for name in targets if name in s and name in c]
          if common:
              sbase=s[common[0]][0]; cbase=c[common[0]][0]
              for name in common:
                  so=s[name][0]-sbase
                  co=c[name][0]-cbase
                  lines.append(f"REL_{name}_STOCK={so}")
                  lines.append(f"REL_{name}_C0014={co}")
                  lines.append(f"REL_{name}_EQUAL={int(so==co)}")

          lines.append(f"FIRST_MISSING_EARLY_ANCHOR={first_missing or '<none>'}")
          lines.append("EARLY_ENTRY_SYMBOL_ANCHOR_GATE=PASS")
          print("\n".join(lines))
          PY

      - name: Resolve bounded early function ranges
        run: |
          set -euo pipefail
          mkdir -p bounded
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets=["stext","__primary_switch","__primary_switched","start_kernel","setup_arch","early_fixmap_init","paging_init"]
          line_rx=re.compile(r"^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.+?)\s*$")

          def canon(name):
              name=re.sub(r"\.cfi_jt$", "", name)
              name=re.sub(r"\.llvm\.[0-9A-Fa-f]+$", "", name)
              name=re.sub(r"\.(?:isra|constprop|part)\.\d+$", "", name)
              name=re.sub(r"\.\d{3,}$", "", name)
              return name

          def parse(path):
              rows=[]
              for raw in Path(path).read_text(errors="replace").splitlines():
                  m=line_rx.match(raw)
                  if not m or m.group(2) not in "Tt":
                      continue
                  rows.append((int(m.group(1),16),m.group(2),m.group(3)))
              rows.sort(key=lambda x:(x[0],x[2]))
              return rows

          def choose(rows,target):
              exact=[r for r in rows if r[2]==target]
              if exact:
                  return exact[0]
              matches=[r for r in rows if canon(r[2])==target and not r[2].endswith(".cfi_jt")]
              if matches:
                  return matches[0]
              matches=[r for r in rows if canon(r[2])==target]
              return matches[0] if matches else None

          for label,path in (("stock","stock.kallsyms"),("c0014","c0014.kallsyms")):
              rows=parse(path)
              addrs=sorted(set(r[0] for r in rows))
              out=[]
              for target in targets:
                  row=choose(rows,target)
                  if row is None:
                      out.append(f"{target}\tMISSING\tMISSING\tMISSING")
                      continue
                  start=row[0]
                  greater=[a for a in addrs if a>start]
                  natural_stop=greater[0] if greater else start+0x10000
                  stop=min(natural_stop,start+0x10000)
                  if stop<=start:
                      raise SystemExit(f"bad range {label} {target}: {start:x}-{stop:x}")
                  out.append(f"{target}\t{start:016x}\t{stop:016x}\t{row[2]}")
              Path(f"bounded/{label}-ranges.tsv").write_text("\n".join(out)+"\n")
          PY

          cat bounded/stock-ranges.tsv
          cat bounded/c0014-ranges.tsv

      - name: Bounded-disassemble key early functions
        run: |
          set -euo pipefail
          for label in stock c0014; do
            elf="${label}.elf"
            while IFS=$'\t' read -r fn start stop provider; do
              if [ "$start" = MISSING ]; then
                : > "bounded/${label}-${fn}.S"
                continue
              fi
              aarch64-linux-gnu-objdump -d \
                --start-address="0x${start}" \
                --stop-address="0x${stop}" \
                "$elf" > "bounded/${label}-${fn}.S"
            done < "bounded/${label}-ranges.tsv"
          done

      - name: Normalize bounded disassembly and compare
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee early-entry-disasm-summary.txt
          from pathlib import Path
          import hashlib,re

          fns=["stext","__primary_switch","__primary_switched","start_kernel","setup_arch","early_fixmap_init","paging_init"]
          insn_rx=re.compile(r"^\s*[0-9a-f]+:\s+(?:[0-9a-f]{2}\s+){4}(.*)$",re.I)
          word_rx=re.compile(r"^\s*[0-9a-f]+:\s+[0-9a-f]{8}\s+(.*)$",re.I)

          def canon_symbol(name):
              name=re.sub(r"\+0x[0-9a-f]+$", "", name, flags=re.I)
              name=re.sub(r"\.cfi_jt$", "", name)
              name=re.sub(r"\.llvm\.[0-9A-Fa-f]+$", "", name)
              name=re.sub(r"\.(?:isra|constprop|part)\.\d+$", "", name)
              name=re.sub(r"\.\d{3,}$", "", name)
              return name

          def norm(path):
              out=[]
              for raw in Path(path).read_text(errors="replace").splitlines():
                  m=insn_rx.match(raw) or word_rx.match(raw)
                  if not m:
                      continue
                  text=m.group(1).strip()
                  def repl(match):
                      return "<"+canon_symbol(match.group(1))+">"
                  text=re.sub(r"<([^>]+)>",repl,text)
                  # Mask layout-dependent raw addresses while preserving symbolic targets.
                  text=re.sub(r"\b(?:0x)?f{4,}[0-9a-f]{6,}\b","<ADDR>",text,flags=re.I)
                  text=re.sub(r"\b[0-9a-f]{12,16}\b","<ADDR>",text,flags=re.I)
                  out.append(text)
              return "\n".join(out)

          def lines(path):
              n=norm(path)
              return n,len(n.splitlines()) if n else 0

          first_diff=None
          summary=[]
          for fn in fns:
              sp=Path(f"bounded/stock-{fn}.S")
              cp=Path(f"bounded/c0014-{fn}.S")
              sn,sl=lines(sp); cn,cl=lines(cp)
              sh=hashlib.sha256(sn.encode()).hexdigest()
              ch=hashlib.sha256(cn.encode()).hexdigest()
              eq=int(bool(sn) and bool(cn) and sn==cn)
              summary += [
                f"BOUNDED_{fn}_STOCK_LINES={sl}",
                f"BOUNDED_{fn}_C0014_LINES={cl}",
                f"BOUNDED_{fn}_NORMALIZED_EQUAL={eq}",
                f"BOUNDED_{fn}_STOCK_SHA256={sh}",
                f"BOUNDED_{fn}_C0014_SHA256={ch}",
              ]
              Path(f"bounded/stock-{fn}.norm").write_text(sn+"\n" if sn else "")
              Path(f"bounded/c0014-{fn}.norm").write_text(cn+"\n" if cn else "")
              if not eq and first_diff is None:
                  first_diff=fn

          summary.append(f"FIRST_BOUNDED_EARLY_DISASM_DIVERGENCE={first_diff or '<none>'}")
          summary.append("BOUNDED_EARLY_ENTRY_DISASM_GATE=PASS")
          print("\n".join(summary))
          PY

          # Reject the old failure mode: a supposedly present function producing no body.
          python3 - <<'PY'
          from pathlib import Path
          import re
          txt=Path("early-entry-disasm-summary.txt").read_text()
          for label in ("STOCK","C0014"):
              vals=[int(v) for v in re.findall(rf"^BOUNDED_.+_{label}_LINES=(\d+)$",txt,re.M)]
              if not vals or any(v==0 for v in vals):
                  raise SystemExit(f"bounded disassembly incomplete for {label}: {vals}")
          PY

      - name: Emit known-good decision matrix
        run: |
          set -euo pipefail
          {
            echo 'KNOWN_GOOD_REFERENCE=healthy-stock-boot-e6f8c978c2cf'
            echo 'PASS_COMPANION_CHAIN=stock-Image-3.09'
            echo 'PASS_USERSPACE=TW-global-OS2.0.8-super'
            echo 'PASS_BOOT_LAYOUT=header-ramdisk-AVB-byte-preserved'
            echo 'PASS_RAMOOPS_ANCHOR=level2-order8'
            echo 'PASS_QCOM_SCM_ANCHOR=level4-order133'
            echo 'PASS_MTDOOPS_ANCHOR=level6'
            grep '^FIRST_' early-entry-anchor-summary.txt
            grep '^FIRST_' early-entry-disasm-summary.txt
            echo 'LISA_KNOWN_GOOD_EARLY_ENTRY_DIAGNOSIS=PASS'
          } | tee known-good-early-entry.txt

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: lisa-known-good-early-entry-diagnosis
          retention-days: 14
          if-no-files-found: error
          path: |
            known-good-early-entry.txt
            early-entry-anchor-summary.txt
            early-entry-disasm-summary.txt
            bounded/
            stock.kallsyms
            c0014.kallsyms
