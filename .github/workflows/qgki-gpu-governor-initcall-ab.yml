name: Verify Lisa stock GPU governor initcalls

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qgki-gpu-governor-initcall-ab.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-qgki-gpu-governor-initcall-ab
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONFIG_ARTIFACT_ID: "10678326339"
      DIAG_ARTIFACT_ID: "10697586302"

    steps:
      - name: Checkout reconstructed source
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          fetch-depth: 1

      - name: Install build and kallsyms dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python3-pip curl unzip git rsync kmod
          python3 -m pip install --break-system-packages \
            git+https://github.com/marin-m/vmlinux-to-elf.git
          command -v kallsyms-finder

      - name: Cache clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"
          if [[ ! -x "$DEST/bin/clang" ]]; then
            curl -L --fail --retry 5 --retry-all-errors \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz" \
              -o "$ARCHIVE"
            tar -xzf "$ARCHIVE" -C "$DEST"
          fi
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Download validated config and stock diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONFIG_ARTIFACT_ID}/zip" \
            -o config.zip
          mkdir -p config
          unzip -q config.zip -d config
          test -s config/out/.config

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DIAG_ARTIFACT_ID}/zip" \
            -o diag.zip
          mkdir -p diag
          unzip -q diag.zip -d diag
          test -s diag/stock.kallsyms

      - name: Verify recovered gpubw lifecycle source
        run: |
          set -euo pipefail
          grep -Fq 'subsys_initcall(devfreq_gpubw_init);' drivers/gpu/msm/governor_gpubw_mon.c
          grep -Fq 'ret = devfreq_gpubw_init();' drivers/gpu/msm/kgsl_pwrscale.c
          grep -Fq 'devfreq_gpubw_registered' drivers/gpu/msm/governor_gpubw_mon.c
          git log -1 --format='%H %s' | tee reconstruction-head.txt

      - name: Build current reconstructed Image
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          KBUILD_BUILD_USER: builder
          KBUILD_BUILD_HOST: pangu-build-component-vendor
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cp config/out/.config out/.config

          # Keep the stock-proven providers already recovered by the main probe.
          scripts/config --file out/.config --enable PERF_HELPER
          scripts/config --file out/.config --disable DEBUG_FS
          scripts/config --file out/.config --enable QTI_TZ_LOG
          scripts/config --file out/.config --enable MILLET_CORE
          scripts/config --file out/.config --enable MILLET_BINDER_GKI
          scripts/config --file out/.config --enable MILLET_BINDER
          scripts/config --file out/.config --enable MILLET_PKG
          scripts/config --file out/.config --enable MILLET_HS
          scripts/config --file out/.config --enable MILLET_SIG
          scripts/config --file out/.config --enable MILLET_CGROUP

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- Image 2>&1 | tee gpu-governor-build.log

          test -s out/arch/arm64/boot/Image
          sha256sum out/arch/arm64/boot/Image | tee gpu-governor-image-sha256.txt
          cp out/.config final-config.txt

      - name: Verify gpubw stock initcall recovery
        run: |
          set -euo pipefail
          kallsyms-finder out/arch/arm64/boot/Image > rebuilt.kallsyms
          test -s rebuilt.kallsyms

          python3 - <<'PY' | tee gpu-governor-initcall-summary.txt
          from pathlib import Path
          import re

          line_rx = re.compile(r"^[0-9a-fA-F]+\s+[A-Za-z?]\s+(.+?)\s*$")
          prefix = re.compile(r"^__initcall_\d+_\d+_")

          def normalize(name):
              name = prefix.sub("", name)
              if name.endswith("early"):
                  name = name[:-5]
              elif name.endswith("rootfs"):
                  name = name[:-6]
              else:
                  name = re.sub(r"([0-7])s?$", "", name)
              return re.sub(r"\.\d+$", "", name)

          def initcalls(path):
              result = set()
              for raw in Path(path).read_text(errors="replace").splitlines():
                  m = line_rx.match(raw)
                  if m and "__initcall_" in m.group(1):
                      result.add(normalize(m.group(1)))
              return result

          stock = initcalls("diag/stock.kallsyms")
          rebuilt = initcalls("rebuilt.kallsyms")
          target = "devfreq_gpubw_init"
          stock_only = sorted(stock - rebuilt)

          print(f"STOCK_HAS_GPUBW={target in stock}")
          print(f"REBUILT_HAS_GPUBW={target in rebuilt}")
          print(f"NORMALIZED_STOCK_ONLY_INITCALLS={len(stock_only)}")
          print("NORMALIZED_STOCK_ONLY_LIST=" + ",".join(stock_only))

          Path("normalized-stock-only-gpu.txt").write_text("\n".join(stock_only) + "\n")
          if target not in stock:
              raise SystemExit("stock image unexpectedly lacks devfreq_gpubw_init")
          if target not in rebuilt:
              raise SystemExit("reconstructed Image did not recover devfreq_gpubw_init")
          PY

      - name: Upload GPU governor verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-qgki-gpu-governor-initcall-verify
          retention-days: 7
          if-no-files-found: warn
          path: |
            reconstruction-head.txt
            gpu-governor-build.log
            gpu-governor-image-sha256.txt
            gpu-governor-initcall-summary.txt
            normalized-stock-only-gpu.txt
            rebuilt.kallsyms
            final-config.txt
            out/arch/arm64/boot/Image
