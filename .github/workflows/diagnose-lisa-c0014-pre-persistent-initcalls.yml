name: Diagnose Lisa Candidate 0014 pre-persistent initcalls

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-lisa-c0014-pre-persistent-initcalls.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-c0014-pre-persistent-initcalls
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STOCK_BOOT: stock-main/reconstruction/stock/stock-Image/boot.img
      STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
      C0014_ARTIFACT_ID: "10802392237"
      C0014_IMAGE_SHA256: 47b1a9126866c31db49ae0bdf06bb7e0205ae516dcc65552d231914c126b7094

    steps:
      - name: Checkout healthy stock boot
        uses: actions/checkout@v4
        with:
          ref: main
          path: stock-main
          lfs: true
          fetch-depth: 1

      - name: Checkout reconstructed source
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          path: reconstructed-source
          fetch-depth: 1

      - name: Install symbol recovery tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip curl unzip
          python3 -m pip install --break-system-packages \
            git+https://github.com/marin-m/vmlinux-to-elf.git@19683fb95b29cd31362d49e6f48ab8368f96cbdf
          command -v kallsyms-finder

      - name: Extract healthy stock Image
        run: |
          set -euo pipefail
          test "$(sha256sum "$STOCK_BOOT" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("stock-main/reconstruction/stock/stock-Image/boot.img").read_bytes()
          if b[:8] != b"ANDROID!": raise SystemExit("bad stock boot")
          ksz=struct.unpack_from("<I",b,8)[0]
          Path("stock-Image").write_bytes(b[4096:4096+ksz])
          print(f"STOCK_IMAGE_BYTES={ksz}")
          PY

      - name: Download exact Candidate 0014 Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C0014_ARTIFACT_ID}/zip" \
            -o c0014.zip
          mkdir c0014
          unzip -q c0014.zip -d c0014
          img="$(find c0014 -type f -name candidate-0014-Image -print -quit)"
          test -n "$img" && test -s "$img"
          cp "$img" candidate-0014-Image
          test "$(sha256sum candidate-0014-Image | awk '{print $1}')" = "$C0014_IMAGE_SHA256"

      - name: Audit ARM64 Image headers
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee image-header-summary.txt
          from pathlib import Path
          import struct

          def parse(path):
              b=Path(path).read_bytes()
              if len(b) < 64:
                  raise SystemExit(f"short Image: {path}")
              return {
                  "bytes": len(b),
                  "code0": struct.unpack_from("<I", b, 0)[0],
                  "code1": struct.unpack_from("<I", b, 4)[0],
                  "text_offset": struct.unpack_from("<Q", b, 8)[0],
                  "image_size": struct.unpack_from("<Q", b, 16)[0],
                  "flags": struct.unpack_from("<Q", b, 24)[0],
                  "magic": b[56:60],
              }

          s=parse("stock-Image")
          c=parse("candidate-0014-Image")
          expected_magic=bytes.fromhex("41524d64")
          for label,x in (("STOCK",s),("C0014",c)):
              print(f"{label}_FILE_BYTES={x['bytes']}")
              print(f"{label}_CODE0=0x{x['code0']:08x}")
              print(f"{label}_CODE1=0x{x['code1']:08x}")
              print(f"{label}_TEXT_OFFSET=0x{x['text_offset']:x}")
              print(f"{label}_IMAGE_SIZE=0x{x['image_size']:x}")
              print(f"{label}_FLAGS=0x{x['flags']:x}")
              print(f"{label}_MAGIC={x['magic'].hex()}")
          print(f"TEXT_OFFSET_MATCH={int(s['text_offset']==c['text_offset'])}")
          print(f"FLAGS_MATCH={int(s['flags']==c['flags'])}")
          print(f"MAGIC_MATCH={int(s['magic']==c['magic']==expected_magic)}")
          print(f"IMAGE_SIZE_FIELD_MATCH={int(s['image_size']==c['image_size'])}")
          print("ARM64_IMAGE_HEADER_AUDIT=PASS")
          PY

      - name: Recover kallsyms
        run: |
          set -euo pipefail
          kallsyms-finder stock-Image > stock.kallsyms
          kallsyms-finder candidate-0014-Image > c0014.kallsyms
          test -s stock.kallsyms
          test -s c0014.kallsyms

      - name: Map corrected initcall order and early boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee pre-persistent-summary.txt
          from pathlib import Path
          import re

          line_rx=re.compile(r"^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.+?)\s*$")
          init_rx=re.compile(r"^__initcall_\d+_\d+_(.+?)(early|rootfs|[0-7]s?)$")
          levels=["early","0","0s","1","1s","2","2s","3","3s","4","4s","5","5s","rootfs","6","6s","7","7s"]
          rank={v:i for i,v in enumerate(levels)}

          def strip_compiler_suffix(name):
              return name.split('.',1)[0]

          def parse(path):
              syms={}
              init=[]
              seen=set()
              for raw in Path(path).read_text(errors="replace").splitlines():
                  m=line_rx.match(raw)
                  if not m: continue
                  addr=int(m.group(1),16); typ=m.group(2); name=m.group(3)
                  syms[name]=(addr,typ)
                  clean=strip_compiler_suffix(name)
                  im=init_rx.match(clean)
                  if not im: continue
                  fn,level=im.groups()
                  key=(level,fn)
                  if key in seen: continue
                  seen.add(key)
                  init.append((addr,level,fn,name))
              init.sort()
              by_level={}
              for row in init:
                  by_level.setdefault(row[1],[]).append(row)
              return syms,init,by_level

          stock_s,stock_i,stock_l=parse("stock.kallsyms")
          cand_s,cand_i,cand_l=parse("c0014.kallsyms")

          def rows_by_fn(rows):
              d={}
              for r in rows: d.setdefault(r[2],[]).append(r)
              return d

          def before(rows, boundary):
              if not boundary: return []
              baddr,blevel,_,_=boundary[0]
              out=[]
              for row in rows:
                  addr,lvl,fn,raw=row
                  if rank.get(lvl,999)<rank.get(blevel,999) or (lvl==blevel and addr<baddr):
                      out.append(row)
              return out

          sm=rows_by_fn(stock_i); cm=rows_by_fn(cand_i)
          stock_set={(lvl,fn) for _,lvl,fn,_ in stock_i}
          cand_set={(lvl,fn) for _,lvl,fn,_ in cand_i}
          cand_only=sorted(cand_set-stock_set)
          stock_only=sorted(stock_set-cand_set)

          targets=[
            "ramoops_init","mtdoops_init","pstore_init","pstore_blk_init",
            "bootinfo_init","regulator_fixed_voltage_init4","cpufreq_times_init",
            "msm_drm_register","rmnet_init","rmnet_ctl_init","fragmentize_init",
            "qcom_scm_init"
          ]

          lines=[]
          for fn in targets:
              sr=sm.get(fn,[]); cr=cm.get(fn,[])
              lines.append(f"TARGET={fn} STOCK_COUNT={len(sr)} C0014_COUNT={len(cr)}")
              for label,arr in (("STOCK",sr),("C0014",cr)):
                  lvlmap=stock_l if label=="STOCK" else cand_l
                  for addr,level,name,raw in arr:
                      order=[x[2] for x in lvlmap.get(level,[])].index(name)
                      lines.append(f"{label}_{fn}=level:{level},order:{order},addr:{addr:016x},raw:{raw}")

          cand_pre_ram=[r for r in before(cand_i,cm.get("ramoops_init",[])) if (r[1],r[2]) in cand_set-stock_set]
          stock_pre_ram=[r for r in before(stock_i,sm.get("ramoops_init",[])) if (r[1],r[2]) in stock_set-cand_set]
          cand_pre_mtd=[r for r in before(cand_i,cm.get("mtdoops_init",[])) if (r[1],r[2]) in cand_set-stock_set]
          stock_pre_mtd=[r for r in before(stock_i,sm.get("mtdoops_init",[])) if (r[1],r[2]) in stock_set-cand_set]
          cand_pre_pstore=[r for r in before(cand_i,cm.get("pstore_init",[])) if (r[1],r[2]) in cand_set-stock_set]
          stock_pre_pstore=[r for r in before(stock_i,sm.get("pstore_init",[])) if (r[1],r[2]) in stock_set-cand_set]

          def write_rows(path,rows):
              Path(path).write_text(
                "level\taddress\tfunction\traw_symbol\n"+
                "".join(f"{lvl}\t{addr:016x}\t{fn}\t{raw}\n" for addr,lvl,fn,raw in rows)
              )

          write_rows("candidate-only-before-ramoops.tsv",cand_pre_ram)
          write_rows("stock-only-before-ramoops.tsv",stock_pre_ram)
          write_rows("candidate-only-before-mtdoops.tsv",cand_pre_mtd)
          write_rows("stock-only-before-mtdoops.tsv",stock_pre_mtd)
          write_rows("candidate-only-before-pstore.tsv",cand_pre_pstore)
          write_rows("stock-only-before-pstore.tsv",stock_pre_pstore)
          Path("all-candidate-only-initcalls.tsv").write_text(
            "level\tfunction\n"+"".join(f"{lvl}\t{fn}\n" for lvl,fn in cand_only)
          )
          Path("all-stock-only-initcalls.tsv").write_text(
            "level\tfunction\n"+"".join(f"{lvl}\t{fn}\n" for lvl,fn in stock_only)
          )

          lines += [
            f"STOCK_INITCALL_COUNT={len(stock_i)}",
            f"C0014_INITCALL_COUNT={len(cand_i)}",
            f"TRUE_C0014_ONLY_INITCALLS={len(cand_only)}",
            f"TRUE_STOCK_ONLY_INITCALLS={len(stock_only)}",
            f"C0014_ONLY_BEFORE_RAMOOPS={len(cand_pre_ram)}",
            f"STOCK_ONLY_BEFORE_RAMOOPS={len(stock_pre_ram)}",
            f"C0014_ONLY_BEFORE_MTD_OOPS={len(cand_pre_mtd)}",
            f"STOCK_ONLY_BEFORE_MTD_OOPS={len(stock_pre_mtd)}",
            f"C0014_ONLY_BEFORE_PSTORE={len(cand_pre_pstore)}",
            f"STOCK_ONLY_BEFORE_PSTORE={len(stock_pre_pstore)}",
          ]

          for prefix,rows in (
              ("C0014_PRE_RAMOOPS",cand_pre_ram),
              ("STOCK_PRE_RAMOOPS",stock_pre_ram),
              ("C0014_PRE_PSTORE",cand_pre_pstore),
              ("STOCK_PRE_PSTORE",stock_pre_pstore)):
              for addr,lvl,fn,raw in rows:
                  lines.append(f"{prefix} level={lvl} addr={addr:016x} fn={fn}")

          false_reg=any(lvl=="0" and fn=="regulator_fixed_voltage_init4" for lvl,fn in stock_only)
          lines.append(f"REGULATOR_SUFFIX_FALSE_POSITIVE_PRESENT={int(false_reg)}")
          if false_reg:
              raise SystemExit("compiler suffix parser regression")

          print("\n".join(lines))
          Path("pre-persistent-summary.txt").write_text("\n".join(lines)+"\n")
          print("PRE_PERSISTENT_INITCALL_DIAGNOSIS_V2=PASS")
          PY

      - name: Map stock-only pre-ramoops providers in reconstructed source
        run: |
          set -euo pipefail
          targets=(cpufreq_times_init pm_debug_init alarm_record_init uevent_record_init)
          : > pre-ramoops-source-map.txt
          for fn in "${targets[@]}"; do
            echo "### ${fn}" | tee -a pre-ramoops-source-map.txt
            hits="$(git -C reconstructed-source grep -n -F "$fn" -- '*.c' '*.h' '*.S' '*Kconfig*' '*Makefile*' || true)"
            if [[ -n "$hits" ]]; then
              echo "EXACT_SYMBOL_PRESENT=1" | tee -a pre-ramoops-source-map.txt
              printf '%s\n' "$hits" | tee -a pre-ramoops-source-map.txt
            else
              echo "EXACT_SYMBOL_PRESENT=0" | tee -a pre-ramoops-source-map.txt
              stem="${fn%_init}"
              echo "FALLBACK_STEM=${stem}" | tee -a pre-ramoops-source-map.txt
              git -C reconstructed-source grep -n -F "$stem" -- '*.c' '*.h' '*.S' '*Kconfig*' '*Makefile*' \
                | head -n 120 | tee -a pre-ramoops-source-map.txt || true
            fi
          done

          echo '### candidate config clues' | tee -a pre-ramoops-source-map.txt
          for key in CPU_FREQ_TIMES CPU_FREQ_STAT PM_DEBUG DEBUG_POWER_MI ALARM_RECORD UEVENT_RECORD; do
            echo "## CONFIG_${key}" | tee -a pre-ramoops-source-map.txt
            git -C reconstructed-source grep -n -E "(^|[^A-Za-z0-9_])(${key}|CONFIG_${key})([^A-Za-z0-9_]|$)" -- '*Kconfig*' '*Makefile*' '*.c' '*.h' \
              | head -n 120 | tee -a pre-ramoops-source-map.txt || true
          done

          grep -Fq '### cpufreq_times_init' pre-ramoops-source-map.txt
          grep -Fq '### pm_debug_init' pre-ramoops-source-map.txt
          grep -Fq '### alarm_record_init' pre-ramoops-source-map.txt
          grep -Fq '### uevent_record_init' pre-ramoops-source-map.txt
          echo 'PRE_RAMOOPS_SOURCE_MAP=PASS' | tee -a pre-ramoops-source-map.txt

      - name: Final gate
        run: |
          set -euo pipefail
          grep -Fq 'ARM64_IMAGE_HEADER_AUDIT=PASS' image-header-summary.txt
          grep -Fq 'MAGIC_MATCH=1' image-header-summary.txt
          grep -Fq 'PRE_PERSISTENT_INITCALL_DIAGNOSIS_V2=PASS' pre-persistent-summary.txt
          grep -Fq 'REGULATOR_SUFFIX_FALSE_POSITIVE_PRESENT=0' pre-persistent-summary.txt
          grep -Fq 'C0014_ONLY_BEFORE_RAMOOPS=0' pre-persistent-summary.txt
          grep -Fq 'PRE_RAMOOPS_SOURCE_MAP=PASS' pre-ramoops-source-map.txt
          {
            cat image-header-summary.txt
            cat pre-persistent-summary.txt
            cat pre-ramoops-source-map.txt
            echo 'LISA_C0014_PRE_PERSISTENT_DIAGNOSIS_V3=PASS'
          } | tee final.txt

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0014-pre-persistent-initcall-diagnosis-v3
          retention-days: 14
          if-no-files-found: error
          path: |
            final.txt
            image-header-summary.txt
            pre-persistent-summary.txt
            pre-ramoops-source-map.txt
            candidate-only-before-ramoops.tsv
            stock-only-before-ramoops.tsv
            candidate-only-before-mtdoops.tsv
            stock-only-before-mtdoops.tsv
            candidate-only-before-pstore.tsv
            stock-only-before-pstore.tsv
            all-candidate-only-initcalls.tsv
            all-stock-only-initcalls.tsv
            stock.kallsyms
            c0014.kallsyms
