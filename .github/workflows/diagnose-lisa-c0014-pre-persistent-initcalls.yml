name: Diagnose Lisa Candidate 0014 pre-persistent initcalls

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-lisa-c0014-pre-persistent-initcalls.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: lisa-c0014-pre-persistent-initcalls
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STOCK_BOOT: stock-main/reconstruction/stock/stock-Image/boot.img
      STOCK_BOOT_SHA256: e6f8c978c2cf0a9473d0ac73cdcf3ffb14747246fdc47f82245c43221eb4cbf1
      C0014_ARTIFACT_ID: "10802392237"
      C0014_IMAGE_SHA256: 47b1a9126866c31db49ae0bdf06bb7e0205ae516dcc65552d231914c126b7094

    steps:
      - name: Checkout healthy stock boot
        uses: actions/checkout@v4
        with:
          ref: main
          path: stock-main
          lfs: true
          fetch-depth: 1

      - name: Install symbol recovery tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pip curl unzip
          python3 -m pip install --break-system-packages \
            git+https://github.com/marin-m/vmlinux-to-elf.git@19683fb95b29cd31362d49e6f48ab8368f96cbdf
          command -v kallsyms-finder

      - name: Extract healthy stock Image
        run: |
          set -euo pipefail
          test "$(sha256sum "$STOCK_BOOT" | awk '{print $1}')" = "$STOCK_BOOT_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path("stock-main/reconstruction/stock/stock-Image/boot.img").read_bytes()
          if b[:8] != b"ANDROID!": raise SystemExit("bad stock boot")
          ksz=struct.unpack_from("<I",b,8)[0]
          Path("stock-Image").write_bytes(b[4096:4096+ksz])
          print(f"STOCK_IMAGE_BYTES={ksz}")
          PY

      - name: Download exact Candidate 0014 Image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${C0014_ARTIFACT_ID}/zip" \
            -o c0014.zip
          mkdir c0014
          unzip -q c0014.zip -d c0014
          img="$(find c0014 -type f -name candidate-0014-Image -print -quit)"
          test -n "$img" && test -s "$img"
          cp "$img" candidate-0014-Image
          test "$(sha256sum candidate-0014-Image | awk '{print $1}')" = "$C0014_IMAGE_SHA256"

      - name: Recover kallsyms
        run: |
          set -euo pipefail
          kallsyms-finder stock-Image > stock.kallsyms
          kallsyms-finder candidate-0014-Image > c0014.kallsyms
          test -s stock.kallsyms
          test -s c0014.kallsyms

      - name: Map exact initcall order and persistent-log boundary
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee pre-persistent-summary.txt
          from pathlib import Path
          import re

          line_rx=re.compile(r"^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.+?)\s*$")
          init_rx=re.compile(r"^__initcall_\d+_\d+_(.+?)(early|rootfs|[0-7]s?)$")

          def parse(path):
              syms={}
              init=[]
              for raw in Path(path).read_text(errors="replace").splitlines():
                  m=line_rx.match(raw)
                  if not m: continue
                  addr=int(m.group(1),16); typ=m.group(2); name=m.group(3)
                  syms[name]=(addr,typ)
                  im=init_rx.match(name)
                  if im:
                      fn,level=im.groups()
                      fn=re.sub(r"\.\d+$","",fn)
                      init.append((addr,level,fn,name))
              init.sort()
              # Stable per-level order as encoded by linker addresses.
              by_level={}
              for row in init:
                  by_level.setdefault(row[1],[]).append(row)
              return syms,init,by_level

          stock_s,stock_i,stock_l=parse("stock.kallsyms")
          cand_s,cand_i,cand_l=parse("c0014.kallsyms")

          def rows_by_fn(rows):
              d={}
              for r in rows: d.setdefault(r[2],[]).append(r)
              return d
          sm=rows_by_fn(stock_i); cm=rows_by_fn(cand_i)

          targets=[
            "mtdoops_init","ramoops_init","pstore_init","pstore_blk_init",
            "bootinfo_init","msm_drm_register","rmnet_init","rmnet_ctl_init",
            "fragmentize_init","cpufreq_times_init","qcom_scm_init"
          ]

          lines=[]
          for fn in targets:
              sr=sm.get(fn,[]); cr=cm.get(fn,[])
              lines.append(f"TARGET={fn} STOCK_COUNT={len(sr)} C0014_COUNT={len(cr)}")
              for label,arr in (("STOCK",sr),("C0014",cr)):
                  for addr,level,name,raw in arr:
                      order=[x[2] for x in (stock_l if label=="STOCK" else cand_l).get(level,[])].index(name)
                      lines.append(f"{label}_{fn}=level:{level},order:{order},addr:{addr:016x},raw:{raw}")

          # Exact function identities by level.
          stock_set={(lvl,fn) for _,lvl,fn,_ in stock_i}
          cand_set={(lvl,fn) for _,lvl,fn,_ in cand_i}
          cand_only=sorted(cand_set-stock_set)
          stock_only=sorted(stock_set-cand_set)

          # Find Candidate mtdoops boundary. If present, list every Candidate-only
          # initcall at levels that can run before it. At same level use linker order.
          mtd=cm.get("mtdoops_init",[])
          pre=[]
          if mtd:
              maddr,mlevel,_,_=mtd[0]
              levels=["early","0","0s","1","1s","2","2s","3","3s","4","4s","5","5s","rootfs","6","6s","7","7s"]
              rank={v:i for i,v in enumerate(levels)}
              for addr,lvl,fn,raw in cand_i:
                  if (lvl,fn) not in cand_set-stock_set: continue
                  if rank.get(lvl,999)<rank.get(mlevel,999) or (lvl==mlevel and addr<maddr):
                      pre.append((addr,lvl,fn,raw))

          Path("candidate-only-before-mtdoops.tsv").write_text(
            "level\taddress\tfunction\traw_symbol\n"+
            "".join(f"{lvl}\t{addr:016x}\t{fn}\t{raw}\n" for addr,lvl,fn,raw in pre)
          )
          Path("all-candidate-only-initcalls.tsv").write_text(
            "level\tfunction\n"+"".join(f"{lvl}\t{fn}\n" for lvl,fn in cand_only)
          )
          Path("all-stock-only-initcalls.tsv").write_text(
            "level\tfunction\n"+"".join(f"{lvl}\t{fn}\n" for lvl,fn in stock_only)
          )

          lines += [
            f"STOCK_INITCALL_COUNT={len(stock_i)}",
            f"C0014_INITCALL_COUNT={len(cand_i)}",
            f"TRUE_C0014_ONLY_INITCALLS={len(cand_only)}",
            f"TRUE_STOCK_ONLY_INITCALLS={len(stock_only)}",
            f"C0014_ONLY_BEFORE_MTD_OOPS={len(pre)}",
          ]

          # Highlight concrete built-in/module model mismatches.
          suspect=re.compile(r"(msm_drm|rmnet|audio|wcd|swr|soundwire|lahaina_asoc|us_prox|fragmentize)",re.I)
          suspects=[x for x in pre if suspect.search(x[2])]
          lines.append(f"SUSPECT_C0014_ONLY_BEFORE_MTD_OOPS={len(suspects)}")
          for addr,lvl,fn,raw in suspects:
              lines.append(f"SUSPECT level={lvl} addr={addr:016x} fn={fn}")

          print("\n".join(lines))
          Path("pre-persistent-summary.txt").write_text("\n".join(lines)+"\n")
          print("PRE_PERSISTENT_INITCALL_DIAGNOSIS=PASS")
          PY

      - name: Final gate
        run: |
          set -euo pipefail
          grep -Fq 'PRE_PERSISTENT_INITCALL_DIAGNOSIS=PASS' pre-persistent-summary.txt
          {
            cat pre-persistent-summary.txt
            echo 'LISA_C0014_PRE_PERSISTENT_DIAGNOSIS=PASS'
          } | tee final.txt

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: lisa-c0014-pre-persistent-initcall-diagnosis
          retention-days: 14
          if-no-files-found: error
          path: |
            final.txt
            pre-persistent-summary.txt
            candidate-only-before-mtdoops.tsv
            all-candidate-only-initcalls.tsv
            all-stock-only-initcalls.tsv
            stock.kallsyms
            c0014.kallsyms
