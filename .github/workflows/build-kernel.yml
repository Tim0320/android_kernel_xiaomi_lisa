name: Build lisa reconstructed kernel

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Reconstruct lisa 5.4.289 QGKI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: lisa-5.4.289-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout reconstructed kernel
        uses: actions/checkout@v4
        with:
          ref: reconstruction/5.4.289-qgki
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio kmod rsync python3 curl xz-utils

      - name: Cache stock-generation AOSP clang 11.0.2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902b1
          key: aosp-clang-r383902b1-linux-x86-v1

      - name: Install stock-generation AOSP clang 11.0.2
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/clang-r383902b1"
          ARCHIVE="${RUNNER_TEMP}/clang-r383902b1.tar.gz"
          mkdir -p "$DEST"

          if [[ -x "$DEST/bin/clang" ]] && "$DEST/bin/clang" --version | grep -q 'clang version 11.0.2'; then
            echo "Using cached clang-r383902b1"
            "$DEST/bin/clang" --version | tee clang-version.txt
            exit 0
          fi

          urls=(
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b1.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r46/clang-r383902b1.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-qpr2-release/clang-r383902b1.tar.gz"
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/4c6fbc28d3b078a5308894fc175f962bb26a5718/clang-r383902b1.tar.gz"
          )

          ok=0
          for url in "${urls[@]}"; do
            echo "Trying $url"
            rm -f "$ARCHIVE"
            if curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
                "$url" -o "$ARCHIVE" && tar -tzf "$ARCHIVE" >/dev/null; then
              ok=1
              break
            fi
          done

          test "$ok" -eq 1
          tar -xzf "$ARCHIVE" -C "$DEST"
          "$DEST/bin/clang" --version | tee clang-version.txt
          grep -q 'clang version 11.0.2' clang-version.txt

      - name: Generate lisa QGKI config
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/lahaina-qgki_defconfig \
            vendor/xiaomi_QGKI.config \
            vendor/lisa_QGKI.config \
            vendor/debugfs.config

          grep -E '^(CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO|CONFIG_MODVERSIONS|CONFIG_MI_MEMORY_SYSFS|CONFIG_MI_CNSS_STATISTIC|CONFIG_MI_HARDWARE_ID|CONFIG_MI_THERMAL_INTERFACE|CONFIG_USB_F_DTP|CONFIG_QGKI_SYSTEM|CONFIG_PINCTRL_SM7325|CONFIG_ARCH_YUPIK)=' out/.config || true

          grep -qx 'CONFIG_LOCALVERSION="-qgki"' out/.config
          grep -qx 'CONFIG_LOCALVERSION_AUTO=y' out/.config
          grep -qx 'CONFIG_MODVERSIONS=y' out/.config
          grep -qx 'CONFIG_MI_MEMORY_SYSFS=m' out/.config
          grep -qx 'CONFIG_MI_HARDWARE_ID=y' out/.config
          grep -qx 'CONFIG_MI_THERMAL_INTERFACE=m' out/.config
          grep -qx 'CONFIG_USB_F_DTP=m' out/.config
          grep -qx 'CONFIG_QGKI_SYSTEM=y' out/.config

          source reconstruction/manifest.env
          release="$(make -s O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- kernelrelease)"
          echo "kernelrelease=$release"
          test "$release" = "$TARGET_VERMAGIC"

      - name: Build kernel, modules and device trees
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image modules dtbs 2>&1 | tee build.log

      - name: Validate build outputs
        run: |
          test -s out/arch/arm64/boot/Image
          test -s out/Module.symvers
          test -s out/techpack/display/msm/msm_drm.ko
          test -s out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko
          test -s out/drivers/input/touchscreen/gt9897t/goodix_core.ko
          test -s out/drivers/misc/mi-memory/mi_memory.ko
          test -s out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko

          source reconstruction/manifest.env
          abi_fail=0
          for ko in \
            out/techpack/display/msm/msm_drm.ko \
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko \
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko \
            out/drivers/misc/mi-memory/mi_memory.ko \
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko; do
            actual_vermagic="$(strings -a "$ko" | sed -n 's/^vermagic=//p' | head -n1 | awk '{print $1}')"
            echo "$ko vermagic=$actual_vermagic stock=$TARGET_VERMAGIC"
            if [[ "$actual_vermagic" != "$TARGET_VERMAGIC" ]]; then
              echo "VERMAGIC_MISMATCH: $ko"
              abi_fail=1
            fi
          done

          for symbol in \
            get_ufs_data get_ufs_hba_data get_ufs_sdev_data memblock_mem_size_in_gb \
            cnss_statistic_wow_wakeup wow_suspend_type \
            ufs_get_string_desc ufs_read_desc_param ufshcd_read_desc; do
            if ! awk -v sym="$symbol" '$2 == sym {found=1} END {exit !found}' out/Module.symvers; then
              echo "MISSING_SYMBOL: $symbol"
              abi_fail=1
            fi
          done

          check_crc() {
            local symbol="$1"
            local expected="$2"
            local actual
            actual="$(awk -v sym="$symbol" '$2 == sym {print tolower($1); exit}' out/Module.symvers)"
            if [[ -z "$actual" ]]; then
              echo "$symbol: rebuilt=MISSING stock=$expected"
              abi_fail=1
              return
            fi
            echo "$symbol: rebuilt=$actual stock=$expected"
            if [[ "$actual" != "$expected" ]]; then
              echo "CRC_MISMATCH: $symbol"
              abi_fail=1
            fi
          }

          check_crc get_ufs_data 0xfa507f92
          check_crc get_ufs_hba_data 0xc40eabac
          check_crc get_ufs_sdev_data 0xc5bbd8a8
          check_crc memblock_mem_size_in_gb 0x84fd4cc1
          check_crc ufs_get_string_desc 0x479d5ded
          check_crc ufs_read_desc_param 0x16548413
          check_crc ufshcd_read_desc 0xa93e3b58
          check_crc cnss_statistic_wow_wakeup 0x0fc3f432
          check_crc wow_suspend_type 0x635b9cbb
          check_crc module_layout 0xba39cbb8
          check_crc dsi_bridge_interface_enable 0x43bda09c
          check_crc mi_disp_register_client 0xa292ba4e
          check_crc mi_disp_unregister_client 0x26ae4476
          check_crc mi_disp_set_fod_queue_work 0xb762dd7b
          check_crc last_touch_events_collect 0x9e978bfa
          check_crc update_palm_sensor_value 0x49118811
          check_crc xiaomitouch_register_modedata 0x1d883975

          if [[ "$abi_fail" -ne 0 ]]; then
            echo "ABI validation failed"
            exit 1
          fi

          {
            echo "## Build outputs"
            echo
            echo "- Kernel: `$(make -s kernelversion)`"
            echo "- Image: `out/arch/arm64/boot/Image`"
            echo "- Module.symvers: generated"
            echo "- Xiaomi mi-memory exported symbols: present"
            echo "- MI CNSS exported symbol: present"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ABI and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-5.4.289-build-evidence
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            clang-version.txt
            build.log
            out/.config
            out/Module.symvers
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/vendor/qcom/**/*.dtb
            out/techpack/display/msm/msm_drm.ko
            out/drivers/input/touchscreen/xiaomi/xiaomi_touch.ko
            out/drivers/input/touchscreen/gt9897t/goodix_core.ko
            out/drivers/input/touchscreen/gt9897t/goodix_ts_gesture.ko
            out/drivers/misc/mi-memory/mi_memory.ko
            out/drivers/net/wireless/mi_cnss_statistic/mi_cnss_statistic.ko
