name: Build Lisa Candidate0056 typed battery providers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-lisa-candidate-0056-power-providers.yml
      - reconstruction/scripts/candidate_0056_build.py
      - reconstruction/scripts/candidate_0056_power_patch.py
      - reconstruction/scripts/test_lisa_power_compat.c
      - reconstruction/overlays/lisa_power_compat.c
      - reconstruction/overlays/lisa_power_compat.h
permissions:
  contents: read
  actions: read
concurrency:
  group: lisa-candidate-0056-power-providers
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact package commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
      - name: Preflight parent pins, Python and capacity boundary tests
        run: python3 reconstruction/scripts/candidate_0056_build.py preflight
      - name: Materialize stock LFS inputs
        run: git lfs pull
      - name: Checkout exact reconstructed kernel source
        uses: actions/checkout@v4
        with:
          ref: 6e568aabc77a06fa787baec1d9e60e4b559874a3
          path: kernel
          fetch-depth: 1
          lfs: false
      - name: Checkout exact reference runtime source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm8350
          ref: 46af56554ec50e3ff3752858bf38eaeeb852ca0d
          path: known-good-302
          fetch-depth: 1
          lfs: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python3-yaml curl unzip git rsync kmod
      - name: Prepare pinned compiler and stock oracles
        run: python3 reconstruction/scripts/candidate_0056_build.py prepare
      - name: Build and package Candidate0056
        env:
          PATH: ${{ runner.temp }}/clang-r383902b1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          STOCK_ABI_ROOT: ${{ runner.temp }}/stock-abi-root
        run: python3 reconstruction/scripts/candidate_0056_build.py build
      - name: Verify inherited gates and typed power providers
        run: python3 reconstruction/scripts/candidate_0056_build.py verify
      - name: Upload verified Candidate0056 boot and evidence
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0056-power-providers
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
          path: |
            boot.img
            boot.img.sha256
            candidate-0056-*
            candidate-0056.config
            candidate-0056.ikconfig
            candidate-0046-*.txt
            kernel/out/System.map
            kernel/out/Module.symvers
            kernel/out/techpack/display/msm/msm_drm.ko
            clang-version.txt
      - name: Upload failure evidence only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lisa-candidate-0056-failure-evidence
          retention-days: 14
          if-no-files-found: ignore
          path: |
            candidate-0056-checks/
            candidate-0056-resolved-builder.py
            candidate-0056-*.txt
            kernel/out/.config
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: Check at 2 minutes, 2 minutes, then every 5 minutes
        uses: actions/github-script@v7
        with:
          script: |
            let check = 0;
            while (true) {
              await new Promise(resolve => setTimeout(resolve, check < 2 ? 120000 : 300000));
              check += 1;
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100
                });
                const build = jobs.find(job => job.name === 'build');
                core.info(`Check ${check}: build=${build?.status} result=${build?.conclusion}`);
                if (!build || build.status !== 'completed') continue;
                if (build.conclusion !== 'success') {
                  const first = (build.steps || []).find(step => step.conclusion === 'failure');
                  core.setFailed(`Build ${build.conclusion}; first blocker: ${first?.name || 'see job log'}`);
                  break;
                }
                const items = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: context.runId, per_page: 100
                });
                const artifact = items.find(a => a.name === 'lisa-candidate-0056-power-providers' && !a.expired && a.size_in_bytes > 0);
                if (!artifact) core.setFailed('Verified boot artifact is absent');
                else await core.summary.addHeading('Candidate0056 build verified').addRaw(`Run ${context.runId}; artifact ${artifact.id}; checks ${check}. Battery hardware remains untested.`).write();
                break;
              } catch (error) {
                core.warning(`Check ${check}: API error: ${error.message}`);
              }
            }
